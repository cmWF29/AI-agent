name: ci

# 门禁：静态扫描 + 用例全量回归。任何一条红即阻断合入。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 推送连发时取消上一轮：门禁占资源，旧提交的结论没有价值
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # 全量跑实测约 25 分钟（单测 ~12m + 浏览器 7 场景 ~8m + HTTP 黑盒/性能 ~4m），
    # 45 分钟是硬上限：留出 runner 抖动余量，任何步骤挂死也不拖到 6 小时。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: 依赖
        run: pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: 强隔离依赖（Linux mount namespace）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: 代码-文档同步门禁（源码哈希 / 符号清单 / 孤儿文档）
        run: python3 scripts/gate_docsync.py
      - name: 控件状态机门禁（每个按钮/事件都要有声明过的状态机）
        run: python3 scripts/gate_controls.py
      - name: 界面文案门禁（禁用句式 / 长度上限 / 术语一致 / 字段泄漏）
        run: python3 scripts/gate_copy.py
      - name: 界面信息预算门禁（网格卡字段上限 / 说明长度 / 品牌无渐变）
        run: python3 scripts/gate_frontend.py
      - name: 运维指标门禁（指标与取数源一一对应）
        run: python3 scripts/gate_ops.py
      - name: 可点实例门禁（每一条都要有控件id/状态机/去向）
        run: python3 scripts/gate_inventory.py
      - name: 界面状态图门禁（页面/浮层节点、浮层可关、入口可达）
        run: python3 scripts/gate_screens.py
      - name: 视图层门禁（条件表达式/只读覆盖/工具卡单一折叠出口）
        run: python3 scripts/gate_views.py
      - name: 卡片尺寸门禁（同区卡片整宽同高）
        run: python3 scripts/gate_card_size.py
      - name: 需求↔用例映射门禁（每条需求绑到 check，check 有 test 模块，映射表不许过期）
        run: python3 scripts/gate_demand_tests.py
      - name: 接线门禁（表单提交→需求 with→API 入参逐项贯通）
        run: python3 scripts/gate_wiring.py
      - name: 需求/架构/装配/传输/幂等/桩协议全量用例（并行分片 + coverage）
        run: |
          set -o pipefail
          python3 scripts/run_tests.py --jobs 2 --coverage \
            --coverage-dir /tmp/hivecov --coverage-out /tmp/coverage.json 2>&1 | tee /tmp/full-tests.log
      - name: 失败测试名（注解可见，不必登录下载日志）
        if: failure()
        run: |
          if [ -f /tmp/full-tests.log ]; then
            awk '/^(FAIL|ERROR):/{flag=1} flag{print; if(++n>=12) exit}' /tmp/full-tests.log               | sed 's/%/%25/g; s/\r//g'               | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: 覆盖率门禁（行/分支/关键机制模块）
        run: python3 scripts/gate_coverage.py --data-file /tmp/hivecov/.coverage
      - name: Skip 门禁（只允许登记过的平台/外部依赖跳过）
        run: python3 scripts/gate_skips.py
      - name: 改动行覆盖率门禁（新增/修改产品代码 ≥90%）
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/gate_diff_coverage.py --data-file /tmp/hivecov/.coverage
      - name: 全量用例失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-tests-log
          path: |
            /tmp/full-tests.log
            /tmp/gates-ops.log
            /tmp/stub.log
      - name: 全量用例失败摘要
        if: failure()
        run: |
          echo "## 全量用例失败尾部" >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 /tmp/full-tests.log >> "$GITHUB_STEP_SUMMARY"
      - name: 契约/韧性/运维门禁（L2 接口矩阵 + L4 真实 kill -9 + L7 落盘/重启/迁移/cron）
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 scripts/gates.py --only L2,L4,L7 --timeout 900 2>&1 | tee /tmp/gates-ops.log
      - name: UI 回归环境（装 Chromium + 起桩）
        timeout-minutes: 12
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium
          CHROME="$(python3 -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          AI_NEW_STUB=1 nohup python3 agent_start.py > /tmp/stub.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/api/health/live >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/api/health/live
      - name: UI 回归（控件状态机实拉）
        run: python3 scripts/verify_ui.py
      - name: UI 表单真点闭环（新建项目：按钮→弹窗→提交→卡片）
        run: python3 scripts/verify_ui_forms.py
      - name: 群聊秘书 IM 发送态（乐观气泡/转圈/头像一致/失败重发/自动处理）
        run: python3 scripts/verify_im_secretary.py
      - name: E2E 项目闭环（新建→改名→归档→删除）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario project 2>&1 | tee /tmp/e2e-project.log
      - name: E2E 工单闭环（建单→消息→PM 回复→结单→归档）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario ticket 2>&1 | tee /tmp/e2e-ticket.log
      - name: E2E 多轮工单（两轮追问→逐轮收口→结单→归档）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario ticket-multi 2>&1 | tee /tmp/e2e-multi.log
      - name: E2E 归档只读（归档后新建工单入口禁用）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario archive-guard 2>&1 | tee /tmp/e2e-archive.log
      - name: E2E 逐轮收口（两轮追问→每轮真收口→结单）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario ticket-rounds 2>&1 | tee /tmp/e2e-rounds.log
      - name: E2E 定时器界面（到点建单在界面可见）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario timer-ui 2>&1 | tee /tmp/e2e-timer.log
      - name: E2E 浏览器多岗位（PM 派 developer，两路会话各自署名）
        run: |
          set -o pipefail
          python3 scripts/verify_e2e.py --scenario roles-dom 2>&1 | tee /tmp/e2e-roles.log
      - name: 像素级视觉回归（三视图基线）
        timeout-minutes: 6
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install pillow
          python3 scripts/verify_visual.py 2>&1 | tee /tmp/visual.log
      - name: HTTP 黑盒业务 E2E（改名/知识版本/检索/备注/定时器/租约/岗位会话/云端/边界/并发）
        # 拆单/定时器这类闭环按真实配置要几十秒，单场景上限 12 分钟
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 scripts/verify_api_e2e.py --scenario all 2>&1 | tee /tmp/e2e-api.log
      - name: HTTP 性能门禁（真实网络 + 并发 + 突发 + p95/p99/错误率/RPS）
        run: |
          set -o pipefail
          python3 scripts/perf_http.py --levels 2,4 --duration 6 --warmup 1 \
            --burst 8 --burst-reqs 2 \
            --min-rps 5 --max-p95-ms 1200 --max-p99-ms 2500 \
            --max-error-rate 0.01 2>&1 | tee /tmp/perf-http.log
      - name: E2E 失败原因（注解可见）
        if: failure()
        run: |
          for f in /tmp/gates-ops.log /tmp/e2e-project.log /tmp/e2e-ticket.log /tmp/e2e-multi.log /tmp/e2e-archive.log /tmp/e2e-rounds.log /tmp/e2e-timer.log /tmp/e2e-roles.log /tmp/visual.log /tmp/e2e-api.log /tmp/perf-http.log; do
            if [ -f "$f" ]; then
              { grep -E "FAIL|Traceback|E2E 失败" "$f" | tail -n 6; tail -n 2 "$f"; } | \
                sed 's/%/%25/g; s/\r//g' | while IFS= read -r line; do echo "::error::$line"; done
            fi
          done
          true
      - name: 全页可达 + 全表单可开
        run: python3 scripts/verify_pages.py
      - name: 安全控件真实点击（逐页重载 + 状态机核对）
        timeout-minutes: 8
        run: python3 scripts/verify_controls.py
      - name: 可点实例清单签名核对
        run: python3 scripts/ui_inventory.py --check

  isolation-windows:
    # Windows 真机装配 + 路径语义 + 核心用例：纯判定层在 Linux 上先覆盖，
    # 这里验证模块能在 Windows 装配起来，盘符/UNC/保留名/大小写/段尾点空格等
    # Win32 语义在真机成立，并复跑平台适配/核心靶向用例。
    # 全量 98 模块的回归只在 Linux 跑（用例的平台分支已用 PLATFORM 常量注入，
    # 不依赖宿主）；Windows 侧再做一遍全量既不增量覆盖，还会把 Linux 专有
    # 夹具（/bin/sh、chmod、bwrap）当产品缺陷，故这里只保留平台层与核心装配。
    # 步骤拆开 + 每步 8 分钟门禁：挂死时定位到具体步骤，不靠 continue-on-error 掩盖。
    runs-on: windows-latest
    env:
      # en-US Windows runner stdio 默认 cp1252，中文输出会 UnicodeEncodeError；
      # 作业级统一 UTF-8，覆盖脚本自启 reconfigure 之外的 unittest 子进程输出。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依赖
        run: pip install -r scripts/requirements.txt
      - name: platform probe（OS 基本面 + plat 三档能力 + loopback TCP 自检）
        timeout-minutes: 8
        run: python scripts/win_probe.py
      - name: test_plat（锁 / 传输 / 进程信号平台适配靶向用例）
        timeout-minutes: 8
        working-directory: ai_new/modules/agent_test/private
        run: python -m unittest test_plat -v
      - name: test_isolation_windows（Win32 路径语义 + msvcrt 锁 / TCP / shm 真机档）
        timeout-minutes: 8
        working-directory: ai_new/modules/agent_test/private
        run: python -m unittest test_isolation_windows -v
      - name: 装配烟测（全部模块 import + setup，plat 能力上报成形）
        timeout-minutes: 8
        run: python -X faulthandler scripts/smoke_boot.py
      - name: test_core（核心回归：装配/路由/契约/桩协议）
        timeout-minutes: 8
        working-directory: ai_new/modules/agent_test/private
        run: |
          python -m unittest test_core -v *> test-core.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $parts = @()
            $lines = Get-Content test-core.log
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(FAIL|ERROR):') {
                $head = $lines[$i]
                for ($j = $i + 1; $j -lt [Math]::Min($i + 20, $lines.Count); $j++) {
                  if ($lines[$j] -match '^[A-Za-z_.]+(Error|Exception):') {
                    $parts += "$head => $($lines[$j])"
                    break
                  }
                }
              }
            }
            "::error::$($parts -join ' || ')"
            Get-Content test-core.log -Tail 120 >> $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      - name: Skip 门禁（Windows 平台允许集）
        timeout-minutes: 8
        run: python scripts/gate_skips.py
