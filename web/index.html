<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>Hive Agent</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-box">
    <h1>Hive<span>Agent</span></h1>
    <p class="muted" id="login-hint">输入访问密码进入控制台</p>
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <button id="login-btn" class="primary">登录</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button id="btn-rail" class="icon-btn" title="群聊列表">☰</button>
    <div class="brand">Hive<span>Agent</span></div>
    <div id="instance-pill" class="pill small">本地节点</div>
    <div class="spacer"></div>
    <nav class="tabs">
      <button class="tab active" data-tab="chat">群聊</button>
      <button class="tab" data-tab="library">库</button>
      <button class="tab" data-tab="health">健康</button>
      <button class="tab" data-tab="versions">版本</button>
      <button class="tab" data-tab="trace">链路</button>
    </nav>
  </header>

  <div class="shell">
    <aside class="rail" id="rail">
      <div class="rail-block">
        <div class="rail-title">本地层 <span id="layer-id" class="muted"></span></div>
        <div class="layer-card">
          <div id="layer-title">本地节点</div>
          <div class="muted small" id="layer-sub">layer=local · http</div>
        </div>
      </div>
      <div class="rail-block">
        <div class="rail-title">项目
          <button class="mini" id="btn-newproject" title="新建项目">+</button>
        </div>
        <div id="projects" class="projects"></div>
      </div>
      <div class="rail-block grow">
        <div class="rail-title">群聊</div>
        <div id="groups" class="groups"></div>
      </div>
      <div class="rail-block actions">
        <button class="ghost" id="btn-newticket">新建工单</button>
        <button class="ghost" id="btn-compact">压缩秘书上下文</button>
        <button class="warn" id="btn-restart">重启 agent</button>
        <button class="danger" id="btn-stop">彻底停止</button>
      </div>
    </aside>

    <main class="chatwrap">
      <div class="chathead">
        <div class="chathead-main">
          <strong id="chat-title">秘书</strong>
          <button class="chip hidden" id="btn-copy-ticket" title="复制工单号">⧉ 工单号</button>
          <span id="chat-sub" class="muted small"></span>
        </div>
        <div class="spacer"></div>
        <button class="mini" id="btn-fork-ticket" title="基于此单新开">⎇</button>
        <button class="mini" id="btn-files" title="交付件">📎</button>
        <button class="mini" id="btn-refresh" title="刷新">⟳</button>
      </div>

      <div id="flow" class="flow hidden"></div>

      <div id="messages" class="messages"></div>
      <div id="livebar" class="livebar hidden">
        <div class="live-dot"></div>
        <div class="live-text">
          <div class="live-who" id="live-who">角色正在说…</div>
          <div class="live-body" id="live-body"></div>
        </div>
        <div class="live-acts">
          <button class="mini" id="btn-interrupt" title="打断">■ 打断</button>
          <button class="mini hidden" id="btn-open-trace" title="看这条请求">链路</button>
        </div>
      </div>

      <div class="composer">
        <textarea id="input" rows="1" placeholder="给秘书发一句话…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="send" class="primary">发送</button>
      </div>
      <div id="readonly-tip" class="readonly-tip hidden">该工单已结单，群聊只读 —— 要改结果请「基于此单新开」。</div>
    </main>

    <aside class="side hidden" id="side">
      <div class="side-head">
        <div class="side-tabs">
          <button class="stab active" data-side="files">交付件</button>
          <button class="stab" data-side="trace">链路</button>
        </div>
        <button class="mini" id="side-close">✕</button>
      </div>
      <div id="side-body" class="side-body"></div>
    </aside>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modal-title">面板</strong>
      <button class="mini" id="modal-close">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
