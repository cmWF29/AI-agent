<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>Hive Agent</title>
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/rules-graph.css" />
</head>
<body>
<div id="login" class="login hidden">
  <div class="login-box">
    <h1>Hive<span>Agent</span></h1>
    <p class="muted" id="login-hint">输入访问密码进入控制台</p>
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <button id="login-btn" class="primary">登录</button>
    <div id="login-err" class="err"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <div id="rail-mask" class="rail-mask"></div>
  <header class="topbar">
    <button id="btn-rail" class="icon-btn" title="项目/秘书">☰</button>
    <button id="btn-back" class="icon-btn hidden" title="返回上一页">←</button>
    <div class="brand">Hive<span>Agent</span></div>
    <div class="spacer"></div>
    <nav class="tabs">
      <button class="tab" data-tab="rules">规则</button>
      <button class="tab" data-tab="library">库</button>
      <button class="tab" data-tab="health">健康</button>
      <button class="tab" data-tab="versions">版本</button>
    </nav>
  </header>

  <div class="shell">
    <aside class="rail" id="rail">
      <div class="rail-block">
        <div class="rail-title">项目
          <button class="mini" id="btn-newproject" title="新建项目">+</button>
        </div>
        <div id="projects" class="projects"></div>
      </div>
      <div class="rail-block actions">
        <button class="ghost" id="btn-restart">重启 agent</button>
        <button class="danger" id="btn-stop">彻底停止</button>
      </div>
    </aside>

    <main class="mainwrap">
      <!-- 项目页：只留挂载点，内容由 hive/modules/projects/ui.js 自己渲染 -->
      <section id="projectview" class="projectview hidden"><div id="mount-project"></div></section>

      <!-- 聊天页：只留挂载点，内容由 hive/modules/webchat/ui.js 自己渲染 -->
      <section id="chatview" class="chatwrap hidden"><div id="mount-chat"></div></section>
    </main>

    <aside class="side hidden" id="side">
      <div class="side-head">
        <div class="side-tabs"><button class="stab active" data-side="files">交付件</button></div>
        <button class="mini" id="side-close">✕</button>
      </div>
      <div id="side-body" class="side-body"></div>
    </aside>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modal-title">面板</strong>
      <button class="mini" id="modal-close">✕</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/core/hive-ui.js"></script>
<script src="/core/core.js"></script>
<script src="/module-ui/projects.js"></script>
<script src="/module-ui/webchat.js"></script>
<script src="/module-ui/artifacts.js"></script>
<script src="/module-ui/rules.js"></script>
<script src="/module-ui/idle.js"></script>
<script src="/module-ui/library.js"></script>
<script src="/module-ui/health.js"></script>
<script src="/module-ui/ops.js"></script>
<script src="/core/ui.js"></script>
<script src="/core/shell.js"></script>
</body>
</html>
