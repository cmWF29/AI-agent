# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: store
routes:
  store.append_text:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
      text:
        type: any
        req: true
    out:
      appended:
        type: bool
  store.archive:
    in:
      module:
        type: any
        req: false
      name:
        type: any
        req: false
      scripts:
        type: any
        req: false
    out:
      archive:
        type: any
      files:
        type: any
  store.exists:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      exists:
        type: any
  store.glob:
    in:
      module:
        type: any
        req: false
      pattern:
        type: any
        req: false
      root:
        type: any
        req: false
    out:
      items:
        type: list
      paths:
        type: any
  store.id:
    in:
      value:
        type: any
        req: false
    out:
      id:
        type: any
  store.next_seq:
    in:
      baseline:
        type: any
        req: false
      bucket:
        type: any
        req: false
    out:
      seq:
        type: any
  store.read:
    in:
      fallback:
        type: any
        req: false
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      bad:
        type: bool
      exists:
        type: bool
      value:
        type: any
  store.read_bytes:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      exists:
        type: bool
      hex:
        type: str
      size:
        type: int
      value:
        type: str
  store.read_text:
    in:
      fallback:
        type: any
        req: false
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      exists:
        type: bool
      value:
        type: any
  store.remove:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      removed:
        type: bool
  store.remove_dir:
    in:
      module:
        type: any
        req: false
      path:
        type: any
        req: false
    out:
      removed:
        type: bool
  store.walk:
    in:
      module:
        type: any
        req: false
      pattern:
        type: any
        req: false
      root:
        type: any
        req: false
    out:
      rows:
        type: list
  store.walk_text:
    in:
      module:
        type: any
        req: false
      pattern:
        type: any
        req: false
      root:
        type: any
        req: false
    out:
      rows:
        type: list
  store.write:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
      value:
        type: any
        req: true
    out:
      path:
        type: any
      written:
        type: bool
  store.write_bytes:
    in:
      hex:
        type: any
        req: false
      module:
        type: any
        req: true
      path:
        type: any
        req: true
      value:
        type: any
        req: false
      data:
        type: any
        req: true
    out:
      bytes:
        type: any
      path:
        type: any
      written:
        type: bool
  store.write_text:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
      text:
        type: any
        req: true
    out:
      path:
        type: any
      written:
        type: bool
  store.claim:
    in:
      module:
        type: any
        req: true
      bucket:
        type: any
        req: true
      key:
        type: any
        req: true
      route:
        type: any
        req: false
      scope:
        type: any
        req: false
      lease_seconds:
        type: any
        req: false
    out:
      claimed:
        type: bool
      status:
        type: any
      attempt:
        type: any
      result_digest:
        type: any
  store.renew:
    in:
      module:
        type: any
        req: true
      bucket:
        type: any
        req: true
      key:
        type: any
        req: true
      lease_seconds:
        type: any
        req: false
    out:
      renewed:
        type: bool
      status:
        type: any
      lease_until:
        type: any
  store.settle:
    in:
      module:
        type: any
        req: true
      bucket:
        type: any
        req: true
      key:
        type: any
        req: true
      status:
        type: any
        req: true
      result_digest:
        type: any
        req: false
      error_code:
        type: any
        req: false
    out:
      settled:
        type: bool
      status:
        type: any
      attempt:
        type: any
  store.sweep:
    in:
      module:
        type: any
        req: true
      bucket:
        type: any
        req: true
      mark:
        type: any
        req: false
    out:
      expired:
        type: any
      checked:
        type: any
      marked:
        type: any
