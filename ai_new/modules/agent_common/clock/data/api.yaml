# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: clock
routes:
  clock.now:
    doc: 现在（epoch 秒 + ISO）
    out:
      iso:
        type: any
      ts:
        type: any
  clock.since:
    doc: 某条 ISO 时间距今多少秒
  clock.sleep:
    doc: 等一会儿（秒）
