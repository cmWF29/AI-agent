# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: net
routes:
  net.request:
    doc: 出站 HTTP(S) 请求
    in:
      body:
        type: any
        req: false
      headers:
        type: any
        req: false
      method:
        type: any
        req: false
      timeout:
        type: any
        req: false
      url:
        type: any
        req: false
  net.request_stream:
    doc: 出站 SSE 流式请求：逐帧推草稿槽并汇总事件
    in:
      body:
        type: any
        req: false
      headers:
        type: any
        req: false
      method:
        type: any
        req: false
      stream_key:
        type: any
        req: false
      timeout:
        type: any
        req: false
      url:
        type: any
        req: false
