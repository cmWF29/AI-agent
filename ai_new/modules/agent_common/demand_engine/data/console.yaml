# 控制台外壳：页面上所有"看得见的字"和"配色"都从这里下发。
#
# 为什么要集中：外壳（导航、标题、词表、配色）一旦写进 HTML/JS，后端改一个岗位名、
# 加一个视图、换一套配色，页面就得跟着改一遍——页面等于存了第二份业务。
# 这里只放平台级、与具体业务无关的外壳信息：
#   brand  品牌与浏览器标题
#   ui     固定可见文案（空态、按钮、提示），{} 是占位，前端按顺序填空
#   roles  角色称呼与配色（改岗位配色改这里，前端不再认角色名）
#   fields 工具结果字段的显示名与展示顺序
#   status 会话状态的语义分组与文案（分组决定徽标颜色，文案决定显示词）
# 导航菜单不放这里：菜单是视图的属性，视图自己声明 `view.menu`，加视图就自动进导航。
brand:
  name: Hive AI
  logo: H
  tagline: 项目 · 工单 · 会话
  title: Hive AI · 项目与工单
  title_view: "{} · {}"                # 进到具体视图时的标题：先视图名，再品牌名
login:                                 # 登录页（未登录可读，不含导航与业务）
  title: Hive AI · 登录
  subtitle: 项目 · 工单 · 会话工作台
  user_label: 用户名
  pass_label: 密码
  submit: 登录
  note: 登录后使用本地同源 API，会话令牌保存在本机。
  failed: 登录失败
  no_token: 登录返回缺少会话令牌
  open_mode: 当前为开放模式，无需登录。
  open_enter: 进入控制台
  net_fail: "网络请求失败：{}"
  http_code: "（{}）"
