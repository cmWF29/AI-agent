click_machine:                          # 点击状态机：前端每一个可点位置都在这里登记种类与门禁
  states:
  - {key: idle,    label: 空闲,      at: [0.50, 0.14], note: 可以正常点击}
  - {key: press,   label: 按下,      at: [0.20, 0.42], note: 手指已落下，还没判方向}
  - {key: busy,    label: 执行中,    at: [0.50, 0.42], note: 有动作在飞，重复点击丢弃}
  - {key: modal,   label: 弹窗,      at: [0.80, 0.42], note: 只认弹窗内控件}
  - {key: drag,    label: 横滑,      at: [0.16, 0.76], note: 手势接管，本次不产生点击}
  - {key: scroll,  label: 纵滚,      at: [0.44, 0.76], note: 纵向手势交还页面滚动，立即回空闲}
  - {key: swallow, label: 吞一下,    at: [0.74, 0.76], note: 刚松手，紧随的一次点击属于手势}
  edge_notes:                          # 图上的关键边注解（只标容易看错的那几条）
    press>drag: 横滑
    press>scroll: 纵滑
    modal>busy: 提交
  transitions:                          # 允许的状态迁移：左边 now，右边 next
    idle:    [press, busy, modal]
    press:   [drag, scroll, idle, swallow, busy]
    drag:    [idle, swallow, busy]
    scroll:  [idle]
    swallow: [idle, press, drag]
    busy:    [idle, modal, swallow]
    modal:   [idle, busy]
  kinds:                                # 每个可点位置一类：允许态 allow / 进入 enter / 回落 exit
  - {key: nav,            label: 侧栏导航,     allow: [idle],           enter: busy,  exit: idle, note: 切页前先收好当前页}
  - {key: drawer_open,    label: 打开侧栏,     allow: [idle],           enter: "",    exit: "",   note: 只开抽屉}
  - {key: drawer_scrim,   label: 点暗处关侧栏, allow: [idle],           enter: "",    exit: "",   note: 只关抽屉}
  - {key: rail_close,     label: 收起侧栏,     allow: [idle],           enter: "",    exit: "",   note: 宽屏折叠}
  - {key: rail_open,      label: 展开侧栏,     allow: [idle],           enter: "",    exit: "",   note: 宽屏展开}
  - {key: crumb_up,       label: 面包屑上一级, allow: [idle],           enter: busy,  exit: idle, note: 回到上级页}
  - {key: head_act,       label: 页头按钮,     allow: [idle],           enter: busy,  exit: idle, note: 页级动作，同时只跑一个}
  - {key: card_open,      label: 打开卡片,     allow: [idle],           enter: busy,  exit: idle, note: 卡片整块可点}
  - {key: card_act,       label: 卡内按钮,     allow: [idle],           enter: busy,  exit: idle, note: 卡内改名/归档/删除}
  - {key: row_open,       label: 打开表格行,   allow: [idle],           enter: busy,  exit: idle, note: 整行可点}
  - {key: row_act,        label: 行内按钮,     allow: [idle],           enter: busy,  exit: idle, note: 行尾动作}
  - {key: tree_group,     label: 展开目录分组, allow: [idle, swallow],  enter: "",    exit: "",   note: 只展开收起，不取数}
  - {key: tree_doc,       label: 打开文档,     allow: [idle],           enter: busy,  exit: idle, note: 叶子跳转}
  - {key: filter,         label: 切换筛选,     allow: [idle],           enter: "",    exit: "",   note: 纯前端重排}
  - {key: member_chip,    label: 成员头像,     allow: [idle],           enter: "",    exit: "",   note: 只开关成员卡}
  - {key: popover_close,  label: 关闭成员卡,   allow: [idle],           enter: "",    exit: "",   note: 点空白处关闭}
  - {key: fold_text,      label: 展开长文,     allow: [idle, swallow],  enter: "",    exit: "",   note: 只改文本}
  - {key: wire_fold,      label: 展开报文,     allow: [idle, swallow],  enter: "",    exit: "",   note: 展开时才读原文}
  - {key: section_fold,   label: 折叠整段,     allow: [idle, swallow],  enter: "",    exit: "",   note: 只改本段显隐}
  - {key: logout,         label: 登出,         allow: [idle],           enter: busy,  exit: idle, note: 清令牌回登录页}
  - {key: summary_fold,   label: 展开摘要,     allow: [idle, swallow],  enter: "",    exit: "",   note: 只改文本}
  - {key: raw_fold,       label: 展开原文,     allow: [idle, swallow],  enter: "",    exit: "",   note: 只改文本}
  - {key: deck_toggle,    label: 展开堆叠,     allow: [idle, swallow],  enter: "",    exit: "",   note: 只改布局}
  - {key: deck_swipe,     label: 滑动堆叠,     allow: [idle],           enter: press, exit: idle, note: 手势由 pointer 驱动，先 press 再判方向}
  - {key: composer_send,  label: 发送消息,     allow: [idle],           enter: busy,  exit: idle, note: 空文本不发}
  - {key: composer_voice, label: 语音输入,     allow: [idle],           enter: busy,  exit: idle, note: 录音期互斥}
  - {key: modal_ok,       label: 弹窗确定,     allow: [modal],          enter: busy,  exit: modal, note: 提交中禁用}
  - {key: modal_cancel,   label: 弹窗取消,     allow: [modal],          enter: "",    exit: "",   note: 关闭由 closeModal 负责}
  - {key: modal_backdrop, label: 点遮罩关闭,   allow: [modal],          enter: "",    exit: "",   note: 只关弹窗}
  - {key: dag_zoom,       label: 流程图缩放,   allow: [idle],           enter: "",    exit: "",   note: 只改画布缩放，不取数}

# 控件级状态机：每一个按钮/控件一条，id 由「种类 + 标签」算（render.js 的 ctlOf 同算法）。
# 增删一个按钮而不登记这里，scripts/gate_controls.py 会直接报错——门禁不是靠人记得。
screen_machine:                       # 界面状态图：节点是"界面状态"，边是"哪个控件点下去到哪个状态"
  entry: view:projects
  shell_controls:                     # 外壳按钮也在状态机里：没有它们，侧栏开合就没人管
  - {key: ctl.shell.menu,       label: 三条杠,   note: 手机端点开侧栏}
  - {key: ctl.shell.scrim,      label: 侧栏外暗区, note: 点暗处收起侧栏，页面不变}
  - {key: ctl.shell.rail_close, label: 收起侧栏, note: 宽屏折叠}
  - {key: ctl.shell.rail_open,  label: 展开侧栏, note: 宽屏展开}
  - {key: ctl.crumb_up,         label: 面包屑上一级, note: 退回上级页}
  - {key: ctl.shell.logout,     label: 登出, note: 清令牌回登录页}
  overlays:                           # 浮层：能打开就必须能关，关的控件逐条登记
  - {key: overlay:sidebar, label: 侧栏, close_ctl: ctl.shell.scrim, close_note: 点侧栏外暗区收起}
  - {key: overlay:sidebar, label: 侧栏, close_ctl: ctl.shell.rail_close, close_note: 宽屏点收起}
controls:
  ctl.shell.menu:
    label: 三条杠
    kind: drawer_open
    where: [shell]
    states: [idle, busy]
    transitions: {idle: [busy], busy: [idle]}
    note: 点开侧栏；侧栏已开时再点由遮罩关闭
  ctl.shell.scrim:
    label: 侧栏外暗区
    kind: drawer_scrim
    where: [shell]
    states: [idle, busy]
    transitions: {idle: [busy], busy: [idle]}
    note: 只认侧栏展开态；收起后回到原页面，不换页
  ctl.shell.rail_close:
    label: 收起侧栏
    kind: rail_close
    where: [shell]
    states: [idle, busy]
    transitions: {idle: [busy], busy: [idle]}
    note: 宽屏折叠为图标条
  ctl.shell.logout:
    label: 登出
