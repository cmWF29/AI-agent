# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: demand_engine
routes:
  demand_engine.list:
    doc: 当前需求（on/do/enabled）
  demand_engine.run:
    doc: 按名跑一段编排需求
    in:
      id:
        type: any
        req: false
      input:
        type: any
        req: false
    out:
      result:
        type: any
  demand_engine.manifest:
    doc: 全量需求的可视化形状（执行链 + 树节点）
    out:
      count:
        type: int
      steps:
        type: int
      views:
        type: int
      callable:
        type: int
      items:
        type: any
      nodes:
        type: any
