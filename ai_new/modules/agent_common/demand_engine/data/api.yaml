# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: demand_engine
routes:
  demand_engine.list:
    doc: 当前需求（on/do/enabled）
  demand_engine.run:
    doc: 按名跑一段编排需求
    in:
      id:
        type: any
        req: false
      input:
        type: any
        req: false
    out:
      result:
        type: any
  demand_engine.batch:
    doc: 同层多条需求一次往返（控制台翻页把 RTT 收到一次）
    in:
      calls:
        type: any
        req: false
    out:
      items:
        type: any
  demand_engine.resolve:
    doc: 整页取数：按视图规格声明的依赖分层并发跑完，一次往返回整页数据
    in:
      view:
        type: str
        req: false
      params:
        type: any
        req: false
      shell:
        type: bool
        req: false
      only:
        type: any
        req: false
    out:
      view:
        type: str
      data:
        type: any
      cache:
        type: any
      spec:
        type: any
      views:
        type: any
      shell:
        type: any
      missing:
        type: any
  demand_engine.code_docs:
    doc: 源码与 docs/code 镜像文档的映射索引（按模块分组）
    in:
      group:
        type: str
        req: false
    out:
      total:
        type: int
      groups:
        type: any
  demand_engine.views_index:
    doc: 视图目录：只给 key/params/default/nav/menu，不带整页 sections
  demand_engine.view_spec:
    doc: 当前视图完整规格：按 key 只回一页
    in:
      key:
        type: str
        req: false
    out:
      result:
        type: any
  demand_engine.manifest:
    doc: 全量需求的可视化形状（执行链 + 树节点）
    out:
      count:
        type: int
      steps:
        type: int
      views:
        type: int
      callable:
        type: int
      items:
        type: any
      nodes:
        type: any
  demand_engine.chrome:
    doc: 登录页外壳（只回品牌与登录文案，未登录可读）
    out:
      brand:
        type: any
      login:
        type: any
  demand_engine.click_machine:
    doc: 点击状态机规格（状态、迁移、每种可点控件的门禁）
    out:
      click_machine:
        type: any
  demand_engine.console:
    doc: 控制台外壳（品牌、词表、配色、导航菜单）
    out:
      brand:
        type: any
      ui:
        type: any
      roles:
        type: any
      fields:
        type: any
      status:
        type: any
      menus:
        type: any
