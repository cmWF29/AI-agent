# 消息契约：本模块每条能力收什么、回什么。
# 字段来自两处：代码静态抽取（handler 读的键）+ 需求里显式写出的 with 键；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: demand_engine
routes:
  demand_engine.list:
    doc: 当前需求（on/do/enabled）
  demand_engine.run:
    doc: 按名跑一段编排需求
    in:
      id:
        type: any
        req: false
      input:
        type: any
        req: false
