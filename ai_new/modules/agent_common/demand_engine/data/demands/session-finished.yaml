id: session-finished
title: 会话收尾闭环：岗位流程校验 → 三态评审 → 回催/复盘/卡点
description: 会话收尾闭环：岗位流程校验 → 三态评审 → 回催/复盘/卡点。校验与判定归模块，闭环动作清单由 flow_plan 成形，写盘与再驱动交 apply
tags:
- session
- position
- write
- async
enabled: true
'on':
- sessions.finished
do:
- call: sessions.record_path
  with:
    id:
      get: event.data.id
  as: sp
- call: store.read
  with:
    module:
      lit: agent/logs
    path:
      get: sp.path
  as: row
- call: library.stage_contract
  with:
    machine:
      get: row.value.meta.machine
  as: contract
- call: demand_engine.run
  with:
    id:
      lit: ticket-files
    input:
      id:
        get: event.data.ticket
  as: listed
- call: tickets.paths
  with:
    items:
      get: listed.result.items
  as: paths
- call: library.stage_conditions
  with:
    contract:
      get: contract
    active:
      get: row.value.meta.active
    stage:
      get: row.value.meta.stage
    files:
      get: paths.paths
    contents:
      lit: {}
  as: cond
- call: library.stage_gaps
  with:
    contract:
      get: contract
    active:
      get: row.value.meta.active
    stage:
      get: row.value.meta.stage
    stage_alert:
      get: row.value.meta.stage_alert
    base:
      get: cond.missing
  as: gaps
- call: config.get
  with:
    key:
      lit: library.review_max_retries
  as: cfg_retries
- call: library.review
  with:
    missing:
      get: gaps.missing
    retries:
      get: row.value.meta.retries
    max_retries:
      get: cfg_retries.value
  as: rev
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      lit: messages.yaml
  as: tpls
- call: config.get
  with:
    key:
      lit: tickets.auto_retrospective
  as: cfg
- call: tickets.record_path
  with:
    id:
      get: event.data.ticket
  as: tp1
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp1.path
  as: ticket_row
- call: clock.now
  as: now
- call: tickets.msg
  with:
    tpl:
      get: tpls.value.repush_task
    vars:
      missing:
        get: rev.missing_text
  as: repush
- call: tickets.msg
  with:
    tpl:
      get: tpls.value.retrospect_prompt
    vars:
      lit: {}
  as: retro
- call: tickets.msg
  with:
    tpl:
      get: tpls.value.exhausted_note
    vars:
      role:
        get: event.data.role
      session:
        get: event.data.id
      retries:
        get: rev.retries
      missing:
        get: rev.missing_text
  as: exh
- call: sessions.flow_plan
  with:
    rec:
      get: row.value
    review:
      get: rev
    ticket:
      get: event.data.ticket
    repush_text:
      get: repush.text
    retrospect_text:
      get: retro.text
    exhausted_text:
      get: exh.text
    now:
      get: now.ts
    retrospect_enabled:
      get: ticket_row.value.auto_retrospective
    retrospect_default:
      get: cfg.value
  as: plan
- call: tickets.review_mark
  with:
    rec:
      get: ticket_row.value
    verdict:
      get: rev.verdict
    repush_text:
      get: repush.text
    to:
      get: event.data.role
    to_kind: role
    exhausted_text:
      get: exh.text
    pass_text:
      get: tpls.value.review_pass
    now:
      get: now.ts
  as: marked
- call: tickets.touch
  with:
    rec:
      get: marked
    now:
      get: now.ts
  as: touched
- call: tickets.record_path
  with:
    id:
      get: event.data.ticket
  as: tp2
- call: store.write
  with:
    module:
      lit: agent/tickets
    path:
      get: tp2.path
    value:
      get: touched
  as: tw
- call: runtime.apply
  with:
    effect:
      get: plan.effects
    echo:
      get: plan
  as: applied
expect:
  given:
    'on': sessions.finished
    event:
      data:
        id: role-1
        kind: role
        role: developer
        ticket: T-1
    input: {}
  calls:
  - sessions.record_path
  - store.read
  - library.stage_contract
  - demand_engine.run
  - tickets.paths
  - library.stage_conditions
  - library.stage_gaps
  - config.get
  - library.review
  - store.read
  - config.get
  - tickets.record_path
  - store.read
  - clock.now
  - tickets.msg
  - tickets.msg
  - tickets.msg
  - sessions.flow_plan
  - tickets.review_mark
  - tickets.touch
  - tickets.record_path
  - store.write
  - runtime.apply
  payload: {}
  promise: 校验与判定归模块，闭环动作清单由 flow_plan 成形，写盘与再驱动交 apply
