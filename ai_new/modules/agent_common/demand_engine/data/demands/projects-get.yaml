id: projects-get
title: 项目详情：按 id 取档案并露出字段；没有就报 not_found
description: 项目详情：按 id 取档案并露出字段；没有就报 not_found。读一次，缺就报缺，不吞错
tags:
- project
- read
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: id
- call: projects.record_path
  with:
    id:
      get: id.id
  as: pp
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: pp.path
  as: row
- call: projects.present
  with:
    id:
      get: id.id
    rec:
      get: row.value
  as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - projects.record_path
  - store.read
  - projects.present
  payload: {}
  promise: 读一次，缺就报缺，不吞错
