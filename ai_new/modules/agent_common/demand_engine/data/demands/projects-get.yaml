id: projects-get
title: 项目详情：按 id 取档案并露出字段；没有就报 not_found
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: id
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      op: +
      a:
        get: id.id
      b:
        lit: .yaml
  as: row
- when:
    op: ==
    a:
      get: row.value
    b: null
  then:
  - call: projects.missing
    with:
      id:
        get: id.id
    as: out
  else:
  - call: projects.view
    with:
      rec:
        get: row.value
    as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - store.read
  - projects.view
  payload: {}
  promise: 读一次，缺就报缺，不吞错
