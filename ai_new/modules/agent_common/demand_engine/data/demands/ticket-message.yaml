id: ticket-message
title: 工单消息：pm 或指定角色 → send 需求
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      op: +
      a:
        lit: tickets/
      b:
        op: +
        a:
          get: input.id
        b:
          lit: /ticket.yaml
  as: row
- when:
    op: ==
    a:
      get: input.target
    b: pm
  then:
  - call: tickets.pick
    with:
      rec:
        get: row.value
      target:
        get: input.target
    as: tgt
  - call: demand_engine.run
    with:
      id:
        lit: session-send
      input:
        id:
          op: +
          a:
            get: row.value.pm
          b:
            lit: ''
        text:
          get: input.text
    as: sent
  else:
  - call: tickets.pick
    with:
      rec:
        get: row.value
      target:
        get: input.target
    as: tgt
  - call: demand_engine.run
    with:
      id:
        lit: session-send
      input:
        id:
          get: tgt.session
        text:
          get: input.text
    as: sent
- call: tickets.view
  with:
    rec:
      get: row.value
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.pick
  - demand_engine.run
  - tickets.view
  payload: {}
  promise: 目标解析归模块
