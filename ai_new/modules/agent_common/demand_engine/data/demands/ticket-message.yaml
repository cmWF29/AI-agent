id: ticket-message
title: 工单消息：pm 或指定角色 → send 需求
description: 工单消息：pm 或指定角色 → send 需求。目标解析归模块
tags:
- ticket
- write
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: row
- call: tickets.resolve_target
  with:
    rec:
      get: row.value
    target:
      lit: pm
  as: tgt
- call: demand_engine.run
  with:
    id:
      lit: session-send
    input:
      id:
        get: tgt.session
      text:
        get: input.text
  as: sent
- call: runtime.dispatch
  with:
    demand:
      lit: session-run
    key:
      get: tgt.session
    input:
      id:
        get: tgt.session
  as: run
- call: tickets.view
  with:
    rec:
      get: row.value
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - tickets.resolve_target
  - demand_engine.run
  - runtime.dispatch
  - tickets.view
  payload: {}
  promise: 目标解析归模块
