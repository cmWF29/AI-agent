id: skill-uninstall
title: 卸载 Skill：级联移除其岗位、流程、工具登记与 Skill 条目
description: "卸载 Skill：按 Skill 登记级联摘除其岗位、流程、外部工具登记与 Skill 条目；内置 Skill 受保护不可卸载。级联裁剪归岗位库模块，四路落盘编排归需求"
tags:
- library
- write
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: us
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: ur
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: uf
- call: store.read
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
  as: ut
- call: library.skill_uninstall
  with:
    id:
      get: input.id
    skills:
      get: us.value
    roles:
      get: ur.value
    flows:
      get: uf.value
    tools:
      get: ut.value
  as: out
- call: store.write
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
    value:
      get: out.skills
  as: ws
- call: store.write
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
    value:
      get: out.roles
  as: wr
- call: store.write
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
    value:
      get: out.flows
  as: wf
- call: store.write
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
    value:
      get: out.tools
  as: wt
expect:
  given:
    input:
      id: demo
  calls:
  - store.read
  - store.read
  - store.read
  - store.read
  - library.skill_uninstall
  - store.write
  - store.write
  - store.write
  - store.write
  payload: {}
  promise: 级联裁剪与保护规则归模块，四路落盘编排归需求
