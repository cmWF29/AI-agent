id: knowledge-search
title: 搜知识：整树取文本 → 交给 knowledge 匹配
description: "搜知识：整树取文本 → 交给 knowledge 匹配。取文本归需求，匹配归模块"
tags: [knowledge, read]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: knowledge.search_limit
  as: cfg_limit
- call: config.get
  with:
    key:
      lit: knowledge.snippet_chars
  as: cfg_snippet
- call: store.walk_text
  with:
    module:
      lit: agent/knowledge
    pattern:
      lit: '**/*.md'
  as: rows
- call: knowledge.search
  with:
    rows:
      get: rows.rows
    query:
      get: input.query
    limit:
      get: cfg_limit.value
    snippet_chars:
      get: cfg_snippet.value
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - config.get
  - store.walk_text
  - knowledge.search
  payload: {}
  promise: 取文本归需求，匹配归模块
