id: knowledge-search
title: 搜知识：整树取文本 → 交给 knowledge 匹配
enabled: true
callable: true
'on': []
do:
- call: store.walk
  with:
    module:
      lit: agent/knowledge
    pattern:
      lit: '*.md'
  as: rows
- call: knowledge.search
  with:
    rows:
      get: rows.rows
    query:
      get: input.query
    limit:
      get: input.limit
  as: out
expect:
  given:
    input: {}
  calls:
  - store.walk
  - knowledge.search
  payload: {}
  promise: 取文本归需求，匹配归模块
