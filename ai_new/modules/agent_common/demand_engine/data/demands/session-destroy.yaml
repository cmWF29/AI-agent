id: session-destroy
title: 销毁会话：读记录 → 打 gone 标记 → 落盘
description: 销毁会话：读记录 → 打 gone 标记 → 落盘。状态迁移归模块，落盘归需求
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: sid
- call: sessions.record_path
  with:
    id:
      get: sid.id
  as: sp1
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      get: sp1.path
  as: row
- call: clock.now
  as: now
- call: sessions.gone
  with:
    rec:
      get: row.value
    now:
      get: now.ts
  as: rec
- call: sessions.record_path
  with:
    id:
      get: sid.id
  as: sp2
- call: store.write
  with:
    module:
      lit: agent/sessions
    path:
      get: sp2.path
    value:
      get: rec
  as: w
- call: sessions.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - sessions.record_path
  - store.read
  - clock.now
  - sessions.gone
  - sessions.record_path
  - store.write
  - sessions.view
  payload: {}
  promise: 状态迁移归模块，落盘归需求
