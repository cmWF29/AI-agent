id: channel-tail
title: 取最近 N 条：闭环在 channel.read_tail 能力内
description: "取最近 N 条：闭环在 channel.read_tail 能力内。读整频道、逐行解码、取窗口都在能力内部"
tags: [channel]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: channel.default_limit
  as: cfg_default
- call: config.get
  with:
    key:
      lit: channel.max_limit
  as: cfg_max
- call: channel.read_tail
  with:
    channel:
      get: input.channel
    limit:
      get: input.limit
    default_limit:
      get: cfg_default.value
    max_limit:
      get: cfg_max.value
  as: out
expect:
  given:
    input:
      channel: c1
      limit: 5
  calls:
  - config.get
  - config.get
  - channel.read_tail
  payload: {}
  promise: 读整频道、逐行解码、取窗口都在能力内部
