id: decompose-inspect
title: 拆解预检：安全读包 + 运行环境探测 + 缺失依赖检查（不执行外壳）
description: "把外部开源 skill 包当作不可信输入读入：先过包清单白名单、路径穿越 / 绝对路径 / 符号链接逃逸与大小数量上限校验，再探测所需命令与环境变量、对照已装清单给出缺失依赖计划。只扫描与探测，不执行包内脚本、不起任意外壳；缺依赖 / 非法包名进入阻断态，不登记交付件。"
tags:
- library
- read
touch: [decompose-index]
enabled: true
callable: true
'on': []
do:
- call: decompose.inspect
  with:
    bundle:
      get: input.bundle
    limits:
      get: input.limits
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      bundle:
        id: demo_skill
        version: v1
        source: https://example.com/SKILL.md
        license: MIT
        files:
        - path: SKILL.md
          text: "# demo skill"
        requirements: []
        deps:
          cli: []
          env: []
  calls:
  - decompose.inspect
  - runtime.apply
  payload: {}
  promise: 包安全校验、环境探测与依赖计划在能力内完成；预检结论落成任务台账记录，阻断态不写正式库
