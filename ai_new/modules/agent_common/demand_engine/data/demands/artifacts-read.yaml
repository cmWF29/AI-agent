id: artifacts-read
title: 读交付件：分层 → 算路径 → 取字节 → 解码成形；越界在纯函数里拦
description: "读交付件：分层 → 算路径 → 取字节 → 解码成形；越界在纯函数里拦。读盘归需求，解码是纯计算"
tags: [artifact, read]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: artifacts.max_bytes
  as: cfg_bytes
- call: config.get
  with:
    key:
      lit: artifacts.paths
  as: cfg_paths
- call: store.read
  with:
    module:
      lit: agent/artifacts
    path:
      lit: messages.yaml
  as: a_tpl
- call: artifacts.resolve
  with:
    layer:
      get: input.layer
    project:
      get: input.project
    ticket:
      get: input.ticket
  as: own
- call: artifacts.base
  with:
    layer:
      get: input.layer
    project:
      get: own.project
    ticket:
      get: own.ticket
    paths:
      get: cfg_paths.value
    tpl:
      get: a_tpl.value
  as: base
- call: artifacts.rel
  with:
    base:
      get: base.base
    path:
      get: input.path
    tpl:
      get: a_tpl.value
  as: rel
  required: true
- call: store.read_bytes
  with:
    module:
      lit: agent/artifacts
    path:
      get: rel.path
  as: raw
- call: codec.decode_hex
  with:
    hex:
      get: raw.hex
    size:
      get: raw.size
    max_bytes:
      get: cfg_bytes.value
  as: d
- call: artifacts.viewed
  with:
    path:
      get: rel.path
    size:
      get: raw.size
    truncated:
      get: d.truncated
    encoding:
      get: d.encoding
    text:
      get: d.text
    offset:
      get: input.offset
    limit:
      get: input.limit
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - config.get
  - store.read
  - artifacts.resolve
  - artifacts.base
  - artifacts.rel
  - store.read_bytes
  - codec.decode_hex
  - artifacts.viewed
  payload: {}
  promise: 读盘归需求，解码是纯计算
