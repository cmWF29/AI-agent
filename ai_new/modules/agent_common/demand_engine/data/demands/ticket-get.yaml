id: ticket-get
title: 取工单：读一次，缺就报缺
description: 取工单：读一次，缺就报缺。缺就报缺
tags:
- ticket
- read
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: row
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      lit: messages.yaml
  as: tpls
- call: tickets.present
  with:
    id:
      get: input.id
    rec:
      get: row.value
    tpl:
      get: tpls.value.missing
  as: out
expect:
  given:
    input:
      id: t1
  calls:
  - tickets.record_path
  - store.read
  - store.read
  - tickets.present
  payload: {}
  promise: 缺就报缺
