id: ticket-get
title: 取工单：读一次，缺就报缺
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      op: +
      a:
        lit: tickets/
      b:
        op: +
        a:
          get: input.id
        b:
          lit: /ticket.yaml
  as: row
- call: tickets.present
  with:
    id:
      get: input.id
    rec:
      get: row.value
  as: out
expect:
  given:
    input:
      id: t1
  calls:
  - store.read
  - tickets.present
  payload: {}
  promise: 缺就报缺
