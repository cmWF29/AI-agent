id: artifacts-list
title: 列交付件：分层 → 遍历该层 → 成形
description: "列交付件：分层 → 遍历该层 → 成形。遍历归需求"
tags: [artifact, read]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: artifacts.paths
  as: cfg_paths
- call: store.read
  with:
    module:
      lit: agent/artifacts
    path:
      lit: messages.yaml
  as: a_tpl
- call: store.id
  with:
    value:
      get: input.project
  as: pid
- call: store.id
  with:
    value:
      get: input.ticket
  as: tid
- call: artifacts.base
  with:
    layer:
      get: input.layer
    project:
      get: pid.id
    ticket:
      get: tid.id
    paths:
      get: cfg_paths.value
    tpl:
      get: a_tpl.value
  as: base
- call: store.walk_text
  with:
    module:
      lit: agent/artifacts
    root:
      get: base.base
    pattern:
      lit: '**/*'
  as: rows
- call: artifacts.screen
  with:
    layer:
      get: input.layer
    rows:
      get: rows.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.read
  - store.id
  - store.id
  - artifacts.base
  - store.walk_text
  - artifacts.screen
  payload: {}
  promise: 遍历归需求
