id: library-role-prompt
title: 岗位提示词：读岗位表 → 找 prompt_file → 取数据文件
description: 岗位提示词：读岗位表 → 找 prompt_file → 取数据文件。提示词是数据文件，模块只拼形状
tags:
- library
- read
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: roles
- call: library.get
  with:
    kind:
      lit: roles
    id:
      get: input.role
    seed:
      get: seed.value
    user:
      get: roles.value
  as: rec
- call: library.prompt_path
  with:
    file:
      get: rec.item.prompt_file
    rec:
      get: rec.item
  as: lp
- call: store.read_text
  with:
    module:
      get: lp.module
    path:
      get: lp.path
  as: file
- call: library.role_prompt
  with:
    role:
      get: input.role
    rec:
      get: rec.item
    text:
      get: file.value
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - store.read
  - library.get
  - library.prompt_path
  - store.read_text
  - library.role_prompt
  payload: {}
  promise: 提示词是数据文件，模块只拼形状
