id: decompose-install
title: 拆解入库：Skill.md 包 → 模型拆成岗位/流程/工具 → 成功后登记为一个 Skill 单元
description: "拆解入库：读入 Skill.md 包，经模型拆成岗位岗位、引用工具、流程规则与新工具定义；交付件有效才合并四库并落盘为一个 Skill 单元，拆解失败/空输入不写正式库。拆解闭环在 decompose.run 能力内，合并与落盘 effects 成形归 decompose.install，需求只编排调用与 apply"
tags:
- tool
- llm
- write
touch: [tools-list, tools-deps, project-tools]
enabled: true
callable: true
completion: inline
'on': []
do:
- call: store.read_text
  with:
    module:
      lit: agent/decompose
    path:
      lit: system.md
  as: sys
- call: decompose.run
  with:
    skill_md:
      get: input.skill_md
    url:
      get: input.url
    system:
      get: sys.value
    base_url:
      get: input.base_url
    api_key:
      get: input.api_key
    model:
      get: input.model
    mode:
      get: input.mode
    cancel:
      get: input.cancel
  as: out
- call: clock.now
  as: now
- call: decompose.install
  with:
    run:
      get: out
    source:
      get: input.source
    now:
      get: now.ts
  as: inst
- call: runtime.apply
  with:
    effect:
      get: inst.effects
    echo:
      get: inst
  as: applied
expect:
  given:
    input:
      skill_md: |
        ---
        name: ppt_design_skill
        description: 演示文稿设计
        ---
        根据资料设计演示文稿并自检交付。
  calls:
  - store.read_text
  - decompose.run
  - clock.now
  - decompose.install
  - runtime.apply
  payload: {}
  promise: 拆解交付件有效才登记为 Skill 单元；无效回空 effects 不落盘；记录映射与合并归模块，apply 落盘归需求
