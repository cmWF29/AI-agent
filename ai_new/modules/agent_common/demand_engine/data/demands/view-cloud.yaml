id: view-cloud
title: 云端配置对话：和云端配置者聊，必要信息一次问清，配置由岗位调工具落地
description: "云端配置对话：不摆表单，起一个全局云端配置者会话；用户给端点/账号/同步类别，岗位自己调连通测试与 profile 工具；凭证只在公共级上下文使用"
tags: [cloud, view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 6, label: 云端资料库, group: {name: 资产, order: 2}, mobile: true}
  key: cloud
  crumb: [云端资料库]
  heading: 云端资料库
  subheading: 和云端配置者对话；它负责收口径、测连通、落 profile，凭证不进聊天与视图
  poll: 2500
  data:
  - as: config
    demand: role-session-open
    disabled_when: data.config.status == gone
    params: {role: cloud-configurer, purpose: cloud-config, kind: role, name: 云端配置者}
  - as: members
    demand: role-session-members
    params: {role: cloud-configurer}
  sections:
  - kind: chat
    as: config
    lane: left
    source: config
    heading: 云端配置者
    meta:
    - 全局配置会话 · 不挂项目
    empty: 说说要接哪种云端、端点和要同步什么；配置者会一次把缺口问清
    hide_roles: [system]
    roles_source: members.items
    wire_demand: message-wire
    wire_chars: 8000
    raw_chars: 6000
    actions:
    - label: 配置信息
      view: cloud-info
      ctl: ctl.card_act.配置信息
  - kind: composer
    disabled_when: data.config.status == gone
    lane: left
    placeholder: 告诉配置者：哪家云、端点、目录/桶、要同步什么
    submit:
      label: 发送
      demand: role-session-message
      params:
        id: "{data.config.id}"
        text: $text
      flash: 已发给云端配置者
      clear: true
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 云端配置不再让人填 10 个字段；配置岗位自带工具与红线，缺口一次问清
