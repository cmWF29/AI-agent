id: artifacts-write
title: 写交付件：闭环在 artifacts.save 能力内，需求只做顺序编排
tags: [artifact]
enabled: true
callable: true
'on': []
do:
- call: artifacts.save
  with:
    layer:
      get: input.layer
    project:
      get: input.project
    ticket:
      get: input.ticket
    path:
      get: input.path
    content:
      get: input.content
    encoding:
      get: input.encoding
  as: out
expect:
  given:
    input:
      layer: ticket
      project: p1
      ticket: T-1
      path: a.bin
      content: AAEC
      encoding: base64
  calls:
  - artifacts.save
  payload: {}
  promise: 文本/二进制两条写路在能力内部选，需求树不分岔
