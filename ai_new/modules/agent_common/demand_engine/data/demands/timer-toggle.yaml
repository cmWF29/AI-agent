id: timer-toggle
title: 暂停/恢复定时器：按当前状态落 pause 或 resume
description: "暂停/恢复翻转：active 可暂停，paused 可恢复；恢复后重排下次触发。落盘效果交 runtime.apply。"
tags:
- timer
- write
touch: [timer-index]
enabled: true
callable: true
'on': []
do:
- call: timer.toggle
  with:
    id:
      get: input.id
    action:
      get: input.action
    caller:
      get: input.caller
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      id: tm-0001
      action: pause
  calls:
  - timer.toggle
  - runtime.apply
  payload: {}
  promise: 暂停/恢复按状态翻转；越权操作在能力内拒绝并写审计
