id: projects-archive
title: 归档项目：读一次 → 打归档标记（带时间）→ 落盘 → 露出字段
description: 归档项目：读一次 → 打归档标记（带时间）→ 落盘 → 露出字段。标记与时间都由需求带进来，模块纯计算
tags:
- project
- write
touch: [project-tree, projects-get]
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: id
- call: projects.record_path
  with:
    id:
      get: id.id
  as: pp1
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: pp1.path
  as: row
- call: clock.now
  as: now
- call: projects.archive
  with:
    rec:
      get: row.value
    now:
      get: now.ts
  as: rec
- call: projects.record_path
  with:
    id:
      get: id.id
  as: pp2
- call: store.write
  with:
    module:
      lit: agent/projects
    path:
      get: pp2.path
    value:
      get: rec
  as: w
- call: projects.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - projects.record_path
  - store.read
  - clock.now
  - projects.archive
  - projects.record_path
  - store.write
  - projects.view
  payload: {}
  promise: 标记与时间都由需求带进来，模块纯计算
