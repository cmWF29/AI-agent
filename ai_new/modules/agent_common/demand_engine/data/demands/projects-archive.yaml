id: projects-archive
title: 归档项目：归档前置（工单全部结单）与只读封锁都在 projects.remove 能力内
description: "归档项目：归档前置与只读封锁在能力内，需求只做顺序编排。有未结单工单就 409 open_tickets；已归档再归档 409 already_archived"
tags:
- project
- write
touch: [project-tree, projects-get]
enabled: true
callable: true
'on': []
do:
- call: projects.remove
  with:
    id:
      get: input.id
    purge:
      lit: false
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input: {}
  calls:
  - projects.remove
  - runtime.apply
  payload: {}
  promise: 归档前置与只读封锁归模块，需求不绕过
