id: view-positions
title: 岗位：岗位是系统提示词与流程规范，不在主线
description: "岗位库视图：岗位是系统提示词与流程规范，不在主线。每个岗位一张卡，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 2, label: 岗位, group: {name: 资产, order: 2}, mobile: true}
  key: positions
  crumb: [岗位]
  heading: 岗位
  subheading: 岗位 = 提示词 + 流程；派岗后生成实例
  data:
  - {as: list, demand: position-list}
  sections:
  - kind: cards
    as: list
    source: list.items
    layout: deck
    title: row.cn
    meta:
    - {label: 提示词, value: row.prompt_file}
    - {label: 工具, value: "row.tools|count", suffix: 个}
    - {label: 流程检查, value: "row.flow.checks|count", suffix: 项}
    chips:
    - {label: 状态机, from: row.stages, text: cn}
    - {label: 工具, from: row.tools}
    stat: {count: "row.stages|count", label: 个状态, note: 状态机随岗位走}
    on_click: {view: position, params: {position: row.id}}
    empty: {text: 暂无岗位}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 岗位库只声明卡片清单，数据源走需求
