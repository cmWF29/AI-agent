id: ops-overview
title: 运维总览：取回各模块只读状态，交给 ops 组装
description: "运维总览：取回各模块只读状态，交给 ops 组装。总览的形状属于运维，取数属于编排；面板只读一次结果"
tags: [ops, write]
enabled: true
callable: true
'on': []
do:
- call: config.get
  as: config
- call: demand_engine.run
  as: sessions
  with:
    id:
      lit: session-list
- call: demand_engine.run
  as: tickets
  with:
    id:
      lit: ticket-list
- call: demand_engine.run
  as: knowledge
  with:
    id:
      lit: knowledge-overview
- call: demand_engine.run
  as: artifacts
  with:
    id:
      lit: artifacts-stats
- call: demand_engine.run
  as: library
  with:
    id:
      lit: library-summary
- call: demand_engine.run
  as: tools
  with:
    id:
      lit: tools-deps
- call: demand_engine.run
  as: docs
  with:
    id:
      lit: artifacts-index
- call: demand_engine.run
  as: projects
  with:
    id:
      lit: projects-list
- call: ops.assemble
  with:
    config:
      get: config
    sessions:
      get: sessions
    tickets:
      get: tickets
    knowledge:
      get: knowledge
    artifacts:
      get: artifacts
    library:
      get: library
    projects:
      get: projects
    tools:
      get: tools
    docs:
      get: docs
  as: overview
expect:
  given:
    input: {}
  calls:
  - config.get
  - demand_engine.run
  - demand_engine.run
  - demand_engine.run
  - demand_engine.run
  - demand_engine.run
  - demand_engine.run
  - demand_engine.run
  - demand_engine.run
  - ops.assemble
  payload: {}
  promise: 总览的形状属于运维，取数属于编排；面板只读一次结果
