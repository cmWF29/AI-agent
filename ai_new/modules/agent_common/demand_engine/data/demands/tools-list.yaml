id: tools-list
title: 工具库清单：agent 代码内置工具，附依赖就绪状态
description: "工具库清单：只列注册表内置工具（代码自带能力），逐条对照在位快照给出依赖就绪状态。外部安装/拆解来的能力归技能库，不在此列。成形与判定归工具模块，取数归需求"
tags: [tool, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
  as: ext
- call: tools.list
  with:
    external:
      get: ext.value
    scope:
      lit: builtin
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - tools.list
  payload: {}
  promise: 内置裁剪与就绪判定归模块，取数归需求
