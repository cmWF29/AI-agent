id: artifacts-stats
title: 交付件统计：整树遍历后算数量与字节
enabled: true
callable: true
'on': []
do:
- call: store.walk
  with:
    module:
      lit: agent/artifacts
    pattern:
      lit: '*'
  as: rows
- call: artifacts.stats
  with:
    rows:
      get: rows.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - store.walk
  - artifacts.stats
  payload: {}
  promise: 统计形状归模块
