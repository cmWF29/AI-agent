id: secretary-autoflush
title: 项目秘书：新消息入队后自动整批处理
description: "秘书收到新消息先入队；本需求挂在 secretary.queued 延迟点上，在发送响应写完之后整批取走、合并建单。重复投递不会触发第二次，失败保留队列并在消息行写 last_error。"
tags:
- secretary
- write
enabled: true
callable: false
'on':
- secretary.queued
do:
- call: secretary.flush
  with:
    project:
      get: event.data.project
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    'on': secretary.queued
    event:
      data:
        project: p1
        msg_id: m-0001
    input: {}
  calls:
  - secretary.flush
  - runtime.apply
  payload: {}
  promise: 新消息入队后自动批量处理一次；重复投递不触发；失败保留队列且错误可见
