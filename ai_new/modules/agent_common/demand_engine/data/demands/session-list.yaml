id: session-list
title: 列会话：遍历会话目录后成形
description: "列会话：遍历会话目录后成形。遍历归需求"
tags: [session, read]
enabled: true
callable: true
'on': []
do:
- call: store.walk
  with:
    module:
      lit: agent/sessions
    root:
      lit: sessions
    pattern:
      lit: '*.yaml'
  as: rows
- call: sessions.screen
  with:
    status:
      get: input.status
    rows:
      get: rows.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - store.walk
  - sessions.screen
  payload: {}
  promise: 遍历归需求
