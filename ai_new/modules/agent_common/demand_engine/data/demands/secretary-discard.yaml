id: secretary-discard
title: 项目秘书：撤回一条队列消息
description: "用户撤回自己发过的某条消息：待处理/处理中置为已废弃，不参与后续合并；已并入或已废弃的终态不可撤回。"
tags:
- secretary
- write
touch: [secretary-index]
enabled: true
callable: true
'on': []
do:
- call: secretary.discard
  with:
    project:
      get: input.project
    msg_id:
      get: input.msg_id
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      project: p1
      msg_id: m1
  calls:
  - secretary.discard
  - runtime.apply
  payload: {}
  promise: 撤回的消息标记 discarded 且不参与合并；终态不可翻回
