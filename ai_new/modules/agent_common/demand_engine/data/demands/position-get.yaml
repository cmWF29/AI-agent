id: position-get
title: 岗位详情：岗位记录 + 关联流程规范 + 提示词正文
description: 岗位详情：岗位记录 + 关联流程规范 + 提示词正文。岗位是提示词加流程规范的模板，实例化不在此需求
tags:
- position
- library
- read
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: uroles
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: uflows
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: messages.yaml
  as: lib_tpl
- call: library.get
  with:
    kind:
      lit: roles
    id:
      get: input.id
    seed:
      get: seed.value
    user:
      get: uroles.value
  as: rec
- call: library.get
  with:
    kind:
      lit: flows
    id:
      get: input.id
    seed:
      get: seed.value
    user:
      get: uflows.value
  as: flowrec
- call: library.prompt_path
  with:
    rec:
      get: rec.item
  as: lp
- call: store.read_text
  with:
    module:
      get: lp.module
    path:
      get: lp.path
  as: libprompt
- call: library.position
  with:
    id:
      get: input.id
    rec:
      get: rec.item
    flow:
      get: flowrec.item
    prompt_text:
      get: libprompt.value
    tpl:
      get: lib_tpl.value.position_missing
  as: out
expect:
  given:
    input:
      id: architect
  calls:
  - store.read
  - store.read
  - store.read
  - store.read
  - library.get
  - library.get
  - library.prompt_path
  - store.read_text
  - library.position
  payload: {}
  promise: 岗位是提示词加流程规范的模板，实例化不在此需求
