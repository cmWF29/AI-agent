id: secretary-flush
title: 项目秘书：批量取整批合并，一次建单分派
description: "秘书空闲/被触发时取整批待处理消息：后发优先合并冲突、保留字段来源，形成一份需求后经既有 tickets.create 建单分派；一批只建一张单，重复 flush 不二次建单。失败保留队列并回滚待处理。"
tags:
- secretary
- write
touch: [secretary-index]
enabled: true
callable: true
'on': []
do:
- call: secretary.flush
  with:
    project:
      get: input.project
    roles_hint:
      get: input.roles_hint
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      project: p1
  calls:
  - secretary.flush
  - runtime.apply
  payload: {}
  promise: 一批消息合并成一张工单；同一批次重复 flush 不重复建单；失败消息不丢、回待处理且错误可见
