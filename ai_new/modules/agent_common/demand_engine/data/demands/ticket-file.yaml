id: ticket-file
title: 读工单交付件：artifacts-read 需求
description: 读工单交付件：artifacts-read 需求。读盘归需求
tags:
- ticket
- write
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: row
- call: demand_engine.run
  with:
    id:
      lit: artifacts-read
    input:
      layer:
        lit: ticket
      ticket:
        get: input.id
      project:
        get: row.value.project
      path:
        get: input.path
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - demand_engine.run
  payload: {}
  promise: 读盘归需求
