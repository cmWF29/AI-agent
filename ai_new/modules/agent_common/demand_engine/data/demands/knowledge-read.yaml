id: knowledge-read
title: 读知识：归一 id → 算路径 → 取文本 → 有则返回，无则报缺
description: "读知识：归一 id → 算路径 → 取文本 → 有则返回，无则报缺。路径由模块算，内容由 store 给，读不到就报缺"
tags: [knowledge, read]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: knowledge.paths
  as: k_paths
- call: store.read
  with:
    module:
      lit: agent/knowledge
    path:
      lit: messages.yaml
  as: k_tpl
- call: store.id
  with:
    value:
      get: input.project
  as: pid
- call: store.id
  with:
    value:
      get: input.ticket
  as: tid
- call: knowledge.scope
  with:
    layer:
      get: input.layer
    project:
      get: pid.id
    ticket:
      get: tid.id
    paths:
      get: k_paths.value
    tpl:
      get: k_tpl.value
  as: scope
- call: store.id
  with:
    value:
      get: input.name
  as: nid
- call: knowledge.doc
  with:
    prefix:
      get: scope.prefix
    name:
      get: nid.id
    paths:
      get: k_paths.value
    tpl:
      get: k_tpl.value
  as: doc
- call: store.read_text
  with:
    module:
      lit: agent/knowledge
    path:
      get: doc.path
  as: file
- call: knowledge.present
  with:
    name:
      get: input.name
    path:
      get: doc.path
    content:
      get: file.value
    tpl:
      get: k_tpl.value.missing
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.read
  - store.id
  - store.id
  - knowledge.scope
  - store.id
  - knowledge.doc
  - store.read_text
  - knowledge.present
  payload: {}
  promise: 路径由模块算，内容由 store 给，读不到就报缺
