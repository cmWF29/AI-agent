id: ticket-create
title: 建工单：闭环在 tickets.create 能力内，需求只做顺序编排
tags:
- ticket
- write
enabled: true
callable: true
'on': []
do:
- call: tickets.create
  with:
    title:
      get: input.title
    goal:
      get: input.goal
    project:
      get: input.project
    kind:
      get: input.kind
    parent:
      get: input.parent
    meta:
      get: input.meta
    auto_retrospective:
      get: input.auto_retrospective
    pm_max_steps:
      get: input.pm_max_steps
    task:
      get: input.task
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      project: p1
  calls:
  - tickets.create
  - runtime.apply
  payload: {}
  promise: 项目守卫与 PM 拉起都在能力内部，需求树只有一次顺序调用
