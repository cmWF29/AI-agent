id: ops-logs
title: 读日志：读文本 → 切成行 → 解析成事件
description: "读日志：读文本 → 切成行 → 解析成事件。解析归模块，读盘归能力"
tags: [ops, read]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: ops.log_lines
  as: cfg_lines
- call: store.read_text
  with:
    module:
      lit: agent_common/ops
    path:
      lit: logs/app.jsonl
    fallback:
      lit: ''
  as: text
- call: ops.tail
  with:
    rows:
      get: text.value
    lines:
      get: cfg_lines.value
  as: last
- call: ops.events
  with:
    rows:
      get: last.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.read_text
  - ops.tail
  - ops.events
  payload: {}
  promise: 解析归模块，读盘归能力
