id: position-tools
title: 岗位工具清单：公共岗位名单 ∩ 注册表；名单为空按会话类型放行
description: "岗位工具清单：岗位定义正文直读公共库，项目覆盖层禁用工具在 pick 时剔除；岗位名单 ∩ 注册表，名单为空按会话类型放行。名单交集成形归模块，注册表全量由 tools 能力给"
tags: [position, library, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: role
- call: library.get
  with:
    kind:
      lit: roles
    id:
      get: input.role
    seed:
      get: seed.value
    user:
      get: role.value
  as: rec
- call: tools.pick
  with:
    tools:
      get: rec.item.tools
    kind:
      get: input.kind
    project:
      get: input.project
  as: out
expect:
  given:
    input:
      role: developer
      kind: role
  calls:
  - store.read
  - store.read
  - library.get
  - tools.pick
  payload: {}
  promise: 公共库取岗位、名单交集成形归模块，项目覆盖层禁用工具在 pick 剔除，注册表全量由 tools 能力给
