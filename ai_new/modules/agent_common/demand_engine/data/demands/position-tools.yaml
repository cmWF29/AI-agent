id: position-tools
title: 岗位工具清单：项目副本岗位名单 ∩ 注册表；名单为空按会话类型放行
description: "岗位工具清单：优先用项目快照副本里的岗位记录，副本缺或空回退公共库；角色名单 ∩ 注册表，名单为空按会话类型放行。名单交集成形归模块，注册表全量由 tools 能力给"
tags: [position, library, read]
enabled: true
callable: true
'on': []
do:
- call: projects.project_lib_path
  with:
    id:
      get: input.project
    kind:
      lit: roles
  as: prole_p
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: prole_p.path
  as: prole
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: pubrole
- call: projects.choose_dict
  with:
    project:
      get: prole
    public:
      get: pubrole
  as: role
- call: library.get
  with:
    kind:
      lit: roles
    id:
      get: input.role
    seed:
      lit: {}
    user:
      get: role.value
  as: rec
- call: tools.pick
  with:
    tools:
      get: rec.item.tools
    kind:
      get: input.kind
  as: out
expect:
  given:
    input:
      role: developer
      kind: role
  calls:
  - projects.project_lib_path
  - store.read
  - store.read
  - projects.choose_dict
  - library.get
  - tools.pick
  payload: {}
  promise: 副本/公共兜底、名单交集成形归模块，注册表全量由 tools 能力给
