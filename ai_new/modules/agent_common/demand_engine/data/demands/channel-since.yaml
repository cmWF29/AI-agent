id: channel-since
title: 按游标取新消息：闭环在 channel.read_since 能力内
enabled: true
callable: true
'on': []
do:
- call: channel.read_since
  with:
    channel:
      get: input.channel
    cursor:
      get: input.cursor
  as: out
expect:
  given:
    input:
      channel: c1
      limit: 5
  calls:
  - channel.read_since
  payload: {}
  promise: 逐行解码与游标比较都在能力内部
