id: ticket-note
title: 写备注：追加一条 history 并落盘
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      op: +
      a:
        lit: tickets/
      b:
        op: +
        a:
          get: input.id
        b:
          lit: /ticket.yaml
  as: row
- call: clock.now
  as: now
- call: tickets.note
  with:
    rec:
      get: row.value
    text:
      get: input.text
    now:
      get: now.ts
  as: rec
- call: store.write
  with:
    module:
      lit: agent/tickets
    path:
      op: +
      a:
        lit: tickets/
      b:
        op: +
        a:
          get: rec.id
        b:
          lit: /ticket.yaml
    value:
      get: rec
  as: w
- call: tickets.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - clock.now
  - tickets.note
  - store.write
  - tickets.view
  payload: {}
  promise: 追加归模块
