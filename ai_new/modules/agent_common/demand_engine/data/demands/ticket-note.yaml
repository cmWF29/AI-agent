id: ticket-note
title: 写备注：守卫 → 追加 history → 落盘
description: 写备注：守卫 → 追加 history → 落盘。追加与守卫归模块
tags:
- ticket
- write
touch: [ticket-list]
enabled: true
callable: true
'on': []
do:
- call: tickets.note_write
  with:
    id:
      get: input.id
    text:
      get: input.text
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input: {}
  calls:
  - tickets.note_write
  - runtime.apply
  payload: {}
  promise: 结单与归档拦截下沉到模块
