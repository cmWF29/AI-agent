id: ticket-note
title: 写备注：追加一条 history 并落盘
description: 写备注：追加一条 history 并落盘。追加归模块
tags:
- ticket
- write
touch: [ticket-list]
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp1
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp1.path
  as: row
- call: clock.now
  as: now
- call: tickets.note
  with:
    rec:
      get: row.value
    text:
      get: input.text
    now:
      get: now.ts
  as: rec
- call: tickets.record_path
  with:
    id:
      get: rec.id
  as: tp2
- call: store.write
  with:
    module:
      lit: agent/tickets
    path:
      get: tp2.path
    value:
      get: rec
  as: w
- call: tickets.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - clock.now
  - tickets.note
  - tickets.record_path
  - store.write
  - tickets.view
  payload: {}
  promise: 追加归模块
