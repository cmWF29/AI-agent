id: react-run
title: ReAct 一轮会话：闭环在 react.run 能力内，需求只做顺序编排
description: "ReAct 一轮会话：闭环在 react.run 能力内，需求只做顺序编排。轮次循环、终止条件、工具回填都在能力内部"
tags:
- write
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: sessions.summary_fallback_chars
  as: cfg_fb
- call: store.read
  with:
    module:
      lit: agent_common/react
    path:
      lit: messages.yaml
  as: rtpl
- call: react.run
  with:
    messages:
      get: input.messages
    tools:
      get: input.tools
    base_url:
      get: input.base_url
    api_key:
      get: input.api_key
    model:
      get: input.model
    max_steps:
      get: input.max_steps
    session:
      get: input.session
    cancel:
      get: input.cancel
    mode:
      get: input.mode
    path:
      get: input.path
    extra:
      get: input.extra
  as: out
- call: react.summarize
  with:
    summary:
      get: out.summary
    messages:
      get: out.new_messages
    by_model:
      get: out.summary_by_model
    chars:
      get: cfg_fb.value
    title:
      get: rtpl.value.fallback_summary
  as: summ
- call: react.result
  with:
    messages:
      get: out.messages
    steps:
      get: out.steps
    cancelled:
      get: out.cancelled
    failed:
      get: out.failed
    summary:
      get: summ.summary
    summary_by_model:
      get: out.summary_by_model
    new_messages:
      get: out.new_messages
    stage:
      get: out.stage
  as: fin
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.read
  - react.run
  - react.summarize
  - react.result
  payload: {}
  promise: 轮次循环、终止条件、工具回填都在能力内部
