id: react-run
title: ReAct 一轮会话：模型 → 工具 → 再模型，循环由 until 表达
enabled: true
callable: true
'on': []
do:
- let: messages
  eq:
    get: input.messages
- let: steps
  eq:
    lit: 0
- let: done
  eq:
    lit: false
- let: cap
  eq:
    lit: 200
- when:
    op: '>'
    a:
      get: input.max_steps
    b:
      lit: 0
  then:
  - let: cap
    eq:
      get: input.max_steps
  else: []
- call: react.schemas
  with:
    tools:
      get: input.tools
  as: schemas
- until:
    op: or
    a:
      op: '>='
      a:
        get: steps
      b:
        get: cap
    b:
      op: ==
      a:
        get: done
      b:
        lit: true
  do:
  - call: demand_engine.run
    with:
      id:
        lit: llm-chat
      input:
        base_url:
          get: input.base_url
        api_key:
          get: input.api_key
        model:
          get: input.model
        messages:
          get: messages
        tools:
          get: schemas
    as: resp
  - call: react.assistant
    with:
      content:
        get: resp.result.content
      tool_calls:
        get: resp.result.tool_calls
    as: amsg
  - let: messages
    eq:
      op: append
      a:
        get: messages
      b:
        get: amsg
  - let: steps
    eq:
      op: +
      a:
        get: steps
      b:
        lit: 1
  - call: react.toolnames
    with:
      tool_calls:
        get: amsg.tool_calls
    as: names
  - when:
      op: ==
      a:
        op: len
        a:
          get: names
      b:
        lit: 0
    then:
    - let: done
      eq:
        lit: true
    else:
    - each:
        get: amsg.tool_calls
      as: call
      do:
      - call: codec.json_decode
        with:
          text:
            get: call.function.arguments
        as: raw
      - call: react.args
        with:
          value:
            get: raw.value
        as: targs
      - call: tools.execute
        with:
          name:
            get: call.function.name
          args:
            get: targs
          session:
            get: input.session
        as: out
      - call: codec.json_encode
        with:
          value:
            get: out
        as: enc
      - call: react.toolmsg
        with:
          id:
            get: call.id
          name:
            get: call.function.name
          content:
            get: enc.text
        as: tmsg
      - let: messages
        eq:
          op: append
          a:
            get: messages
          b:
            get: tmsg
- call: react.result
  with:
    messages:
      get: messages
    steps:
      get: steps
  as: out
expect:
  given:
    input: {}
  calls:
  - react.schemas
  - react.result
  payload: {}
  promise: 循环、终止条件、工具回填都在需求里；模块只切形状
