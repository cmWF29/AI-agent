id: react-run
title: ReAct 一轮会话：闭环在 react.run 能力内，需求只做顺序编排
tags:
- write
enabled: true
callable: true
'on': []
do:
- call: react.run
  with:
    messages:
      get: input.messages
    tools:
      get: input.tools
    base_url:
      get: input.base_url
    api_key:
      get: input.api_key
    model:
      get: input.model
    max_steps:
      get: input.max_steps
    session:
      get: input.session
    cancel:
      get: input.cancel
    mode:
      get: input.mode
  as: out
expect:
  given:
    input: {}
  calls:
  - react.run
  payload: {}
  promise: 轮次循环、终止条件、工具回填都在能力内部
