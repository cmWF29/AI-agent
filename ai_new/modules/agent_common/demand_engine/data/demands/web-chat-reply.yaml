id: web-chat-reply
title: 网页发消息→对话→回复写回频道：闭环在 channel.reply 能力内
tags:
- channel
- web
enabled: true
'on':
- channel.posted
do:
- call: channel.reply
  with:
    channel:
      get: event.data.channel
    role:
      get: event.data.role
    content:
      get: event.data.content
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    'on': channel.posted
    event:
      data:
        channel: web
        role: user
        content: 你好
    input: {}
  calls:
  - channel.reply
  - runtime.apply
  payload:
    channel.read_tail:
      channel:
        get: event.data.channel
  promise: 只回复用户消息、取历史、跑对话编排、写回同频道都在能力内部
