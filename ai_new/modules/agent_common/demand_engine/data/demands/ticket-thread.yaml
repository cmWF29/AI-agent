id: ticket-thread
title: 工单主会话线程：读工单 → 归一化主会话 id → 取 1:1 主会话消息流 → 露出岗位实例
description: 工单主会话线程：读工单 → 归一化主会话 id → 取 1:1 主会话消息流 → 露出岗位实例。工单与主会话 1:1，消息流由会话记录露出，模块只拼视图
tags:
- ticket
- session
- read
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: row
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      lit: messages.yaml
  as: tpls
- call: projects.record_path
  with:
    id:
      get: row.value.project
  as: prp
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: prp.path
  as: prow
- call: store.id
  with:
    value:
      get: row.value.pm
  as: sid
- call: sessions.record_path
  with:
    id:
      get: sid.id
  as: sp
- call: store.read
  with:
    module:
      lit: agent/logs
    path:
      get: sp.path
  as: srow
- call: sessions.view
  with:
    rec:
      get: srow.value
  as: thread
- call: sessions.by_ticket
  with:
    ticket:
      get: row.value
  as: roles_sessions
- call: tickets.thread
  with:
    id:
      get: input.id
    ticket:
      get: row.value
    thread:
      get: thread
    role_threads:
      get: roles_sessions.items
    tpl:
      get: tpls.value.missing
    project_archived:
      get: prow.value.archived
    tpl_lock:
      closed:
        get: tpls.value.ticket_closed
      archived:
        get: tpls.value.project_archived
  as: out
expect:
  given:
    input:
      id: T-1
  calls:
  - tickets.record_path
  - store.read
  - store.read
  - projects.record_path
  - store.read
  - store.id
  - sessions.record_path
  - store.read
  - sessions.view
  - sessions.by_ticket
  - tickets.thread
  payload: {}
  promise: 工单与主会话 1:1，消息流由会话记录露出，模块只拼视图
