id: view-knowledge
title: 知识库视图：公共/项目/工单三级文档只读浏览
description: "知识库视图：公共/项目/工单三级文档只读浏览。目录由 knowledge-index 分组，点进文档看正文，不在此页编辑"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 2, label: 知识库, group: {name: 工作, order: 1}, mobile: true}
  key: knowledge
  crumb: [知识库]
  heading: 知识库
  subheading: 公共、项目、工单三级，只读
  data:
  - {as: idx, demand: knowledge-index}
  sections:
  - kind: kv
    as: idx
    source: idx.counts
    heading: 层级统计
    rows:
    - label: 公共
      value: row.public
    - label: 项目
      value: row.project_groups
    - label: 已归项目
      value: row.placed
    - label: 未归工单
      value: row.orphan
  - kind: tree
    as: idx
    source: idx.tree
    on_click:
      view: knowledge-doc
      params:
        layer: row.layer
        name: row.name
        project: row.project
        ticket: row.ticket
    empty: {title: 知识库为空, text: 流程运行后会把规范与结论沉淀到这里。}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 目录由 knowledge-index 分组，浏览视图只读；tree 叶子为 doc 条目
