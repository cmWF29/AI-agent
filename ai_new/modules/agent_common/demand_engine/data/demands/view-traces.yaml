id: view-traces
title: 链路列表视图：今天每次请求一条 trace，点开看瀑布
description: "链路列表视图：今天每次请求一条 trace，点开看瀑布。列表只声明表格，聚合走需求"
tags: [view, web, ops]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 2.1, label: 链路, group: {name: 系统, order: 3}, parent: ops, mobile: true}
  key: traces
  nav: ops
  parent: {view: ops}
  crumb: [运维, 链路]
  heading: 链路
  subheading: 一次请求一条；点开看每段耗时
  data:
  - {as: list, demand: trace-list}
  - {as: slow, demand: trace-slow}
  sections:
  - kind: stats
    rows:
    - {label: 今日请求, value: "data.list.total", note: "条 trace"}
    - {label: 最慢 P95, value: "data.slow.items.0.p95_ms", note: "ms"}
  - kind: table
    as: list
    source: data.list.items
    heading: 请求清单
    limit: 20
    count_note: "共 {data.list.total} 条；慢请求排前面，只看前 20 条，点任意一行看瀑布"
    columns:
    - {label: 链路, value: row.trace, sub: "{row.start|when}"}
    - {label: 节点数, value: row.spans, suffix: 个}
    - {label: 总耗时, value: row.dur_ms, suffix: ms}
    - {label: 错误, value: row.err}
    on_click: {view: trace, params: {trace: row.trace}}
    empty: {text: 今天还没有链路采样（config.trace.sample 调高可全采）}
  - kind: stack
    as: slow
    heading: 按阶段聚合（P95 排序）
    note: 按 P95 从慢到快；点开任意一条看 P50/峰值/错误和代表链路
    source: data.slow.items
    sort: {by: row.p95_ms, order: desc}
    count_note: "共 {data.slow.items|count} 条，全部可展开"
    item:
      title: row.name
      sub: "row.n 次"
      badge: row.p95_ms
      badge_suffix: ms
    fields:
    - {label: 次数, value: row.n}
    - {label: P50, value: row.p50_ms, suffix: ms}
    - {label: P95, value: row.p95_ms, suffix: ms}
    - {label: 峰值, value: row.max_ms, suffix: ms}
    - {label: 错误, value: row.err}
    samples:
      label: 代表链路
      from: row.samples
      text: row.trace
      value: row.dur_ms
      max: 5
      on_click: {view: trace, params: {trace: row.trace}}
    empty: {text: 暂无采样}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 列表只声明表格，聚合走需求
