id: secretary-intake
title: 项目秘书：消息入队（幂等，不直接建单）
description: "用户把零散表述发给项目秘书：消息先入项目队列；同一 msg_id 重复投递不重复入队。建单由秘书批量合并后统一完成，本需求不建工单。"
tags:
- secretary
- write
touch: [secretary-index]
enabled: true
callable: true
'on': []
do:
- call: secretary.push
  with:
    project:
      get: input.project
    msg_id:
      get: input.msg_id
    text:
      get: input.text
    fields:
      get: input.fields
    source:
      get: input.source
    timer_id:
      get: input.timer_id
    slot:
      get: input.slot
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      project: p1
  calls:
  - secretary.push
  - runtime.apply
  payload: {}
  promise: 同一 msg_id 重复投递只入队一次；入队本身不建工单
