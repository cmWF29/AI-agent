id: project-skills
title: 项目 Skill 清单：直读公共技能库，按项目覆盖层打禁用标记
description: "项目 Skill 清单：技能/岗位/流程/工具定义正文只存公共库一份，项目档案只持启停覆盖层；读公共库成形摘要，项目禁用技能仍展示并打 disabled_project 标记，供重新启用。关联岗位中文名、流程在库与否、工具名与状态。摘要成形归岗位库模块，覆盖层取数归项目模块，取数归需求"
tags: [project, library, read]
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: pid
- call: projects.record_path
  with:
    id:
      get: pid.id
  as: pp
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: pp.path
  as: proj
- call: projects.override_parts
  with:
    rec:
      get: proj.value
  as: ov
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: sk
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: role
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: flow
- call: store.read
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
  as: tool
- call: library.skills_list
  with:
    skills:
      get: sk.value
    roles:
      get: role.value
    flows:
      get: flow.value
    tools:
      get: tool.value
    disabled:
      get: ov.skills
  as: out
expect:
  given:
    input:
      id: <project-id>
  calls:
  - store.id
  - projects.record_path
  - store.read
  - projects.override_parts
  - store.read
  - store.read
  - store.read
  - store.read
  - library.skills_list
  payload: {}
  promise: 公共库唯一事实源、Skill 摘要成形归模块，项目覆盖层只打标记，取数归需求
