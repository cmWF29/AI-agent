id: ticket-roles
title: 工单角色清单：读记录后取 roles
description: "工单角色清单：读记录后取 roles。取一个字段"
tags: [ticket, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      op: +
      a:
        lit: tickets/
      b:
        op: +
        a:
          get: input.id
        b:
          lit: /ticket.yaml
  as: row
- call: tickets.roles
  with:
    rec:
      get: row.value
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.roles
  payload: {}
  promise: 取一个字段
