id: ticket-roles
title: 工单岗位清单：读记录后取 roles
description: 工单岗位清单：读记录后取 roles。取一个字段
tags:
- ticket
- read
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: row
- call: tickets.roles
  with:
    rec:
      get: row.value
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - tickets.roles
  payload: {}
  promise: 取一条岗位记录
