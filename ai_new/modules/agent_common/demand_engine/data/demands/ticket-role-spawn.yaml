id: ticket-role-spawn
title: 拉岗位会话：spawn 需求 → 挂到 roles → 落盘
description: 拉岗位会话：spawn 需求（内部幂等复用）→ 挂到 roles → 落盘。会话由需求拉，工单只记账
tags:
- ticket
- write
touch: [ticket-list]
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp1
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp1.path
  as: row
- call: clock.now
  as: now
- call: sessions.role_name
  with:
    role:
      get: input.role
    id:
      get: input.id
  as: rn
- call: demand_engine.run
  with:
    id:
      lit: session-spawn
    input:
      kind:
        lit: role
      role:
        get: input.role
      name:
        get: rn.name
      ticket:
        get: input.id
      project:
        get: row.value.project
      task:
        get: input.task
  as: sp
# 复用分支已在 sessions.spawn 内把 task 追加进已有会话（等价 role_task），
# 这里不能再无条件跑 session-send，否则复用时任务会落两遍。新建分支的
# task 由 sessions.build 写进会话初始消息，也不缺这一步。
- call: tickets.bindrole
  with:
    rec:
      get: row.value
    session:
      get: sp.result.id
    reuse:
      get: sp.result.reused
    role:
      get: input.role
    display:
      get: input.display
    task:
      get: input.task
    now:
      get: now.ts
  as: rec
- call: tickets.record_path
  with:
    id:
      get: rec.id
  as: tp2
- call: store.write
  with:
    module:
      lit: agent/tickets
    path:
      get: tp2.path
    value:
      get: rec
  as: w
- call: runtime.dispatch
  with:
    demand:
      lit: session-run
    key:
      get: sp.result.id
    input:
      id:
        get: sp.result.id
  as: run
- call: tickets.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - clock.now
  - sessions.role_name
  - demand_engine.run
  - tickets.bindrole
  - tickets.record_path
  - store.write
  - runtime.dispatch
  - tickets.view
  payload: {}
  promise: 同工单同岗位只留一条会话线；复用则派任务，新建则记账
