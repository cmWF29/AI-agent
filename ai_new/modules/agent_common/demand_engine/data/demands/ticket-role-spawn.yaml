id: ticket-role-spawn
title: 拉角色会话：spawn 需求 → 挂到 roles → 落盘
description: 拉角色会话：spawn 需求 → 挂到 roles → 落盘。会话由需求拉，工单只记账
tags:
- ticket
- write
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp1
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp1.path
  as: row
- call: clock.now
  as: now
- call: sessions.role_name
  with:
    role:
      get: input.role
    id:
      get: input.id
  as: rn
- call: demand_engine.run
  with:
    id:
      lit: session-spawn
    input:
      kind:
        lit: role
      role:
        get: input.role
      name:
        get: rn.name
      ticket:
        get: input.id
      task:
        get: input.task
  as: sp
- call: tickets.bindrole
  with:
    rec:
      get: row.value
    session:
      get: sp.result.id
    role:
      get: input.role
    display:
      get: input.display
    task:
      get: input.task
    now:
      get: now.ts
  as: rec
- call: tickets.record_path
  with:
    id:
      get: rec.id
  as: tp2
- call: store.write
  with:
    module:
      lit: agent/tickets
    path:
      get: tp2.path
    value:
      get: rec
  as: w
- call: tickets.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - clock.now
  - sessions.role_name
  - demand_engine.run
  - tickets.bindrole
  - tickets.record_path
  - store.write
  - tickets.view
  payload: {}
  promise: 会话由需求拉，工单只记账
