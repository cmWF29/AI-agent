id: view-click-machine
title: 页面怎么走、每页能点什么、点了以后什么态
description: "用户视角：先把有哪些页面、页面之间怎么跳讲清楚，再逐页列出能点/能输入的元素与它们的态；技术附录（状态迁移图、控件门禁）折叠在最后，不占主线"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 页面只声明区块与规格；页面地图、跳转与元素清单全部由 click-machine 需求从视图规格推导，不手维护
view:
  menu: {order: 1, label: 点击状态机, group: {name: 系统, order: 3}, mobile: true}
  key: click-machine
  crumb: [点击状态机]
  heading: 点击状态机
  subheading: 用户从登录进来先看哪页、页面之间靠哪个控件跳、每页里哪些东西能点、点不动时是什么态
  data:
  - {as: machine, demand: click-machine}
  actions: []
  sections:
  # 第一屏只讲一件事：这是一张"用户走位图"——页面 → 页面间跳转 → 页内元素
  - kind: pages
    as: machine
    source: machine
    fold: {title: "有哪些页面", note: "每行一页：这页只干一件事（视图自己声明的副标题）、从哪页点什么进来、点哪个控件能出去"}
    heading: 有哪些页面
    note: 每行一页：这页只干一件事（视图自己声明的副标题）、从哪页点什么进来、点哪个控件能出去
  - kind: routes
    as: machine
    source: machine
    fold: {title: "页面之间怎么跳", note: "一条就是在哪页、点哪个、到了哪页；弹窗（浮层）也算一步落点"}
    heading: 页面之间怎么跳
    note: 一条就是"在哪页、点哪个、到了哪页"；弹窗（浮层）也算一步落点，因为它会打断当前页
  - kind: elems
    as: machine
    source: machine
    fold: {title: "一页里有哪些元素、点了以后什么态", note: "按页折叠；每行写清元素叫什么、点下去发生什么、只在哪个态点得动"}
    heading: 一页里有哪些元素、点了以后什么态
    note: 按页折叠；每行写清元素叫什么、点下去发生什么、以及只在哪个态点得动（点不动就是灰的、吞掉点击）
  - kind: stats
    as: machine
    fold: {title: 盘点数字}
    rows:
    - {label: 页面, value: "data.machine.screen_machine.stats.pages", note: 个业务页面}
    - {label: 页面间跳转, value: "data.machine.screen_machine.stats.routes", note: 条页面→页面/弹窗}
    - {label: 控件种类, value: "data.machine.click_machine.kinds|count", note: 类可点位置}
    - {label: 可点实例, value: "data.machine.inventory.stats.instances", note: 逐页清点到的真实元素}
    - {label: 交互迁移, value: "data.machine.click_machine.edges", note: 条允许的状态转移}
  # 技术附录：给实现与测试看，默认折叠，不进用户主线
  - kind: table
    as: machine
    fold: {title: "附录：每页可点实例数（脚本清点）", note: "完整清单由 scripts/ui_inventory.py 生成"}
    source: machine.inventory.pages
    columns:
    - {label: 页面, value: row.view}
    - {label: 可点实例, value: row.count}
  - kind: table
    as: machine
    fold: {title: "附录：控件清单（每个按钮点下去干什么）", note: "不换页面的按钮也在册：归档/删除/启停是本页刷新，展开/缩放只改本页显示"}
    source: machine.screen_machine.controls
    columns:
    - {label: 页面, value: row.view_cn, sub: row.view}
    - {label: 按钮, value: row.label, sub: row.ctl}
    - {label: 点后去向, value: row.effect}
  - kind: dag
    as: machine
    fold: {title: "附录：全站界面状态图", note: "节点是页面/浮层，箭头是具体控件点下去到哪；虚线回边是关回去那一步"}
    source: machine.screen_machine.states
  - kind: kinds
    as: machine
    fold: {title: "附录：可点位置的门禁", note: "允许态里点得动；箭头是点下去之后的状态"}
    source: machine.click_machine.kinds
  - kind: machine
    as: machine
    fold: {title: "附录：交互状态迁移图", note: "空闲/按下/执行中/弹窗/横滑/纵滚/吞一下，以及它们之间允许的转移"}
    source: machine.click_machine
