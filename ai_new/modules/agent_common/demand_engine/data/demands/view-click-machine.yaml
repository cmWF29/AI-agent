id: view-click-machine
title: 点击状态机：页面所有可点控件的状态、迁移与门禁
description: "点击状态机：页面所有可点控件的状态、迁移与门禁。状态与门禁由外壳下发，前端只执行，测试按这份规格全量跑"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 1, label: 点击状态机, group: {name: 系统, order: 3}, mobile: true}
  key: click-machine
  crumb: [点击状态机]
  heading: 点击状态机
  subheading: 每个可点位置的门禁与允许的迁移
  data:
  - {as: machine, demand: click-machine}
  actions: []
  sections:
  - kind: stats
    as: machine
    rows:
    - {label: 状态, value: "data.machine.click_machine.states|count", note: 个交互状态}
    - {label: 可点位置, value: "data.machine.click_machine.kinds|count", note: 类控件}
    - {label: 迁移规则, value: "data.machine.click_machine.edges", note: 条允许的转移}
  - kind: stats
    as: machine
    rows:
    - {label: 界面状态, value: "data.machine.screen_machine.stats.states|count", note: 个页面/浮层}
    - {label: 界面迁移, value: "data.machine.screen_machine.stats.edges|count", note: 条"点哪个控件到哪个状态"}
    - {label: 浮层, value: "data.machine.screen_machine.stats.overlays|count", note: 能开必须能关}
  - kind: dag
    as: machine
    source: machine.screen_machine.states
    title: 全站界面状态图
    heading: 页面、浮层与控件点击的去向
    note: 节点是界面状态，箭头是具体控件点下去之后到的状态；虚线回边是"关回去"的那一步（侧栏/弹窗/面包屑）
  - kind: machine
    as: machine
    source: machine.click_machine
    heading: 状态与迁移
    note: 箭头是允许的转移；线越密的地方越容易被误点，门禁就在那里
  - kind: kinds
    as: machine
    source: machine.click_machine.kinds
    heading: 可点位置与门禁
    note: 允许态里点得动；箭头是点下去之后的状态
