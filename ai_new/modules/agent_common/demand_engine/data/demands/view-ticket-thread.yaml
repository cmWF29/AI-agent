id: view-ticket-thread
title: 工单会话视图：工单信息、历程与成员全部并入群聊，头像弹成员卡
description: "工单会话视图：工单信息、历程与成员全部并入群聊，头像弹成员卡。会话视图只声明区块，数据源走需求"
tags:
- view
- web
- read
enabled: true
callable: false
'on': []
do: []
view:
  key: ticket
  labels: {created: 建单, pm_start: PM 开工, role_spawn: 派角色, child_split: 拆子单,
           repush: 回催缺口, review_pass: 评审达标, exhausted: 卡点, note: 备注, closed: 结单}
  params: [project, ticket]
  nav: projects
  parent: {view: project, params: {project: "{route.project}"}}
  crumb:
  - 项目
  - '{thread.ticket.project|project_name}'
  - '{thread.ticket.title}'
  heading_from: '{thread.ticket.title}'
  poll: 1500
  data:
  - as: thread
    demand: ticket-thread
    params:
      id: '{route.ticket}'
  - as: draft
    demand: session-draft
    params:
      id: '{thread.thread.id}'
  - as: tree
    demand: project-tree
    cache: projects
  sections:
  - kind: chat
    lane: left
    source: thread.thread
    badge: '{thread.ticket.status}'
    meta:
    - '{thread.ticket.id}'
    - '{thread.ticket.project|project_name}'
    - '更新 {thread.ticket.updated|when}'
    history_source: thread.ticket.history
    # 回催与备注在消息流里已有原文气泡/工具卡，历程事件不再重复一遍
    hide_events:
    - repush
    - note
    hide_roles:
    - system
    empty: 还没有消息，PM 正在准备…
    roles_source: thread.members
    wire_demand: message-wire
    wire_chars: 8000
    raw_chars: 6000
  - kind: composer
    lane: left
    placeholder: 发给 PM 的消息，Enter 发送
    voice:
      label: 语音
      demand: asr-transcribe
      params:
        mime: audio/wav
      hint: 点一次开始录音，再点停止；识别文字回填到输入框，可修改后手动发送
    submit:
      label: 发送
      demand: ticket-message
      params:
        id: '{thread.ticket.id}'
        text: $text
        target: pm
      flash: 已发送给 PM
      clear: true
    busy_from: '{thread.thread.status}'
    busy_when: running
    busy_text: PM 正在输出：现在发送会打断它当前这轮，工单内的角色不受影响
    actions:
    - label: 追加备注
      demand: ticket-note
      params:
        id: '{thread.ticket.id}'
        text: $text
      flash: 备注已追加
      clear: true
      empty_hint: 请先输入备注内容
    - label: 结单
      modal: ticket.close
      tone: danger
    disabled_when: '{thread.ticket.status=closed}'
    disabled_hint: 工单已结单：不能再发消息或追加备注
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 会话视图只声明区块，数据源走需求
