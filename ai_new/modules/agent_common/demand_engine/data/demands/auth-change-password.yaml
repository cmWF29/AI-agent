id: auth-change-password
title: 修改密码：验旧密码 → 摘要校验 → 写配置新摘要
description: "修改密码：验旧密码 → 摘要校验 → 写配置新摘要。校验与写盘在 auth.change_password 能力内部闭环，需求树不写 when/fail；本期只支持改密，不做角色与权限"
tags:
- auth
- write
enabled: true
callable: true
'on': []
do:
- call: auth.change_password
  with:
    old_password:
      get: input.old_password
    new_password:
      get: input.new_password
    confirm:
      get: input.confirm
  as: out
expect:
  given:
    input:
      old_password: old-secret
      new_password: new-secret
      confirm: new-secret
  calls:
  - auth.change_password
  payload: {}
  promise: 旧密码比对、两次新密码一致性校验与新摘要落盘在能力内部闭环，需求树不写 when/fail
