id: session-compact
title: 裁剪上下文：保留系统消息 + 最近 N 条
description: 裁剪上下文：保留系统消息 + 最近 N 条。裁剪规则归模块
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: sid
- call: sessions.record_path
  with:
    id:
      get: sid.id
  as: sp
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      get: sp.path
  as: row
- call: config.get
  with:
    key:
      lit: sessions.summary_keep
  as: cfg_keep
- call: clock.now
  as: now
- call: sessions.compact
  with:
    rec:
      get: row.value
    keep:
      get: cfg_keep.value
    now:
      get: now.ts
  as: rec
expect:
  given:
    input: {}
  calls:
  - store.id
  - sessions.record_path
  - store.read
  - config.get
  - clock.now
  - sessions.compact
  payload: {}
  promise: 裁剪规则归模块
