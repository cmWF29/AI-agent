id: view-arch
title: 需求契约与运行时参数：需求要求什么、编译成什么、藏了哪些参数
description: "需求契约：每条需求要求什么、编译成什么调用、有没有变形；运行时参数（重试/并发/超时/红线）与路由契约同屏。页面只声明区块，形状归模块与需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 1, label: 需求契约, short: 契约, group: {name: 资产, order: 2}, mobile: true}
  key: arch
  nav: arch
  crumb: [需求契约]
  heading: 需求契约
  subheading: 每条需求要求什么、编译成哪些调用、偏差在哪；重试/并发/超时等隐藏参数一并摊开
  actions:
  - {label: 全部调用, view: traces}
  data:
  - {as: mf, demand: demands-manifest}
  - {as: api, demand: api-snapshot}
  - {as: pos, demand: position-list}
  - {as: slow, demand: trace-slow, params: {}}
  - {as: params, demand: runtime-params}
  sections:
  - kind: map
    heading: 一条需求怎么变成一次调用
    note: 从上往下是数据流向，框里是当前在库数量
    cols:
    - title: 入口
      nodes:
      - {label: 需求, value: "data.mf.count", note: 条}
    - title: 编译
      nodes:
      - {label: 语句树, value: "data.mf.steps", note: 个顺序 call/send 节点}
    - title: 契约
      nodes:
      - {label: 已注册路由, value: "data.api.routes", note: 条可被调用的能力}
    - title: 执行
      nodes:
      - {label: 带状态机岗位, value: "data.pos.items|count", note: 个}
    foot: {label: 业务域分布, from: data.mf.groups}

  # 先给"需求本身"：标题、要求什么、编译出什么、声明预期与实际是否一致
  - kind: table
    as: mf
    source: data.mf.items
    heading: 需求清单（声明 vs 编译）
    note: 偏差 = 需求自己声明的预期调用与编译出来的实际调用不一致；不是 0 就是需求变形或用例过期
    columns:
    - {label: 需求, value: row.id, sub: row.view}
    - {label: 标题, value: row.title}
    - {label: 步骤, value: row.steps}
    - {label: 实际调用, value: row.routes, muted: true}
    - {label: 声明预期, value: row.expect_calls, muted: true}
    - {label: 偏差, value: "row.drift|count", suffix: 处}
    - {label: 契约承诺, value: row.promise, muted: true}
    empty: {text: 暂无需求}

  - kind: table
    as: params
    source: data.params.rows
    heading: 运行时隐藏参数
    note: 这些值不在页面上就没人知道"重试几次、并发多少、超时多少"；改值去 config，说明留在这里
    columns:
    - {label: 分组, value: row.group}
    - {label: 参数, value: row.label, sub: row.key}
    - {label: 当前值, value: row.value}
    - {label: 作用, value: row.note, muted: true}
    empty: {text: 暂无参数登记}

  - kind: tree
    as: mf
    source: data.mf.groups
    list: true
    collapsed: true
    hide_count: true
    fold: {title: "需求执行链（点开看 call/send 与 as/with 摘要）"}
    note: 点开组看需求，再点开需求看每一步
    empty: {text: 暂无需求}
  - kind: table
    as: api
    source: data.api.items
    limit: 10
    list: true
    fold: {title: "路由与契约"}
    note: 只列前 10 条；完整清单点右上「全部调用」
    columns:
    - {label: 路由, value: row.name, sub: row.module}
    - {label: 通道, value: row.stream, fallback: 直连, muted: true}
    - {label: 入参, value: "row.in|count", suffix: 项}
    - {label: 出参, value: "row.out|count", suffix: 项}
    - {label: 说明, value: row.doc, muted: true}
    empty: {text: 暂无路由}
  - kind: table
    as: slow
    source: data.slow.items
    limit: 8
    heading: 今日慢请求（按 P95 排序）
    columns:
    - {label: 阶段, value: row.name}
    - {label: 次数, value: row.n}
    - {label: P50, value: row.p50_ms, suffix: ms, muted: true}
    - {label: P95, value: row.p95_ms, suffix: ms}
    - {label: 峰值, value: row.max_ms, suffix: ms, muted: true}
    - {label: 错误, value: row.err, muted: true}
    empty: {text: 今日暂无链路采样（trace 采样率可在 config.trace.sample 调高）}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 页面只声明区块，形状归模块与需求
