id: view-arch
title: 架构视图：需求全景、路由契约与实时调用摊开看
description: "架构视图：需求全景、路由契约与实时调用摊开看。页面只声明区块，形状归模块与需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 2, label: 架构, short: 架构, mobile: true}
  key: arch
  nav: arch
  crumb: [架构]
  heading: 架构
  subheading: 需求是数据、模块是能力、契约是约束；一条需求怎么编译、落到哪条路由、由哪个岗位执行，都在这一页
  actions:
  - {label: 全部调用, view: traces}
  data:
  - {as: mf, demand: demands-manifest}
  - {as: api, demand: api-snapshot}
  - {as: pos, demand: position-list}
  - {as: slow, demand: trace-slow, params: {}}
  sections:
  - kind: map
    heading: 架构全景：一条需求怎么变成一次调用
    note: 从上往下是数据流向，框里是当前在库数量；业务域按条数列在最后一行
    cols:
    - title: 入口
      nodes:
      - {label: 需求, value: "data.mf.count", note: 条，业务域分组见图下}
    - title: 编译
      nodes:
      - {label: 语句树, value: "data.mf.steps", note: 个顺序 call/send 节点}
    - title: 契约
      nodes:
      - {label: 已注册路由, value: "data.api.routes", note: 条可被调用的能力}
    - title: 执行
      nodes:
      - {label: 带状态机岗位, value: "data.pos.items|count", note: 个，各自带一套状态机}
    foot: {label: 业务域分布, from: data.mf.groups}

  - kind: tree
    source: data.mf.groups
    list: true
    collapsed: true
    hide_count: true
    fold: {title: "需求执行链"}
    note: 点开组看需求，再点开需求看 call/send 与 as/with 摘要
    empty: {text: 暂无需求}
  - kind: table
    source: data.api.items
    limit: 10
    list: true
    fold: {title: "路由与契约"}
    note: 只列前 10 条；完整清单点右上「全部调用」
    columns:
    - {label: 路由, value: row.name, sub: row.module}
    - {label: 通道, value: row.stream, fallback: 直连, muted: true}
    - {label: 入参, value: "row.in|count", suffix: 项}
    - {label: 出参, value: "row.out|count", suffix: 项}
    - {label: 说明, value: row.doc, muted: true}
    empty: {text: 暂无路由}
  - kind: table
    source: data.slow.items
    limit: 8
    heading: 今日慢请求（按 P95 排序）
    columns:
    - {label: 阶段, value: row.name}
    - {label: 次数, value: row.n}
    - {label: P50, value: row.p50_ms, suffix: ms, muted: true}
    - {label: P95, value: row.p95_ms, suffix: ms}
    - {label: 峰值, value: row.max_ms, suffix: ms, muted: true}
    - {label: 错误, value: row.err, muted: true}
    empty: {text: 今日暂无链路采样（trace 采样率可在 config.trace.sample 调高）}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 页面只声明区块，形状归模块与需求
