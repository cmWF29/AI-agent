id: knowledge-list
title: 列知识：归一 scope → 列目录 → 交给 knowledge 成形
description: "列知识：归一 scope → 列目录 → 交给 knowledge 成形。目录列表由 store 给，条目的形状由模块定"
tags: [knowledge, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/knowledge
    path:
      lit: messages.yaml
  as: k_tpl
- call: store.id
  with:
    value:
      get: input.project
  as: pid
- call: store.id
  with:
    value:
      get: input.ticket
  as: tid
- call: knowledge.scope
  with:
    layer:
      get: input.layer
    project:
      get: pid.id
    ticket:
      get: tid.id
    tpl:
      get: k_tpl.value
  as: scope
- call: store.glob
  with:
    module:
      lit: agent/knowledge
    root:
      get: scope.prefix
    pattern:
      lit: '*.md'
  as: rows
- call: knowledge.screen
  with:
    layer:
      get: input.layer
    rows:
      get: rows.paths
  as: out
expect:
  given:
    input:
      project: p1
  calls:
  - store.read
  - store.id
  - store.id
  - knowledge.scope
  - store.glob
  - knowledge.screen
  payload: {}
  promise: 目录列表由 store 给，条目的形状由模块定
