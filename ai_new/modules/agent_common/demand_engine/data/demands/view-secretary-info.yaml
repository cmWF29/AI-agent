id: view-secretary-info
title: 群聊秘书 · 群信息：队列、批次追溯与项目定时任务
description: "群聊的独立信息页：不改聊天流，只放队列条数、消息明细、批次追溯与定时任务；从群聊头部的小标签进入。"
tags:
- view
- web
- read
enabled: true
callable: false
'on': []
do: []
view:
  screen_label: 群信息
  key: secretary-info
  labels:
    pending: 待处理
    processing: 处理中
    merged: 已并入
    discarded: 已废弃
    user: 用户
    timer: 定时器
    active: 活动
    paused: 已暂停
  params: [project]
  require: [project]
  nav: projects
  parent: {view: secretary, params: {project: "{route.project}"}}
  crumb:
  - 项目
  - "{project.name}"
  - 群聊秘书
  - 群信息
  heading: 群信息
  subheading: 队列、批次与定时任务；聊天记录留在群聊页
  badges:
  - {text: 已归档·只读, when: "{project.archived}"}
  data:
  - {as: project, demand: projects-get, params: {id: "{route.project}"}}
  - {as: queue, demand: secretary-index, params: {project: "{route.project}"}}
  - {as: timers, demand: secretary-timers, params: {project: "{route.project}"}}
  actions:
  - label: 聊天
    view: secretary
    params: {project: "{route.project}"}
    ctl: ctl.head_act.聊天
    tone: primary
  sections:
  - kind: stats
    as: queue
    heading: 队列概览
    rows:
    - {label: 待处理, value: "data.queue.counts.pending", note: 条等待秘书合并}
    - {label: 处理中, value: "data.queue.counts.processing", note: 条正在整批处理}
    - {label: 已并入, value: "data.queue.counts.merged", note: 条已并入工单}
    - {label: 已废弃, value: "data.queue.counts.discarded", note: 条已撤回}
  - kind: stack
    as: queue
    source: queue.rows
    heading: 消息明细
    count_note: "共 {data.queue.rows|count} 条 · 后发可补充或修正前面的内容；撤回的不参与合并"
    sort: {by: at, order: desc}
    item:
      title: row.text
      sub: "row.msg_id"
      badge: row.status|label
    fields:
    - {label: 消息 id, value: row.msg_id}
    - {label: 来源, value: "row.source|label", suffix: row.timer_id}
    - {label: 时间, value: "row.at|when", fallback: "—"}
    - {label: 尝试次数, value: row.attempts, fallback: "0"}
    - {label: 错误, value: row.last_error, fallback: "—"}
    - {label: 并入工单, value: row.merged_ticket, fallback: "—"}
    - {label: 批次, value: row.batch_id, fallback: "—"}
    empty: {text: 队列是空的：把想法发给项目秘书即可}
  - kind: table
    as: queue
    source: queue.batches
    heading: 批次追溯
    count_note: "每条批次：由哪几条消息合并、并入了哪张工单"
    columns:
    - {label: 批次, value: row.batch_id}
    - {label: 消息, value: row.msg_ids, chips: true}
    - {label: 工单, value: row.ticket, fallback: "—"}
    - {label: 合并摘要, value: row.brief.goal, fallback: "—"}
    - {label: 错误, value: row.error, fallback: "—"}
    empty: {text: 还没有处理过的批次}
  - kind: table
    as: timers
    source: timers.items
    heading: 定时任务
    count_note: "只列本项目定时器；暂停/恢复/删除在定时器页操作"
    columns:
    - {label: 标题, value: row.title}
    - {label: 规则, value: row.expr, sub: row.kind}
    - {label: 时区, value: row.tz, fallback: "—"}
    - {label: 下次触发, value: "row.next_at|when", fallback: "—"}
    - {label: 状态, value: "row.status|label"}
    - {label: 最近结果, value: row.last_run.detail, fallback: "—"}
    empty: {text: 本项目还没有定时器；回聊天页跟秘书说即可创建}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 群信息只展示队列与批次，不重复聊天输入
