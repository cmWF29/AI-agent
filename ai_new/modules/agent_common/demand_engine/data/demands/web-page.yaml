id: web-page
title: 取控制台页面：纯路径 → store 读文本 → MIME
description: 取控制台页面：纯路径 → store 读文本 → MIME。页面是数据，路径与 MIME 是纯计算；清单一并下发，页面与需求不再各存一份
tags:
- web
- read
enabled: true
callable: true
'on': []
do:
- call: web.rel
  with:
    path:
      get: input.path
  as: p
- call: web.console_path
  with:
    path:
      get: p.path
  as: wc
- call: store.read_text
  with:
    module:
      lit: agent/web
    path:
      get: wc.path
    fallback:
      lit: ''
  as: text
- call: web.mime
  with:
    path:
      get: p.path
  as: type
- call: demand_engine.list
  with: {}
  as: listing
- call: web.info
  with:
    console:
      get: text.value
    routes:
      get: input.routes
    demands:
      get: listing
  as: out
expect:
  given:
    input: {}
  calls:
  - web.rel
  - web.console_path
  - store.read_text
  - web.mime
  - demand_engine.list
  - web.info
  payload: {}
  promise: 页面是数据，路径与 MIME 是纯计算；清单一并下发，页面与需求不再各存一份
