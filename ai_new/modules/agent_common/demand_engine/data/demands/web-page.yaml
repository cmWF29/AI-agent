id: web-page
title: 取控制台页面：纯路径 → store 读文本 → MIME
enabled: true
callable: true
'on': []
do:
- call: web.rel
  with:
    path:
      get: input.path
  as: p
- call: store.read_text
  with:
    module:
      lit: agent/web
    path:
      op: +
      a:
        lit: console/
      b:
        get: p.path
    fallback:
      lit: ''
  as: text
- call: web.mime
  with:
    path:
      get: p.path
  as: type
- call: web.info
  with:
    console:
      get: text.value
    routes:
      get: input.routes
    demands:
      get: input.demands
  as: out
expect:
  given:
    input: {}
  calls:
  - web.rel
  - web.mime
  - web.info
  payload: {}
  promise: 页面是数据，路径与 MIME 是纯计算
