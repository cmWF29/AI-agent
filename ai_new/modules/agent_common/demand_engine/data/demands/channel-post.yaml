id: channel-post
title: 发消息：闭环在 channel.post 能力内，需求只做顺序编排
enabled: true
callable: true
'on': []
do:
- call: channel.post
  with:
    channel:
      get: input.channel
    role:
      get: input.role
    content:
      get: input.content
  as: out
expect:
  given:
    input:
      channel: c1
      role: user
      content: hi
  calls:
  - channel.post
  payload: {}
  promise: 读历史、算 seq、追加、emit 都在能力内部，需求树只有一次顺序调用
