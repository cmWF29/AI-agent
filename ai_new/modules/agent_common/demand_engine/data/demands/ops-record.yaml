id: ops-record
title: 记一条事件：成形 → 追加到系统日志
description: 记一条事件：成形 → 追加到系统日志。日志是运维的业务，写盘是能力；日志正文归 logs 模块数据根。
tags:
- ops
- write
enabled: true
callable: true
'on': []
do:
- call: clock.now
  as: now
- call: config.get
  with:
    key:
      lit: logs.paths.system_record
  as: rec_path
- call: ops.record
  with:
    hook:
      get: input.hook
    level:
      get: input.level
    data:
      get: input.data
    now:
      get: now.iso
  as: rec
- call: codec.json_encode
  with:
    value:
      get: rec
  as: enc
- call: ops.log_line
  with:
    text:
      get: enc.text
  as: ll
- call: store.append_text
  with:
    module:
      lit: agent/logs
    path:
      get: rec_path.value
    text:
      get: ll.text
  as: w
- call: logs.record
  with:
    path:
      get: rec_path.value
    kind:
      lit: system
    layer:
      lit: public
    project:
      lit: ''
    ticket:
      lit: ''
    name:
      lit: app.jsonl
  as: logrec
- call: runtime.apply
  with:
    effect:
      get: logrec.effects
  as: applied
- call: ops.record
  with:
    hook:
      get: input.hook
    level:
      get: input.level
    data:
      get: input.data
    now:
      get: now.iso
  as: out
expect:
  given:
    input: {}
  calls:
  - clock.now
  - config.get
  - ops.record
  - codec.json_encode
  - ops.log_line
  - store.append_text
  - logs.record
  - runtime.apply
  - ops.record
  payload: {}
  promise: 日志是运维的业务，写盘是能力
