id: view-position
title: 岗位详情：岗位记录 + 流程规范 + 提示词正文，只读
description: "岗位详情：岗位记录 + 流程规范 + 提示词正文，只读。岗位详情只声明区块，数据源走 position-get"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: position
  params: [position]
  require: [position]   # 缺这个参数就不发请求：没有对象的页面只有空壳，按到就是白等
  nav: positions
  parent: {view: positions}
  crumb: [岗位库, "{position.cn}"]
  heading: "{position.cn}"
  subheading: 岗位 = 系统提示词 + 流程状态机 + 工具名单；三者同屏，主会话条目只读
  data:
  - {as: position, demand: position-get, params: {id: "{route.position}"}}
  sections:
  - kind: kv
    as: position
    source: position
    heading: 岗位信息
    rows:
    - label: 标识
      value: row.id
    - label: 提示词引用
      value: row.prompt_file
      fallback: —
    - label: 流程检查
      value: "row.flow.checks|count"
      suffix: 项
      muted: true
  - kind: table
    as: position
    source: position.stages
    heading: 流程状态机（岗位预定，模型必须照着走）
    hide_when_empty: true
    columns:
    - {label: 状态, value: row.cn, fallback: row.id}
    - {label: 标识, value: row.id, muted: true}
    - {label: 做什么, value: row.desc, fallback: "—"}
    - {label: 此状态可用工具, value: row.tools, fallback: 全量}
    - {label: 下一状态, value: row.next, fallback: "—", muted: true}
    - {label: 终态, value: row.terminal, fallback: "—", muted: true}
  - kind: doc
    as: position
    source: position.prompt
    heading: 提示词正文
    hide_when_empty: true
  - kind: table
    as: position
    source: position.must_dos
    heading: 必须做到
    hide_when_empty: true
    columns:
    - {label: 条目, value: "{row}"}
  - kind: table
    as: position
    source: position.forbidden
    heading: 禁止事项
    hide_when_empty: true
    columns:
    - {label: 红线, value: "{row}"}
  - kind: table
    as: position
    source: position.must_outputs
    heading: 产出约束
    hide_when_empty: true
    columns:
    - {label: 路径, value: "{row}"}
  - kind: table
    as: position
    source: position.flow.checks
    heading: 流程检查规则
    hide_when_empty: true
    columns:
    - {label: 类型, value: row.kind}
    - {label: 匹配路径, value: row.paths}
    - {label: 命中规则, value: row.match, fallback: —}
    - {label: 最小字节, value: row.min_bytes, fallback: —}
    - {label: 说明, value: row.desc, fallback: —}
  - kind: table
    as: position
    source: position.tools
    heading: 可见工具
    hide_when_empty: true
    columns:
    - {label: 工具, value: "{row}"}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 岗位详情只声明区块，数据源走 position-get
