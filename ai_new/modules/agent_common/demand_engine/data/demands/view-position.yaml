id: view-position
title: 岗位详情：基本信息 + 状态机 + 每步约束 + 提示词，只读
description: "岗位详情：基本信息 + 状态机 + 每步约束 + 提示词，只读。岗位详情只声明区块，数据源走 position-get"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  screen_label: 岗位详情
  key: position
  params: [position]
  require: [position]   # 缺这个参数就不发请求：没有对象的页面只有空壳，按到就是白等
  nav: positions
  parent: {view: positions}
  crumb: [岗位, "{position.cn}"]
  heading: "{position.cn}"
  subheading: 职责、流程与每步约束同屏
  data:
  - {as: position, demand: position-get, params: {id: "{route.position}"}}
  sections:
  - kind: kv
    as: position
    source: position
    heading: 岗位信息
    rows:
    - label: 标识
      value: row.id
    - label: 可见工具
      value: "row.tools|count"
      suffix: 个
      muted: true
  - kind: dag
    as: position
    source: position.stages
    heading: 流程状态机
    note: 实线前进，橙色虚线是回退；迁移条件见下方列表，节点内是必做/禁止条数
    title: "{position.cn} 流程"
    hide_when_empty: true
  - kind: gate
    as: position
    source: position.stages
    heading: 每步清单
    note: 迁移时逐条打勾；缺项或踩红线由后端拒绝，原地补做
    hide_when_empty: true
    empty: 本岗位状态未设必做/禁止清单
  - kind: doc
    as: position
    source: position.prompt
    heading: 提示词
    hide_when_empty: true
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 岗位详情只声明区块，数据源走 position-get
