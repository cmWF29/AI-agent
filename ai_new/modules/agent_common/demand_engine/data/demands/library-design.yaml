id: library-design
title: 改岗位库：读用户记录 → 合并字段（带时间）→ 落盘
tags: [library, write]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      op: +
      a:
        get: input.kind
      b:
        lit: s.yaml
  as: user
- call: library.get
  with:
    kind:
      get: input.kind
    id:
      get: input.id
    seed:
      lit: {}
    user:
      get: user.value
  as: cur
- call: clock.now
  as: now
- call: library.design
  with:
    kind:
      get: input.kind
    id:
      get: input.id
    fields:
      get: input.fields
    record:
      get: cur.item
    now:
      get: now.ts
  as: rec
- call: store.write
  with:
    module:
      lit: agent/library
    path:
      op: +
      a:
        get: input.kind
      b:
        lit: s.yaml
    value:
      op: append
      a:
        lit: {}
  as: w
expect:
  given:
    input: {}
  calls:
  - library.get
  - clock.now
  - library.design
  payload: {}
  promise: 改记录要带时间，时间由需求给
