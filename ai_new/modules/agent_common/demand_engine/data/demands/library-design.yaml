id: library-design
title: 改岗位库：读用户记录 → 合并字段（带时间）→ 落盘
description: 改岗位库：读用户记录 → 合并字段（带时间）→ 落盘。改记录要带时间，时间由需求给
tags:
- library
- write
touch: [skills-list, project-skills]
enabled: true
callable: true
'on': []
do:
- call: library.kind_file
  with:
    kind:
      get: input.kind
  as: lk1
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      get: lk1.path
  as: user
- call: library.get
  with:
    kind:
      get: input.kind
    id:
      get: input.id
    seed:
      get: seed.value
    user:
      get: user.value
  as: cur
- call: clock.now
  as: now
- call: library.design
  with:
    kind:
      get: input.kind
    id:
      get: input.id
    fields:
      get: input.fields
    record:
      get: cur.item
    now:
      get: now.ts
  as: rec
- call: library.save_record
  with:
    user:
      get: user.value
    rec:
      get: rec
  as: saved
- call: library.kind_file
  with:
    kind:
      get: input.kind
  as: lk2
- call: store.write
  with:
    module:
      lit: agent/library
    path:
      get: lk2.path
    value:
      get: saved.value
  as: w
expect:
  given:
    input: {}
  calls:
  - library.kind_file
  - store.read
  - store.read
  - library.get
  - clock.now
  - library.design
  - library.save_record
  - library.kind_file
  - store.write
  payload: {}
  promise: 改记录要带时间，时间由需求给
