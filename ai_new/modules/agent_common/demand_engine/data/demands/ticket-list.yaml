id: ticket-list
title: 列工单：遍历 tickets/*/ticket.yaml 后成形
description: "列工单：遍历 tickets/*/ticket.yaml 后成形。遍历归需求"
tags: [ticket, read]
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: tickets.paths
  as: tp
- call: store.walk
  with:
    module:
      lit: agent/tickets
    root:
      get: tp.value.walk_root
    pattern:
      get: tp.value.walk_pattern
  as: rows
- call: tickets.screen
  with:
    status:
      get: input.status
    project:
      get: input.project
    rows:
      get: rows.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.walk
  - tickets.screen
  payload: {}
  promise: 遍历归需求
