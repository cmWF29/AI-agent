id: projects-list
title: 项目列表：取回档案行，交给 projects 筛选成列表
description: "项目列表：取回档案行，交给 projects 筛选成列表。取数归需求，列表形状归模块"
tags: [project, read]
enabled: true
callable: true
'on': []
do:
- call: store.walk
  with:
    module:
      lit: agent/projects
    root:
      lit: ''
    pattern:
      lit: '*.yaml'
  as: rows
- call: projects.screen
  with:
    rows:
      get: rows.rows
  as: list
expect:
  given:
    input: {}
  calls:
  - store.walk
  - projects.screen
  payload: {}
  promise: 取数归需求，列表形状归模块
