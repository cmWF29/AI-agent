id: view-skills
title: 技能视图：按 Skill 单元管理岗位/流程/工具，可禁用或卸载
description: "技能视图：每个 Skill 单元聚合拆出的岗位、流程与工具，卡片上可禁用/启用/级联卸载；头部入口新建拆解，拆解结果直接入库。视图只声明卡片与动作，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: skills
  crumb: [项目管理, 技能]
  heading: 技能
  subheading: Skill = 从一份 Skill.md 拆出的一个岗位、配套流程与工具，归到同一标识下；可临时禁用，也可级联卸载。内置能力受保护不可卸载
  actions:
  - {label: ＋ 新建拆解, tone: primary, modal: decompose.new}
  forms:
  - id: decompose.new
    title: 拆解 Skill.md 包
    hint: 三种方式提供 Skill.md：粘贴正文、拖入 .md/.txt 文件，或填网页链接由后台拉取；链接优先。声明的 Python 依赖由拆解者当场核对安装，脚本资源随包登记。拆解结果直接入库为一个 Skill 单元，流程拆不出就留空。
    fields:
    - name: source
      label: 来源标识（可选）
      placeholder: 标识名或包路径，便于追溯
    - name: url
      label: 文档链接（可选）
      kind: url
      placeholder: https://example.com/SKILL.md；填了就从链接拉取正文
    - name: skill_md
      label: SKILL.md 正文
      kind: textarea
      drop: true
      placeholder: 粘贴含 frontmatter 的包说明全文，或把 .md/.txt 文件拖到此处
    submit:
      demand: decompose-install
      params:
        skill_md: $skill_md
        url: $url
        source: $source
      ok: 开始拆解
      flash: 拆解完成，已入库为新技能
      then:
        view: skills
        reload: true
  data:
  - {as: list, demand: skills-list}
  sections:
  - kind: cards
    source: list.items
    title: row.cn
    meta:
    - {label: 岗位, value: row.role_cn, hide_if_empty: true}
    - {label: 流程, value: row.flow_text, hide_if_empty: true}
    - {label: 工具, value: row.tools, hide_if_empty: true}
    - {label: 来源, value: row.source, hide_if_empty: true}
    - {label: 状态, value: row.status_text}
    actions:
    - label: 禁用
      demand: skill-disable
      params: {id: row.id}
      disabled_when: row.status == disabled
      confirm: "禁用「{row.cn}」后，其岗位、工具、流程不再进入运行名单；记录保留，可再启用。"
      flash: "已禁用：{row.cn}"
      after: {view: skills, reload: true}
    - label: 启用
      demand: skill-enable
      params: {id: row.id}
      disabled_when: row.status == enabled
      flash: "已启用：{row.cn}"
      after: {view: skills, reload: true}
    - label: 卸载
      tone: danger
      demand: skill-uninstall
      params: {id: row.id}
      disabled_when: row.builtin == true
      confirm: "卸载「{row.cn}」将一并删除其岗位、流程与工具登记，不可恢复。确定卸载？"
      flash: "已卸载：{row.cn}"
      after: {view: skills, reload: true}
    empty: {title: 暂无技能, text: 点右上角「新建拆解」，贴一份 Skill.md 包开始拆解入库。}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 技能视图只声明卡片与动作，数据源走需求
