id: view-skills
title: 外部工具视图：外部安装/拆解来的工具，只读清单
description: "外部工具视图：只列外部登记的工具（拆解确认后并入、后续外部安装）。视图只声明表格，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: skills
  crumb: [外部工具]
  heading: 外部工具
  subheading: 外部工具 = 从外部 Skill.md 包安装/拆解来的工具；代码内置能力归工具库。清单只读，依赖缺失可一键装 Python 包
  actions:
  - label: 安装缺失依赖
    demand: tools-install
    confirm: "自动安装清单里缺失的 Python 包；CLI/环境变量/配置项需另行人工补齐。"
    flash: 依赖安装完成
    after: {view: skills, reload: true}
  data:
  - {as: list, demand: tools-external-list}
  sections:
  - kind: table
    source: list.items
    columns:
    - {label: 工具名, value: row.name, sub: row.module}
    - {label: 来源, value: row.source}
    - {label: 说明, value: row.desc}
    - {label: 依赖, value: row.deps}
    - {label: 状态, badge: row.status_text}
    - {label: 缺失项, value: row.missing, muted: true}
    - {label: 参数, value: row.params, muted: true}
    empty: {text: 暂无外部工具；经「拆解」确认入库的工具会出现在这里}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 外部工具视图只声明表格，数据源走需求
