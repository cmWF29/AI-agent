id: knowledge-remove-project
title: 删项目知识：归一 id → 删目录
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.project
  as: pid
- call: store.remove_dir
  with:
    module:
      lit: agent/knowledge
    path:
      op: +
      a:
        lit: projects/
      b:
        get: pid.id
  as: rm
- call: knowledge.removed
  with:
    removed:
      get: rm.removed
    project:
      get: input.project
  as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - store.remove_dir
  - knowledge.removed
  payload: {}
  promise: 删目录也是需求的动作
