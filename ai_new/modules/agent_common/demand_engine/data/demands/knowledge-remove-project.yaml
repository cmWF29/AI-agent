id: knowledge-remove-project
title: 删项目知识：归一 id → 删目录
description: 删项目知识：归一 id → 删目录。删目录也是需求的动作
tags:
- knowledge
- write
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: knowledge.paths
  as: k_paths
- call: store.id
  with:
    value:
      get: input.project
  as: pid
- call: knowledge.project_dir
  with:
    project:
      get: pid.id
    paths:
      get: k_paths.value
  as: kd
- call: store.remove_dir
  with:
    module:
      lit: agent/knowledge
    path:
      get: kd.path
  as: rm
- call: knowledge.removed
  with:
    removed:
      get: rm.removed
    project:
      get: input.project
  as: out
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.id
  - knowledge.project_dir
  - store.remove_dir
  - knowledge.removed
  payload: {}
  promise: 删目录也是需求的动作
