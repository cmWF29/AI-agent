id: view-artifacts
title: 文档视图：公共/项目/工单三级文档只读浏览
description: "文档视图：交付件与非交付件按归属分组只读浏览；目录由 artifacts-index 分组，不在此页编辑"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 3, label: 文档, group: {name: 工作, order: 1}, mobile: true}
  key: artifacts
  crumb: [文档]
  heading: 文档
  subheading: 交付件按归属分组，只读
  data:
  - {as: idx, demand: artifacts-index}
  sections:
  - kind: kv
    as: idx
    source: idx.counts
    heading: 层级统计
    rows:
    - label: 公共
      value: row.public
    - label: 项目
      value: row.project
    - label: 工单
      value: row.ticket
  - kind: tree
    as: idx
    source: idx.tree
    empty: {title: 文档为空, text: 流程产出的交付件与非交付件会留档到这里。}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 目录由 artifacts-index 分组，浏览视图只读；tree 叶子为 doc 条目
