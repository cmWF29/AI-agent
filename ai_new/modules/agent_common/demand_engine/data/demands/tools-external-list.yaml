id: tools-external-list
title: 外部工具清单：外部安装/拆解来的工具，附依赖就绪状态
description: "外部工具清单：只列外部登记记录（拆解确认后并入、后续外部安装的工具），逐条对照在位快照给出依赖就绪状态。代码内置能力归工具库，不在此列。成形与判定归工具模块，取数归需求"
tags: [tool, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
  as: ext
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: sk
- call: library.disabled_skills
  with:
    skills:
      get: sk.value
  as: dis
- call: tools.list
  with:
    external:
      get: ext.value
    disabled:
      get: dis.ids
    scope:
      lit: external
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - store.read
  - library.disabled_skills
  - tools.list
  payload: {}
  promise: 外部裁剪、禁用过滤与就绪判定归模块，取数归需求
