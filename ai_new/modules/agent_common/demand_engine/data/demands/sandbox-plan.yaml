id: sandbox-plan
title: 隔离执行计划：按档位给出 cwd、锁路径与强档 wrap 描述符
description: "纯计划推导：项目根校验、cwd 约束、项目锁路径；强档附 namespace/容器 wrap 描述符，起进程由 exec 能力执行。"
tags: [sandbox, read]
enabled: true
callable: true
'on': []
do:
- call: sandbox.plan
  with:
    project:
      get: input.project
    tier:
      get: input.tier
    workspace:
      get: input.workspace
  as: out
expect:
  given:
    input: {project: demo-proj, tier: weak, workspace: {root: /tmp/ai_new/demo-proj}}
  calls:
  - sandbox.plan
  payload: {}
  promise: 计划不落盘、不起进程；根路径越界即拒
