id: library-summary
title: 岗位库总览：种子 + 三类用户记录，交给 library 数数
tags: [library, skill, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: roles
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: flows
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: skills
- call: library.summary
  with:
    seed:
      get: seed.value
    user:
      roles:
        get: roles.value
      flows:
        get: flows.value
      skills:
        get: skills.value
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - store.read
  - store.read
  - store.read
  - library.summary
  payload: {}
  promise: 三张表一起数，规则归模块
