id: project-tools
title: 项目工具清单：内置注册表 ∪ 公共外部登记，按项目覆盖层打禁用标记
description: "项目工具清单：外部登记工具定义正文只存公共库一份，项目档案只持启停覆盖层；与代码内置注册表合并，按已禁用 Skill 与项目禁用裁剪展示标记，附依赖就绪状态。合并/裁剪/判定归工具模块，覆盖层取数归项目模块，取数归需求"
tags: [project, tool, read]
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: pid
- call: projects.record_path
  with:
    id:
      get: pid.id
  as: pp
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: pp.path
  as: proj
- call: projects.override_parts
  with:
    rec:
      get: proj.value
  as: ov
- call: store.read
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
  as: tool
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: sk
- call: library.disabled_skills
  with:
    skills:
      get: sk.value
  as: dis
- call: tools.list
  with:
    external:
      get: tool.value
    disabled:
      get: dis.ids
    disabled_names:
      get: ov.tools
    scope:
      lit: all
  as: out
expect:
  given:
    input:
      id: <project-id>
  calls:
  - store.id
  - projects.record_path
  - store.read
  - projects.override_parts
  - store.read
  - store.read
  - library.disabled_skills
  - tools.list
  payload: {}
  promise: 公共库唯一事实源、合并裁剪与就绪判定归工具模块，项目覆盖层只打标记，取数归需求
