id: llm-chat
title: 对话（非流式）：闭环在 llm.chat 能力内，需求只做顺序编排
tags: [llm]
enabled: true
callable: true
'on': []
do:
- call: llm.chat
  with:
    messages:
      get: input.messages
    tools:
      get: input.tools
    tool_choice:
      get: input.tool_choice
    temperature:
      get: input.temperature
    timeout:
      get: input.timeout
  as: out
expect:
  given:
    input:
      messages:
      - role: user
        content: 你好
      temperature: 0.3
  calls:
  - llm.chat
  payload: {}
  promise: 配置→载荷→序列化→传输→反序列化→解码的失败短路链收进 llm.chat 能力
