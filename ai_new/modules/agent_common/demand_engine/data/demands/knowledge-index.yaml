id: knowledge-index
title: 知识目录：整树取路径 → 交给 knowledge 分三级成形
description: "知识目录：整树取路径 → 交给 knowledge 分三级成形。取路径归需求，分组归模块，浏览视图只读"
tags: [knowledge, read]
enabled: true
callable: true
'on': []
do:
- call: store.walk_text
  with:
    module:
      lit: agent/knowledge
    pattern:
      lit: '**/*.md'
  as: rows
- call: store.walk
  with:
    module:
      lit: agent/tickets
    root:
      lit: projects
    pattern:
      lit: '*/tickets/*/ticket.yaml'
  as: trows
- call: knowledge.index
  with:
    rows:
      get: rows.rows
    tickets:
      get: trows.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - store.walk_text
  - store.walk
  - knowledge.index
  payload: {}
  promise: 取路径与工单归需求，项目/工单归属树归模块；叶子条目 type=doc
