id: library-check
title: 流程检查：读流程记录，按调用方给的文件清单核验
description: "流程检查：读流程记录，按调用方给的文件清单核验。文件从外面进来，判断归模块"
tags: [library, read]
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: flows
- call: library.get
  with:
    kind:
      lit: flows
    id:
      get: input.flow
    seed:
      lit: {}
    user:
      get: flows.value
  as: rec
- call: library.check
  with:
    flow:
      get: input.flow
    rec:
      get: rec.item
    files:
      get: input.files
    contents:
      get: input.contents
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - library.get
  - library.check
  payload: {}
  promise: 文件从外面进来，判断归模块
