id: session-send
title: 发消息给会话：读记录 → 追加 user 消息 → 落盘
description: 发消息给会话：读记录 → 追加 user 消息 → 落盘。追加与状态迁移归模块，落盘归需求
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: sessions.record_path
  with:
    id:
      get: input.id
  as: sp1
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      get: sp1.path
  as: row
- call: clock.now
  as: now
- call: sessions.appendmsg
  with:
    rec:
      get: row.value
    text:
      get: input.text
    now:
      get: now.ts
  as: rec
- call: sessions.record_path
  with:
    id:
      get: rec.id
  as: sp2
- call: store.write
  with:
    module:
      lit: agent/sessions
    path:
      get: sp2.path
    value:
      get: rec
  as: w
- call: sessions.view
  with:
    rec:
      get: rec
  as: out
expect:
  given:
    input: {}
  calls:
  - sessions.record_path
  - store.read
  - clock.now
  - sessions.appendmsg
  - sessions.record_path
  - store.write
  - sessions.view
  payload: {}
  promise: 追加与状态迁移归模块，落盘归需求
