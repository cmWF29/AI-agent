id: projects-create
title: 新建项目：闭环在 projects.create 能力内，需求只做顺序编排
description: "新建项目：闭环在 projects.create 能力内，需求只做顺序编排。查重与落盘在能力内部闭环，需求树不分岔"
tags:
- project
- write
touch: [project-tree, projects-get]
enabled: true
callable: true
completion: inline
'on': []
do:
- call: projects.create
  with:
    name:
      get: input.name
    root:
      get: input.root
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input: {}
  calls:
  - projects.create
  - runtime.apply
  payload: {}
  promise: 查重与落盘在能力内部闭环，需求树不分岔
