id: knowledge-compose
title: 注入知识：整树取文本 → 按层前缀拼接并截断
description: "注入知识：整树取文本 → 按层前缀拼接并截断。拼哪些层、截多少，都写在需求里"
tags: [knowledge, read]
enabled: true
callable: true
'on': []
do:
- call: store.walk_text
  with:
    module:
      lit: agent/knowledge
    pattern:
      lit: '**/*.md'
  as: rows
- call: knowledge.compose
  with:
    rows:
      get: rows.rows
    prefixes:
      get: input.prefixes
    max_chars:
      get: input.max_chars
  as: out
expect:
  given:
    input: {}
  calls:
  - store.walk_text
  - knowledge.compose
  payload: {}
  promise: 拼哪些层、截多少，都写在需求里
