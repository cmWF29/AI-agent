id: project-tree
title: 项目-工单分级树：取项目行与工单行，按项目归组
description: "项目-工单分级树：取项目行与工单行，按项目归组。取数归需求，两级归组形状归模块"
tags: [project, ticket, read]
enabled: true
callable: true
'on': []
do:
- call: store.walk
  with:
    module:
      lit: agent/projects
    root:
      lit: ''
    pattern:
      lit: '*.yaml'
  as: prows
- call: config.get
  with:
    key:
      lit: tickets.paths
  as: tpaths
- call: store.walk
  with:
    module:
      lit: agent/tickets
    root:
      get: tpaths.value.walk_root
    pattern:
      get: tpaths.value.walk_pattern
  as: trows
- call: projects.tree
  with:
    projects:
      get: prows.rows
    tickets:
      get: trows.rows
  as: out
expect:
  given:
    input: {}
  calls:
  - store.walk
  - config.get
  - store.walk
  - projects.tree
  payload: {}
  promise: 取数归需求，两级归组形状归模块
