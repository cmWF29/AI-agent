id: session-spawn
title: 造会话：人设 + 岗位红线/必做 + 岗位工具清单 + 知识注入，拼装落盘
description: 造会话：人设 + 岗位红线/必做 + 岗位工具清单 + 知识注入，拼装落盘。人设、岗位要素、工具清单、知识各自取来，会话拼装归能力，落盘由 apply 执行
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: knowledge.paths
  as: k_paths
- call: demand_engine.run
  with:
    id:
      lit: library-role-prompt
    input:
      role:
        get: input.role
  as: prompt
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: role
- call: library.get
  with:
    kind:
      lit: roles
    id:
      get: input.role
    seed:
      lit: {}
    user:
      get: role.value
  as: rec
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: flows
- call: library.get
  with:
    kind:
      lit: flows
    id:
      get: input.role
    seed:
      lit: {}
    user:
      get: flows.value
  as: flow
- call: library.stage_contract
  with:
    states:
      get: rec.item.states
    stages:
      get: rec.item.stages
    checks:
      get: flow.item.checks
  as: contract
- call: demand_engine.run
  with:
    id:
      lit: position-tools
    input:
      role:
        get: input.role
      kind:
        get: input.kind
      project:
        get: input.project
  as: tools
- call: library.stage_tools
  with:
    contract:
      get: contract
    active:
    - get: contract.initial
    items:
      get: tools.result.items
  as: stools
- call: library.stage_block
  with:
    contract:
      get: contract
    active:
    - get: contract.initial
  as: stblk
- call: library.prompt_blocks
  with:
    text:
      get: prompt.result.prompt
    must_dos:
      get: rec.item.must_dos
    forbidden:
      get: rec.item.forbidden
    stage:
      get: stblk.system
  as: blocks
- call: knowledge.project_prefix
  with:
    ticket:
      get: input.ticket
    paths:
      get: k_paths.value
  as: kp
- call: demand_engine.run
  with:
    id:
      lit: knowledge-compose
    input:
      prefixes:
      - public/
      - get: kp.prefix
  as: know
- call: sessions.spawn
  with:
    kind:
      get: input.kind
    seq:
      get: input.seq
    name:
      get: input.name
    ticket:
      get: input.ticket
    project:
      get: input.project
    role:
      get: input.role
    max_steps:
      get: input.max_steps
    meta:
      get: input.meta
    tools:
      get: stools.items
    machine:
      get: contract
    stages:
      get: contract.states
    active:
    - get: contract.initial
    stage:
      get: contract.initial
    task:
      get: input.task
    intro:
      get: input.intro
    role_prompt:
      get: blocks.system
    injected:
      get: know.result.text
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      ticket: T-1
      role: developer
      kind: role
  calls:
  - config.get
  - demand_engine.run
  - store.read
  - library.get
  - store.read
  - library.get
  - library.stage_contract
  - demand_engine.run
  - library.stage_tools
  - library.stage_block
  - library.prompt_blocks
  - knowledge.project_prefix
  - demand_engine.run
  - sessions.spawn
  - runtime.apply
  payload: {}
  promise: 人设、岗位要素、工具清单、知识各自取来，会话拼装归能力，落盘由 apply 执行
