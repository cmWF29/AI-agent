id: session-spawn
title: 造会话：人设 + 岗位红线/必做 + 岗位工具清单 + 知识注入，拼装落盘
description: "造会话：人设 + 岗位红线/必做 + 岗位工具清单 + 知识注入，拼装落盘。人设、岗位要素、工具清单、知识各自取来，会话拼装归能力，落盘由 apply 执行"
tags: [session, write]
enabled: true
callable: true
'on': []
do:
- call: demand_engine.run
  with:
    id:
      lit: library-role-prompt
    input:
      role:
        get: input.role
  as: prompt
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: roles
- call: library.get
  with:
    kind:
      lit: roles
    id:
      get: input.role
    seed:
      lit: {}
    user:
      get: roles.value
  as: rec
- call: demand_engine.run
  with:
    id:
      lit: position-tools
    input:
      role:
        get: input.role
      kind:
        get: input.kind
  as: tools
- call: library.prompt_blocks
  with:
    text:
      get: prompt.result.prompt
    must_dos:
      get: rec.item.must_dos
    forbidden:
      get: rec.item.forbidden
  as: blocks
- call: demand_engine.run
  with:
    id:
      lit: knowledge-compose
    input:
      prefixes:
      - public/
      - op: +
        a:
          lit: projects/
        b:
          get: input.ticket
  as: know
- call: sessions.spawn
  with:
    kind:
      get: input.kind
    seq:
      get: input.seq
    name:
      get: input.name
    ticket:
      get: input.ticket
    role:
      get: input.role
    backend:
      get: input.backend
    max_steps:
      get: input.max_steps
    meta:
      get: input.meta
    tools:
      get: tools.result.items
    task:
      get: input.task
    intro:
      get: input.intro
    role_prompt:
      get: blocks.system
    injected:
      get: know.result.text
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      ticket: T-1
      role: developer
      kind: role
  calls:
  - demand_engine.run
  - store.read
  - library.get
  - demand_engine.run
  - library.prompt_blocks
  - demand_engine.run
  - sessions.spawn
  - runtime.apply
  payload: {}
  promise: 人设、岗位要素、工具清单、知识各自取来，会话拼装归能力，落盘由 apply 执行
