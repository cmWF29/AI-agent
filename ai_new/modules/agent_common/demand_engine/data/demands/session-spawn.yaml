id: session-spawn
title: 造会话：闭环在 sessions.spawn 能力内，需求只做顺序编排
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: demand_engine.run
  with:
    id:
      lit: library-role-prompt
    input:
      role:
        get: input.role
  as: prompt
- call: demand_engine.run
  with:
    id:
      lit: knowledge-compose
    input:
      prefixes:
      - public/
      - op: +
        a:
          lit: projects/
        b:
          get: input.ticket
  as: know
- call: sessions.spawn
  with:
    kind:
      get: input.kind
    seq:
      get: input.seq
    name:
      get: input.name
    ticket:
      get: input.ticket
    role:
      get: input.role
    backend:
      get: input.backend
    max_steps:
      get: input.max_steps
    meta:
      get: input.meta
    task:
      get: input.task
    intro:
      get: input.intro
    role_prompt:
      get: prompt.result.prompt
    injected:
      get: know.result.text
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      ticket: T-1
      role: developer
      kind: role
  calls:
  - demand_engine.run
  - demand_engine.run
  - sessions.spawn
  - runtime.apply
  payload: {}
  promise: 人设与知识各自一条需求取来，会话拼装归能力，落盘由 apply 执行
