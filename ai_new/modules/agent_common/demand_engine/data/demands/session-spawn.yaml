id: session-spawn
title: 造会话：闭环在 sessions.spawn 能力内，需求只做顺序编排
enabled: true
callable: true
'on': []
do:
- call: sessions.spawn
  with:
    kind:
      get: input.kind
    seq:
      get: input.seq
    name:
      get: input.name
    ticket:
      get: input.ticket
    role:
      get: input.role
    backend:
      get: input.backend
    max_steps:
      get: input.max_steps
    meta:
      get: input.meta
    task:
      get: input.task
  as: out
expect:
  given:
    input: {}
  calls:
  - sessions.spawn
  payload: {}
  promise: 人设来源的分岔与知识装配都在能力内部，需求树只有一次顺序调用
