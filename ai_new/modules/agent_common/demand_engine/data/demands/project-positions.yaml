id: project-positions
title: 项目岗位列表：项目快照副本优先，副本缺或空回退公共库
description: "项目岗位列表：优先用项目快照副本里的岗位/流程/技能，副本不存在或为空回退公共库；种子内置岗位恒定提供。岗位成形与禁用摘除归 library，副本/公共兜底选择归 projects，取数归需求"
tags: [project, position, library, read]
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: pid
- call: projects.project_lib_path
  with:
    id:
      get: pid.id
    kind:
      lit: roles
  as: prole_p
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: prole_p.path
  as: prole
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: pubrole
- call: projects.choose_dict
  with:
    project:
      get: prole
    public:
      get: pubrole
  as: role
- call: projects.project_lib_path
  with:
    id:
      get: pid.id
    kind:
      lit: flows
  as: pflow_p
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: pflow_p.path
  as: pflow
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: pubflow
- call: projects.choose_dict
  with:
    project:
      get: pflow
    public:
      get: pubflow
  as: flow
- call: projects.project_lib_path
  with:
    id:
      get: pid.id
    kind:
      lit: skills
  as: psk_p
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: psk_p.path
  as: psk
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: pubsk
- call: projects.choose_dict
  with:
    project:
      get: psk
    public:
      get: pubsk
  as: sk
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: library.positions
  with:
    seed:
      get: seed.value
    user:
      get: role.value
    flows:
      get: flow.value
    skills:
      get: sk.value
  as: out
expect:
  given:
    input:
      id: <project-id>
  calls:
  - store.id
  - projects.project_lib_path
  - store.read
  - store.read
  - projects.choose_dict
  - projects.project_lib_path
  - store.read
  - store.read
  - projects.choose_dict
  - projects.project_lib_path
  - store.read
  - store.read
  - projects.choose_dict
  - store.read
  - library.positions
  payload: {}
  promise: 副本/公共兜底、岗位成形与禁用摘除归模块，取数归需求
