id: project-positions
title: 项目岗位列表：直读公共岗位库，按项目覆盖层打禁用标记
description: "项目岗位列表：岗位/流程/技能定义正文只存公共库一份，项目档案只持启停覆盖层；读公共库成形岗位，项目禁用岗位仍展示并打 disabled 标记，供重新启用。种子内置岗位恒定提供。岗位成形与禁用摘除归 library，覆盖层取数归 projects，取数归需求"
tags: [project, position, library, read]
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: pid
- call: projects.record_path
  with:
    id:
      get: pid.id
  as: pp
- call: store.read
  with:
    module:
      lit: agent/projects
    path:
      get: pp.path
  as: proj
- call: projects.override_parts
  with:
    rec:
      get: proj.value
  as: ov
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: role
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: flow
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: sk
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: library.positions
  with:
    seed:
      get: seed.value
    user:
      get: role.value
    flows:
      get: flow.value
    skills:
      get: sk.value
    disabled_roles:
      get: ov.roles
  as: out
expect:
  given:
    input:
      id: <project-id>
  calls:
  - store.id
  - projects.record_path
  - store.read
  - projects.override_parts
  - store.read
  - store.read
  - store.read
  - store.read
  - library.positions
  payload: {}
  promise: 公共库唯一事实源、岗位成形与禁用摘除归模块，项目覆盖层只打标记，取数归需求
