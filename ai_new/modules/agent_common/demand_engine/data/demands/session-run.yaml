id: session-run
title: 驱动会话：标记 running → 跑一轮 react → 收尾落盘
description: 驱动会话：标记 running → 跑一轮 react → 收尾落盘。循环在 react 里，本需求只负责状态迁移；收尾校验/回催/复盘由 finished 钩子编排
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: sessions.record_path
  with:
    id:
      get: input.id
  as: sp1
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      get: sp1.path
  as: row
- call: clock.now
  as: now
- call: sessions.mark
  with:
    rec:
      get: row.value
    status:
      lit: running
    now:
      get: now.ts
  as: running
- call: sessions.record_path
  with:
    id:
      get: running.id
  as: sp2
- call: store.write
  with:
    module:
      lit: agent/sessions
    path:
      get: sp2.path
    value:
      get: running
  as: w
- call: demand_engine.run
  with:
    id:
      lit: react-run
    input:
      session:
        get: running
      messages:
        get: row.value.messages
      tools:
        get: row.value.meta.tools
      max_steps:
        get: input.max_steps
      base_url:
        get: input.base_url
      api_key:
        get: input.api_key
      model:
        get: input.model
      cancel:
        id:
          get: input.id
        since:
          get: now.ts
      mode:
        get: row.value.backend
  as: out
- call: sessions.record_path
  with:
    id:
      get: input.id
  as: sp3
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      get: sp3.path
  as: latest
- call: clock.now
  as: done_at
- call: sessions.finish
  with:
    rec:
      get: running
    out:
      get: out.result
    latest:
      get: latest.value
    now:
      get: done_at.ts
  as: rec
- call: sessions.record_path
  with:
    id:
      get: rec.id
  as: sp4
- call: store.write
  with:
    module:
      lit: agent/sessions
    path:
      get: sp4.path
    value:
      get: rec
  as: w
- call: sessions.view
  with:
    rec:
      get: rec
  as: out2
- call: sessions.emit_finished
  with:
    rec:
      get: rec
  as: hooked
expect:
  given:
    input: {}
  calls:
  - sessions.record_path
  - store.read
  - clock.now
  - sessions.mark
  - sessions.record_path
  - store.write
  - demand_engine.run
  - sessions.record_path
  - store.read
  - clock.now
  - sessions.finish
  - sessions.record_path
  - store.write
  - sessions.view
  - sessions.emit_finished
  payload: {}
  promise: 循环在 react 里，本需求只负责状态迁移；收尾校验/回催/复盘由 finished 钩子编排
