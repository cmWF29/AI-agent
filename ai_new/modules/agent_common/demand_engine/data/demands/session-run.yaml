id: session-run
title: 驱动会话：标记 running → 跑一轮 react → 收尾落盘
description: 驱动会话：标记 running → 跑一轮 react → 收尾落盘。循环在 react 里，本需求只负责状态迁移；收尾校验/回催/复盘由 finished 钩子编排
tags:
- session
- write
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: sessions.result_chars
  as: cfg_chars
- call: config.get
  with:
    key:
      lit: sessions.max_steps
  as: cfg_steps
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      lit: messages.yaml
  as: sess_tpl
- call: sessions.record_path
  with:
    id:
      get: input.id
  as: sp1
- call: store.read
  with:
    module:
      lit: agent/logs
    path:
      get: sp1.path
  as: row
- call: library.stage_contract
  with:
    machine:
      get: row.value.meta.machine
  as: contract
- call: demand_engine.run
  with:
    id:
      lit: position-tools
    input:
      role:
        get: row.value.role
      kind:
        get: row.value.kind
      project:
        get: row.value.project
  as: pt
- call: library.stage_tools
  with:
    contract:
      get: contract
    active:
      get: row.value.meta.active
    stage:
      get: row.value.meta.stage
    items:
      get: pt.result.items
  as: run_tools
- call: todos.context
  with:
    todos:
      get: row.value.todos
  as: todo_ctx
- call: library.flow_context
  with:
    contract:
      get: contract
    flow:
      id:
        get: row.value.meta.flow.id
      cn:
        get: row.value.meta.flow.cn
    checks:
      get: contract.checks
    active:
      get: row.value.meta.active
  as: fctx
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: messages.yaml
  as: libtpl
- call: tickets.record_path
  with:
    id:
      get: row.value.ticket
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: trow
- call: clock.now
  as: now
# 取完快照到标 running 之间可能有人插话：标 running 前再读一次盘，把新追加的接上
- call: store.read
  with:
    module:
      lit: agent/logs
    path:
      get: sp1.path
  as: fresh
- call: sessions.mark
  with:
    rec:
      get: row.value
    latest:
      get: fresh.value
    status:
      lit: running
    now:
      get: now.ts
  as: running
# 状态卡必须压在本轮最新快照上：标 running 时已把“取快照后插进来的话”接上，避免旧快照把新任务顶掉
- call: sessions.refresh_constraint_message
  with:
    messages:
      get: running.messages
    constraint:
      get: fctx
  as: constraint_msgs
- call: sessions.inject_assigned_message
  with:
    messages:
      get: constraint_msgs.messages
    roles:
      get: trow.value.roles
    heading:
      get: libtpl.value.heading_assigned
  as: assg_msgs
- call: library.stage_block
  with:
    contract:
      get: contract
    active:
      get: running.meta.active
    checked:
      get: running.meta.checklist.checked
    stage_alert:
      get: running.meta.stage_alert
    gate_alert:
      get: running.meta.gate_alert
  as: stage_block
- call: sessions.refresh_stage_message
  with:
    messages:
      get: assg_msgs.messages
    stage:
      get: stage_block.system
  as: stage_msgs
- call: sessions.record_path
  with:
    id:
      get: running.id
  as: sp2
- call: store.write
  with:
    module:
      lit: agent/logs
    path:
      get: sp2.path
    value:
      get: running
  as: w
- call: demand_engine.run
  with:
    id:
      lit: react-run
    input:
      session:
        get: running
      messages:
        get: stage_msgs.messages
      tools:
        get: run_tools.items
      max_steps:
        get: cfg_steps.value
      base_url:
        get: input.base_url
      api_key:
        get: input.api_key
      model:
        get: input.model
      cancel:
        id:
          get: input.id
        since:
          get: now.ts
      path:
        get: sp2.path
      extra:
        get: todo_ctx.message
  as: out
- call: sessions.record_path
  with:
    id:
      get: input.id
  as: sp3
- call: demand_engine.run
  with:
    id:
      lit: ticket-files
    input:
      id:
        get: row.value.ticket
  as: listed
- call: tickets.paths
  with:
    items:
      get: listed.result.items
  as: paths
- call: library.stage_transition
  with:
    contract:
      get: contract
    active:
      get: row.value.meta.active
    prev:
      get: row.value.meta.stage
    nxt:
      get: out.result.stage
    checked:
      get: out.result.checklist
    violations:
      get: out.result.violations
    files:
      get: paths.paths
    contents:
      lit: {}
    notes:
      get: trow.value.history
  as: check
# 收尾前再读一次盘：react 与状态校验期间可能有人插话/复用派任务，宁可晚读也不拿旧快照覆盖
- call: store.read
  with:
    module:
      lit: agent/logs
    path:
      get: sp3.path
  as: latest
- call: clock.now
  as: done_at
- call: sessions.finish
  with:
    rec:
      get: running
    out:
      get: out.result
    stage_check:
      get: check
    ticket_status:
      get: trow.value.status
    tools:
      get: run_tools.items
    latest:
      get: latest.value
    now:
      get: done_at.ts
    result_chars:
      get: cfg_chars.value
    cancelled_text:
      get: sess_tpl.value.cancelled_summary
    no_reply_text:
      get: sess_tpl.value.backend_no_reply
  as: rec
- call: sessions.record_path
  with:
    id:
      get: rec.id
  as: sp4
- call: store.write
  with:
    module:
      lit: agent/logs
    path:
      get: sp4.path
    value:
      get: rec
  as: w
- call: sessions.view
  with:
    rec:
      get: rec
  as: out2
- call: sessions.emit_finished
  with:
    rec:
      get: rec
  as: hooked
expect:
  given:
    input: {}
  calls:
  - config.get
  - store.read
  - sessions.record_path
  - store.read
  - library.stage_contract
  - demand_engine.run
  - library.stage_tools
  - todos.context
  - library.flow_context
  - store.read
  - tickets.record_path
  - store.read
  - clock.now
  - store.read
  - sessions.mark
  - sessions.refresh_constraint_message
  - sessions.inject_assigned_message
  - library.stage_block
  - sessions.refresh_stage_message
  - sessions.record_path
  - store.write
  - demand_engine.run
  - sessions.record_path
  - demand_engine.run
  - tickets.paths
  - library.stage_transition
  - store.read
  - clock.now
  - sessions.finish
  - sessions.record_path
  - store.write
  - sessions.view
  - sessions.emit_finished
  payload: {}
  promise: 循环在 react 里，本需求只负责状态迁移；收尾校验/回催/复盘由 finished 钩子编排
