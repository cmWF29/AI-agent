id: ticket-stall-scan
title: 停滞扫描：闭环在 tickets.stall_scan 能力内，需求只做顺序编排
description: "停滞扫描：闭环在 tickets.stall_scan 能力内，需求只做顺序编排。遍历在途、逐条判定、按命中开审计单都在能力内部"
tags:
- ticket
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: tickets.stall_check.enabled
  as: cfg_enabled
- call: config.get
  with:
    key:
      lit: tickets.stall_check.idle_minutes
  as: cfg_idle
- call: config.get
  with:
    key:
      lit: tickets.stall_check.max_per_scan
  as: cfg_max
- call: config.get
  with:
    key:
      lit: tickets.stall_check.create_audit
  as: cfg_audit
- call: tickets.stall_scan
  with:
    enabled:
      get: cfg_enabled.value
    idle_minutes:
      get: cfg_idle.value
    max_per_scan:
      get: cfg_max.value
    create_audit:
      get: cfg_audit.value
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input: {}
  calls:
  - config.get
  - config.get
  - config.get
  - config.get
  - tickets.stall_scan
  - runtime.apply
  payload: {}
  promise: 遍历在途、逐条判定、按命中开审计单都在能力内部
