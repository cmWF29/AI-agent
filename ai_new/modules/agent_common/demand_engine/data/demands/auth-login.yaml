id: auth-login
title: 登录：闭环在 auth.login 能力内，需求只做顺序编排
description: "登录：闭环在 auth.login 能力内，需求只做顺序编排。凭据比对与失败守卫在能力内部闭环，需求树不写 when/fail"
tags:
- auth
enabled: true
callable: true
'on': []
do:
- call: auth.login
  with:
    username:
      get: input.username
    password:
      get: input.password
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input:
      username: admin
      password: secret
  calls:
  - auth.login
  - runtime.apply
  payload: {}
  promise: 凭据比对与失败守卫在能力内部闭环，需求树不写 when/fail
