id: view-forms
title: 表单集合：弹窗与提交动作都写在规格里，前端没有第二份
description: "表单集合：弹窗与提交动作都写在规格里，前端没有第二份。表单声明，提交动作指向需求"
tags:
- view
- web
- write
enabled: true
callable: false
'on': []
do: []
view:
  forms:
  - id: project.new
    title: 新建项目
    hint: 项目是工单的容器，建完在列表里点进去就能建工单。
    fields:
    - name: name
      label: 项目名称
      placeholder: 例如：官网重构
      required: true
    - name: default_backend
      label: 默认执行后端
      kind: select
      options: &id001
      - value: api
        label: API 模式（直连模型接口）
      - value: agent
        label: Agent 模式（交给外部 agent）
      value: '{project.default_backend}'
    submit:
      demand: projects-create
      params:
        name: $name
        default_backend: $default_backend
      ok: 创建项目
      flash: 已建项目：{name}
      then:
        view: projects
        reload: true
  - id: project.rename
    title: 重命名项目
    hint: 改的是显示名；项目里的工单会跟着走，不会丢。
    fields:
    - name: name
      label: 项目名称
      value: '{project.name}'
      required: true
    - name: default_backend
      label: 默认执行后端
      kind: select
      options: *id001
      value: '{project.default_backend}'
    submit:
      demand: projects-rename
      params:
        id: '{project.id}'
        name: $name
        default_backend: $default_backend
      ok: 保存
      flash: 已改名：{name}
      then:
        view: project
        params:
          project: '{result.id}'
        reload: true
  - id: ticket.new
    title: 新建工单
    hint: 工单自动挂在当前项目下，不需要再选一遍。
    fields:
    - name: project_label
      label: 所属项目
      value: '{project.name}'
      readonly: true
    - name: title
      label: 标题
      placeholder: 例如：登录页改版
      required: true
    - name: goal
      label: 需求目标
      placeholder: 要做什么、验收标准是什么
      kind: textarea
    - name: kind
      label: 类型
      kind: select
      options:
      - value: normal
        label: 普通
      - value: stall-audit
        label: 停滞审计
    - name: parent
      label: 父工单（可选）
      placeholder: 父工单 ID
    - name: backend
      label: 执行后端（留空跟随项目）
      kind: select
      options: *id001
      required: false
    submit:
      demand: ticket-create
      params:
        title: $title
        goal: $goal
        project: '{project.id}'
        kind: $kind
        parent: $parent
        backend: $backend
      ok: 创建工单
      flash: 已建工单：$title
      then:
        view: ticket
        params:
          project: '{project.id}'
          ticket: '{result.id}'
        reload: true
  - id: ticket.close
    title: 结单
    hint: 对照验收标准填写结单结论；提交后会话回收，本工单不能再发消息。
    fields:
    - name: summary
      label: 结单结论
      kind: textarea
      placeholder: 逐条对照验收标准：做了什么、结果如何、有哪些遗留观察
      required: true
    - name: verdict
      label: 验收结论
      kind: select
      value: accepted
      options:
      - value: accepted
        label: 验收通过
      - value: rejected
        label: 未通过（返工）
    submit:
      demand: ticket-close
      params:
        id: '{thread.ticket.id}'
        summary: $summary
        verdict: $verdict
      ok: 确认结单
      flash: 工单已结单
      then:
        view: ticket
        params:
          project: '{thread.ticket.project}'
          ticket: '{thread.ticket.id}'
        reload: true
  - id: project.role.edit
    title: 编辑项目岗位
    hint: 改动只落在本项目的快照副本上，不回写公共岗位库；必做/禁止/工具清单每行一项，留空即清空。内置与只读岗位不可编辑。
    fields:
    - name: cn
      label: 岗位名称
      value: '{row.cn}'
      required: true
    - name: prompt
      label: 岗位描述 / 提示词
      kind: textarea
      value: '{row.prompt}'
      placeholder: 这个岗位负责什么、按什么方式做事
    - name: must_dos
      label: 必须做到
      kind: textarea
      value: '{row.must_dos}'
      placeholder: 每行一条必须做到的事项
    - name: forbidden
      label: 禁止事项
      kind: textarea
      value: '{row.forbidden}'
      placeholder: 每行一条禁止事项
    - name: tools
      label: 工具清单
      kind: textarea
      value: '{row.tools}'
      placeholder: 每行一个工具名；留空表示不挂工具
    submit:
      demand: project-library-design
      params:
        project: '{project.id}'
        kind: roles
        id: row.id
        fields:
          cn: $cn
          prompt: $prompt
          must_dos: $must_dos
          forbidden: $forbidden
          tools: $tools
      ok: 保存
      flash: 已更新岗位：{row.cn}
      then:
        view: project
        params:
          project: '{project.id}'
        reload: true
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 表单声明，提交动作指向需求
