id: view-forms
title: 表单集合：弹窗与提交动作都写在规格里，前端没有第二份
description: "表单集合：弹窗与提交动作都写在规格里，前端没有第二份。表单声明，提交动作指向需求"
tags:
- view
- web
- write
enabled: true
callable: false
'on': []
do: []
view:
  forms:
  - id: project.new
    title: 新建项目
    hint: 项目是工单的容器；项目路径决定公共工作区与工单隔离目录，留空则用系统默认数据目录。
    fields:
    - name: name
      label: 项目名称
      placeholder: 例如：官网重构
      required: true
    - name: root
      label: 项目路径
      placeholder: /srv/hive/projects/官网重构（留空用默认目录）
    submit:
      demand: projects-create
      params:
        name: $name
        root: $root
      ok: 创建项目
      flash: 已建项目：{name}
      then:
        view: projects
        reload: true
  - id: project.rename
    title: 重命名项目
    hint: 改的是显示名；项目里的工单会跟着走，不会丢。
    fields:
    - name: name
      label: 项目名称
      value: '{project.name}'
      required: true
    submit:
      demand: projects-rename
      params:
        id: '{project.id}'
        name: $name
      ok: 保存
      flash: 已改名：{name}
      then:
        view: project
        params:
          project: '{result.id}'
        reload: true
  - id: project.path
    title: 配置项目路径
    hint: 必须是服务器上的绝对路径。配置后文档/日志/交付件放在项目根下，由项目内所有工单访问，每张工单落在 tickets/<工单ID> 下独立工作；留空恢复系统默认数据目录。
    fields:
    - name: root
      label: 项目绝对路径
      value: '{project.root}'
      placeholder: /srv/hive/projects/官网重构
    submit:
      demand: projects-set-root
      params:
        id: '{project.id}'
        root: $root
      ok: 保存路径
      flash: 项目路径已更新
      then:
        view: project
        params:
          project: '{project.id}'
        reload: true
  - id: ticket.new
    title: 新建工单
    hint: 工单自动挂在当前项目下，不需要再选一遍。
    fields:
    - name: project_label
      label: 所属项目
      value: '{project.name}'
      readonly: true
    - name: title
      label: 标题
      placeholder: 例如：登录页改版
      required: true
    - name: goal
      label: 需求目标
      placeholder: 要做什么、验收标准是什么
      kind: textarea
    - name: kind
      label: 类型
      kind: select
      options:
      - value: normal
        label: 普通
      - value: stall-audit
        label: 停滞审计
    - name: parent
      label: 父工单（可选）
      placeholder: 父工单 ID
    submit:
      demand: ticket-create
      params:
        title: $title
        goal: $goal
        project: '{project.id}'
        kind: $kind
        parent: $parent
      ok: 创建工单
      flash: 已建工单：$title
      then:
        view: ticket
        params:
          project: '{project.id}'
          ticket: '{result.id}'
        reload: true
  - id: ticket.close
    title: 结单
    hint: 对照验收标准填写结单结论；提交后会话回收，本工单不能再发消息。选「未通过关闭」只记录驳回结论并关单，不会自动重开或重新派岗位。
    fields:
    - name: summary
      label: 结单结论
      kind: textarea
      placeholder: 逐条对照验收标准：做了什么、结果如何、有哪些遗留观察
      required: true
    - name: verdict
      label: 验收结论
      kind: select
      value: accepted
      options:
      - value: accepted
        label: 验收通过
      - value: rejected
        label: 未通过关闭
    submit:
      demand: ticket-close
      params:
        id: '{thread.ticket.id}'
        summary: $summary
        verdict: $verdict
      ok: 确认结单
      flash: 工单已结单
      then:
        view: ticket
        params:
          project: '{thread.ticket.project}'
          ticket: '{thread.ticket.id}'
        reload: true
  - id: auth.change
    title: 修改密码
    hint: 需验证当前密码；新密码需两次输入一致。本期只支持改密，不做岗位与权限。
    fields:
    - name: old_password
      label: 当前密码
      kind: password
      required: true
    - name: new_password
      label: 新密码
      kind: password
      required: true
    - name: confirm
      label: 确认新密码
      kind: password
      required: true
    submit:
      demand: auth-change-password
      params:
        old_password: $old_password
        new_password: $new_password
        confirm: $confirm
      ok: 保存密码
      flash: 密码已修改
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 表单声明，提交动作指向需求
