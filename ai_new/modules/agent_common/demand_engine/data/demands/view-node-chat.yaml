id: view-node-chat
title: 节点配置者对话：必要信息一次问清，配置由岗位调工具落地
description: "节点配置者对话：像即时通讯一样直接跟岗位聊；台账留在上位页，会话按 purpose 幂等复用"
tags: [session, view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: node-chat
  crumb: [节点, 节点配置者]
  heading: 节点配置者
  subheading: 和节点配置者对话；登记、归属、容量与租约由它调节点工具核对，不在这里填一堆选项
  poll: 2500
  parent: {view: nodes}
  data:
  - as: chat
    demand: role-session-open
    disabled_when: data.chat.status == gone
    params: {role: node-configurer, purpose: node-config, kind: role, name: 节点配置者}
  - as: members
    demand: role-session-members
    params: {role: node-configurer}
  actions:
  - label: 节点台账
    view: nodes
    ctl: ctl.head_act.节点台账
  sections:
  - kind: chat
    as: chat
    lane: left
    source: chat
    heading: 节点配置者
    meta:
    - 全局岗位会话 · 不挂项目
    empty: 说说要登记哪台机器、走什么传输、给哪个项目用；缺口它会问
    hide_roles: [system]
    roles_source: members.items
    wire_demand: message-wire
    wire_chars: 8000
    raw_chars: 6000
  - kind: composer
    disabled_when: data.chat.status == gone
    lane: left
    placeholder: 说说要登记哪台机器、走什么传输、给哪个项目用；缺口它会问
    submit:
      label: 发送
      demand: role-session-message
      params:
        id: "{data.chat.id}"
        text: $text
      flash: 已发给节点配置者
      clear: true
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 节点配置者会话按 purpose 复用，聊天流只追加 human 并后台驱动
