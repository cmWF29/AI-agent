id: view-secretary
title: 项目秘书视图：项目级消息队列、批量合并与批次追溯
description: "项目秘书页：看各状态队列条数、逐条消息与错误、批次追溯（哪几条消息合并成哪张工单）；消息经秘书入队，批量合并后统一建单。"
tags:
- view
- web
- read
enabled: true
callable: false
'on': []
do: []
view:
  screen_label: 群聊秘书
  key: secretary
  labels:
    pending: 待处理
    processing: 处理中
    merged: 已并入
    discarded: 已废弃
    queued: 排队中
    running: 进行中
    idle: 等待
    done: 已完成
    error: 异常
    user: 用户
    timer: 定时器
    active: 活动
    paused: 已暂停
  params: [project]
  require: [project]
  nav: projects
  parent: {view: project, params: {project: "{route.project}"}}
  crumb:
  - 项目
  - "{project.name}"
  - 群聊秘书
  heading: 群聊秘书
  subheading: 像即时通讯一样跟秘书聊；队列与批次在「群信息」里看
  poll: 2000
  badges:
  - {text: 已归档·只读, when: "{project.archived}"}
  data:
  - {as: project, demand: projects-get, params: {id: "{route.project}"}}
  - {as: queue, demand: secretary-index, params: {project: "{route.project}"}}
  - {as: timers, demand: secretary-timers, params: {project: "{route.project}"}}
  sections:
  - kind: chat
    as: queue
    lane: left
    source: queue
    heading: 群聊秘书
    meta:
    - "待处理 {data.queue.counts.pending} · 处理中 {data.queue.counts.processing}"
    empty: 还没有消息；跟秘书说第一句话
    roles_source: queue.members
    actions:
    - label: 群信息
      view: secretary-info
      params: {project: "{route.project}"}
      ctl: ctl.card_act.群信息
  - kind: composer
    lane: left
    placeholder: 把需求或补充告诉项目秘书，Enter 发送
    voice:
      label: 语音
      demand: asr-transcribe
      params:
        mime: audio/wav
      hint: 点一次开始录音，再点停止；识别文字回填到输入框，可修改后手动发送
    submit:
      label: 发送
      demand: secretary-intake
      params:
        project: "{route.project}"
        text: $text
      flash: 已加入秘书队列
      clear: true
    disabled_when: "{project.archived}"
    disabled_hint: 已归档项目只能查看，不能再向秘书发消息
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 项目秘书页只声明区块：队列条数、消息行、批次追溯与入队入口，取数走需求
