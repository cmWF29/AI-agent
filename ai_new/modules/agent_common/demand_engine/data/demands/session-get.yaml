id: session-get
title: 取会话：按 id 取记录，缺就报缺
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: sid
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      op: +
      a:
        lit: sessions/
      b:
        op: +
        a:
          get: sid.id
        b:
          lit: .yaml
  as: row
- when:
    op: ==
    a:
      get: row.value
    b: null
  then:
  - call: sessions.missing
    with:
      id:
        get: input.id
    as: out
  else:
  - call: sessions.view
    with:
      rec:
        get: row.value
    as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - store.read
  - sessions.view
  payload: {}
  promise: 读一次，缺就报缺
