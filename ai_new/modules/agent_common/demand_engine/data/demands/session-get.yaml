id: session-get
title: 取会话：按 id 取记录，缺就报缺
description: 取会话：按 id 取记录，缺就报缺。读一次，缺就报缺
tags:
- session
- read
enabled: true
callable: true
'on': []
do:
- call: store.id
  with:
    value:
      get: input.id
  as: sid
- call: sessions.record_path
  with:
    id:
      get: sid.id
  as: sp
- call: store.read
  with:
    module:
      lit: agent/logs
    path:
      get: sp.path
  as: row
- call: store.read
  with:
    module:
      lit: agent/sessions
    path:
      lit: messages.yaml
  as: tpls
- call: sessions.present
  with:
    id:
      get: input.id
    rec:
      get: row.value
    tpl:
      get: tpls.value.session_missing
  as: out
expect:
  given:
    input: {}
  calls:
  - store.id
  - sessions.record_path
  - store.read
  - store.read
  - sessions.present
  payload: {}
  promise: 读一次，缺就报缺
