id: view-project-detail
title: 项目详情视图：一个项目下的全部工单，建单自动挂本项目
description: "项目详情视图：一个项目下的全部工单，建单自动挂本项目。岗位/技能/工具定义正文只存公共库一份，项目只持启停覆盖层；项目详情只声明区块，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  screen_label: 项目详情
  labels:
    queued: 排队中
    running: 进行中
    doing: 进行中
    idle: 等待
    done: 已完成
    closed: 已结单
    gone: 已失效
    error: 异常
    legacy: 系统默认目录
    root: 自定义项目根
  key: project
  params: [project]
  require: [project]   # 缺这个参数就不发请求：没有对象的页面只有空壳，按到就是白等
  nav: projects
  parent: {view: projects}
  crumb: [项目, "{project.name}"]
  heading: "{project.name}"
  subheading: "建 {project.created|when}"
  badges:
  - {text: 已归档·只读, when: "{project.archived}"}
  data:
  - {as: project, demand: projects-get, params: {id: "{route.project}"}}
  - {as: queue, demand: secretary-index, params: {project: "{route.project}"}}
  - {as: positions, demand: project-positions, params: {id: "{route.project}"}}
  - {as: skills, demand: project-skills, params: {id: "{route.project}"}}
  - {as: ptools, demand: project-tools, params: {id: "{route.project}"}}
  - {as: tickets, demand: ticket-list, params: {project: "{route.project}"}}
  - {as: workspace, demand: project-workspace, params: {project: "{route.project}"}}
  actions:
  - {label: 项目路径, modal: project.path,
     disabled_when: "{project.archived}", disabled_hint: 已归档项目只能查看，不能再改路径}
  - {label: 重命名, modal: project.rename,
     disabled_when: "{project.archived}", disabled_hint: 已归档项目只能查看，不能再改名}
  - {label: 归档, demand: projects-archive, params: {id: "{route.project}"},
     flash: "已归档：{project.name}", disabled_when: "{project.archived}", disabled_hint: 已归档,
     stay: true}
  - {label: 删除, demand: projects-delete, params: {id: "{route.project}", purge: true},
     confirm: "彻底删除项目「{project.name}」？", flash: "已删除：{project.name}",
     tone: danger, after: {view: projects, reload: true}}
  - {label: ＋ 新建工单, tone: primary, modal: ticket.new,
     disabled_when: "{project.archived}", disabled_hint: 已归档项目不能再建工单}
  sections:
  # 路径是项目的第一现场：先看公共层和工单隔离目录，再进业务区
  - kind: table
    as: workspace
    source: workspace.layers
    heading: 项目工作区
    count_note: "模式：{data.workspace.mode|label} · 公共层固定，工单目录独立"
    columns:
    - {label: 层, value: row.name, sub: row.scope}
    - {label: 路径, value: row.path}
  # 群聊秘书入口排第一：零散想法先发给秘书，合并成需求后统一建单
  - kind: cards
    as: queue
    layout: list
    heading: 群聊秘书
    note: 把零散想法发给秘书，合并成需求后统一建单
    items:
    - title: 群聊秘书
      sub: "把想法发给秘书；待处理 {data.queue.counts.pending} 条 · 处理中 {data.queue.counts.processing} 条"
    on_click: {view: secretary, params: {project: "{route.project}"}}
    empty: {text: 秘书队列读取失败，点开仍可查看}
  # 其后是本项目工单的群聊式列表，按最近活动倒序
  - kind: cards
    as: tickets
    source: tickets.items
    layout: list
    sort: {by: updated, order: desc}
    heading: 工单
    note: "共 {data.tickets.items|count} 条 · 进行中 {data.tickets.items|count(status!=closed)} · 已结单 {data.tickets.items|count(status=closed)}"
    title: row.title
    sub: "{row.id} · {row.status|label} · {row.project}"
    meta:
    - {label: 更新, value: "row.updated|when"}
    - {label: PM, value: row.pm, fallback: "—"}
    on_click: {view: ticket, params: {project: "{route.project}", ticket: row.id}}
    empty: {text: 这个项目还没有工单，点右上角「＋ 新建工单」}
  - kind: cards
    as: positions
    source: positions.items
    heading: 岗位
    fold: {title: 岗位配置}
    layout: deck
    note: "{data.positions.items|count} 个岗位 · 左右滑动换卡；点卡进岗位详情，可在本项目单独启停"
    title: row.cn
    badge: {when: row.disabled == true, text: 本项目已禁用}
    stat: {count: "row.flow.checks|count", label: 项门禁检查, note: "流程 {row.flow.cn}"}
    chips:
    - {label: 状态机, from: row.stages, text: cn}
    - {label: 工具, from: row.tools_enabled}
    meta:
    - {label: 提示词, value: row.prompt_file}
    on_click: {view: position, params: {position: row.id}}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: roles, id: row.id, enabled: false}
      disabled_when: "row.disabled == true || {project.archived}"
      disabled_hint: 已在本项目禁用
      flash: 已禁用岗位：{row.cn}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: roles, id: row.id, enabled: true}
      disabled_when: "row.disabled != true || row.locked == true || {project.archived}"
      disabled_hint: 已启用，无需再启用
      flash: 已启用岗位：{row.cn}
      stay: true
    empty: {text: 这个项目还没有岗位}
  - kind: cards
    as: skills
    source: skills.items
    heading: 技能
    fold: {title: 技能配置}
    layout: deck
    note: "{data.skills.items|count} 个技能 · 左右滑动换卡；可在本项目单独禁用"
    title: row.cn
    badge: {when: row.disabled_project == true, text: 本项目已禁用}
    meta:
    - {label: 归属岗位, value: row.role_cn, fallback: "—"}
    - {label: 流程, value: row.flow_text, fallback: "—"}
    - {label: 工具, value: row.tools}
    - {label: 公共状态, value: row.status_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: skills, id: row.id, enabled: false}
      disabled_when: "row.disabled_project == true || {project.archived}"
      disabled_hint: 已在本项目禁用
      flash: 已禁用技能：{row.cn}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: skills, id: row.id, enabled: true}
      disabled_when: "row.disabled_project != true || {project.archived}"
      disabled_hint: 已启用
      flash: 已启用技能：{row.cn}
      stay: true
    empty: {text: 这个项目还没有技能}
  - kind: cards
    as: ptools
    source: ptools.items
    heading: 工具
    fold: {title: 工具配置}
    layout: deck
    note: "{data.ptools.items|count} 个工具 · 左右滑动换卡；可在本项目单独禁用"
    title: row.name
    badge: {when: row.disabled_project == true, text: 本项目已禁用}
    meta:
    - {label: 模块, value: row.module}
    - {label: 来源, value: row.source}
    - {label: 说明, value: row.desc}
    - {label: 依赖, value: row.deps}
    - {label: 状态, value: row.status_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: tools, id: row.name, enabled: false}
      disabled_when: "row.disabled_project == true || {project.archived}"
      disabled_hint: 已在本项目禁用
      flash: 已禁用工具：{row.name}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: tools, id: row.name, enabled: true}
      disabled_when: "row.disabled_project != true || {project.archived}"
      disabled_hint: 已启用
      flash: 已启用工具：{row.name}
      stay: true
    empty: {text: 这个项目还没有工具}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 项目详情只声明区块，数据源走需求
