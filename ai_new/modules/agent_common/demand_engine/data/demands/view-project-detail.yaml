id: view-project-detail
title: 项目详情视图：一个项目下的全部工单，建单自动挂本项目
description: "项目详情视图：一个项目下的全部工单，建单自动挂本项目。岗位/技能/工具定义正文只存公共库一份，项目只持启停覆盖层；项目详情只声明区块，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  labels:
    queued: 排队中
    running: 进行中
    doing: 进行中
    idle: 等待
    done: 已完成
    closed: 已结单
    gone: 已失效
    error: 异常
  key: project
  params: [project]
  nav: projects
  crumb: [项目, "{project.name}"]
  heading: "{project.name}"
  subheading: "建 {project.created|when}"
  data:
  - {as: project, demand: projects-get, params: {id: "{route.project}"}}
  - {as: positions, demand: project-positions, params: {id: "{route.project}"}}
  - {as: skills, demand: project-skills, params: {id: "{route.project}"}}
  - {as: ptools, demand: project-tools, params: {id: "{route.project}"}}
  - {as: tickets, demand: ticket-list, params: {project: "{route.project}"}}
  actions:
  - {label: 重命名, modal: project.rename}
  - {label: 归档, demand: projects-archive, params: {id: "{route.project}"},
     flash: "已归档：{project.name}", disabled_when: "{project.archived}", stay: true}
  - {label: 删除, demand: projects-delete, params: {id: "{route.project}", purge: true},
     confirm: "彻底删除项目「{project.name}」？", flash: "已删除：{project.name}",
     tone: danger, after: {view: projects}}
  - {label: ＋ 新建工单, tone: primary, modal: ticket.new,
     disabled_when: "{project.archived}", disabled_hint: 已归档项目不能再建工单}
  sections:
  # 工单排第一：项目最要紧的是"现在有哪些活、干到哪了"
  - kind: cards
    source: tickets.items
    heading: 工单
    note: "共 {data.tickets.items|count} 条 · 进行中 {data.tickets.items|count(status!=closed)} · 已结单 {data.tickets.items|count(status=closed)}"
    title: row.title
    meta:
    - {label: 工单号, value: row.id}
    - {label: 状态, value: "row.status|label"}
    - {label: 更新, value: "row.updated|when"}
    - {label: PM, value: row.pm, fallback: "—"}
    on_click: {view: ticket, params: {project: "{route.project}", ticket: row.id}}
    empty: {text: 这个项目还没有工单，点右上角「＋ 新建工单」}
  - kind: cards
    source: positions.items
    heading: 项目岗位
    note: "{data.positions.items.length} 个岗位 · 点卡进岗位详情；可在本项目单独启停"
    title: row.cn
    badge: {when: row.disabled == true, text: 本项目已禁用}
    stat: {count: "row.flow.checks|count", label: 项门禁检查, note: "流程 {row.flow.cn}"}
    chips: {label: 状态机, from: row.stages, text: cn}
    meta:
    - {label: 提示词, value: row.prompt_file}
    - {label: 可用工具, value: row.tools_sum}
    on_click: {view: position, params: {position: row.id}}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: roles, id: row.id, enabled: false}
      disabled_when: "row.disabled == true"
      disabled_hint: 已在本项目禁用
      confirm: "在本项目禁用岗位「{row.cn}」？"
      flash: 已禁用岗位：{row.cn}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: roles, id: row.id, enabled: true}
      disabled_when: "row.disabled != true || row.locked == true"
      disabled_hint: 已启用，无需再启用
      flash: 已启用岗位：{row.cn}
      stay: true
    empty: {text: 这个项目还没有岗位}
  - kind: cards
    source: skills.items
    heading: 项目技能
    note: "{data.skills.items|count} 个技能 · 引用公共技能库，可在本项目单独禁用"
    title: row.cn
    badge: {when: row.disabled_project == true, text: 本项目已禁用}
    meta:
    - {label: 归属岗位, value: row.role_cn, fallback: "—"}
    - {label: 流程, value: row.flow_text, fallback: "—"}
    - {label: 工具, value: row.tools}
    - {label: 公共状态, value: row.status_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: skills, id: row.id, enabled: false}
      disabled_when: "row.disabled_project == true"
      disabled_hint: 已在本项目禁用
      confirm: "在本项目禁用技能「{row.cn}」？"
      flash: 已禁用技能：{row.cn}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: skills, id: row.id, enabled: true}
      disabled_when: "row.disabled_project != true"
      disabled_hint: 已启用
      flash: 已启用技能：{row.cn}
      stay: true
    empty: {text: 这个项目还没有技能}
  - kind: cards
    source: ptools.items
    heading: 项目工具
    note: "{data.ptools.items|count} 个工具 · 内置 ∪ 公共外部登记，可在本项目单独禁用"
    title: row.name
    meta:
    - {label: 模块, value: row.module}
    - {label: 来源, value: row.source}
    - {label: 说明, value: row.desc}
    - {label: 依赖, value: row.deps}
    - {label: 状态, value: row.status_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: tools, id: row.name, enabled: false}
      disabled_when: "row.disabled_project == true"
      disabled_hint: 已在本项目禁用
      confirm: "在本项目禁用工具「{row.name}」？"
      flash: 已禁用工具：{row.name}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: tools, id: row.name, enabled: true}
      disabled_when: "row.disabled_project != true"
      disabled_hint: 已启用
      flash: 已启用工具：{row.name}
      stay: true
    empty: {text: 这个项目还没有工具}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 项目详情只声明区块，数据源走需求
