id: view-project-detail
title: 项目详情视图：一个项目下的全部工单，建单自动挂本项目
description: "项目详情视图：一个项目下的全部工单，建单自动挂本项目。岗位/技能/工具定义正文只存公共库一份，项目只持启停覆盖层；项目详情只声明区块，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: project
  crumb: [项目, "{project.name}"]
  heading: "{project.name}"
  subheading: "建 {project.created|when}"
  data:
  - {as: project, demand: projects-get, params: {id: "{route.project}"}}
  - {as: positions, demand: project-positions, params: {id: "{route.project}"}}
  - {as: skills, demand: project-skills, params: {id: "{route.project}"}}
  - {as: ptools, demand: project-tools, params: {id: "{route.project}"}}
  - {as: tickets, demand: ticket-list, params: {project: "{route.project}"}}
  actions:
  - {label: 重命名, modal: project.rename}
  - {label: 归档, demand: projects-archive, params: {id: "{route.project}"},
     flash: "已归档：{project.name}", disabled_when: "{project.archived}", stay: true}
  - {label: 删除, demand: projects-delete, params: {id: "{route.project}", purge: true},
     confirm: "彻底删除项目「{project.name}」？", flash: "已删除：{project.name}",
     tone: danger, after: {view: projects}}
  - {label: ＋ 新建工单, tone: primary, modal: ticket.new,
     disabled_when: "{project.archived}", disabled_hint: 已归档项目不能再建工单}
  sections:
  - kind: table
    source: positions.items
    heading: 项目岗位
    summarize: true
    title: 项目岗位
    count_note: "{data.positions.items.length} 个岗位（岗位 ↔ 流程 ↔ 工具绑定在此一行看全；可在本项目单独禁用岗位或工具）"
    columns:
    - {label: 岗位, value: row.cn, fallback: row.id, sub: row.prompt_file}
    - {label: 绑定流程, value: row.flow.cn, fallback: row.flow_id}
    - {label: 流程状态链, value: row.stage_text, muted: true}
    - {label: 可用工具, value: row.tools_sum, sub: row.tools_text, muted: true}
    - {label: 项目内禁用, value: row.tools_disabled, fallback: "—", muted: true}
    - {label: 门禁检查, value: "row.flow.checks|count", suffix: 项, muted: true}
    - {label: 状态, badge: row.disabled_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: roles, id: row.id, enabled: false}
      disabled_when: "row.disabled == true"
      disabled_hint: 已在本项目禁用
      confirm: "在本项目禁用岗位「{row.cn}」？"
      flash: 已禁用岗位：{row.cn}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: roles, id: row.id, enabled: true}
      disabled_when: "row.locked == true"
      disabled_hint: 只读岗位不可启停
      flash: 已启用岗位：{row.cn}
      stay: true
    on_click: {view: position, params: {position: row.id}}
    empty: {text: 这个项目还没有岗位}
  - kind: table
    source: skills.items
    heading: 项目技能
    summarize: true
    title: 项目技能
    count_note: "{data.skills.items.length} 个技能（引用公共技能库；可在本项目单独禁用）"
    columns:
    - {label: 技能, value: row.cn, fallback: row.id}
    - {label: 岗位, value: row.role_cn, fallback: "—", muted: true}
    - {label: 流程, value: row.flow_text, fallback: "—", muted: true}
    - {label: 工具, value: row.tools, muted: true}
    - {label: 公共状态, badge: row.status_text}
    - {label: 项目状态, badge: row.disabled_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: skills, id: row.id, enabled: false}
      disabled_when: "row.disabled_project == true"
      disabled_hint: 已在本项目禁用
      confirm: "在本项目禁用技能「{row.cn}」？"
      flash: 已禁用技能：{row.cn}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: skills, id: row.id, enabled: true}
      disabled_when: "row.disabled_project != true"
      disabled_hint: 已启用
      flash: 已启用技能：{row.cn}
      stay: true
    empty: {text: 这个项目还没有技能}
  - kind: table
    source: ptools.items
    heading: 项目工具
    summarize: true
    title: 项目工具
    count_note: "{data.ptools.items.length} 个工具（内置 ∪ 公共外部登记；可在本项目单独禁用）"
    columns:
    - {label: 工具名, value: row.name, sub: row.module}
    - {label: 来源, value: row.source}
    - {label: 说明, value: row.desc}
    - {label: 依赖, value: row.deps}
    - {label: 状态, badge: row.status_text}
    - {label: 项目状态, badge: row.disabled_text}
    actions:
    - label: 禁用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: tools, id: row.name, enabled: false}
      disabled_when: "row.disabled_project == true"
      disabled_hint: 已在本项目禁用
      confirm: "在本项目禁用工具「{row.name}」？"
      flash: 已禁用工具：{row.name}
      stay: true
    - label: 启用
      demand: project-override-toggle
      params: {project: "{project.id}", kind: tools, id: row.name, enabled: true}
      disabled_when: "row.disabled_project != true"
      disabled_hint: 已启用
      flash: 已启用工具：{row.name}
      stay: true
    empty: {text: 这个项目还没有工具}
  - kind: table
    source: tickets.items
    heading: 工单
    summarize: true
    title: 工单
    count_note: "{data.tickets.items.length} 条 / 进行中 {data.tickets.items|count(status!=closed)}"
    filters:
    - {key: all, label: 全部}
    - {key: open, label: 进行中, keep: "status!=closed"}
    - {key: closed, label: 已结单, keep: "status=closed"}
    sort: {by: updated, order: desc}
    columns:
    - {label: 标题, value: row.title, sub: row.id}
    - {label: 状态, badge: row.status}
    - {label: 类型, value: row.kind, fallback: normal, muted: true}
    - {label: 更新, value: row.updated, format: when, muted: true}
    - {label: PM, value: row.pm, fallback: "—", muted: true}
    on_click: {view: ticket, params: {project: "{route.project}", ticket: row.id}}
    empty: {text: 这个项目还没有工单}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 项目详情只声明区块，数据源走需求
