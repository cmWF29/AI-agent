id: llm-chat-stream
title: 编排：messages → 载荷 → net → SSE 解码 → 对话结果
enabled: true
callable: true
'on': []
do:
- call: config.get
  with:
    key:
      lit: llm
  as: cfg
- call: llm.encode
  with:
    base_url:
      get: cfg.value.base_url
    api_key:
      get: cfg.value.api_key
    model:
      get: cfg.value.model
    messages:
      get: input.messages
    tools:
      get: input.tools
    temperature:
      get: input.temperature
    stream:
      lit: true
  as: enc
- when:
    op: ==
    a:
      get: enc.ok
    b: false
  then: []
  else:
  - call: codec.json_encode
    with:
      value:
        get: enc.payload
    as: body
  - call: net.request
    with:
      url:
        get: enc.url
      method:
        lit: POST
      headers:
        get: enc.headers
      body:
        get: body.text
      timeout:
        get: input.timeout
    as: resp
  - when:
      op: ==
      a:
        get: resp.ok
      b: false
    then: []
    else:
    - call: codec.sse_decode
      with:
        text:
          get: resp.text
      as: ev
    - when:
        op: ==
        a:
          get: ev.ok
        b: false
      then: []
      else:
      - call: llm.decode_sse
        with:
          items:
            get: ev.items
        as: out
expect:
  given:
    input:
      messages:
      - role: user
        content: 你好
  calls:
  - config.get
  - llm.encode
  - codec.json_encode
  - net.request
  - codec.sse_decode
  - llm.decode_sse
  payload:
    llm.encode:
      stream:
        lit: true
    net.request:
      method:
        lit: POST
  promise: 流式对话也是同一条编排，只是把反序列化换成 SSE 帧
