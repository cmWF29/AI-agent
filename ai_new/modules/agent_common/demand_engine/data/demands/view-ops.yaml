id: view-ops
title: 运维视图：只读总览 + 运行记录 + 运行环境
description: "运维视图：一次取运维总览与系统运行记录，摊成统计、事件表与环境信息；面板只声明区块，取数与组装归需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 2, label: 运维, group: {name: 系统, order: 3}, mobile: true}
  key: ops
  crumb: [运维]
  heading: 运维
  subheading: 运行记录只读，扫描手动触发
  actions:
  - {label: 扫停滞, demand: ops-scan, confirm: 扫一遍在途工单，命中停滞的按配置开审计单。继续？, flash: 扫描完成}
  - {label: 导出数据, modal: ops.export}
  data:
  - {as: overview, demand: ops-overview}
  - {as: logs, demand: ops-logs}
  - {as: slow, demand: trace-slow}
  forms:
  - id: ops.export
    title: 导出模块数据
    hint: 打包走存储层压缩，落在这个模块自己的 exports 下；文件名留空按时间戳生成。
    fields:
    - name: name
      label: 包名（可选）
      placeholder: 例如 data-20261121.zip
    submit:
      demand: ops-export
      params:
        name: $name
      ok: 导出
      flash: 已导出
  sections:
  - kind: stats
    as: overview
    rows:
    - {label: 项目, value: "data.overview.projects.result.items|count", note: 个在库项目}
    - {label: 归档项目, value: "data.overview.projects.result.archived|count", note: 个已归档项目}
    - {label: 工单, value: "data.overview.tickets.result.items|count", note: 个在库工单}
    - {label: 进行中, value: "data.overview.tickets.result.items|count(status!=closed)", note: 个未结单工单}
    - {label: 会话, value: "data.overview.sessions.result.items|count", note: 个在库会话}
    - {label: 文档, value: "data.overview.artifacts.result.files", note: 个文件}
    - {label: 公共文档, value: "data.overview.docs.result.counts.public", note: 篇公共规范}
    - {label: 项目文档, value: "data.overview.docs.result.counts.project", note: 篇项目文档}
    - {label: 工单文档, value: "data.overview.docs.result.counts.ticket", note: 篇工单文档}
    - {label: 公共知识, value: "data.overview.knowledge.result.counts.public", note: 篇规范}
    - {label: 工具, value: "data.overview.tools.result.total", note: 个内置工具}
    - {label: 技能, value: "data.overview.library.result.counts.skills", note: 个技能}
    - {label: 岗位, value: "data.overview.library.result.counts.roles", note: 个岗位}
    - {label: 流程, value: "data.overview.library.result.counts.flows", note: 套流程}
  - kind: kv
    as: overview
    source: data.overview
    heading: 运行环境
    fold: {title: 运行环境}
    rows:
    - {label: 服务地址, value: "{row.config.server.host}:{row.config.server.port}"}
    - {label: 版本, value: row.config.server.version}
    - {label: 登录校验, value: row.config.server.auth.enabled, format: switch}
    - {label: 模型接入, value: row.config.llm.base_url}
  - kind: stack
    as: slow
    heading: 今日请求
    note: 按 P95 从慢到快；点开任意一条看 P50/峰值/错误和代表链路
    source: data.slow.items
    sort: {by: row.p95_ms, order: desc}
    count_note: "共 {data.slow.items|count} 条，全部可展开"
    item:
      title: row.name
      sub: "row.n 次"
      badge: row.p95_ms
      badge_suffix: ms
    fields:
    - {label: 次数, value: row.n}
    - {label: P50, value: row.p50_ms, suffix: ms}
    - {label: P95, value: row.p95_ms, suffix: ms}
    - {label: 峰值, value: row.max_ms, suffix: ms}
    - {label: 错误, value: row.err}
    samples:
      label: 代表链路
      from: row.samples
      text: row.trace
      value: row.dur_ms
      max: 5
      on_click: {view: trace, params: {trace: row.trace}}
    empty: {text: 今日暂无链路采样（trace 采样率可在 config.trace.sample 调高）}
  - kind: table
    as: logs
    source: data.logs.events
    limit: 30
    count_note: "共 {data.logs.events|count} 条；只列最近 30 条"
    heading: 运行记录
    fold: {title: "运行记录 · {data.logs.events|count} 条"}
    note: 每一次需求执行都是一条系统动作；完整瀑布在「链路」页查看
    columns:
    - {label: 时间, value: row.ts, format: when, muted: true}
    - {label: 级别, value: row.level}
    - {label: 事件, value: row.event}
    - {label: 详情, value: row.detail, fallback: row.msg, muted: true}
    empty: {text: 暂无运行记录；系统动作会自动追加到这里}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 运维视图只声明区块，取数与组装归需求
