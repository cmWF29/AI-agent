id: library-get
title: 岗位库单条：种子 + 用户记录合并后取一条
description: 岗位库单条：种子 + 用户记录合并后取一条。查不到就返回 not_found 形状
tags:
- library
- read
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: seed.yaml
  as: seed
- call: library.kind_file
  with:
    kind:
      get: input.kind
  as: lk
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      get: lk.path
  as: user
- call: library.get
  with:
    kind:
      get: input.kind
    id:
      get: input.id
    seed:
      get: seed.value
    user:
      get: user.value
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - library.kind_file
  - store.read
  - library.get
  payload: {}
  promise: 查不到就返回 not_found 形状
