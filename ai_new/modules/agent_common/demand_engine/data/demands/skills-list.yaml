id: skills-list
title: Skill 清单：已登记的 Skill 单元，关联岗位/流程/工具与启停状态
description: "Skill 清单：读 Skill 登记及其岗位、流程、工具记录，成形摘要清单（岗位中文名、流程在库与否、工具名、状态）。合并与摘要成形归岗位库模块，取数归需求"
tags:
- library
- read
enabled: true
callable: true
'on': []
do:
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: skills.yaml
  as: us
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: roles.yaml
  as: ur
- call: store.read
  with:
    module:
      lit: agent/library
    path:
      lit: flows.yaml
  as: uf
- call: store.read
  with:
    module:
      lit: agent_common/tools
    path:
      lit: tools.yaml
  as: ut
- call: library.skills_list
  with:
    skills:
      get: us.value
    roles:
      get: ur.value
    flows:
      get: uf.value
    tools:
      get: ut.value
  as: out
expect:
  given:
    input: {}
  calls:
  - store.read
  - store.read
  - store.read
  - store.read
  - library.skills_list
  payload: {}
  promise: Skill 摘要成形归模块，各库取数归需求
