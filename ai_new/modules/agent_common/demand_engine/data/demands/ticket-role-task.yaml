id: ticket-role-task
title: 给角色派活：找会话 → send 需求
description: 给角色派活：找会话 → send 需求。找人归模块，发消息归需求
tags:
- ticket
- write
enabled: true
callable: true
'on': []
do:
- call: tickets.record_path
  with:
    id:
      get: input.id
  as: tp
- call: store.read
  with:
    module:
      lit: agent/tickets
    path:
      get: tp.path
  as: row
- call: tickets.pick
  with:
    rec:
      get: row.value
    target:
      get: input.role
  as: tgt
- call: demand_engine.run
  with:
    id:
      lit: session-send
    input:
      id:
        get: tgt.session
      text:
        get: input.text
  as: sent
- call: tickets.view
  with:
    rec:
      get: row.value
  as: out
expect:
  given:
    input: {}
  calls:
  - tickets.record_path
  - store.read
  - tickets.pick
  - demand_engine.run
  - tickets.view
  payload: {}
  promise: 找人归模块，发消息归需求
