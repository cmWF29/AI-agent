id: view-tools
title: 工具：agent 代码内置能力，只读清单
description: "工具库视图：只列代码内置工具。视图只声明表格，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  menu: {order: 3, label: 工具, group: {name: 资产, order: 2}, mobile: true}
  key: tools
  crumb: [工具]
  heading: 工具
  subheading: 代码里注册的内置能力
  actions: []
  data:
  - {as: list, demand: tools-list}
  - {as: deps, demand: tools-deps}
  sections:
  - kind: kv
    as: deps
    source: deps
    heading: 依赖盘点
    rows:
    - label: 工具总数
      value: row.total
    - label: 就绪工具
      value: row.ready
    - label: 缺依赖工具
      value: row.missing_tools
    - label: 待装 Python 包
      value: row.pip_missing
    - label: 待人工补齐
      value: row.manual_missing
    actions:
    - label: 安装缺失依赖
      demand: tools-install
      disabled_when: row.install_blocked
      disabled_hint: 没有待自动安装的 Python 包；CLI/环境变量/配置项需人工补齐
      confirm: "自动安装盘点中缺失的 Python 包；CLI/环境变量/配置项需另行人工补齐。"
      flash: 依赖安装完成
      after: {view: tools, reload: true}
  - kind: table
    as: list
    source: list.items
    columns:
    - {label: 工具名, value: row.name, sub: row.module}
    - {label: 来源, value: row.source}
    - {label: 说明, value: row.desc}
    - {label: 依赖, value: row.deps}
    - {label: 状态, badge: row.status_text}
    - {label: 缺失项, value: row.missing, muted: true}
    - {label: 参数, value: row.params, muted: true}
    empty: {text: 暂无工具}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 工具库只声明表格，数据源走需求
