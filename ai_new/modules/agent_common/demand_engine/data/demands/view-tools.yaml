description: "工具库视图：注册表登记的全部能力，只读清单。视图只声明表格，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: tools
  crumb: [项目, 工具库]
  heading: 工具库
