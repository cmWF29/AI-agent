id: view-tools
title: 工具库视图：agent 代码内置能力，只读清单
description: "工具库视图：只列代码内置工具。视图只声明表格，数据源走需求"
tags: [view, web, read]
enabled: true
callable: false
'on': []
do: []
view:
  key: tools
  crumb: [工具库]
  heading: 工具库
  subheading: 工具 = agent 代码里注册的内置能力；宏观 Shell/进程执行属平台底座，不作为业务工具露出。外部安装的工具归外部工具库
  actions:
  - label: 安装缺失依赖
    demand: tools-install
    confirm: "自动安装清单里缺失的 Python 包；CLI/环境变量/配置项需另行人工补齐。"
    flash: 依赖安装完成
    after: {view: tools, reload: true}
  data:
  - {as: list, demand: tools-list}
  sections:
  - kind: table
    source: list.items
    columns:
    - {label: 工具名, value: row.name, sub: row.module}
    - {label: 来源, value: row.source}
    - {label: 说明, value: row.desc}
    - {label: 依赖, value: row.deps}
    - {label: 状态, badge: row.status_text}
    - {label: 缺失项, value: row.missing, muted: true}
    - {label: 参数, value: row.params, muted: true}
    empty: {text: 暂无工具}
expect:
  given:
    input: {}
  calls: []
  payload: {}
  promise: 工具库只声明表格，数据源走需求
