id: knowledge-write
title: 写知识：闭环在 knowledge.save 能力内，需求只做顺序编排
description: "写知识：闭环在 knowledge.save 能力内，需求只做顺序编排。append 与覆盖两条写路在能力内部选，需求树不分岔"
tags:
- knowledge
enabled: true
callable: true
'on': []
do:
- call: knowledge.save
  with:
    layer:
      get: input.layer
    project:
      get: input.project
    ticket:
      get: input.ticket
    name:
      get: input.name
    content:
      get: input.content
    mode:
      get: input.mode
  as: out
- call: runtime.apply
  with:
    effect:
      get: out.effects
    echo:
      get: out
  as: applied
expect:
  given:
    input: {}
  calls:
  - knowledge.save
  - runtime.apply
  payload: {}
  promise: append 与覆盖两条写路在能力内部选，需求树不分岔
