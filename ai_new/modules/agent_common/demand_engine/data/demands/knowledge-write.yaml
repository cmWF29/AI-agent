id: knowledge-write
title: 写知识：闭环在 knowledge.save 能力内，需求只做顺序编排
tags: [knowledge]
enabled: true
callable: true
'on': []
do:
- call: knowledge.save
  with:
    layer:
      get: input.layer
    project:
      get: input.project
    ticket:
      get: input.ticket
    name:
      get: input.name
    content:
      get: input.content
    mode:
      get: input.mode
  as: out
expect:
  given:
    input: {}
  calls:
  - knowledge.save
  payload: {}
  promise: append 与覆盖两条写路在能力内部选，需求树不分岔
