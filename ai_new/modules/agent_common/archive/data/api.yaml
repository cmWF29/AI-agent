# 消息契约：本模块每条能力收什么、回什么。
module: archive
routes:
  archive.resolve_abs:
    in:
      abs:
        type: any
        req: true
    out:
      exists:
        type: bool
      raw:
        type: any
      cached:
        type: bool
  archive.scan:
    in:
      paths:
        type: any
        req: false
    out:
      candidates:
        type: list
      summary:
        type: any
  archive.compress:
    in:
      paths:
        type: any
        req: false
      category:
        type: any
        req: false
    out:
      items:
        type: list
      summary:
        type: any
  archive.read_text:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      exists:
        type: bool
      value:
        type: any
      cached:
        type: bool
  archive.read_bytes:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
    out:
      exists:
        type: bool
      size:
        type: int
      value:
        type: str
      cached:
        type: bool
  archive.read_lines:
    in:
      module:
        type: any
        req: true
      path:
        type: any
        req: true
      start:
        type: any
        req: false
      end:
        type: any
        req: false
      limit:
        type: any
        req: false
    out:
      exists:
        type: bool
      lines:
        type: list
      total:
        type: int
      cached:
        type: bool
  archive.stats:
    in: {}
    out:
      index:
        type: any
      cache:
        type: any
      backend:
        type: any
      lock:
        type: any
  archive.metrics:
    in: {}
    out:
      storage:
        type: any
        fields:
          count: {type: int}
          orig_bytes: {type: int}
          comp_bytes: {type: int}
          saved_bytes: {type: int}
          compression_ratio: {type: float}
          saved_ratio: {type: float}
          by_category: {type: any}
      decompress:
        type: any
        fields:
          samples: {type: int}
          p50_ms: {type: any}
          p95_ms: {type: any}
          status: {type: str}
      cache:
        type: any
        fields:
          hits: {type: int}
          misses: {type: int}
          hit_rate: {type: float}
          entries: {type: int}
          max_entries: {type: int}
          bytes: {type: int}
          max_bytes: {type: int}
      labels:
        type: any
  archive.index_query:
    in:
      category:
        type: any
        req: false
      older_than:
        type: any
        req: false
      limit:
        type: any
        req: false
    out:
      rows:
        type: list
