# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: llm
routes:
  llm.chat:
    doc: 对话闭环：HTTP 直连 → SSE 解码
    in:
      cancel:
        type: any
        req: false
      timeout:
        type: any
        req: false
      api_key:
        type: any
        req: false
      base_url:
        type: any
        req: false
      messages:
        type: any
        req: false
      mode:
        type: any
        req: false
      model:
        type: any
        req: false
      temperature:
        type: any
        req: false
      tool_choice:
        type: any
        req: false
      tools:
        type: any
        req: false
    out:
      wire:
        type: any
  llm.chat_stream:
    doc: 流式对话闭环：配置→载荷→传输→SSE 解码
    in:
      timeout:
        type: any
        req: false
      messages:
        type: any
        req: false
      temperature:
        type: any
        req: false
      tools:
        type: any
        req: false
    out:
      wire:
        type: any
  llm.decode_sse:
    doc: SSE 事件列表 → 对话结果
    in:
      items:
        type: any
        req: false
  llm.encode:
    doc: 对话 → 线上载荷
    in:
      api_key:
        type: any
        req: false
      base_url:
        type: any
        req: false
      messages:
        type: any
        req: false
      model:
        type: any
        req: false
      stream:
        type: any
        req: false
      temperature:
        type: any
        req: false
      tool_choice:
        type: any
        req: false
      tools:
        type: any
        req: false
    out:
      code:
        type: any
      error:
        type: any
      ok:
        type: bool
