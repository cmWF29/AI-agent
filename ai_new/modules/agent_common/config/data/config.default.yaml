server:
  host: 127.0.0.1
  port: 8787
  token: ''
  version: 0.1.0
  auth:
    enabled: false
    username: admin
    password_hash: ''
    salt: ''
    ttl: 86400
  tls:
    enabled: false
    cert: ''
    key: ''
llm:
  mode: api              # api=走 HTTP 对话接口；agent=交给外部 agent 进程
  base_url: ''
  api_key: ''
  model: ''
  timeout: 120
  temperature: 0.3
  agent:
    command: []          # argv 数组；含 {prompt} 就替换进去，否则用 stdin 喂
    cwd: ''
    timeout: 600
sessions:
  max_concurrent: 8
  max_steps: 60
  summary_keep: 10       # 上下文裁剪保留的最近普通消息条数（system 消息全部保留）
  result_chars: 500      # 落盘结果摘要（失败原因/回复正文）截断字符数
  secretary_scenario: prompts/secretary.md
  pm_scenario: prompts/pm.md
  role_scenario: prompts/roles/{role}.md
  paths:
    prompt: 'prompts/{kind}.md'
  context:
    tool_output_chars: 1000   # 工具输出正文超此字符数即落盘 ticket 层，上下文只回路径
    resume_on_boot: true      # 进程重启后自动把残留 running 会话重新驱动一轮
    resume_max: 5             # 单次启动最多自动续跑的会话数，防止启动风暴
tickets:
  max_roles: 8
  max_children: 8
  pm_max_steps: 0
  auto_retrospective: false
  stall_check:
    enabled: true          # 是否启用停滞扫描
    idle_minutes: 45       # 空闲超过该分钟数判停滞
    max_per_scan: 2        # 单次扫描最多开几张审计单
    create_audit: true     # 命中后是否真开审计单（false 只报告命中）
  paths:
    record: 'tickets/{id}/ticket.yaml'
    project_record: '{project}.yaml'
    glob: 'tickets/T-*/ticket.yaml'
    ticket_glob: '*/ticket.yaml'
    root: 'tickets'
agents:
  default: api
  guard:
    min_free_mem_mb: 1024
    max_load_ratio: 1.5
    max_claude_procs: 3
    on_insufficient: reject
knowledge:
  max_inject_chars: 20000
  search_limit: 10        # 检索命中默认条数
  snippet_chars: 400      # 命中摘要片段字符长度
  paths:
    public: 'public'
    project: 'projects/{project}'
    ticket: 'tickets/{ticket}'
    doc: '{prefix}/{name}.md'
    project_dir: 'projects/{id}'
    index: 'index.yaml'
library:
  review_max_retries: 2   # 收尾评审最多回催次数，到达即转卡点交上层裁决
  paths:
    record: '{kind}s.yaml'
    prompt: 'prompts/{file}'
channel:
  default_limit: 20      # 频道回看默认条数
  max_limit: 200         # 单次回看条数硬上限
projects:
  paths:
    record: '{id}.yaml'
    ticket_prefix: 'tickets/{seg}'
    project_dir: 'projects/{pid}'
    ticket_glob: 'tickets/T-*/ticket.yaml'
auth:
  paths:
    session: 'sessions/{token}.yaml'
web:
  paths:
    console: 'console/{rel}'
artifacts:
  max_bytes: 262144      # 交付件读取截断字节上限（256 KiB）
  paths:
    public: 'public'
    project: 'projects/{project}'
    ticket: 'projects/{project}/tickets/{ticket}'
    public_kind: 'public/{kind}'
    project_kind: 'projects/{project}/{kind}'
    ticket_kind: 'projects/{project}/tickets/{ticket}/{kind}'
    index: 'index.yaml'
ops:
  log_lines: 100         # 日志/操作记录回看行数
taxonomy:
  layers: [public, project, ticket]
  categories: [knowledge, document, log]
  doc_kinds: [artifact, non_artifact]
  sources: [llm, system, script]
  knowledge_source: llm
  log_source: system
logs:
  paths:
    index: 'index.yaml'
    system_record: 'public/system/app.jsonl'
    project: 'projects/{project}'
    ticket: 'projects/{project}/tickets/{ticket}'
    session: 'sessions/{id}.yaml'
    session_glob: 'sessions/*.yaml'
    transcript: 'projects/{project}/tickets/{ticket}/transcript.yaml'
    tool: 'projects/{project}/tickets/{ticket}/tool/{fid}.txt'
    channel: 'channels/{id}.jsonl'
