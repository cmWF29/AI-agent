server:
  host: 127.0.0.1
  port: 8787
  token: ''
  version: 0.1.0
  auth:
    enabled: false
    username: admin
    password_hash: ''
    salt: ''
    ttl: 86400
  tls:
    enabled: false
    cert: ''
    key: ''
llm:
  mode: api              # api=走 HTTP 对话接口；agent=交给外部 agent 进程
  base_url: ''
  api_key: ''
  model: ''
  timeout: 120
  temperature: 0.3
  agent:
    command: []          # argv 数组；含 {prompt} 就替换进去，否则用 stdin 喂
    cwd: ''
    timeout: 600
sessions:
  max_concurrent: 8
  max_steps: 60
  summary_keep: 10       # 上下文裁剪保留的最近普通消息条数（system 消息全部保留）
  result_chars: 500      # 落盘结果摘要（失败原因/回复正文）截断字符数
  secretary_scenario: prompts/secretary.md
  pm_scenario: prompts/pm.md
  role_scenario: prompts/roles/{role}.md
  context:
    tool_output_chars: 1000   # 工具输出正文超此字符数即落盘 ticket 层，上下文只回路径
    resume_on_boot: true      # 进程重启后自动把残留 running 会话重新驱动一轮
    resume_max: 5             # 单次启动最多自动续跑的会话数，防止启动风暴
tickets:
  max_roles: 8
  pm_max_steps: 0
  auto_retrospective: false
  stall_check:
    enabled: true          # 是否启用停滞扫描
    idle_minutes: 45       # 空闲超过该分钟数判停滞
    max_per_scan: 2        # 单次扫描最多开几张审计单
    create_audit: true     # 命中后是否真开审计单（false 只报告命中）
agents:
  default: api
  guard:
    min_free_mem_mb: 1024
    max_load_ratio: 1.5
    max_claude_procs: 3
    on_insufficient: reject
knowledge:
  max_inject_chars: 20000
  search_limit: 10        # 检索命中默认条数
  snippet_chars: 400      # 命中摘要片段字符长度
library:
  review_max_retries: 2   # 收尾评审最多回催次数，到达即转卡点交上层裁决
channel:
  default_limit: 20      # 频道回看默认条数
  max_limit: 200         # 单次回看条数硬上限
artifacts:
  max_bytes: 262144      # 交付件读取截断字节上限（256 KiB）
ops:
  log_lines: 100         # 日志/操作记录回看行数
