server:
  host: 127.0.0.1
  port: 8787
  token: ''
  version: 0.1.0
  auth:
    # 登录校验：缺省 false 仅本机开发；对外提供服务前必须置 true 并改掉默认口令。
    enabled: false
    # 默认账号 admin；生产必须改成非默认用户名。
    username: admin
    # 口令摘要（salt:口令 的 sha256）：生产必须设置强口令摘要；留空即视为未改默认弱口令，
    # 启动打显著告警，控制台横幅提示必须改密后才能对外。
    password_hash: ''
    salt: ''
    ttl: 86400
  tls:
    enabled: false
    cert: ''
    key: ''
api:
  transport_timeout: 10  # 跨进程通道超时秒数（direct 不走网络，不读它）
  contract_mode: enforce  # 入参契约校验：enforce 缺必填报 bad_payload；warn 只记证据
  internal_call_mode: enforce  # 跨模块直调：warn 只记证据，enforce 未登记即拒（internal-calls.yaml）
llm:
  base_url: ''
  api_key: ''
  model: ''
  timeout: 120
  temperature: 0.3
  stub: false          # 演示/测试桩模式：外壳起本地桩并把 base_url 指到桩；生产保持 false 走真实上游
net:
  stream_lines: 4000     # SSE 原文保留行数上限（网络报文回查，0=不保留）
runtime:
  session_workers: 8     # 后台会话调度并发上限（有界池复用，不再一会话一裸线程）
  tool_workers: 8       # 工具调用/子进程执行并发上限（独立于会话调度池）
  api_workers: 32       # api-loop 桥接同步路由的执行器线程上限（留并发建单+嵌套回投余量，防循环等待）
  hook_batch: 10        # 单次认领的待派发事件条数
  future_timeout: 30    # 等后台任务收尾的秒数
  stream_timeout: 15    # 草稿槽长轮询等待秒数
sessions:
  max_concurrent: 8
  max_steps: 60
  react_cap: 200        # 未指定 max_steps 时 ReAct 单轮步数硬上限
  summary_keep: 10       # 上下文裁剪保留的最近普通消息条数（system 消息全部保留）
  summary_fallback_chars: 600  # 未收口轮次的系统兜底摘要字符上限（0=不兜底）
  result_chars: 500      # 落盘结果摘要（失败原因/回复正文）截断字符数
  secretary_scenario: prompts/secretary.md
  pm_scenario: prompts/pm.md
  role_scenario: prompts/roles/{role}.md
  paths:
    prompt: 'prompts/{kind}.md'
  context:
    tool_output_chars: 1000   # 工具输出正文超此字符数即落盘 ticket 层，上下文只回路径
    resume_on_boot: true      # 进程重启后自动把残留 running 会话重新驱动一轮
    resume_max: 5             # 单次启动最多自动续跑的会话数，防止启动风暴
  stuck_check:
    enabled: true           # 运行期自愈扫描：僵死/停滞超阈值的 running 会话复位 idle
    idle_minutes: 30        # 在途任务距上次更新超过该分钟数判停滞（卡死保守复位）
tickets:
  max_roles: 8
  max_children: 8
  pm_max_steps: 0
  auto_retrospective: false
  stall_check:
    enabled: true          # 是否启用停滞扫描
    idle_minutes: 45       # 空闲超过该分钟数判停滞
    max_per_scan: 2        # 单次扫描最多开几张审计单
    create_audit: true     # 命中后是否真开审计单（false 只报告命中）
  paths:
    # 工单落在它所属项目的目录里：一张单 = 一个目录，项目之间不共享路径。
    record: 'projects/{project}/tickets/{id}/ticket.yaml'
    project_record: '{project}.yaml'
    glob: 'projects/*/tickets/T-*/ticket.yaml'
    ticket_glob: 'projects/*/tickets/T-*/ticket.yaml'
    walk_glob: '**/tickets/T-*/ticket.yaml'
    walk_root: 'projects'
    walk_pattern: '*/tickets/*/ticket.yaml'
    root: 'projects'
timer:
  min_interval_s: 60       # once 距 now 最小间隔；cron 最小粒度校验
  max_per_project: 20      # 单项目在档定时器上限，超限 quota_exceeded
  tick_interval_s: 30      # 后台扫描周期（秒）
  max_catchup: 5           # 宕机后单次最多补触发的槽位数
  default_tz: Asia/Shanghai
exec:
  error_chars: 400       # 子进程失败原因截断字符数
asr:
  chunk_shorts: 4000     # 语音识别一次喂给识别器的采样点数
todos:
  max_items: 40          # 会话待办条数上限，超出的新条目不收
knowledge:
  max_inject_chars: 20000
  search_limit: 10        # 检索命中默认条数
  snippet_chars: 400      # 命中摘要片段字符长度
  paths:
    public: 'public'
    project: 'projects/{project}'
    ticket: 'tickets/{ticket}'
    doc: '{prefix}/{name}.md'
    project_dir: 'projects/{id}'
    index: 'index.yaml'
library:
  review_max_retries: 2   # 收尾评审最多回催次数，到达即转卡点交上层裁决
  paths:
    record: '{kind}s.yaml'
    prompt: 'prompts/{file}'
channel:
  default_limit: 20      # 频道回看默认条数
  max_limit: 200         # 单次回看条数硬上限
projects:
  paths:
    record: '{id}.yaml'
    ticket_prefix: 'projects/{project}/tickets/{seg}'
    project_dir: 'projects/{pid}'
    ticket_glob: 'projects/*/tickets/T-*/ticket.yaml'
auth:
  paths:
    session: 'sessions/{token}.yaml'
web:
  gzip_min_bytes: 1024  # 响应体超过该字节数才压缩（客户端声明可接收时）
  paths:
    console: 'console/{rel}'
  bundle:               # 控制台首屏把六个脚本合成一个响应：少六次握手就是少六次往返
  - out: console.js
    parts: [assets/js-yaml.min.js, app.js, spec.js, render.js, recorder.js, actions.js, boot.js]
artifacts:
  max_bytes: 262144      # 交付件读取截断字节上限（256 KiB）
  paths:
    public: 'public'
    project: 'projects/{project}'
    ticket: 'projects/{project}/tickets/{ticket}'
    public_kind: 'public/{kind}'
    project_kind: 'projects/{project}/{kind}'
    ticket_kind: 'projects/{project}/tickets/{ticket}/{kind}'
    index: 'index.yaml'
ops:
  log_lines: 100         # 日志/操作记录回看行数
taxonomy:
  layers: [public, project, ticket]
  categories: [knowledge, document, log]
  doc_kinds: [artifact, non_artifact]
  sources: [llm, system, script]
  knowledge_source: llm
  log_source: system
logs:
  paths:
    index: 'index.yaml'
    system_record: 'public/system/app.jsonl'
    project: 'projects/{project}'
    ticket: 'projects/{project}/tickets/{ticket}'
    session: 'sessions/{id}.yaml'
    session_glob: 'sessions/*.yaml'
    transcript: 'projects/{project}/tickets/{ticket}/transcript.yaml'
    tool: 'projects/{project}/tickets/{ticket}/tool/{fid}.txt'
    channel: 'channels/{id}.jsonl'
    hook_queue: 'hook-queue.yaml'

# 链路追踪：默认全开；压测时用 sample 降采样（0~1）
trace:
  enabled: true
  sample: 1.0

# 存储治理：冷数据自动压缩归档 + 按需动态解压。
# 压缩是写盘动作，由需求 archive-gc 编排触发；本配置只给阈值与扫描面。
archive:
  enabled: true
  algorithm: gzip            # gzip | zstd；zstd 需环境装 zstandard，未装自动回落 gzip
  compress_level: 6
  min_file_bytes: 2048       # 小于该字节的文件不压（小文件压缩不抵开销）
  grace_seconds: 3600        # 写入宽限窗口：近 1 小时内改过的文件判热，绝不边写边压
  cache_max_bytes: 4194304   # 解压缓存内存上限（4 MiB）
  cache_max_entries: 64      # 解压缓存条目上限
  max_attempts: 2           # 压缩失败重试次数；半截临时文件必清理
  categories:
    session:  {age_days: 7,  min_bytes: 2048}
    tool:     {age_days: 7,  min_bytes: 1024}
    channel:  {age_days: 14, min_bytes: 1024}
    trace:    {age_days: 3,  min_bytes: 1024}
    system:   {age_days: 14, min_bytes: 4096}
    artifact: {age_days: 30, min_bytes: 4096}
  scan:
    - {module: agent/logs,         category: session,  glob: 'sessions/*.yaml'}
    - {module: agent/logs,         category: tool,     glob: 'projects/**/tool/*.txt'}
    - {module: agent/logs,         category: tool,     glob: 'tickets/**/tool/*.txt'}
    - {module: agent/logs,         category: channel,  glob: 'channels/*.jsonl'}
    - {module: agent_common/trace, category: trace,    glob: 'trace/**/*.jsonl'}
    - {module: agent/logs,         category: system,   glob: 'public/system/*.jsonl'}
    - {module: agent/artifacts,    category: artifact, glob: 'public/**/*'}
    - {module: agent/artifacts,    category: artifact, glob: 'projects/**/*'}
