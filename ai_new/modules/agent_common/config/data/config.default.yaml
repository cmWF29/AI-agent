server:
  host: 127.0.0.1
  port: 8787
  token: ''
  version: 0.1.0
  auth:
    enabled: false
    username: admin
    password_hash: ''
    salt: ''
    ttl: 86400
  tls:
    enabled: false
    cert: ''
    key: ''
llm:
  mode: api              # api=走 HTTP 对话接口；agent=交给外部 agent 进程
  base_url: ''
  api_key: ''
  model: ''
  timeout: 120
  temperature: 0.3
  agent:
    command: []          # argv 数组；含 {prompt} 就替换进去，否则用 stdin 喂
    cwd: ''
    timeout: 600
sessions:
  max_concurrent: 8
  max_steps: 60
  secretary_scenario: prompts/secretary.md
  pm_scenario: prompts/pm.md
  role_scenario: prompts/roles/{role}.md
  context:
    tool_output_chars: 1000   # 工具输出正文超此字符数即落盘 ticket 层，上下文只回路径
    recover_after_seconds: 300  # 启动时卡在 running 超过该秒数的会话复位 idle
    resume_on_boot: true      # 进程重启后自动把残留 running 会话重新驱动一轮
    resume_max: 5             # 单次启动最多自动续跑的会话数，防止启动风暴
tickets:
  max_roles: 8
  pm_max_steps: 0
  auto_retrospective: false
  stall_check:
    enabled: true
    interval_sec: 300
    idle_minutes: 45
    max_per_scan: 2
    create_audit: true
agents:
  default: api
  guard:
    min_free_mem_mb: 1024
    max_load_ratio: 1.5
    max_claude_procs: 3
    on_insufficient: reject
knowledge:
  max_inject_chars: 20000
