# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: codec
routes:
  codec.base64_decode_bytes:
    doc: base64 → 原始字节
    in:
      text:
        type: any
        req: false
    out:
      data:
        type: any
  codec.decode_hex:
    doc: hex → utf8 文本，非 utf8 退 base64
    in:
      hex:
        type: any
        req: false
      max_bytes:
        type: any
        req: false
      size:
        type: any
        req: false
    out:
      encoding:
        type: any
      text:
        type: any
      truncated:
        type: any
  codec.digest:
    doc: 内容摘要
  codec.hex_from_base64:
    doc: base64 → hex
  codec.json_decode:
    doc: JSON 文本 → 对象
  codec.json_encode:
    doc: 对象 → JSON 文本
    in:
      value:
        type: any
        req: false
    out:
      text:
        type: any
  codec.nonce:
    doc: 安全随机令牌
  codec.sse_decode:
    doc: SSE 文本 → 事件对象列表
  codec.wave_decode:
    doc: WAV(PCM) 字节 → PCM 帧/采样率
