# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: api
routes:
  api.snapshot:
    out:
      items:
        type: list
      routes:
        type: int
      transport:
        type: dict
  api.transport_compile:
    in:
      deploy:
        type: str
        req: false
        comment: 部署意图文件路径，缺省用模块自己的 data/deploy.yaml
      out:
        type: str
        req: false
        comment: 绑定产物路径，缺省 data/gen/bindings.yaml
    out:
      default:
        type: str
      path:
        type: str
      routes:
        type: dict
      stats:
        type: dict
