comment: 聚合能力内部路由清单：B1 下沉后，业务能力在 handler 内部经 ctx.api.call(caller=None) 编排的其他模块路由。
  这些路由不出现在需求 do 树里，但只要所属聚合能力被某条需求编排，即视为受管辖。静态闸据此把内部路由并入 demand_bound。
  新增聚合能力时，必须在此登记它内部调用的全部路由；漏登记会被 stray/写管辖闸拦下。
capabilities:
  llm.chat:
    calls:
    - config.get
    - llm.encode
    - codec.json_encode
    - net.request
    - codec.json_decode
    - llm.decode
  llm.chat_stream:
    calls:
    - config.get
    - llm.encode
    - codec.json_encode
    - net.request
    - codec.sse_decode
    - llm.decode_sse
  knowledge.save:
    calls:
    - store.id
    - knowledge.scope
    - knowledge.doc
    - store.append_text
    - store.write_text
    - knowledge.view
  artifacts.save:
    calls:
    - store.id
    - artifacts.base
    - artifacts.rel
    - codec.hex_from_base64
    - store.write_bytes
    - store.write_text
    - artifacts.written
  projects.create:
    calls:
    - store.id
    - clock.now
    - projects.build
    - store.exists
    - projects.conflict
    - store.write
    - projects.view
  projects.toggle:
    calls:
    - store.id
    - store.read
    - projects.missing
    - clock.now
    - projects.toggle_override
    - projects.override_parts
    - projects.view
    - store.write
  projects.rename:
    calls:
    - store.id
    - store.read
    - projects.missing
    - store.exists
    - projects.conflict
    - clock.now
    - projects.renamed
    - store.write
    - store.remove
    - tickets.rebind
    - projects.view
  projects.remove:
    calls:
    - store.id
    - store.read
    - store.remove
    - projects.deleted
    - clock.now
    - projects.archive
    - store.write
    - projects.view
  auth.login:
    calls:
    - config.get
    - codec.digest
    - auth.credentials_ok
    - clock.now
    - codec.nonce
    - auth.build_session
    - store.write
    - auth.session_view
  sessions.spawn:
    calls:
    - store.id
    - demand_engine.run
    - store.read_text
    - clock.now
    - sessions.build
    - store.write
    - sessions.view
  tickets.create:
    calls:
    - tickets.validate_project
    - tickets.err
    - store.read
    - projects.missing
    - clock.now
    - tickets.newid
    - tickets.build
    - demand_engine.run
    - tickets.bindpm
    - store.write
    - tickets.view
  channel.post:
    calls:
    - store.id
    - store.read_text
    - channel.split
    - codec.json_decode
    - clock.now
    - channel.make
    - codec.json_encode
    - store.append_text
  channel.read_since:
    calls:
    - store.id
    - store.read_text
    - channel.split
    - codec.json_decode
    - channel.since
  channel.read_tail:
    calls:
    - store.id
    - store.read_text
    - channel.split
    - codec.json_decode
    - channel.tail
  tickets.close:
    calls:
    - store.read
    - store.glob
    - clock.now
    - tickets.closefin
    - tickets.collect_session_ids
    - tickets.archive_transcript
    - store.write
    - store.remove
    - demand_engine.run
    - tickets.view
  sessions.by_ticket:
    calls:
    - store.glob
    - store.read
    - sessions.view
  tickets.split:
    calls:
    - store.read
    - demand_engine.run
    - clock.now
    - tickets.bindchild
    - store.write
    - tickets.view
  tickets.rebind:
    calls:
    - store.walk
    - store.write
  tickets.stall_scan:
    calls:
    - clock.now
    - store.walk
    - clock.since
    - tickets.stale
    - demand_engine.run
    - ops.assemble
  react.run:
    calls:
    - react.schemas
    - demand_engine.run
    - react.assistant
    - react.toolnames
    - codec.json_decode
    - react.args
    - tools.execute
    - codec.json_encode
    - react.toolmsg
    - react.result
  decompose.run:
    calls:
    - net.request
    - decompose.parse_skill_doc
    - store.read
    - library.disabled_skills
    - tools.list
    - decompose.promptize
    - codec.json_decode
    - decompose.parse
  tools.list:
    calls:
    - host.which
    - host.importable
    - host.env
    - config.get
  tools.install_missing:
    calls:
    - host.which
    - host.importable
    - host.env
    - config.get
    - host.executable
    - exec.run
  tools.external_run:
    calls:
    - store.read
  tools.pick:
    calls:
    - store.read
    - library.disabled_skills
    - projects.override_parts
  tools.execute:
    calls:
    - store.read
    - library.disabled_skills
    - projects.override_parts
  channel.reply:
    calls:
    - channel.read_tail
    - demand_engine.run
    - channel.post
