# ---- 能力模块台账（架构闸豁免依据，可执行清单）----
# 判定口径：模块自持落盘/压缩/解压/网络/主机/传输/进程等职责；路由被需求 do 树
# 编排或平台清单登记；自身不含业务规则。架构闸从下列两张名单读豁免，不在测试里
# 维护第二份名单。新增能力模块先在此登记归属面，再跑 test_architecture 复核。
# 证据：archive 的 8 条路由登记在 archive/__init__.py（setup），契约在 archive/data/api.yaml；
# 需求编排见 demand_engine/data/demands/archive-gc.yaml（scan/compress/stats）；
# 聚合内部调用 cloud.sync_plan / cloud.sync_run 调 index_query / read_bytes。
capability_modules:
  stdlib_io:
    modules: [store, net, host, http, exec, archive]
  clock_codec:
    modules: [clock, codec, store, host, net, http, exec, boot, api, config, trace, archive]
