comment: 平台入口路由：不由任何需求 do 树编排，而由 HTTP 闸 / SSE / 需求引擎 / 装配期直接调用（caller=None 或引擎内部）。业务能力路由必须出现在某条需求的
  do 语句树里；只在模块内部进程内直调的纯函数不注册到本表之外的注册表。新增平台路由必须在此登记 caller 与原因。
routes:
  auth.verify:
    caller: http-gate
    reason: HTTP 闸在放行业务请求前校验令牌；系统调用，不走需求。
  auth.status:
    caller: http-public
    reason: 登录页先询问是否需要登录，公开路由，不鉴权。
  channel.watch:
    caller: http-sse
    reason: SSE 长流门面，按游标委托 channel-since 需求回 {items, cursor}。
  clock.sleep:
    caller: engine
    reason: 需求语言 wait 语句与 SSE 轮询直接调用；平台计时等待，不是业务能力。
  web.gate:
    caller: http-gate
    reason: 静态资源落到页面之前判定是否需要登录；未登录直接 302 到登录页，不让前端兜底跳转。
  exec.run:
    caller: internal
    reason: 拆包拉装依赖与受限工具起进程；进程能力只在进程内调用，不对外。
  hooks.points:
    caller: http-inspect
    reason: 前端与巡检读取已声明的 hook 点清单；只读可见性面。
  runtime.stream:
    caller: view
    reason: 视图轮询读运行期草稿（内存面，不落盘）；模型逐行吐正文时给前端看增量。
  runtime.stream_events:
    caller: http-sse
    reason: SSE 长流门面，订阅运行期草稿槽变化，事件驱动推草稿快照；内存面不落盘，替代高频轮询。
  api.transport_compile:
    caller: internal
    reason: 换通道只改部署意图并重编，属运维动作：只在进程内可调，不对外暴露。
