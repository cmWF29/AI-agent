# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: host
routes:
  host.env:
    doc: 读一个环境变量
  host.executable:
    doc: 当前 Python 解释器路径
  host.profile:
    doc: 只读：节点环境 profile 快照（OS/CLI/包/环境变量/解释器）
    in:
      cli:
        type: any
        req: false
      pip:
        type: any
        req: false
      env:
        type: any
        req: false
      node:
        type: any
        req: false
    out:
      ok:
        type: bool
      profile:
        type: any
  host.readiness:
    doc: 工具就绪度：按依赖声明 vs 节点探针判 ready/missing_deps
    in:
      tool:
        type: any
        req: false
    out:
      ready:
        type: bool
      status:
        type: string
      missing:
        type: any
  host.importable:
    doc: 探测 Python 包当前解释器可否导入
  host.info:
    doc: 内存/磁盘/负载读数
  host.which:
    doc: 探测 CLI 命令是否在 PATH
