# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: hooks
routes:
  hooks.points:
    doc: 已声明的 hook 点
  hooks.emit:
    doc: 触发已声明的 hook 点；延迟点只入队，响应写完后由 http 收尾统一 drain
    in:
      name:
        type: str
        req: true
      payload:
        type: any
        req: false
      level:
        type: str
        req: false
