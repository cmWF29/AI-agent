checks:
- id: structure
  title: 模块结构契约（目录即规则）
  module: test_architecture
  kind: static
  enabled: true
- id: assembly
  title: 装配图与需求闭合
  module: test_boot_graph
  kind: static
  enabled: true
- id: language
  title: 需求语言与引擎
  module: test_demand_engine
  kind: static
  enabled: true
- id: transport
  title: 通信通道抽象
  module: test_transport
  kind: static
  enabled: true
- id: behaviour
  title: 运行时行为（真实装配 + HTTP）
  module: test_core
  kind: runtime
  enabled: true
  demands: []
