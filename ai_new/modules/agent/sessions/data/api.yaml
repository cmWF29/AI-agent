# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: sessions
routes:
  sessions.by_ticket:
    doc: 按工单归集全部会话视图：PM 与角色会话同一群聊流
    in:
      ticket:
        type: any
        req: false
    out:
      items:
        type: any
  sessions.emit_finished:
    doc: 一轮收尾落盘后触发 finished 钩子，后续业务由需求编排
    in:
      rec:
        type: any
        req: false
    out:
      ok:
        type: bool
  sessions.resume:
    doc: 启动续跑：遍历残留 running → 分类成形落盘/派发效果清单
    in:
      enabled:
        type: any
        req: false
      max:
        type: any
        req: false
      resume_text:
        type: any
        req: false
      stale_text:
        type: any
        req: false
    out:
      effects:
        type: any
      resumed:
        type: any
      stale:
        type: any
  sessions.scan_stuck:
    doc: 自愈扫描：僵死/停滞超阈值的 running 会话复位 idle，落盘效果交 apply
    in:
      enabled:
        type: any
        req: false
      idle_minutes:
        type: any
        req: false
      stale_text:
        type: any
        req: false
    out:
      effects:
        type: any
      keep:
        type: any
      stuck:
        type: any
  sessions.spawn:
