# 消息契约：cloud 模块每条云端能力收什么、回什么。
module: cloud
routes:
  cloud.providers:
    out:
      items: {type: list}
  cloud.profile_save:
    in:
      id: {type: str, req: true}
      company: {type: str, req: true}
      provider: {type: str, req: true}
      endpoint: {type: str, req: true}
      root_dir: {type: str, req: false}
      credential_ref: {type: str, req: false}
      credentials: {type: dict, req: false}
      # s3 通道凭证键（密封落盘，视图脱敏）：access_key / secret_key / region / bucket
      # webdav 通道凭证键：username / password / ca_bundle（自定义 CA 证书包路径）
      categories: {type: list, req: false}
      policy: {type: dict, req: false}
      # s3 通道策略键：multipart_threshold / multipart_min_size / part_max_bytes /
      # concurrency / rate_per_s
      # webdav 通道策略键：auth(basic/digest/auto) / upload_chunk_size / ca_bundle
      exclude_projects: {type: list, req: false}
      caller: {type: dict, req: false}
    out:
      ok: {type: bool}
      id: {type: str}
      view: {type: dict}
      effects: {type: list}
  cloud.profile_list:
    out:
      items: {type: list}
      active: {type: str}
  cloud.profile_get:
    in:
      id: {type: str, req: true}
    out:
      view: {type: dict}
  cloud.profile_switch:
    in:
      id: {type: str, req: true}
      caller: {type: dict, req: false}
    out:
      ok: {type: bool}
      id: {type: str}
      effects: {type: list}
  cloud.profile_delete:
    in:
      id: {type: str, req: true}
      caller: {type: dict, req: false}
    out:
      ok: {type: bool}
      id: {type: str}
      effects: {type: list}
  cloud.connection_test:
    in:
      id: {type: str, req: true}
      caller: {type: dict, req: false}
    out:
      ok: {type: bool}
      result: {type: dict}
      # result.code ∈ ok / signature_mismatch / access_denied / not_found /
      # rate_limited / transient / connection_error / provider_error
      effects: {type: list}
  cloud.probe_roundtrip:
    in:
      id: {type: str, req: true}
      caller: {type: dict, req: false}
    out:
      ok: {type: bool}
      verified: {type: bool}
      probe_key: {type: str}
      remote_digest: {type: str}
      expected_digest: {type: str}
      # 校验失败码：checksum_mismatch / signature_mismatch / access_denied / multipart_error
      effects: {type: list}
  cloud.sync_plan:
    in:
      id: {type: str, req: false}
    out:
      profile: {type: str}
      plan: {type: dict}
      local_count: {type: int}
  cloud.sync_run:
    in:
      id: {type: str, req: false}
      caller: {type: dict, req: false}
    out:
      ok: {type: bool}
      ledger: {type: dict}
      effects: {type: list}
  cloud.status:
    out:
      active: {type: str}
      configured: {type: bool}
      profile: {type: dict}
      last_run: {type: dict}
      counts: {type: dict}
  cloud.project_status:
    in:
      project: {type: str, req: true}
    out:
      project: {type: str}
      included: {type: bool}
      reason: {type: str}
  cloud.audit_list:
    in:
      limit: {type: int, req: false}
    out:
      items: {type: list}
