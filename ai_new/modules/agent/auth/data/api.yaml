# 消息契约：本模块每条能力收什么、回什么。
# 字段来自三处：代码静态抽取（handler 读/回的键）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: auth
routes:
  auth.change_password:
    doc: 修改密码：验旧密码→摘要校验→写配置新摘要
    in:
      confirm:
        type: any
        req: false
      new_password:
        type: any
        req: false
      old_password:
        type: any
        req: false
    out:
      code:
        type: any
      message:
        type: any
      ok:
        type: bool
      status:
        type: any
      username:
        type: any
  auth.login:
    doc: 登录闭环：配置→摘要比对→发会话→落盘→会话视图
    in:
      password:
        type: any
        req: false
      username:
        type: any
        req: false
    out:
      code:
        type: str
      message:
        type: any
      ok:
        type: bool
      status:
        type: int
      effects:
        type: any
  auth.status: {}
  auth.verify: {}
  auth.session_path:
    in:
      token:
        type: any
        req: false
    out:
      path:
        type: any
  auth.build_session: {}
  auth.credentials_ok: {}
  auth.password_check: {}
  auth.session_view: {}
