roles:
- id: architect
  cn: 架构
  prompt_file: roles/architect.md
  must_outputs:
  - docs/**/*architect*
  - docs/**/*架构*
  must_dos:
  - 输出结构设计文档（模块划分、接口、数据流、规则变更）并落到任务指定路径
  - 引用现有文件时给出证据与文件路径
  - 关键设计决策与踩坑写入知识
  forbidden:
  - 不直接改业务代码实现
  - 不越出工单范围改动文件
  - 不替测试下验收结论
  tools:
  - artifact_read
  - artifact_write
  - knowledge_read
  - knowledge_write
  - knowledge_search
  - ticket_read_doc
  - ticket_note
  backend: ''
  builtin: true
- id: developer
  cn: 开发
  prompt_file: roles/developer.md
  must_outputs:
  - '**/*.py'
  - '**/*.js'
  - '**/*.go'
  - '**/*.sh'
  must_dos:
  - 按验收标准实现并交付代码产物
  - 改完自己跑一遍验证，写明验证命令与结果
  - 改动点、验证结果与坑写入交接文档和知识
  forbidden:
  - 不为凑清单创建项目里不存在的语言文件
  - 不改工单范围外的文件
  - 不自验通过就宣称完成
  tools:
  - artifact_read
  - artifact_write
  - knowledge_read
  - knowledge_write
  - knowledge_search
  - ticket_read_doc
  - ticket_note
  backend: ''
  builtin: true
- id: reviewer
  cn: 评审
  prompt_file: roles/reviewer.md
  must_outputs:
  - docs/**/*review*
  - docs/**/*评审*
  must_dos:
  - 逐条对照验收标准给出评审结论并落文档
  forbidden:
  - 不改业务代码
  - 不替开发补实现
  tools:
  - artifact_read
  - knowledge_read
  - ticket_read_doc
  - ticket_note
  backend: ''
  builtin: true
- id: tester
  cn: 测试
  prompt_file: roles/tester.md
  must_outputs:
  - tests/**/*.py
  - tests/**/*.md
  must_dos:
  - 交付测试用例或脚本并跑通，记录结果
  forbidden:
  - 不改业务实现逻辑
  - 不隐藏或跳过失败用例
  tools:
  - artifact_read
  - artifact_write
  - knowledge_read
  - knowledge_write
  - ticket_read_doc
  - ticket_note
  backend: ''
  builtin: true
- id: ops
  cn: 运维
  prompt_file: roles/ops.md
  must_outputs:
  - docs/**/*.md
  must_dos:
  - 给出部署或恢复方案文档
  forbidden:
  - 不在被审计工单上直接改动其产物
  tools:
  - artifact_read
  - knowledge_read
  - knowledge_search
  - ticket_read_doc
  backend: ''
  builtin: true
- id: researcher
  cn: 调研
  prompt_file: roles/researcher.md
  must_outputs:
  - docs/**/*.md
  must_dos:
  - 输出调研结论文档并标注来源
  forbidden:
  - 不把调研结论当成已落地实现
  tools:
  - artifact_read
  - knowledge_read
  - knowledge_search
  - ticket_read_doc
  backend: ''
  builtin: true
- id: writer
  cn: 文案
  prompt_file: roles/writer.md
  must_outputs:
  - docs/**/*.md
  must_dos:
  - 交付对应文案文档
  forbidden:
  - 不改技术实现
  tools:
  - artifact_read
  - artifact_write
  - knowledge_read
  - ticket_read_doc
  backend: ''
  builtin: true
- id: process
  cn: 流程专家
  prompt_file: roles/process.md
  must_outputs:
  - docs/**/*.yaml
  - docs/**/*.md
  must_dos:
  - 输出流程或规则配置文档
  forbidden:
  - 不改业务代码
  tools:
  - artifact_read
  - artifact_write
  - knowledge_read
  - ticket_read_doc
  backend: ''
  builtin: true
- id: skill-decomposer
  cn: 拆解者
  prompt_file: roles/skill-decomposer.md
  must_outputs:
  - docs/**/*拆解*
  - docs/**/*.yaml
  must_dos:
  - 把外部 Skill.md 包拆成岗位角色、引用工具、流程规则三要素
  - 工具只引用注册表已有项，名单外的不写
  - 拆解结果直接入库为一个 Skill 单元，岗位/流程/工具归到同一标识下
  forbidden:
  - 流程拆不出就留空数组，不硬造检查项或流程节点
  - 不引用注册表之外的工具
  - 不改业务代码
  tools:
  - artifact_read
  - knowledge_read
  - knowledge_search
  - ticket_read_doc
  - ticket_note
  backend: ''
  builtin: true
flows:
- id: architect
  role: architect
  checks:
  - kind: glob
    paths:
    - docs/**/*architect*
    - docs/**/*架构*
    match: any
    min_bytes: 80
- id: developer
  role: developer
  checks:
  - kind: glob
    paths:
    - '**/*.py'
    - '**/*.js'
    - '**/*.go'
    - '**/*.sh'
    match: any
    min_bytes: 80
- id: reviewer
  role: reviewer
  checks:
  - kind: glob
    paths:
    - docs/**/*review*
    - docs/**/*评审*
    match: any
    min_bytes: 80
- id: tester
  role: tester
  checks:
  - kind: glob
    paths:
    - tests/**/*.py
    - tests/**/*.md
    match: any
    min_bytes: 80
- id: ops
  role: ops
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
- id: researcher
  role: researcher
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
- id: writer
  role: writer
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
- id: process
  role: process
  checks:
  - kind: glob
    paths:
    - docs/**/*.yaml
    - docs/**/*.md
    match: any
    min_bytes: 80
- id: skill-decomposer
  role: skill-decomposer
  checks:
  - kind: glob
    paths:
    - docs/**/*拆解*
    - docs/**/*.yaml
    match: any
    min_bytes: 80
- id: requirement-owner
  kind: process
  nodes:
  - req.intake
  - req.structure
  - req.plan
  - req.split
  - req.execute
  - req.accept
  - req.close
  edges:
  - - req.intake
    - req.structure
  - - req.structure
    - req.plan
  - - req.plan
    - req.split
  - - req.split
    - req.execute
  - - req.execute
    - req.accept
  - - req.accept
    - req.close
- id: ticket-health
  kind: process
  nodes:
  - scan.run
  - scan.judge
  - scan.audit
  - ops.diagnose
  - ops.recover
  - audit.close
  edges:
  - - scan.run
    - scan.judge
  - - scan.judge
    - scan.audit
  - - scan.audit
    - ops.diagnose
  - - ops.diagnose
    - ops.recover
  - - ops.recover
    - audit.close
