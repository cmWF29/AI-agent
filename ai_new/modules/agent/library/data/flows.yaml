requirement-owner:
  id: requirement-owner
  kind: process
  states:
  - id: req.intake
    next:
    - req.structure
  - id: req.structure
    next:
    - req.plan
  - id: req.plan
    next:
    - req.split
  - id: req.split
    next:
    - req.execute
  - id: req.execute
    next:
    - req.accept
  - id: req.accept
    next:
    - req.close
  - id: req.close
    next: []
    terminal: true
  builtin: true
ticket-health:
  id: ticket-health
  kind: process
  states:
  - id: scan.run
    next:
    - scan.judge
  - id: scan.judge
    next:
    - scan.audit
  - id: scan.audit
    next:
    - ops.diagnose
  - id: ops.diagnose
    next:
    - ops.recover
  - id: ops.recover
    next:
    - audit.close
  - id: audit.close
    next: []
    terminal: true
  builtin: true
