architect:
  id: architect
  role: architect
  checks:
  - kind: glob
    paths:
    - docs/**/*architect*
    - docs/**/*架构*
    match: any
    min_bytes: 80
  builtin: true
developer:
  id: developer
  role: developer
  checks:
  - kind: glob
    paths:
    - '**/*.py'
    - '**/*.js'
    - '**/*.go'
    - '**/*.sh'
    match: any
    min_bytes: 80
  builtin: true
reviewer:
  id: reviewer
  role: reviewer
  checks:
  - kind: glob
    paths:
    - docs/**/*review*
    - docs/**/*评审*
    match: any
    min_bytes: 80
  builtin: true
tester:
  id: tester
  role: tester
  checks:
  - kind: glob
    paths:
    - tests/**/*.py
    - tests/**/*.md
    match: any
    min_bytes: 80
  builtin: true
ops:
  id: ops
  role: ops
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
researcher:
  id: researcher
  role: researcher
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
writer:
  id: writer
  role: writer
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
process:
  id: process
  role: process
  checks:
  - kind: glob
    paths:
    - docs/**/*.yaml
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
skill-decomposer:
  id: skill-decomposer
  role: skill-decomposer
  checks:
  - kind: glob
    paths:
    - docs/**/*拆解*
    - docs/**/*.yaml
    match: any
    min_bytes: 80
  builtin: true
requirement-owner:
  id: requirement-owner
  kind: process
  nodes:
  - req.intake
  - req.structure
  - req.plan
  - req.split
  - req.execute
  - req.accept
  - req.close
  edges:
  - - req.intake
    - req.structure
  - - req.structure
    - req.plan
  - - req.plan
    - req.split
  - - req.split
    - req.execute
  - - req.execute
    - req.accept
  - - req.accept
    - req.close
  builtin: true
ticket-health:
  id: ticket-health
  kind: process
  nodes:
  - scan.run
  - scan.judge
  - scan.audit
  - ops.diagnose
  - ops.recover
  - audit.close
  edges:
  - - scan.run
    - scan.judge
  - - scan.judge
    - scan.audit
  - - scan.audit
    - ops.diagnose
  - - ops.diagnose
    - ops.recover
  - - ops.recover
    - audit.close
  builtin: true
