architect:
  id: architect
  role: architect
  checks:
  - kind: glob
    paths:
    - docs/**/*architect*
    - docs/**/*架构*
    match: any
    min_bytes: 80
  builtin: true
developer:
  id: developer
  role: developer
  checks:
  - kind: glob
    paths:
    - '**/*.py'
    - '**/*.js'
    - '**/*.go'
    - '**/*.sh'
    match: any
    min_bytes: 80
  builtin: true
reviewer:
  id: reviewer
  role: reviewer
  checks:
  - kind: glob
    paths:
    - docs/**/*review*
    - docs/**/*评审*
    match: any
    min_bytes: 80
  builtin: true
tester:
  id: tester
  role: tester
  checks:
  - kind: glob
    paths:
    - tests/**/*.py
    - tests/**/*.md
    match: any
    min_bytes: 80
  builtin: true
ops:
  id: ops
  role: ops
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
researcher:
  id: researcher
  role: researcher
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
writer:
  id: writer
  role: writer
  checks:
  - kind: glob
    paths:
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
process:
  id: process
  role: process
  checks:
  - kind: glob
    paths:
    - docs/**/*.yaml
    - docs/**/*.md
    match: any
    min_bytes: 80
  builtin: true
skill-decomposer:
  id: skill-decomposer
  role: skill-decomposer
  checks:
  - kind: glob
    paths:
    - docs/**/*拆解*
    - docs/**/*.yaml
    match: any
    min_bytes: 80
  builtin: true
requirement-owner:
  id: requirement-owner
  kind: process
  states:
  - id: req.intake
    next: [req.structure]
  - id: req.structure
    next: [req.plan]
  - id: req.plan
    next: [req.split]
  - id: req.split
    next: [req.execute]
  - id: req.execute
    next: [req.accept]
  - id: req.accept
    next: [req.close]
  - id: req.close
    next: []
    terminal: true
  builtin: true
ticket-health:
  id: ticket-health
  kind: process
  states:
  - id: scan.run
    next: [scan.judge]
  - id: scan.judge
    next: [scan.audit]
  - id: scan.audit
    next: [ops.diagnose]
  - id: ops.diagnose
    next: [ops.recover]
  - id: ops.recover
    next: [audit.close]
  - id: audit.close
    next: []
    terminal: true
  builtin: true
