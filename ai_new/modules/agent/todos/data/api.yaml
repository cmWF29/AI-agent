# 消息契约：本模块每条能力收什么、回什么。
# 字段来自：代码静态抽取（handler 读/回的键，含一层转调）、需求 with 键、需求里消费的 as.字段；
# api 模块装配后据此校验入参（config api.contract_mode），架构闸据此断言路由必须有契约。
module: todos
routes:
  todos.apply:
    in:
      ops:
        type: list
        req: true
      limit:
        type: int
        req: false
      args:
        type: any
        req: false
      todos:
        type: any
        req: false
    out:
      ok:
        type: bool
      todos:
        type: list
      changed:
        type: bool
  todos.context:
    in:
      todos:
        type: list
        req: false
      tpl:
        type: dict
        req: false
      limit:
        type: int
        req: false
    out:
      text:
        type: str
      count:
        type: int
      message:
        type: any
