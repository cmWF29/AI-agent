<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive AI · 控制台</title>
<style>
:root{color-scheme:light dark;--fg:#1d2129;--bg:#f7f8fa;--card:#fff;--line:#e5e6eb;--accent:#1664ff}
@media (prefers-color-scheme:dark){:root{--fg:#e5e6eb;--bg:#17171a;--card:#1f1f24;--line:#2f2f36;--accent:#6aa1ff}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,"PingFang SC",sans-serif;color:var(--fg);background:var(--bg)}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:16px;margin:0}
header .meta{opacity:.7;font-size:12px}
main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.2fr);gap:16px;padding:16px 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
section h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{opacity:.6;font-weight:500}
select,textarea,input{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:6px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
pre{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:280px;overflow:auto;margin:0}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.muted{opacity:.6;font-size:12px}
</style>
</head>
<body>
<header>
  <h1 id="title">Hive AI · 控制台</h1>
  <span class="meta" id="meta"></span>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <input id="token" placeholder="令牌（本地可留空）" style="width:200px">
    <button id="save">保存令牌</button>
    <button id="refresh">刷新</button>
  </div>
</header>
<main>
  <section>
    <h2>装配</h2>
    <div class="tabs">
      <button data-view="modules" aria-selected="true">模块</button>
      <button data-view="hooks">扩展点</button>
      <button data-view="demands">需求</button>
    </div>
    <div id="view"></div>
  </section>
  <section>
    <h2>调用任何能力</h2>
    <div class="muted">选一条路由、填一段 JSON。控制台不认识业务，业务在路由和数据里。</div>
    <div style="margin:10px 0"><select id="route"></select></div>
    <textarea id="payload" placeholder='{}'>{}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="primary" id="send">发送</button>
      <button id="clear">清空结果</button>
    </div>
    <div style="margin-top:12px"><pre id="result"></pre></div>
  </section>
  <section style="grid-column:1/-1">
    <h2>日志（ops 自己的数据）</h2>
    <pre id="logs"></pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("ai_new_token") || "";
const headers = () => ({ "Content-Type": "application/json", "X-Auth-Token": token() });

async function get(path) {
  const r = await fetch(path, { headers: headers() });
  return r.json();
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: headers(), body: JSON.stringify(body || {}) });
  return r.json();
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

let state = { info: null, modules: null, hooks: null, demands: null, view: "modules" };

async function load() {
  const [info, modules, hooks, demands, logs] = await Promise.all([
    get("/api/web/info"), get("/api/modules"), get("/api/hooks/points"),
    get("/api/demand_engine/list"), get("/api/ops/logs?lines=40"),
  ]);
  state.info = info.ok ? info : null;
  state.modules = modules;
  state.hooks = hooks;
  state.demands = demands;
  $("title").textContent = (info.name || "Hive AI") + " · 控制台";
  $("meta").textContent = "版本 " + (info.version || "?") + " · 模块 " + (info.modules || []).length
    + " · 路由 " + (info.routes || 0);
  $("logs").textContent = JSON.stringify((logs.events || []).slice(-20), null, 1);
  render();
}

function render() {
  const view = $("view");
  if (state.view === "modules") {
    const routes = state.modules.routes || state.modules || [];
    const rows = routes.map((r) => `<tr><td>${esc(r.route || r.name || r)}</td><td class="muted">${esc(r.description || r.desc || "")}</td></tr>`).join("");
    view.innerHTML = `<table><thead><tr><th>路由</th><th>说明</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else if (state.view === "hooks") {
    const points = state.hooks.points || state.hooks || [];
    view.innerHTML = `<table><tbody>${points.map((p) => `<tr><td>${esc(p.name || p)}</td><td class="muted">${esc((p.emitters || []).join(", "))}</td></tr>`).join("")}</tbody></table>`;
  } else {
    const items = state.demands.items || state.demands || [];
    view.innerHTML = `<table><tbody>${items.map((d) => `<tr><td>${esc(d.id)}</td><td class="muted">${esc((d.on || []).join(", "))}</td></tr>`).join("")}</tbody></table>`;
  }
}

async function fillRoutes() {
  const data = await get("/api/modules");
  const routes = data.routes || data || [];
  $("route").innerHTML = routes.map((r) => {
    const name = r.route || r.name || r;
    return `<option value="${esc(name)}">${esc(name)}${r.description ? " · " + esc(r.description) : ""}</option>`;
  }).join("");
}

$("save").onclick = () => { localStorage.setItem("ai_new_token", $("token").value.trim()); load(); };
$("refresh").onclick = load;
$("clear").onclick = () => { $("result").textContent = ""; };
$("send").onclick = async () => {
  const route = $("route").value; let body = {};
  try { body = JSON.parse($("payload").value || "{}"); }
  catch (e) { $("result").textContent = "载荷不是合法 JSON：" + e.message; return; }
  const path = "/api/" + route.replace(".", "/");
  $("result").textContent = "POST " + path + "\n" + JSON.stringify(await post(path, body), null, 1);
};
document.querySelectorAll("[data-view]").forEach((b) => {
  b.onclick = () => {
    state.view = b.dataset.view;
    document.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-selected", x === b ? "true" : "false"));
    render();
  };
});
$("token").value = token();
load(); fillRoutes();
</script>
</body>
</html>
