<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive AI · 项目与工单</title>
<style>
:root{
  color-scheme:light;
  --fg:#1f2329;--fg-2:#4e5969;--muted:#86909c;
  --bg:#f2f4f8;--card:#ffffff;--line:#e7e9ef;--line-2:#f0f1f5;
  --accent:#2f6bff;--accent-weak:rgba(47,107,255,.10);
  --ok:#00b42a;--warn:#ff7d00;--danger:#f53f3f;--purple:#722ed1;--teal:#0fc6c2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--fg:#e5e6eb;--fg-2:#c9cdd4;--muted:#8b90a0;
    --bg:#141519;--card:#1d1e24;--line:#2e3038;--line-2:#26272e;
    --accent:#6aa1ff;--accent-weak:rgba(106,161,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--fg);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}

/* ---- 顶栏 ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f6bff,#722ed1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.brand h1{font-size:15px;margin:0;line-height:1.2}
.brand .sub{font-size:12px;color:var(--muted)}
.topbar .spacer{margin-left:auto}

/* ---- 布局 ---- */
main{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:16px 22px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--fg-2);letter-spacing:.02em}
.full{grid-column:1/-1}

/* ---- 表单 ---- */
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.full-field{margin-bottom:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---- 按钮 ---- */
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;transition:background .15s,border-color .15s,opacity .15s}
button:hover:not(:disabled){background:var(--line-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:#2457e0}
button.danger{color:var(--danger);border-color:rgba(245,63,63,.4)}
button.danger:hover:not(:disabled){background:rgba(245,63,63,.08)}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
.actions button{padding:5px 10px;font-size:12.5px;border-radius:8px}

/* ---- 徽章 / 标签 ---- */
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px}
.badge.closed,.badge.gone{color:var(--ok);border-color:rgba(0,180,42,.4)}
.badge.archived{color:var(--warn);border-color:rgba(255,125,0,.4)}
.badge.running{color:var(--accent);border-color:rgba(47,107,255,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg-2)}

/* ---- 分级树 ---- */
.tree{margin-top:4px;display:flex;flex-direction:column;gap:10px}
.proj{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.proj-head{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.proj-head .caret{width:14px;display:inline-block;transition:transform .15s;color:var(--muted)}
.proj.open .caret{transform:rotate(90deg)}
.proj-head .pname{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-head .cnt{font-size:12px;color:var(--muted)}
.proj-body{display:none;border-top:1px solid var(--line-2)}
.proj.open .proj-body{display:block}
.ticket-row{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 34px;cursor:pointer;border-top:1px solid var(--line-2)}
.ticket-row:hover{background:var(--line-2)}
.ticket-row.active{background:var(--accent-weak)}
.ticket-row .t-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orphans{margin-top:10px;display:flex;flex-direction:column;gap:6px}

/* ---- 群聊 ---- */
.chat-card{display:flex;flex-direction:column;min-height:560px}
.chat-head{padding-bottom:12px;border-bottom:1px solid var(--line-2)}
.chat-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.chat-title .muted{font-weight:400}
.chat-head .chips{margin-top:8px}
.chat{display:flex;flex-direction:column;gap:16px;flex:1;min-height:320px;max-height:54vh;overflow-y:auto;padding:16px 4px}
.msg{display:flex;gap:10px;max-width:74%}
.msg.right{align-self:flex-end;flex-direction:row-reverse}
.msg.left{align-self:flex-start}
.avatar{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;background:var(--av,#86909c)}
.msg-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.right .msg-main{align-items:flex-end}
.msg-name{font-size:12px;color:var(--muted);padding:0 4px}
.bubble-stack{display:flex;flex-direction:column;gap:6px}
.bubble-body{padding:9px 13px;border-radius:12px;background:var(--line-2);border:1px solid var(--line-2);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.msg.right .bubble-body{background:var(--accent);border-color:var(--accent);color:#fff;border-top-right-radius:4px}
.msg.left .bubble-body{border-top-left-radius:4px}
.msg-ts{font-size:11px;color:var(--muted);padding:0 4px}
.msg.system{align-self:center;max-width:90%}
.msg.system .sys-body{font-size:12px;color:var(--muted);text-align:center}
.chat-empty{margin:auto;color:var(--muted)}
.composer{display:flex;gap:8px;margin-top:12px}
.composer textarea{flex:1;min-height:46px}
.composer button{flex:none}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{color:var(--muted);font-weight:500}

#status{margin-top:10px;font-size:12px;color:var(--muted)}
#banner{margin:14px 22px 0;padding:10px 14px;border-radius:12px;font-size:13px;display:none}
#banner.err{display:block;background:rgba(245,63,63,.08);color:var(--danger);border:1px solid rgba(245,63,63,.3)}
#banner.ok{display:block;background:rgba(0,180,42,.08);color:var(--ok);border:1px solid rgba(0,180,42,.3)}
details{margin-top:6px}
details summary{font-size:12px;color:var(--muted);cursor:pointer}

@media (max-width:960px){main{grid-template-columns:1fr}.msg{max-width:88%}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">H</span><div><h1>Hive AI</h1><div class="sub">项目 · 工单 · 会话</div></div></div>
  <div class="spacer"></div>
  <button id="logout" class="ghost">登出</button>
</header>
<div id="banner"></div>
<main>
  <aside class="side">
    <section class="card">
      <h2>新建项目</h2>
      <form id="proj-form">
        <div class="full-field"><label>项目名称</label><input id="p-name" placeholder="例如：官网重构" required></div>
        <div class="actions"><button class="primary" type="submit">新建项目</button>
          <button type="button" id="p-refresh">刷新</button></div>
      </form>
    </section>

    <section class="card">
      <h2>新建工单</h2>
      <form id="ticket-form">
        <div class="row">
          <div><label>标题</label><input id="t-title" placeholder="工单标题" required></div>
          <div><label>所属项目</label><select id="t-project" required></select></div>
        </div>
        <div class="full-field"><label>需求目标</label><textarea id="t-goal" placeholder="要做什么、验收标准是什么"></textarea></div>
        <details>
          <summary>高级选项</summary>
          <div class="row" style="margin-top:8px">
            <div><label>类型</label><select id="t-kind">
              <option value="normal">普通</option>
              <option value="stall-audit">停滞审计</option>
            </select></div>
            <div><label>父工单（可选）</label><input id="t-parent" placeholder="父工单 ID"></div>
          </div>
        </details>
        <div class="actions" style="margin-top:10px"><button class="primary" type="submit">建工单</button></div>
      </form>
    </section>

    <section class="card">
      <h2>项目 / 工单（分级）</h2>
      <div class="tree" id="tree"></div>
    </section>
  </aside>

  <section class="card chat-card">
    <div class="chat-head">
      <div class="chat-title" id="thread-meta"><span class="muted">从左侧项目展开后选择一个工单</span></div>
      <div class="chips" id="thread-roles"></div>
    </div>
    <div class="chat" id="chat"><div class="chat-empty">还没有消息</div></div>
    <div class="composer">
      <textarea id="op-text" placeholder="发给 PM 的消息，Enter 发送"></textarea>
      <button class="primary" id="op-message">发送</button>
    </div>
    <div class="actions" style="margin-top:10px">
      <button id="op-note">追加备注</button>
      <button id="op-close" class="danger">结单</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="card full">
    <h2>岗位库（岗位 = 系统提示词 + 流程规范；角色是岗位的实例）</h2>
    <table>
      <thead><tr><th>名称</th><th>流程检查</th></tr></thead>
      <tbody id="position-rows"></tbody>
    </table>
  </section>
</main>
<script src="/assets/js-yaml.min.js"></script>
<script>
async function readYaml(resp){return jsyaml.load(await resp.text())||{};}
function yamlBody(o){return jsyaml.dump(o,{flowLevel:Infinity,noRefs:true,sortKeys:false});}
const $ = (id) => document.getElementById(id);
function readCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}
const token = () => localStorage.getItem("ai_new_token") || readCookie("hive_token") || "";
function clearToken() {
  localStorage.removeItem("ai_new_token");
  sessionStorage.removeItem("hive.token");
  document.cookie = "hive_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
}
function headers() {
  const h = { "Content-Type": "application/yaml" };
  if (token()) h["X-Auth-Token"] = token();
  return h;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const ticketMap = {};
let selId = "";

async function run(demand, input) {
  let resp, body;
  try {
    resp = await fetch("/api/rpc/demand_engine/run", {
      method: "POST", headers: headers(),
      body: yamlBody({ id: demand, input: input || {} })
    });
    body = await readYaml(resp).catch(() => ({ ok: false, error: "响应不是 YAML", code: "bad_yaml" }));
  } catch (e) {
    throw Object.assign(new Error("网络请求失败：" + e.message), { status: 0, code: "network" });
  }
  if (!body.ok) {
    if (resp.status === 401 || body.code === "unauthorized") { clearToken(); location.href = "/login.html"; return; }
    throw Object.assign(new Error(body.error || ("HTTP " + resp.status)),
      { status: resp.status, code: body.code });
  }
  const inner = (body.result && body.result.result) || {};
  if (inner && inner.ok === false) {
    if (resp.status === 401 || inner.code === "unauthorized") { clearToken(); location.href = "/login.html"; return; }
    throw Object.assign(new Error(inner.error || inner.code || "需求失败"),
      { status: resp.status, code: inner.code });
  }
  return inner;
}
function banner(msg, kind) {
  const el = $("banner");
  if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
  el.className = kind === "ok" ? "ok" : "err";
  el.textContent = msg;
}
function status(text) { $("status").textContent = text; }
function gateMessage(err) {
  if (err && (err.status === 401 || err.code === "unauthorized")) return "登录已失效（401），请重新登录。";
  return (err && err.message) || "操作失败";
}
async function withBusy(btn, fn) {
  if (btn) { btn.disabled = true; }
  try { return await fn(); }
  finally { if (btn) btn.disabled = false; }
}
function actBtn(act, id, label, disabled, cls, tip) {
  const attrs = disabled ? 'disabled title="' + esc(tip || "当前状态不可用") + '"' : "";
  const clsAttr = cls ? 'class="' + cls + '"' : "";
  return `<button ${clsAttr} data-act="${act}" data-id="${esc(id)}" ${attrs}>${label}</button>`;
}

const ROLE_CN = { pm: "PM", user: "用户", assistant: "助手", system: "系统" };
const AVATAR_PALETTE = ["#2f6bff", "#00b42a", "#ff7d00", "#722ed1", "#0fc6c2", "#f53f3f", "#eb0aa4"];
function speakerOf(msg, roles) {
  const role = msg.role || "assistant";
  if (role === "user") return "用户";
  if (role === "system") return "系统";
  if (role === "pm" || role === "assistant") return ROLE_CN[role] || role;
  const hit = (roles || []).find((r) => r.role === role || r.session === role);
  return (hit && (hit.display || hit.role)) || role;
}
function bubbleClass(msg) {
  const role = msg.role || "assistant";
  if (role === "user") return "user";
  if (role === "system") return "system";
  if (role === "assistant" || role === "pm") return "assistant";
  return "role";
}
function avatarColor(name) {
  let h = 0;
  for (const ch of String(name || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function initial(name) {
  const s = String(name || "?").trim();
  return s ? esc(s[0]) : "?";
}

// ---- 分级树：项目 → 工单 ----
async function loadTree() {
  const tree = await run("project-tree", {});
  const items = tree.items || [];
  const orphans = tree.orphans || [];
  Object.keys(ticketMap).forEach((k) => delete ticketMap[k]);
  items.forEach((n) => (n.tickets || []).forEach((t) => { ticketMap[t.id] = t; }));
  orphans.forEach((t) => { ticketMap[t.id] = t; });

  const projOpts = ['<option value="">（选择项目）</option>']
    .concat(items.map((n) => `<option value="${esc(n.project.id)}">${esc(n.project.name || n.project.id)}</option>`));
  $("t-project").innerHTML = projOpts.join("");

  const html = items.map((n) => {
    const p = n.project;
    const tickets = (n.tickets || []).map((t) => ticketRow(t)).join("")
      || '<div class="ticket-row muted" style="cursor:default">暂无工单</div>';
    return `
    <div class="proj" data-proj="${esc(p.id)}">
      <div class="proj-head" data-proj-head="${esc(p.id)}">
        <span class="caret">▶</span>
        <span class="pname">${esc(p.name || p.id)}</span>
        <span class="cnt">${(n.tickets || []).length} 工单</span>
        <span class="actions">
          ${actBtn("archive", p.id, "归档", !!p.archived, "", "项目已归档")}
          ${actBtn("del", p.id, "删除", false, "danger")}
        </span>
      </div>
      <div class="proj-body">${tickets}</div>
    </div>`;
  }).join("");
  const orphanHtml = orphans.length
    ? `<div class="orphans"><div class="muted">未归属工单</div>` +
      orphans.map((t) => ticketRow(t)).join("") + "</div>" : "";
  $("tree").innerHTML = html + orphanHtml || '<div class="muted">暂无项目</div>';
}

function ticketRow(t) {
  const closed = t.status === "closed";
  const badge = closed ? '<span class="badge closed">closed</span>'
    : `<span class="badge ${esc(t.status)}">${esc(t.status || "")}</span>`;
  const active = t.id === selId ? " active" : "";
  return `<div class="ticket-row${active}" data-ticket="${esc(t.id)}">
    <span class="t-title">${esc(t.title || t.id)}</span>${badge}</div>`;
}

$("proj-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const rec = await run("projects-create", {
      name: $("p-name").value.trim(), default_backend: ""
    });
    banner(""); status("已建项目：" + (rec.id || ""));
    $("p-name").value = "";
    await loadTree();
  } catch (err) { banner(gateMessage(err), "err"); status("项目创建失败：" + err.message); }
};
$("p-refresh").onclick = () => loadTree().catch((e) => banner(gateMessage(e), "err"));

$("tree").onclick = async (e) => {
  const head = e.target.closest("[data-proj-head]");
  if (head) { head.closest(".proj").classList.toggle("open"); return; }
  const btn = e.target.closest("button");
  if (btn && !btn.disabled) {
    const id = btn.dataset.id;
    try {
      if (btn.dataset.act === "archive") { await withBusy(btn, () => run("projects-archive", { id })); status("已归档：" + id); }
      else if (btn.dataset.act === "del") {
        if (!confirm("彻底删除项目 " + id + "？")) return;
        await withBusy(btn, () => run("projects-delete", { id, purge: true })); status("已删除：" + id);
      }
      await loadTree();
    } catch (err) { banner(gateMessage(err), "err"); status("操作失败：" + err.message); }
    return;
  }
  const row = e.target.closest("[data-ticket]");
  if (row) { await openTicket(row.dataset.ticket); }
};

$("ticket-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const rec = await run("ticket-create", {
      title: $("t-title").value.trim(), goal: $("t-goal").value.trim(),
      project: $("t-project").value, kind: $("t-kind").value, parent: $("t-parent").value.trim()
    });
    banner(""); status("已建工单：" + (rec.id || ""));
    $("t-title").value = ""; $("t-goal").value = ""; $("t-parent").value = "";
    await loadTree();
    if (rec.id) await openTicket(rec.id);
  } catch (err) { banner(gateMessage(err), "err"); status("工单创建失败：" + err.message); }
};

// ---- 工单主会话（1:1 业务会话）----
async function openTicket(id) {
  selId = id;
  let th;
  try { th = await run("ticket-thread", { id }); }
  catch (err) { banner(gateMessage(err), "err"); status("加载工单会话失败：" + err.message); return; }
  const t = th.ticket || {};
  $("thread-meta").innerHTML =
    `<strong>${esc(t.title || id)}</strong><span class="muted">${esc(t.id || "")}</span>` +
    `<span class="badge ${esc(t.status || "")}">${esc(t.status || "")}</span>`;
  const roles = th.roles || [];
  $("thread-roles").innerHTML = roles.map((r) =>
    `<span class="chip">${esc(r.display || r.role)} · ${esc(r.status || "")}</span>`).join("");
  renderChat(th.thread || {}, roles);
  syncOps();
  loadTree().catch(() => {});
}

function renderChat(thread, roles) {
  const msgs = thread.messages || [];
  const list = $("chat");
  if (!msgs.length) { list.innerHTML = '<div class="chat-empty">还没有消息</div>'; return; }

  // 连续同发言人合并为一组：头像、昵称只在组首出现
  const groups = [];
  msgs.forEach((m) => {
    const cls = bubbleClass(m);
    const who = cls === "system" ? "" : speakerOf(m, roles);
    const key = cls + "|" + who;
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.msgs.push(m);
    else groups.push({ key, cls, who, msgs: [m] });
  });

  list.innerHTML = groups.map((g) => {
    if (g.cls === "system") {
      return g.msgs.map((m) =>
        `<div class="msg system"><div class="sys-body">${esc(m.content == null ? "" : m.content)}</div></div>`
      ).join("");
    }
    const side = g.cls === "user" ? "right" : "left";
    const av = `<div class="avatar" style="--av:${avatarColor(g.who)}">${initial(g.who)}</div>`;
    const bodies = g.msgs.map((m) =>
      `<div class="bubble-body">${esc(m.content == null ? "" : m.content)}</div>`).join("");
    const last = g.msgs[g.msgs.length - 1];
    const ts = last.ts ? `<div class="msg-ts">${new Date(last.ts).toLocaleTimeString()}</div>` : "";
    return `<div class="msg ${side}">${side === "left" ? av : ""}
      <div class="msg-main"><div class="msg-name">${esc(g.who)}</div>
      <div class="bubble-stack">${bodies}</div>${ts}</div>${side === "right" ? av : ""}</div>`;
  }).join("");
  list.scrollTop = list.scrollHeight;
}

function syncOps() {
  const t = ticketMap[selId];
  const closed = !!(t && t.status === "closed");
  $("op-note").disabled = closed;
  $("op-message").disabled = closed;
  $("op-close").disabled = closed;
}

$("op-note").onclick = async () => {
  if (!selId) return;
  const text = $("op-text").value.trim();
  if (!text) return;
  try { await run("ticket-note", { id: selId, text }); status("备注已追加"); $("op-text").value = ""; await openTicket(selId); }
  catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};
$("op-message").onclick = async () => {
  if (!selId) return;
  const text = $("op-text").value.trim();
  if (!text) return;
  try { await run("ticket-message", { id: selId, text, target: "pm" }); status("已通知 PM"); $("op-text").value = ""; await openTicket(selId); }
  catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};
$("op-close").onclick = async () => {
  if (!selId) return;
  const summary = prompt("结单摘要：");
  if (summary == null) return;
  const verdict = prompt("验收结论（可选，通过/驳回）：") || "";
  try {
    await run("ticket-close", { id: selId, summary, verdict });
    status("已结单"); await openTicket(selId);
  } catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};

// ---- 岗位库 ----
async function loadPositions() {
  const list = await run("position-list", {});
  const items = list.items || [];
  $("position-rows").innerHTML = items.map((p) => {
    const checks = (p.flow && p.flow.checks) || [];
    const name = p.cn || p.id;
    return `<tr><td>${esc(name)}</td><td class="muted">${checks.length} 项流程检查</td></tr>`;
  }).join("") || '<tr><td colspan="2" class="muted">暂无岗位</td></tr>';
}

$("logout").onclick = async () => {
  try { await run("auth-logout", { token: token() }); } catch (e) {}
  clearToken(); location.href = "/login.html";
};

async function boot() {
  let st = { enabled: false };
  try { const r = await fetch("/api/auth/status"); const _j = await readYaml(r); st = _j.result || _j || {}; } catch (e) {}
  if (st.enabled && !token()) { location.href = "/login.html"; return; }
  const errors = [];
  for (const step of [loadTree, loadPositions]) {
    try { await step(); } catch (e) { errors.push(gateMessage(e)); }
  }
  if (errors.length) banner(errors[0], "err"); else banner("");
}
boot();
</script>
</body>
</html>
