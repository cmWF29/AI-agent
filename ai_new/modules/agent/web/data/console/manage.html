<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive AI · 项目与工单</title>
<style>
:root{
  color-scheme:light;
  --fg:#1f2329;--fg-2:#4e5969;--muted:#86909c;
  --bg:#f2f4f8;--card:#ffffff;--line:#e7e9ef;--line-2:#f0f1f5;
  --accent:#2f6bff;--accent-weak:rgba(47,107,255,.10);
  --ok:#00b42a;--warn:#ff7d00;--danger:#f53f3f;--purple:#722ed1;--teal:#0fc6c2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--fg:#e5e6eb;--fg-2:#c9cdd4;--muted:#8b90a0;
    --bg:#141519;--card:#1d1e24;--line:#2e3038;--line-2:#26272e;
    --accent:#6aa1ff;--accent-weak:rgba(106,161,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--fg);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}

/* ---- 顶栏 ---- */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f6bff,#722ed1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.brand h1{font-size:15px;margin:0;line-height:1.2}
.brand .sub{font-size:12px;color:var(--muted)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2);min-width:0}
.crumb button{background:transparent;border:0;padding:2px 6px;border-radius:8px;color:var(--fg-2)}
.crumb button:hover{background:var(--line-2);color:var(--fg)}
.crumb .sep{color:var(--muted)}
.crumb .now{font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}
.spacer{margin-left:auto}

/* ---- 视图容器 ---- */
main{padding:18px 22px 40px;max-width:1180px;margin:0 auto}
.view-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.view-head h2{font-size:18px;margin:0;font-weight:600}
.view-head .desc{color:var(--muted);font-size:12.5px}
.view-head .spacer{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.vsec{margin-bottom:16px}

/* ---- 项目卡片 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 14px;cursor:pointer;transition:border-color .15s,transform .08s}
.pcard:hover{border-color:var(--accent)}
.pcard:active{transform:scale(.995)}
.pcard:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.pcard.archived{cursor:default;opacity:.72}
.pcard .pname{font-size:15px;font-weight:600;margin:0 0 2px;padding-right:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pcard .stat{font-size:12.5px;color:var(--fg-2);margin-top:10px;display:flex;gap:8px;align-items:center}
.pcard .stat b{font-size:18px;color:var(--fg);font-weight:600}
.pcard .acts{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.pcard .acts button{padding:3px 7px;font-size:11.5px;line-height:1.5;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--fg-2)}
.pcard .acts button:hover{border-color:var(--accent);color:var(--accent)}
.pcard .acts button.danger:hover{border-color:var(--danger);color:var(--danger)}
.pcard .ar{position:absolute;right:14px;bottom:14px;color:var(--muted);font-size:16px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:6px;font-weight:600}
.cards .empty{grid-column:1/-1}

/* ---- 未归属工单 ---- */
.orphans{margin-top:18px}
.orphans summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none}
.orphans summary::-webkit-details-marker{display:none}
.orphans summary::before{content:"▸ ";color:var(--muted)}
.orphans[open] summary::before{content:"▾ "}
.orphans table{margin-top:10px}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2)}
th{color:var(--muted);font-weight:500;font-size:12.5px}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--line-2)}
tbody tr:last-child td{border-bottom:0}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tbl-wrap .tbl-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;font-size:12.5px;background:transparent}
.seg button.on{background:var(--accent);color:#fff}

/* ---- 徽章 / 标签 ---- */
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px}
.badge.closed,.badge.gone{color:var(--ok);border-color:rgba(0,180,42,.4)}
.badge.open,.badge.running{color:var(--accent);border-color:rgba(47,107,255,.4)}
.badge.archived{color:var(--warn);border-color:rgba(255,125,0,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg-2)}

/* ---- 按钮 ---- */
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;transition:background .15s,border-color .15s,opacity .15s}
button:hover:not(:disabled){background:var(--line-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:#2457e0}
button.danger{color:var(--danger);border-color:rgba(245,63,63,.4)}
button.danger:hover:not(:disabled){background:rgba(245,63,63,.08)}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}

/* ---- 表单 / 弹窗 ---- */
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
input[readonly]{background:var(--line-2);color:var(--fg-2)}
textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{margin-bottom:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal[hidden]{display:none}
.modal-card{width:min(520px,100%);background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(16,24,40,.22);padding:20px 22px}
.modal-card h2{font-size:16px;margin:0 0 4px}
.modal-card .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.modal-err{display:none;margin:0 0 12px;padding:9px 11px;border-radius:10px;background:rgba(245,63,63,.08);color:var(--danger);font-size:12.5px}
.modal-err.on{display:block}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ---- 会话视图 ---- */
.ticket-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.lane{display:flex;flex-direction:column;min-width:0}
.lane>.vsec{margin-bottom:0}
.lane-left>.vsec[data-kind="chat"] .chat-card{min-height:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;box-shadow:none}
.lane-left>.vsec[data-kind="composer"] .composer{background:var(--card);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);padding:12px 16px}
.lane-left>.vsec[data-kind="composer"] .composer textarea{min-height:56px;resize:none}
.chat{height:auto;min-height:380px}
.chat-card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:520px}
.chat-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-title{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:8px;min-width:0}
.chat-title strong{color:var(--fg);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.chat-empty{margin:auto;color:var(--muted);font-size:13px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:82%}
.msg.right{align-self:flex-end;flex-direction:row}
.msg.left{align-self:flex-start}
.msg.system{align-self:center;max-width:70%}
.avatar{width:32px;height:32px;border-radius:9px;flex:none;background:var(--av);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.msg-main{min-width:0}
.msg.right .msg-main{text-align:right}
.msg-name{font-size:12px;color:var(--muted);margin-bottom:4px}
.bubble-stack{display:flex;flex-direction:column;gap:3px}
.msg.left .bubble-stack{align-items:flex-start}
.msg.right .bubble-stack{align-items:flex-end}
.bubble-body{padding:9px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;max-width:100%}
.msg.left .bubble-body{border-top-left-radius:4px}
.msg.right .bubble-body{background:var(--accent);border-color:var(--accent);color:#fff;border-top-right-radius:4px}
.msg-ts{font-size:11px;color:var(--muted);margin-top:4px}
.msg.system .sys-body{padding:7px 12px;border-radius:999px;background:var(--line-2);color:var(--fg-2);font-size:12.5px;text-align:center}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
.composer textarea{min-height:44px;max-height:120px;flex:1}
.composer button{flex:none}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.side-card h3{font-size:13px;margin:0 0 10px;color:var(--fg-2)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.kv span{color:var(--muted)}
#banner{display:none;margin:0 22px;padding:10px 14px;border-radius:10px;font-size:12.5px}
#banner.err{display:block;background:rgba(245,63,63,.1);color:var(--danger)}
#banner.ok{display:block;background:rgba(0,180,42,.1);color:var(--ok)}
#status{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line-2)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">H</span><div><h1>Hive AI</h1><div class="sub">项目 · 工单 · 会话</div></div></div>
  <div class="crumb" id="crumb"></div>
  <div class="spacer"></div>
  <button id="nav-points" class="ghost">岗位库</button>
  <button id="logout" class="ghost">登出</button>
</header>
<div id="banner"></div>

<main><div id="view-body"></div></main>

<!-- 通用弹窗 -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2 id="modal-title"></h2>
    <p class="hint" id="modal-hint"></p>
    <div class="modal-err" id="modal-err"></div>
    <form id="modal-form"></form>
    <div class="modal-foot">
      <button type="button" id="modal-cancel">取消</button>
      <button type="submit" form="modal-form" class="primary" id="modal-ok">确定</button>
    </div>
  </div>
</div>

<script src="/assets/js-yaml.min.js"></script>
<script>
/* ============================================================ 基础设施
   这一层只认传输与渲染，不认识任何业务名词：
   - run()：按名跑一条需求
   - fill()/ref()：把规格里的取值表达式解析成实际数据
   - execute()：唯一的动作出口，动作 = 规格里写着的 demand / view / modal
*/
async function readYaml(resp){return jsyaml.load(await resp.text())||{};}
function yamlBody(o){return jsyaml.dump(o,{flowLevel:Infinity,noRefs:true,sortKeys:false});}
const $ = (id) => document.getElementById(id);
function readCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}
const token = () => localStorage.getItem("ai_new_token") || readCookie("hive_token") || "";
function clearToken() {
  localStorage.removeItem("ai_new_token");
  sessionStorage.removeItem("hive.token");
  document.cookie = "hive_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
}
function headers() {
  const h = { "Content-Type": "application/yaml" };
  if (token()) h["X-Auth-Token"] = token();
  return h;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function run(demand, input) {
  let resp, body;
  try {
    resp = await fetch("/api/rpc/demand_engine/run", {
      method: "POST", headers: headers(),
      body: yamlBody({ id: demand, input: input || {} })
    });
    body = await readYaml(resp).catch(() => ({ ok: false, error: "响应不是 YAML", code: "bad_yaml" }));
  } catch (e) {
    throw Object.assign(new Error("网络请求失败：" + e.message), { status: 0, code: "network" });
  }
  if (!body.ok) {
    if (resp.status === 401 || body.code === "unauthorized") { clearToken(); location.href = "/login.html"; return; }
    throw Object.assign(new Error(body.error || ("HTTP " + resp.status)),
      { status: resp.status, code: body.code });
  }
  const inner = (body.result && body.result.result) || {};
  if (inner && inner.ok === false) {
    if (resp.status === 401 || inner.code === "unauthorized") { clearToken(); location.href = "/login.html"; return; }
    throw Object.assign(new Error(inner.error || inner.code || "需求失败"),
      { status: resp.status, code: inner.code });
  }
  return inner;
}

function banner(msg, kind) {
  const el = $("banner");
  if (!msg) { el.style.display = "none"; el.textContent = ""; el.className = ""; return; }
  el.className = kind === "ok" ? "ok" : "err";
  el.textContent = msg;
}
function gateMessage(err) {
  if (err && (err.status === 401 || err.code === "unauthorized")) return "登录已失效（401），请重新登录。";
  return (err && err.message) || "操作失败";
}
function when(ts) {
  if (!ts) return "—";
  const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
  if (isNaN(d.getTime())) return String(ts);
  return d.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

/* ============================================================ 取值表达式
   规格里出现的取值写法（只这三种，不含业务知识）：
   - {route.x}       路由参数
   - {row.x.y}       当前数据行
   - {data.<as>.x}   本次取数的结果（也允许省略 data.，直接写 <as>.x）
   - {cache.<name>.x} 缓存数据（如项目名解析）
   - $x              表单字段
   - {result.x}      上一次提交的返回
   后缀变换： |when  时间格式化   |count  计数   |count(a!=b) 条件计数
             |project_name  id 转项目名
*/
function dig(obj, path) {
  if (!path) return obj;
  let cur = obj;
  for (const part of String(path).split(".")) {
    if (cur == null) return undefined;
    if (part === "length") { cur = Array.isArray(cur) ? cur.length : (cur && cur.length); continue; }
    if (/^\d+$/.test(part)) { cur = cur[Number(part)]; continue; }
    cur = cur[part];
  }
  return cur;
}
function ref(path, ctx) {
  if (path.startsWith("$")) return (ctx.fields || {})[path.slice(1)];
  if (path.startsWith("result.")) return dig(ctx.result, path.slice(7));
  if (path.startsWith("row.")) return dig(ctx.row, path.slice(4));
  if (path.startsWith("route.")) return (ctx.route || {})[path.slice(6)];
  if (path.startsWith("data.")) {
    const rest = path.slice(5), head = rest.split(".")[0];
    return dig((ctx.data || {})[head], rest.slice(head.length + 1));
  }
  if (path.startsWith("cache.")) {
    const rest = path.slice(6), head = rest.split(".")[0];
    return dig((ctx.cache || {})[head], rest.slice(head.length + 1));
  }
  const head = path.split(".")[0];
  if (ctx.data && head in ctx.data) return dig(ctx.data[head], path.slice(head.length + 1));
  if (ctx.cache && head in ctx.cache) return dig(ctx.cache[head], path.slice(head.length + 1));
  return undefined;
}
function projectName(id, ctx) {
  const tree = (ctx.cache || {}).projects || (ctx.data || {}).tree || {};
  const hit = ((tree.items || []).find((n) => (n.project || {}).id === id) || {}).project;
  return hit ? (hit.name || hit.id) : (id || "—");
}
function arr(v) { return Array.isArray(v) ? v : (v == null ? [] : [v]); }
function applyChain(val, chain, ctx) {
  for (const raw of chain) {
    const t = String(raw).trim();
    if (t === "when") val = when(val);
    else if (t === "count") val = arr(val).length;
    else if (t === "project_name") val = projectName(val, ctx);
    else if (t.startsWith("count(") && t.endsWith(")")) {
      const cond = t.slice(6, -1);
      val = arr(val).filter((x) => matchCond(x, cond)).length;
    }
  }
  return val;
}
function matchCond(item, cond) {
  const m = String(cond).match(/^(\S+?)(!=|==|=|>=|<=|>|<)(\S+)$/);
  if (!m) return false;
  const [, field, op, raw] = m;
  const left = dig(item, field);
  const right = /^\d+$/.test(raw) ? Number(raw) : raw;
  if (op === "!=") return String(left) !== String(right);
  if (op === "==" || op === "=") return String(left) === String(right);
  const ln = Number(left);
  if (op === ">") return ln > Number(right);
  if (op === "<") return ln < Number(right);
  if (op === ">=") return ln >= Number(right);
  return ln <= Number(right);
}
function fill(tpl, ctx) {
  if (tpl == null || typeof tpl === "number" || typeof tpl === "boolean") return tpl;
  if (Array.isArray(tpl)) return tpl.map((x) => fill(x, ctx));
  if (typeof tpl === "object") {
    const out = {};
    for (const k of Object.keys(tpl)) out[k] = fill(tpl[k], ctx);
    return out;
  }
  const s = String(tpl);
  if (s.includes("{")) {
    return s.replace(/\{([^{}]+)\}/g, (_, expr) => {
      const [path, ...chain] = expr.split("|").map((x) => x.trim());
      const v = applyChain(ref(path, ctx), chain, ctx);
      return v == null ? "" : String(v);
    });
  }
  if (s.includes("|")) {
    const [path, ...chain] = s.split("|").map((x) => x.trim());
    return applyChain(ref(path, ctx), chain, ctx);
  }
  if (s.startsWith("$") || s.includes(".")) {
    const v = ref(s, ctx);
    return v == null ? "" : v;
  }
  return s;
}
function fmtVal(item, ctx) {
  let v = fill(item.value, ctx);
  if (item.format === "when") v = when(v);
  else if (item.format === "project_name") v = projectName(v, ctx);
  return v;
}
function truthy(v) {
  if (typeof v === "string") {
    if (v === "" || v === "false" || v === "0") return false;
    if (/\{/.test(v)) return true;
    return true;
  }
  return !!v;
}
function condBase(ctx) {
  return { ...(ctx.data || {}), ...(ctx.cache || {}), row: ctx.row || {}, fields: ctx.fields || {} };
}
function condOf(expr, ctx) {
  if (expr == null) return true;
  if (typeof expr === "boolean") return expr;
  let s = String(expr).trim();
  const wrapped = s.match(/^\{(.+)\}$/);
  if (wrapped) s = wrapped[1];
  if (/[!<>=]=?/.test(s)) return matchCond(condBase(ctx), s);
  return truthy(fill(s, ctx));
}

/* ============================================================ 路由与视图
*/
let VIEWS = {}, FORMS = {}, state = { view: "projects" };
let ACTS = [], FILTER = null, modalSubmit = null, MODAL_CTX = null;

function qsOf(s) {
  const q = new URLSearchParams();
  if (s.view === "positions") q.set("view", "positions");
  else if (s.ticket) { q.set("project", s.project || ""); q.set("ticket", s.ticket); }
  else if (s.project) q.set("project", s.project);
  const str = q.toString();
  return str ? "/manage.html?" + str : "/manage.html";
}
function parseURL() {
  const q = new URLSearchParams(location.search);
  if (q.get("view") === "positions") return { view: "positions" };
  const p = q.get("project") || "";
  const t = q.get("ticket") || "";
  if (t) return { view: "ticket", project: p, ticket: t };
  if (p) return { view: "project", project: p };
  return { view: "projects" };
}
async function go(next, push) {
  state = next;
  if (push) history.pushState(next, "", qsOf(next));
  await render().catch((err) => banner(gateMessage(err), "err"));
}

async function boot() {
  const items = arr(await run("views-list", {}));
  for (const it of items) {
    const v = it && it.view;
    if (!v) continue;
    if (v.key) VIEWS[v.key] = v;
    for (const f of v.forms || []) FORMS[f.id] = f;
  }
  if (!VIEWS.projects) throw new Error("没有 projects 视图规格，页面无法启动");
  state = parseURL();
  await render();
}

async function render() {
  const spec = VIEWS[state.view] || VIEWS.projects;
  const ctx = { route: state, data: {}, cache: {}, fields: {}, row: null };
  for (const src of spec.data || []) {
    const params = fill(src.params || {}, ctx);
    const res = await run(src.demand, params);
    ctx.data[src.as] = res;
    if (src.cache) ctx.cache[src.cache] = res;
  }
  banner("");
  renderCrumb(spec, ctx);
  renderView(spec, ctx);
}

function crumbUp() {
  if (state.view === "ticket") return { view: "project", project: state.project || "" };
  return { view: "projects" };
}
function renderCrumb(spec, ctx) {
  const parts = (spec.crumb || []).map((x) => fill(x, ctx)).filter(Boolean);
  if (!parts.length) { $("crumb").innerHTML = ""; return; }
  $("crumb").innerHTML = parts.map((text, i) => {
    const last = i === parts.length - 1;
    if (last) return `<span class="now">${esc(text)}</span>`;
    return `<button data-crumb="1">${esc(text)}</button><span class="sep">/</span>`;
  }).join("");
}

/* ============================================================ 渲染：规格 -> DOM
   只认识原语（cards / table / chat / kv / composer / empty），不认识业务。
*/
function actIndex(act, ctx) {
  ACTS.push({ act, ctx });
  return ACTS.length - 1;
}
function buttonHtml(act, ctx, opts) {
  opts = opts || {};
  const disabled = act.disabled_when != null && condOf(act.disabled_when, ctx);
  const title = disabled && act.disabled_hint ? ` title="${esc(act.disabled_hint)}"` : "";
  const cls = act.tone === "primary" ? "primary" : (act.tone === "danger" ? "danger" : "");
  return `<button class="${cls}" data-act="${actIndex(act, ctx)}" ${disabled ? "disabled" : ""}${title}>${esc(fill(act.label, ctx))}</button>`;
}
function badgeHtml(value, ctx) {
  const s = String(value == null ? "" : value);
  const cls = s === "closed" || s === "gone" || s === "done" ? "closed"
    : (s === "open" || s === "running" || s === "queued" || s === "doing" ? "open" : "");
  return `<span class="badge ${cls}">${esc(s || "open")}</span>`;
}
function emptyHtml(block) {
  block = block || {};
  return `<div class="empty">${block.title ? `<strong>${esc(fill(block.title, {}))}</strong>` : ""}${esc(fill(block.text || "", {}))}</div>`;
}

function cardsHtml(sec, ctx) {
  const rows = arr(ref(sec.source, ctx));
  if (!rows.length) return emptyHtml(sec.empty);
  const cards = rows.map((row) => {
    const c = { ...ctx, row };
    const archived = sec.archived_when != null && condOf(sec.archived_when, c);
    const acts = (sec.actions || []).map((a) => buttonHtml(a, c)).join("");
    const badge = (sec.badge && condOf(sec.badge.when, c))
      ? `<span class="badge archived">${esc(fill(sec.badge.text, c))}</span>` : "";
    const stat = sec.stat ? `<div class="stat"><b>${esc(fill(sec.stat.count, c))}</b> ${esc(fill(sec.stat.label, c))}<span class="muted">· ${esc(fill(sec.stat.note || "", c))}</span></div>` : "";
    const meta = (sec.meta || []).filter((m) => m.hide_if_empty ? !!fmtVal(m, c) : true)
      .map((m) => `<span>${esc(fill(m.label, c))} ${esc(fmtVal(m, c))}</span>`).join("");
    const click = sec.on_click ? actIndex({ view: sec.on_click.view, params: sec.on_click.params || {} }, c) : -1;
    return `<article class="pcard${archived ? " archived" : ""}" ${click >= 0 ? `data-go="${click}"` : ""} role="button" tabindex="0" aria-label="进入 ${esc(fill(sec.title, c))}">
      <div class="acts">${acts}</div>
      <h3 class="pname">${esc(fill(sec.title, c))}</h3>
      ${badge}${stat}
      <div class="meta">${meta}</div>
      <span class="ar">›</span>
    </article>`;
  }).join("");
  return `<div class="cards">${cards}</div>`;
}

function tableHtml(sec, ctx) {
  const rows0 = arr(ref(sec.source, ctx));
  let rows = rows0.slice();
  if (sec.sort) {
    const by = sec.sort.by, dir = sec.sort.order === "asc" ? 1 : -1;
    rows.sort((a, b) => dir * String(dig(a, by) || "").localeCompare(String(dig(b, by) || "")));
  }
  const filters = sec.filters || [];
  if (filters.length) {
    const active = filters.find((f) => f.key === FILTER) || filters[0];
    if (active && active.keep) rows = rows.filter((r) => matchCond(r, active.keep));
    sec._active = active ? active.key : null;
  }
  const head = `<div class="tbl-head">
    ${sec.heading ? `<strong style="font-size:13px">${esc(fill(sec.heading, ctx))}</strong>` : ""}
    ${sec.count_note ? `<span class="muted">${esc(fill(sec.count_note, ctx))}</span>` : ""}
    <div class="spacer" style="margin-left:auto"></div>
    ${filters.length ? `<span class="seg" id="seg">${filters.map((f) =>
      `<button data-filter="${esc(f.key)}" class="${f.key === (sec._active || filters[0].key) ? "on" : ""}">${esc(f.label)}</button>`).join("")}</span>` : ""}
  </div>`;
  const cols = sec.columns || [];
  const body = rows.length ? rows.map((row) => {
    const c = { ...ctx, row };
    const cells = cols.map((col) => {
      let val;
      if (col.badge) val = badgeHtml(fill(col.badge, c), c);
      else {
        val = esc(col.format ? fmtVal(col, c) : fill(col.value, c));
        if (col.suffix) val += ` ${esc(fill(col.suffix, c))}`;
        if (col.sub) val += `<div class="muted">${esc(fill(col.sub, c))}</div>`;
      }
      if (val === "" || val === "undefined") val = esc(col.fallback ? fill(col.fallback, c) : "—");
      return `<td class="${col.muted ? "muted" : ""}">${val}</td>`;
    }).join("");
    const click = sec.on_click ? actIndex({ view: sec.on_click.view, params: sec.on_click.params || {} }, c) : -1;
    return `<tr ${click >= 0 ? `data-go="${click}"` : ""}>${cells}</tr>`;
  }).join("") : `<tr><td colspan="${cols.length}" class="muted">${esc((sec.empty || {}).text || "暂无数据")}</td></tr>`;
  if (sec.hide_when_empty && !rows0.length) return "";
  const wrap = `<div class="tbl-wrap">${sec.heading || filters.length || sec.count_note ? head : ""}<table>
    <thead><tr>${cols.map((c) => `<th>${esc(c.label || "")}</th>`).join("")}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
  if (sec.summarize) {
    return `<div class="orphans"><details><summary>${esc(fill(sec.title || "", ctx))}（${rows0.length}）</summary>${wrap}</details></div>`;
  }
  return wrap;
}

const ROLE_CN = { pm: "PM", user: "用户", assistant: "助手", system: "系统" };
const AVATAR_PALETTE = ["#2f6bff", "#00b42a", "#ff7d00", "#722ed1", "#0fc6c2", "#f53f3f", "#eb0aa4"];
function speakerOf(msg, roles) {
  const role = msg.role || "assistant";
  if (role === "user") return "用户";
  if (role === "system") return "系统";
  if (role === "pm" || role === "assistant") return ROLE_CN[role] || role;
  const hit = (roles || []).find((r) => r.role === role || r.session === role);
  return (hit && (hit.display || hit.role)) || role;
}
function bubbleClass(msg) {
  const role = msg.role || "assistant";
  if (role === "user") return "user";
  if (role === "system") return "system";
  if (role === "assistant" || role === "pm") return "assistant";
  return "role";
}
function avatarColor(name) {
  let h = 0;
  for (const ch of String(name || "")) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function initial(name) {
  const s = String(name || "?").trim();
  return s ? esc(s[0]) : "?";
}
function chatHtml(sec, ctx) {
  const src = ref(sec.source, ctx) || {};
  const roles = ref(sec.roles_source, ctx) || [];
  const hidden = sec.hide_roles || [];
  const msgs = arr(src.messages).filter((m) => !hidden.includes(m.role || ""));
  const headTitle = sec.heading ? `<div class="chat-title">${esc(fill(sec.heading, ctx))}</div>` : "";
  const body = msgs.length ? renderBubbles(msgs, roles) : `<div class="chat-empty">${esc(fill(sec.empty || "", ctx))}</div>`;
  return `<section class="chat-card card">
    ${headTitle ? `<div class="chat-head">${headTitle}<div class="spacer" style="margin-left:auto"></div><div class="chips">${arr(roles).map((r) => `<span class="chip">${esc((r.display || r.role) + " · " + (r.status || ""))}</span>`).join("")}</div></div>` : ""}
    <div class="chat">${body}</div>
  </section>`;
}
function renderBubbles(msgs, roles) {
  const groups = [];
  for (const m of msgs) {
    const cls = bubbleClass(m);
    const who = cls === "system" ? "" : speakerOf(m, roles);
    const key = cls + "|" + who;
    const last = groups[groups.length - 1];
    if (last && last.key === key) last.msgs.push(m);
    else groups.push({ key, cls, who, msgs: [m] });
  }
  return groups.map((g) => {
    if (g.cls === "system") {
      return g.msgs.map((m) => `<div class="msg system"><div class="sys-body">${esc(m.content == null ? "" : m.content)}</div></div>`).join("");
    }
    const side = g.cls === "user" ? "right" : "left";
    const av = `<div class="avatar" style="--av:${avatarColor(g.who)}">${initial(g.who)}</div>`;
    const bodies = g.msgs.map((m) => `<div class="bubble-body">${esc(m.content == null ? "" : m.content)}</div>`).join("");
    const last = g.msgs[g.msgs.length - 1];
    const ts = last.ts ? `<div class="msg-ts">${when(last.ts)}</div>` : "";
    return `<div class="msg ${side}">${side === "left" ? av : ""}
      <div class="msg-main"><div class="msg-name">${esc(g.who)}</div>
      <div class="bubble-stack">${bodies}</div>${ts}</div>${side === "right" ? av : ""}</div>`;
  }).join("");
}

function kvHtml(sec, ctx) {
  const src = ref(sec.source, ctx) || {};
  const rows = (sec.rows || []).map((r) => {
    const c = { ...ctx, row: src };
    const val = r.badge ? badgeHtml(fill(r.badge, c), c)
      : esc((fmtVal(r, c) === undefined || fmtVal(r, c) === "" ? (r.fallback || "—") : fmtVal(r, c)));
    return `<div class="kv"><span>${esc(r.label)}</span><div>${val}</div></div>`;
  }).join("");
  const acts = (sec.actions || []).map((a) => buttonHtml(a, { ...ctx, row: src })).join("");
  return `<aside class="side-card">
    ${sec.heading ? `<h3>${esc(fill(sec.heading, ctx))}</h3>` : ""}
    ${rows}
    ${acts ? `<div class="actions" style="margin-top:12px">${acts}</div>` : ""}
  </aside>`;
}

function composerHtml(sec, ctx) {
  const disabled = sec.disabled_when != null && condOf(sec.disabled_when, ctx);
  const submit = sec.submit || {};
  ACTS.push({ act: submit, ctx, composer: true });
  const submitIdx = ACTS.length - 1;
  const acts = (sec.actions || []).map((a) => buttonHtml({ ...a, composer: true }, ctx)).join("");
  return `<div class="composer">
    <textarea placeholder="${esc(fill(sec.placeholder || "", ctx))}" ${disabled ? "disabled" : ""}></textarea>
    ${acts}
    <button class="primary" data-act="${submitIdx}" ${disabled ? "disabled" : ""}>${esc(fill(submit.label || "发送", ctx))}</button>
  </div>`;
}

function sectionHtml(sec, ctx) {
  const kind = sec.kind;
  let html = "";
  if (kind === "cards") html = cardsHtml(sec, ctx);
  else if (kind === "table") html = tableHtml(sec, ctx);
  else if (kind === "chat") html = chatHtml(sec, ctx);
  else if (kind === "kv") html = kvHtml(sec, ctx);
  else if (kind === "composer") html = composerHtml(sec, ctx);
  else html = emptyHtml({ text: "未知区块: " + kind });
  return `<div class="vsec" data-kind="${esc(kind)}">${html}</div>`;
}

function renderView(spec, ctx) {
  ACTS = [];
  const head = `<div class="view-head">
      <div style="min-width:0"><h2>${esc(fill(spec.heading || spec.heading_from || "", ctx))}</h2>
      <div class="desc">${esc(fill(spec.subheading || "", ctx))}</div></div>
      <div class="spacer"></div>
      <div class="actions">${(spec.actions || []).map((a) => buttonHtml(a, ctx)).join("")}</div>
    </div>`;
  const left = [], right = [], single = [];
  for (const sec of spec.sections || []) {
    const html = sectionHtml(sec, ctx);
    if (sec.lane === "left") left.push(html);
    else if (sec.lane === "right") right.push(html);
    else single.push(html);
  }
  let body = single.join("");
  if (left.length || right.length) {
    body = `<div class="ticket-grid">
      <div class="lane lane-left">${left.join("")}</div>
      <div class="lane lane-right">${right.join("")}</div>
    </div>`;
  }
  $("view-body").innerHTML = head + body;
}

/* ============================================================ 执行：动作 -> 需求
*/
async function execute(binding, fields) {
  const { act, ctx, composer } = binding;
  const c = { ...ctx, fields: fields || ctx.fields || {}, composer };
  if (act.view) {
    const next = resolveView(act, c);
    return go(next, true);
  }
  if (act.modal) {
    const fc = { ...c };
    if (fc.row && fc.row.project) fc.project = fc.row.project;
    return openForm(FORMS[act.modal], fc);
  }
  if (!act.demand) return;
  const params = fill(act.params || {}, c);
  if (act.confirm && !confirm(String(fill(act.confirm, c)))) return;
  const flashText = act.flash ? String(fill(act.flash, c)) : "";
  try {
    const res = await run(act.demand, params);
    if (flashText) banner(fill(act.flash, { ...c, result: res }), "ok");
    if (act.after) {
      const next = resolveView(act.after, { ...c, result: res });
      return go(next, true);
    }
    await render();
  } catch (err) {
    banner(gateMessage(err), "err");
  }
}
function resolveView(target, c) {
  const params = fill(target.params || {}, c);
  const view = target.view;
  if (view === "projects") return { view: "projects" };
  if (view === "project") return { view: "project", project: params.project || "" };
  if (view === "ticket") return { view: "ticket", project: params.project || "", ticket: params.ticket || "" };
  if (view === "positions") return { view: "positions" };
  return { view: view };
}

/* ============================================================ 弹窗：表单规格
*/
function openForm(form, ctx) {
  if (!form) return;
  MODAL_CTX = { form, ctx };
  $("modal-title").textContent = fill(form.title || "", ctx);
  $("modal-hint").textContent = fill(form.hint || "", ctx);
  $("modal-err").className = "modal-err";
  $("modal-err").textContent = "";
  $("modal-form").innerHTML = (form.fields || []).map((f) => {
    const val = f.value != null ? fill(f.value, ctx) : "";
    const req = f.required ? ' data-required="1"' : "";
    const ro = f.readonly ? " readonly" : "";
    const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "";
    if (f.kind === "textarea") {
      return `<div class="field"><label>${esc(f.label)}</label><textarea name="${esc(f.name)}"${ph}>${esc(val)}</textarea></div>`;
    }
    if (f.kind === "select") {
      const opts = (f.options || []).map((o) =>
        `<option value="${esc(o.value)}"${String(val) === String(o.value) ? " selected" : ""}>${esc(o.label)}</option>`).join("");
      return `<div class="field"><label>${esc(f.label)}</label><select name="${esc(f.name)}">${opts}</select></div>`;
    }
    return `<div class="field"><label>${esc(f.label)}</label><input name="${esc(f.name)}" value="${esc(val)}"${ph}${req}${ro}></div>`;
  }).join("");
  $("modal-ok").textContent = fill((form.submit || {}).ok || "确定", ctx);
  $("modal-ok").disabled = false;
  $("modal").hidden = false;
  const first = $("modal-form").querySelector("input:not([readonly]),textarea,select");
  if (first) first.focus();
  modalSubmit = async (fd) => {
    const fields = {};
    for (const [k, v] of fd.entries()) fields[k] = typeof v === "string" ? v.trim() : v;
    for (const f of form.fields || []) {
      if (f.required && !fields[f.name]) throw new Error(f.label + "不能为空");
    }
    const c = { ...ctx, fields };
    const res = await run(form.submit.demand, fill(form.submit.params || {}, c));
    closeModal();
    if (form.submit.flash) banner(fill(form.submit.flash, { ...c, result: res }), "ok");
    if (form.submit.then) {
      const next = resolveView(form.submit.then, { ...c, result: res });
      return go(next, true);
    }
    await render();
  };
}
function closeModal() { $("modal").hidden = true; modalSubmit = null; MODAL_CTX = null; }
function modalError(msg) {
  $("modal-err").className = "modal-err on";
  $("modal-err").textContent = msg;
}
$("modal-cancel").onclick = closeModal;
$("modal").onclick = (e) => { if (e.target === $("modal")) closeModal(); };
$("modal-form").onsubmit = async (e) => {
  e.preventDefault();
  if (!modalSubmit) return;
  $("modal-ok").disabled = true;
  try { await modalSubmit(new FormData(e.target)); }
  catch (err) { modalError(gateMessage(err)); }
  finally { $("modal-ok").disabled = false; }
};

/* ============================================================ 事件总线
   只有一条：点到的按钮 -> 动作表 -> 执行器。
*/
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-act]");
  if (btn && !btn.disabled) {
    const binding = ACTS[Number(btn.dataset.act)];
    if (!binding) return;
    if (binding.composer) {
      const box = $("view-body").querySelector(".composer textarea");
      const text = (box && box.value || "").trim();
      if (!text) return;
      return execute(binding, { text });
    }
    return execute(binding, {});
  }
  const filterBtn = e.target.closest("[data-filter]");
  if (filterBtn) { FILTER = filterBtn.dataset.filter; return render(); }
  const goEl = e.target.closest("[data-go]");
  if (goEl) {
    const binding = ACTS[Number(goEl.dataset.go)];
    if (binding) return execute(binding, {});
  }
  if (e.target.closest("[data-crumb]")) return go(crumbUp(), true);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest && e.target.closest("[data-go][role=button]");
  if (card) { e.preventDefault(); card.click(); }
  const ta = e.target;
  if (ta && ta.tagName === "TEXTAREA" && e.key === "Enter" && !e.shiftKey) {
    const box = ta.closest(".composer");
    if (box) {
      const btn = box.querySelector("button.primary");
      if (btn) { e.preventDefault(); btn.click(); }
    }
  }
});

$("nav-points").onclick = () => go({ view: "positions" }, true);
$("logout").onclick = async () => {
  try { await run("auth-logout", { token: token() }); } catch (e) {}
  clearToken(); location.href = "/login.html";
};
window.addEventListener("popstate", () => {
  state = parseURL();
  render().catch((err) => banner(gateMessage(err), "err"));
});

boot().catch((err) => banner("控制台启动失败：" + gateMessage(err) + "（检查 views-list 与视图规格）", "err"));
</script>
