<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制台</title>
<link rel="stylesheet" href="assets/shoelace/themes/light.css">
<link rel="stylesheet" href="assets/shoelace/themes/dark.css">
<script>
/* 暗色跟随系统 prefers-color-scheme：Shoelace 主题类挂到 <html>，与现有媒体查询同步 */
(function () {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function sync() { document.documentElement.classList.toggle("sl-theme-dark", mq.matches); }
  sync();
  if (mq.addEventListener) mq.addEventListener("change", sync);
})();
</script>
<style>
/* ---- 现有 token → Shoelace CSS 变量映射（明暗两套 token 在下方媒体查询里各自覆盖） ---- */
:root{
  --sl-font-family: inherit;
  --sl-border-radius-medium: 10px;
  --sl-border-radius-small: 8px;
  --sl-color-primary-500: var(--accent);
  --sl-color-primary-600: var(--accent);
  --sl-color-primary-700: #2457e0;
  --sl-color-primary-800: #1c48b8;
  --sl-color-success-600: var(--ok);
  --sl-color-warning-600: var(--warn);
  --sl-color-danger-600: var(--danger);
  --sl-color-neutral-0: var(--card);
  --sl-color-neutral-50: var(--bg);
  --sl-color-neutral-100: var(--line);
  --sl-color-neutral-200: var(--line-2);
  --sl-color-neutral-600: var(--fg-2);
  --sl-color-neutral-900: var(--fg);
  --sl-input-background-color: var(--card);
  --sl-input-border-color: var(--line);
  --sl-input-border-color-focus: var(--accent);
  --sl-input-color: var(--fg);
}
:root{
  color-scheme:light;
  --fg:#1d2129;--fg-2:#4e5969;--muted:#86909c;
  --bg:#f3f5f9;--card:#ffffff;--line:#e6e9f0;--line-2:#f0f2f6;
  --accent:#2f6bff;--accent-weak:rgba(47,107,255,.10);
  --ok:#00b42a;--warn:#ff7d00;--danger:#f53f3f;--purple:#722ed1;--teal:#0fc6c2;
  --sidebar-w:272px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --radius:12px;
  /* 卡片尺寸与字号阶梯：进行中 / 已归档 / 详情页工单卡三处同一套 token */
  --pcard-name:15px; --pcard-meta:12.5px; --pcard-stat-size:12.5px; --pcard-stat-num:18px;
  --pcard-pad:14px 14px 12px; --pcard-gap:14px; --pcard-h:152px;
  /* 群聊 TG 手感：聊天底色与自己的气泡色（自己= TG 绿，成员=白卡） */
  --chat-bg:#e6ebf1;--out-bg:#effdde;--out-fg:#0f0f0f;
  /* 角色固定配色：PM 蓝 / developer 紫 / tester 青 / reviewer 橙 / user 绿 */
  --c-pm:#2f6bff;--c-developer:#722ed1;--c-tester:#0fc6c2;--c-reviewer:#ff7d00;--c-user:#00b42a;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--fg:#e5e6eb;--fg-2:#c9cdd4;--muted:#8b90a0;
    --bg:#131418;--card:#1c1d23;--line:#2c2e36;--line-2:#25262d;
    --accent:#6aa1ff;--accent-weak:rgba(106,161,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.32);--shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --chat-bg:#0e1621;--out-bg:#8774e1;--out-fg:#ffffff;}
}
*{box-sizing:border-box}
/* ---- Shoelace 控件外壳兼容：尺寸/边框/颜色落到自定义元素的内建按钮上 ---- */
sl-icon-button.icon-btn{width:38px;height:38px;flex:none}
sl-icon-button.icon-btn::part(button){width:100%;height:100%;border:1px solid var(--line);background:transparent;border-radius:10px;color:var(--fg-2);font-size:18px}
sl-icon-button.rail-btn{width:26px;height:26px;flex:none}
sl-icon-button.rail-btn::part(button){width:100%;height:100%;border-radius:8px}
sl-dialog.modal-dialog::part(panel){width:min(520px,100%)}
sl-dialog.modal-dialog .modal-err{display:none;margin:0 0 12px;padding:9px 11px;border-radius:10px;background:rgba(245,63,63,.08);color:var(--danger);font-size:12.5px}
sl-dialog.modal-dialog .modal-err.on{display:block}
html,body{height:100%}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--fg);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}

/* ---- 骨架：桌面常驻侧栏，窄屏抽屉 ---- */
.shell{display:flex;min-height:100vh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand-mini{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mini h1{font-size:15px;margin:0;line-height:1.2}
.scrim{position:fixed;inset:0;background:rgba(15,20,30,.42);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;left:0;top:0;height:100vh;width:var(--sidebar-w);z-index:40;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;transform:translateX(-100%);transition:transform .22s ease}
.sidebar.open{transform:translateX(0)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.brand>div{min-width:0}
.rail-btn{width:26px;height:26px;margin-left:auto;flex:none;font-size:14px;border-radius:8px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f6bff,#722ed1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.brand h1{font-size:15px;margin:0;line-height:1.2}
.brand .sub{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:0}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group + .nav-group{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.nav-group-title{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:0 12px 6px}
/* 交互状态迁移图：容器内独立 pan/zoom，样式与 dag 共用 .graph-wrap */
.machine-wrap{display:flex;flex-direction:column;gap:8px;min-width:0}
/* 可点位置清单：一行一类，手机上一屏看四五类 */
/* ---- 用户视角的页面地图 / 跳转 / 元素 ---- */
.pmap{display:flex;flex-direction:column;gap:10px}
.pmap-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.pmap-row.is-entry{border-color:rgba(95,135,221,.5);box-shadow:0 0 0 1px rgba(95,135,221,.16) inset}
.pmap-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pmap-top b{font-size:13.5px;color:var(--fg)}
.pmp-pin{font-size:11px;color:#5f87dd;border:1px solid rgba(95,135,221,.4);border-radius:999px;padding:1px 7px}
.pmap-main{font-size:12.5px;color:var(--fg-2);margin-top:3px;line-height:1.6}
.pmap-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}
.pmp-lab{font-size:11.5px;color:var(--muted)}
.pmp-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--fg-2)}
.pmp-chip i{font-style:normal;color:var(--muted)}
.pmp-none{font-size:11.5px;color:var(--muted)}
.pmp-arrow{color:var(--muted);font-size:12px}
.route-list{display:flex;flex-direction:column;gap:6px}
.route-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:10px}
.rt-from,.rt-to{color:var(--fg)}
.rt-by{color:var(--fg-2)}
.rt-arrow{color:var(--muted)}
.elem-pages{display:flex;flex-direction:column;gap:6px}
.elem-page{border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.elem-page>summary{cursor:pointer;font-size:12.5px;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
.elem-page>summary::-webkit-details-marker{display:none}
.elem-count{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.elem-list{display:flex;flex-direction:column;gap:5px;padding:2px 0 8px}
.elem-row{display:grid;grid-template-columns:minmax(120px,1.2fr) 52px minmax(110px,1fr) minmax(0,1.6fr);gap:8px;align-items:baseline;font-size:12px;border-top:1px dashed var(--line);padding-top:5px}
.elem-label{color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elem-n{font-style:normal;color:var(--muted);margin-left:4px;font-size:11px}
.elem-tag{font-size:10.5px;color:var(--muted);text-transform:lowercase}
.elem-eff{color:var(--fg-2)}
.elem-gate{color:var(--muted);font-size:11.5px;line-height:1.5}
@media (max-width:720px){.elem-row{grid-template-columns:1fr;gap:2px}}
.kind-list{display:flex;flex-direction:column}
.kind-row{padding:9px 0;border-bottom:1px solid var(--line-2);min-width:0}
.kind-row:last-child{border-bottom:0}
.kind-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.kind-top b{font-size:13.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kind-top em{font-style:normal;font-size:10.5px;color:var(--muted);background:var(--bg);padding:1px 5px;border-radius:5px}
.kind-flow{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;margin-left:auto;min-width:0;flex:1 1 auto}
.kind-flow i{font-style:normal;color:var(--muted);font-size:11px}
.kind-flow .chip{padding:1px 8px;font-size:11px;max-width:100%;overflow-wrap:anywhere}
.kind-row p{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45;min-width:0}
.nav sl-button{width:100%}
.nav sl-button::part(base){justify-content:flex-start;text-align:left;padding:9px 12px;border-radius:9px;color:var(--fg-2);font-size:13.5px}
.nav sl-button:hover::part(base){background:var(--line-2);color:var(--fg)}
.nav sl-button.on::part(base){background:var(--accent-weak);color:var(--accent);font-weight:600}
/* 二级菜单：缩进 + 左侧竖线，读起来是"这页属于上面那页"，不是又一列平铺 */
.nav-sub{display:flex;flex-direction:column;gap:2px;margin:1px 0 3px 14px;padding-left:8px;border-left:1px solid var(--line)}
.nav sl-button.nav-child::part(base){font-size:12.5px;padding:7px 10px;color:var(--muted);border-radius:8px}
.nav sl-button.nav-child:hover::part(base){color:var(--fg)}
.nav sl-button.nav-child.on::part(base){color:var(--accent);background:var(--accent-weak)}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.side-foot sl-button{width:100%}
.side-foot sl-button::part(base){justify-content:flex-start}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.crumb{display:flex;align-items:center;gap:0;font-size:13px;color:var(--fg-2);min-width:0}
.crumb button{background:transparent;border:0;padding:2px 0;border-radius:8px;color:var(--fg-2)}
.crumb button:hover{background:var(--line-2);color:var(--fg)}
.crumb .sep{color:var(--muted);padding:0 6px}
.crumb .now{font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}
.spacer{margin-left:auto}

/* ---- 视图容器 ---- */
main{padding:18px 26px 48px;max-width:1520px;margin:0 auto;width:100%}
main .crumb{margin-bottom:14px}
.view-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px}
.view-head h2{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.view-head .desc{color:var(--muted);font-size:12.5px}
.view-head .spacer{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.vsec{margin-bottom:16px}
/* 手机端的页码指示，桌面版不需要 */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:80px 20px;color:var(--muted);font-size:13px}

/* ---- 项目卡片 ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--pcard-gap);grid-auto-rows:1fr}
/* 只有一张卡时不留多列缺口：一张卡就是一张全宽卡，与堆叠态的整宽口径一致 */
.cards:has(> .pcard:only-child){grid-template-columns:minmax(0,1fr)}

/* ---- 卡片堆叠（deck）：收缩时叠成一摞、左右滑动换牌；展开时铺成列表 ----
   位置全靠 --pos：0 是最上面那张，往下每层右移 9px、下移 13px，最多露四层。 */
.cards.deck{display:block}
.deck{position:relative;min-width:0}
.deck-stage{position:relative;transition:height .26s cubic-bezier(.22,.72,.28,1)}
/* 展开态就回到普通卡片排列：一张一行、整宽，与收缩态的整宽口径一致
   （原先 auto-fill 多列会把卡压成 300px 列宽，和叠起来那张整宽卡对不上） */
.deck[data-open="1"] .deck-stage{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
/* 展开态每张牌都必须是整宽同高：不能继承收缩态的 right/transform，
   否则后几张会比第一张窄 8px，看上去像尺寸不一致的另一套卡。 */
.deck[data-open="1"] .deck-stage>.pcard{position:relative;left:auto;right:auto;width:100%;max-width:100%;height:var(--pcard-h);transform:none!important;transition:none!important}
.deck-stage{--ox:9px;--oy:13px;isolation:isolate;will-change:transform}
.deck[data-open="0"] .deck-stage>.pcard{position:absolute;left:0;right:calc(var(--pos,0) * var(--ox));top:0;
  z-index:calc(20 - var(--pos,0));
  backface-visibility:hidden;
  transition:transform .26s cubic-bezier(.22,.72,.28,1);
  touch-action:pan-y;cursor:grab}
.deck[data-open="0"] .deck-stage>.pcard:active{cursor:grabbing}
/* 后层只用轮廓示意"下面还有牌"：按钮和内容都压暗，否则两层按钮叠在一起像重复控件 */
/* 后层只留一张白卡的下缘：内容全部隐藏，露出来的就是"下面还有牌"的那道边，
   不会和前卡的文字混成一团（微信那种合并转发的观感） */
.deck[data-open="0"] .deck-stage>.pcard:not([data-front="1"])>*{visibility:hidden}
/* 露出来的那道边要看得见：用卡片底色的下一档 + 主题色描边，暗亮两套主题都成立
   （写死 #fff 在暗色下会变成一道刺眼白边） */
.deck[data-open="0"] .deck-stage>.pcard:not([data-front="1"]){background:var(--bg);
  box-shadow:inset 0 0 0 1px var(--line), 0 2px 0 var(--line)}
.deck[data-open="0"] .deck-stage>.pcard[data-front="1"]{box-shadow:0 12px 26px rgba(0,0,0,.11);will-change:transform}
.deck[data-open="0"] .deck-stage>.pcard:not([data-front="1"]){box-shadow:0 1px 3px rgba(16,24,40,.10)}
/* 拖动期间收掉大模糊阴影：移动中的卡每帧都要重绘阴影 */
.deck[data-dragging="1"] .deck-stage>.pcard[data-front="1"]{box-shadow:0 5px 12px rgba(0,0,0,.14)}
/* 露不出来的牌直接不参与绘制，省掉十几张大卡的合成开销 */
.deck[data-open="0"] .deck-stage>.pcard[data-far="1"]{visibility:hidden;pointer-events:none}
.deck-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 10px}
.perf-probe{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:90;
  background:rgba(16,24,40,.82);color:#fff;font-size:11px;line-height:1.5;padding:3px 8px;border-radius:8px;
  font-variant-numeric:tabular-nums;pointer-events:none}
.deck[data-open="1"] .deck-pos{display:none}
.deck-pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
sl-button.deck-more::part(base){border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;
  padding:5px 13px;font-size:12.5px;line-height:1.4}
sl-button.deck-more:hover::part(base){background:var(--line-2)}
.flow-map{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;padding:2px}
.flow-col{display:flex;flex-direction:column;gap:8px;min-width:118px;flex:1}
.flow-node{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0}
.flow-node b{display:block;font-size:12.5px;line-height:1.4;color:var(--fg);font-weight:600}
.flow-node span{font-size:11px;color:var(--muted)}
.flow-node.term{border-color:var(--ok);background:rgba(0,180,42,.06)}
.flow-arrow{color:var(--muted);font-size:13px;padding-top:12px;flex:none}
/* ---- 状态机/流程图：图容器内独立 pan/zoom，滚轮/双指/拖拽不冒泡成整页滚动 ---- */
.graph-wrap{position:relative;overflow:hidden;touch-action:none;border:1px dashed var(--line);border-radius:10px;
  height:clamp(320px,48vh,520px);max-width:100%;background:
  linear-gradient(rgba(127,127,127,.05) 1px,transparent 1px) 0 0/100% 22px,
  linear-gradient(90deg,rgba(127,127,127,.05) 1px,transparent 1px) 0 0/22px 100%;}
.graph-canvas{position:absolute;inset:0}
.graph-zoom{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.graph-zoom sl-button::part(base){width:26px;height:24px;padding:0;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:13px;line-height:1}
.graph-zoom sl-button[data-graph="fit"]::part(base){width:auto;padding:0 8px;font-size:11.5px}
.dag-legend{font-size:11px;color:var(--muted);padding:6px 2px 0;line-height:1.6}
.dag-transitions{display:flex;flex-direction:column;gap:2px;padding:8px 2px 0;font-size:11.5px;line-height:1.55}
.dag-tr-head{font-size:11px;color:var(--muted);font-weight:600}
.dag-tr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dag-tr .flow{color:var(--fg-2);white-space:nowrap}
.dag-tr .why{color:var(--fg)}
.dag-tr.back .flow,.dag-tr.back .why{color:#e2571e}
.gate-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.gate-card header{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.gate-card header b{font-size:12.5px;color:var(--fg)}
.gate-card header span{font-size:11px;color:var(--muted)}
.gate-card h5{margin:6px 0 3px;font-size:11.5px;color:var(--fg-2);font-weight:600}
.gate-card ul{margin:0;padding-left:16px}
.gate-card li{font-size:11.5px;line-height:1.65;color:var(--fg-2)}
.gate-must li::marker{content:"☐ "}
.gate-forbid{color:#e2571e}
.gate-forbid li{color:#c04a18}
.gate-card code{font-size:10.5px;color:var(--muted);margin-right:5px;background:var(--line-2);padding:0 4px;border-radius:4px}

/* 跨 deck 统一固定高：任何卡片都不按内容多少变高；超出部分限行/裁切。
   头部操作按钮在顶部行内完整保留，不被裁切。 */
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--pcard-pad);height:var(--pcard-h);overflow:hidden;cursor:pointer;transition:border-color .15s,transform .08s;display:flex;flex-direction:column}
.pcard:hover{border-color:var(--accent)}
.pcard:active{transform:scale(.995)}
.pcard:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.pcard.archived{cursor:default;opacity:.72}
.pcard .phead{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;min-width:0;padding-right:20px}
.pcard .pname{font-size:var(--pcard-name);font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .phead .badge{flex:none}
.pcard .phead .acts{flex:none}
/* meta 固定 2 行省略；stat 单行；chips 单行横向裁切，都不把卡片撑高 */
.pcard .meta{font-size:var(--pcard-meta);color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
/* meta 多段之间留一个中点：字段名与值挨在一起读不出断句 */
.pcard .meta span:not(:last-child)::after{content:" · ";color:var(--line)}
.pcard .meta span,.pcard .stat,.pcard .chips-row{overflow-wrap:anywhere}
.pcard .stat{font-size:var(--pcard-stat-size);color:var(--fg-2);margin-top:10px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.pcard .stat b{font-size:var(--pcard-stat-num);color:var(--fg);font-weight:600}
.pcard .chips-row{flex-wrap:nowrap;overflow:hidden}
.pcard .chips{flex-wrap:nowrap;overflow:hidden;max-width:100%}
.pcard .chip{white-space:nowrap}
.pcard .acts{display:flex;gap:4px}
.pcard .acts sl-button::part(base){padding:3px 7px;font-size:11.5px;line-height:1.5;border-radius:7px;background:var(--card);border:1px solid var(--line);color:var(--fg-2)}
.pcard .acts sl-button:hover::part(base){border-color:var(--accent);color:var(--accent)}
.pcard .acts sl-button.danger:hover::part(base){border-color:var(--danger);color:var(--danger)}
.pcard .ar{position:absolute;right:14px;bottom:14px;color:var(--muted);font-size:16px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:15px;margin-bottom:6px;font-weight:600}
.cards .empty{grid-column:1/-1}

/* ---- 未归属工单 ---- */
.orphans{margin-top:18px}
.orphans summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none}
.orphans summary::-webkit-details-marker{display:none}
.orphans summary::before{content:"▸ ";color:var(--muted)}
.orphans[open] summary::before{content:"▾ "}
.orphans table{margin-top:10px}

/* ---- 知识归属树 ---- */
.tree{display:flex;flex-direction:column;gap:10px}
.tree-node{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.tree-node>summary{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;list-style:none}
.tree-node>summary::-webkit-details-marker{display:none}
.tree-node>summary::before{content:"▾ ";color:var(--muted)}
.tree-node:not([open])>summary::before{content:"▸ "}
.tree-node .badge{flex:none}
.tree-node-label{font-weight:600;font-size:13.5px;flex:none}
/* 空层行：与折叠条同款一张卡（同一套壳、同一内边距、同一 gap），
   只是不可折叠：没有三角、没有计数，说明文字退居 muted */
.tree-node-blank{display:flex;align-items:center;gap:8px;padding:11px 26px 11px 34px}
.tree-node-blank .tree-node-empty{margin-left:2px}
.tree-node-sub{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-node-count{margin-left:auto;font-size:12px;flex:none}
.tree-children{display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px 24px;border-top:1px solid var(--line-2)}
.tree-children .tree-node{box-shadow:none;background:transparent;border-color:var(--line-2)}
.tree-children .tree-node>summary{padding:9px 10px}
.tree-children .tree-children{padding-left:18px}
.tree-doc{display:flex;align-items:baseline;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.tree-doc:hover{background:var(--line-2)}
.tree-doc-name{font-size:13.5px;flex:none}
.tree-doc-path{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--bg);letter-spacing:.01em}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--line-2)}
tbody tr:last-child td{border-bottom:0}
.lane-right td{font-size:12.5px}
.lane-right td:first-child{font-weight:600;white-space:nowrap}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tbl-wrap .tbl-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg sl-button::part(base){border:0;border-radius:0;padding:5px 12px;font-size:12.5px;background:transparent}
.seg sl-button.on::part(base){background:var(--accent);color:#fff}

/* ---- 徽章 / 标签 ---- */
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px}
.badge.closed,.badge.gone{color:var(--ok);border-color:rgba(0,180,42,.4)}
.badge.open,.badge.running{color:var(--accent);border-color:rgba(47,107,255,.4)}
.badge.archived{color:var(--warn);border-color:rgba(255,125,0,.4)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips-row{display:flex;align-items:flex-start;gap:10px;min-width:0;margin-top:8px}
.chips-row>.chips-label{flex:none;font-size:12px;color:var(--muted);line-height:22px}
.chips-row>.chips{min-width:0}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip .chip-name{font-weight:600;color:var(--fg)}
.chip.st-busy .dot{background:var(--accent)}
.chip.st-idle .dot{background:var(--ok)}
.chip.st-offline .dot{background:var(--muted)}
.chip.st-offline{opacity:.55}
td .chip{margin:0 4px 4px 0}
/* ---- stack：分组堆叠列表，默认收起，展开态持久化 ---- */
.stack{display:flex;flex-direction:column;gap:8px}
.stack-bar{margin:2px 0}
.stack-item{border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stack-item>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;cursor:pointer;list-style:none}
.stack-item>summary::-webkit-details-marker{display:none}
.stack-title{font-weight:600;font-size:13px;min-width:0;overflow-wrap:anywhere}
.stack-badge{flex:none}
.stack-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.stack-field{display:grid;grid-template-columns:minmax(70px,110px) minmax(0,1fr);gap:8px;font-size:12px}
.stack-field>span{color:var(--muted)}
.stack-field>div{min-width:0;overflow-wrap:anywhere}
.stack-samples{display:flex;flex-direction:column;gap:6px}
.stack-samples .chips-label{font-size:11.5px;color:var(--muted)}
.stack-sample i{font-style:normal;color:var(--muted)}
.kind-key{font-style:normal;font-size:10.5px;color:var(--muted);background:var(--bg);padding:1px 5px;border-radius:5px}
.kind-note{font-size:11.5px;color:var(--muted);line-height:1.5}
.pmap-sub{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 100%}

/* ---- 按钮 ---- */
button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;transition:background .15s,border-color .15s,opacity .15s}
button:hover:not(:disabled){background:var(--line-2)}
sl-button.primary::part(base){background:var(--accent);border-color:var(--accent);color:#fff}
sl-button.primary:hover:not(:disabled)::part(base){background:#2457e0}
sl-button.danger::part(base){background:var(--card);color:var(--danger);border-color:rgba(245,63,63,.4)}
sl-button.danger:hover:not(:disabled)::part(base){background:rgba(245,63,63,.08)}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}

/* ---- 表单 / 弹窗 ---- */
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
input[readonly]{background:var(--line-2);color:var(--fg-2)}
textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field{margin-bottom:10px}
.field[data-drop]{border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.field[data-drop].drag{border-color:var(--accent);background:rgba(47,107,255,.06)}
.field[data-drop] textarea,.field[data-drop] sl-textarea{border:0;min-height:84px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* 弹窗主体由 sl-dialog 渲染；这里只补表单与底部按钮布局 */
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
sl-dialog .hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}

/* ---- 会话视图 ---- */
.ticket-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:stretch;height:calc(100vh - 150px)}
.ticket-grid.solo{grid-template-columns:minmax(0,1fr)}
/* ---- 工单聊天满高整改：聊天区是这页的主角，冗余高度全部让位 ----
   页大标题与 chat-head 里的工单标题重复，直接让位；grid 高度公式跟着减负，
   头部/状态条/composer 收紧——省下的每一像素都归消息区 */
#view-body:has(>.view-scroll>.ticket-grid .vsec[data-kind="chat"])>.view-head>div:first-child{display:none}
#view-body:has(>.view-scroll>.ticket-grid .vsec[data-kind="chat"])>.view-head{margin-bottom:6px}
.ticket-grid:has(.vsec[data-kind="chat"]){height:calc(100vh - 96px)}
.ticket-grid:has(.vsec[data-kind="chat"]) .chat-head{padding:8px 12px}
.ticket-grid:has(.vsec[data-kind="chat"]) .chat-head-title strong{font-size:14px}
.ticket-grid:has(.vsec[data-kind="chat"]) .chat-head-main{gap:1px}
.ticket-grid:has(.vsec[data-kind="chat"]) .role-board{padding:6px 12px}
.ticket-grid:has(.vsec[data-kind="chat"]) .composer{padding:8px 10px}
.ticket-grid:has(.vsec[data-kind="chat"]) .composer textarea{min-height:38px;max-height:110px}
.lane{display:flex;flex-direction:column;min-width:0;min-height:0}
.lane>.vsec{margin-bottom:0}
.lane-left>.vsec[data-kind="chat"]{flex:1;min-height:0;display:flex}
.lane-left>.vsec[data-kind="chat"] .chat-card{flex:1;min-height:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent;box-shadow:none}
.lane-left>.vsec[data-kind="composer"]{flex:none}
.lane-left>.vsec[data-kind="composer"] .composer{background:var(--card);border:1px solid var(--line);border-top:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);padding:10px 12px}
.lane-left>.vsec[data-kind="composer"] .composer textarea{min-height:56px;resize:none}
.chat-card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.chat-head-main{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;gap:3px}
.chat-head-title{display:flex;align-items:center;gap:8px;min-width:0}
.chat-head-title strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head-meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chat-head-meta i{font-style:normal;color:var(--line)}
.chat-head-meta span i{margin-right:5px}
.chat-head-meta .badge{flex:none}
/* 成员头像行：点击弹成员卡 */
.members{display:flex;align-items:center;margin-left:auto;flex:none;padding-left:10px}
sl-button.av-chip{position:relative;width:32px;height:32px;margin-left:-8px;color:#fff;font-weight:600;font-size:12.5px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
sl-button.av-chip::part(base){width:100%;height:100%;padding:0;border:2px solid var(--card);border-radius:12px;background:var(--av);display:flex;align-items:center;justify-content:center}
sl-button.av-chip:first-child{margin-left:0}
sl-button.av-chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(16,24,40,.16)}
sl-button.av-chip .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--card);background:var(--ok)}
sl-button.av-chip.st-busy .dot{background:var(--accent)}
sl-button.av-chip.st-offline .dot{background:var(--muted)}
.popover{position:fixed;z-index:60;width:min(330px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(16,24,40,.22);padding:14px 16px;font-size:13px}
.popover[hidden]{display:none}
.popover h4{margin:0 0 3px;font-size:14px;display:flex;align-items:center;gap:8px}
.popover .p-role{color:var(--muted);font-size:12px}
.popover .p-row{display:flex;gap:8px;margin-top:9px;font-size:12.5px;line-height:1.5}
.popover .p-row span{color:var(--muted);flex:none}
.popover .p-row div{color:var(--fg-2);min-width:0;word-break:break-word}
.chat-title{font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:8px;min-width:0}
.chat-title strong{color:var(--fg);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---- 群聊 TG 手感：聊天区带底色和暗纹，气泡浮在底上，头像圆、底对齐 ---- */
.chat{flex:1;min-height:0;overflow:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:8px;
  background:
    radial-gradient(circle at 18% 12%, rgba(47,107,255,.05) 0 14px, transparent 15px),
    radial-gradient(circle at 82% 38%, rgba(47,107,255,.04) 0 18px, transparent 19px),
    radial-gradient(circle at 30% 76%, rgba(47,107,255,.04) 0 12px, transparent 13px),
    var(--chat-bg)}
.chat>*:first-child{margin-top:auto}
.chat-empty{margin:auto;color:var(--muted);font-size:13px}
/* 日期签：跨天插一条居中胶囊 */
.chat-day{align-self:center;margin:8px 0 2px}
.chat-day>span{display:inline-block;padding:3px 12px;border-radius:999px;background:rgba(127,127,127,.16);color:var(--fg-2);font-size:11.5px}
.chat-summary{flex:none;margin:10px 16px 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2,transparent);font-size:12px;color:var(--muted)}
.chat-summary>summary{cursor:pointer;color:var(--fg-2)}
.chat-summary-text{margin-top:6px;white-space:pre-wrap;line-height:1.6}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:78%}
.msg.right{align-self:flex-end;flex-direction:row}
.msg.left{align-self:flex-start}
.msg.system{align-self:center;max-width:76%}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;background:var(--av);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.avatar-ph{visibility:hidden}
.msg-main{min-width:0}
.msg.right .msg-main{text-align:left}
.msg.right .msg-name{text-align:right}
/* 发言人名字用角色专属色，同组只出现一次 */
.msg-name{font-size:12px;margin-bottom:3px;font-weight:600;opacity:.92}
.bubble-stack{display:flex;flex-direction:column;gap:2px}
.msg.left .bubble-stack{align-items:flex-start}
.msg.right .bubble-stack{align-items:flex-end}
/* 报文两列：左列文字气泡，右列同一轮原始报文；窄屏降为上下两行，仍同卡同标题 */
.wire-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;min-width:0;width:100%}
.wire-side{min-width:0;min-height:0}
.wire-side-raw{display:flex;flex-direction:column;gap:6px}
.ev-to{display:inline-flex;align-items:center;font-size:11px;color:var(--fg-2);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
@media (max-width:719px){
  .wire-pair{grid-template-columns:minmax(0,1fr)}
}
.bubble-body{padding:7px 11px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;max-width:100%;box-shadow:0 1px 1.5px rgba(16,24,40,.08)}
.msg.left .bubble-body{border-top-left-radius:5px}
.msg.left .bubble-stack .bubble-body:last-child{border-bottom-left-radius:5px}
/* 自己的气泡 = TG 绿（暗色 = TG 紫），朝头像一侧收一个小角 */
.msg.right .bubble-body{background:var(--out-bg);border-color:var(--out-bg);color:var(--out-fg);border-top-right-radius:5px;box-shadow:0 1px 2px rgba(16,24,40,.14)}
.msg.right .bubble-stack .bubble-body:last-child{border-bottom-right-radius:5px}
/* 时间在消息之上：和名字同一行（右边对齐自己），悬停看完整年月日 */
/* 名字+时间固定高：展开原文/工具调用只让 bubble-stack 向下长，头像与名字时间不位移 */
.msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;min-width:0;height:18px;line-height:18px;overflow:hidden}
.msg.right .msg-head{justify-content:flex-end}
.msg-time{font-size:11px;line-height:1;color:var(--muted);opacity:.8;user-select:none;flex:none}
.msg.right .msg-time{color:var(--muted)}
.msg-ts{font-size:11px;color:var(--muted);margin-top:2px;text-align:right;user-select:none}
.bubble-body.draft{color:var(--muted)}
.bubble-body.md{white-space:normal;line-height:1.55}
.bubble-body.md p{margin:0}
.bubble-body.md p+p{margin-top:6px}
.bubble-body.md h5{margin:0 0 4px;font-size:13.5px;line-height:1.4}
.bubble-body.md ul,.bubble-body.md ol{margin:4px 0;padding-left:18px}
.bubble-body.md li{margin:2px 0}
.bubble-body.md code{padding:1px 5px;border-radius:5px;background:rgba(127,127,127,.14);font-size:12.5px}
.bubble-body.md a{color:inherit;text-decoration:underline}
.msg.right .bubble-body.md code{background:rgba(255,255,255,.2)}
.cursor{display:inline-block;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.msg.system .sys-body{padding:6px 12px;border-radius:10px;width:fit-content;max-width:100%;background:rgba(127,127,127,.16);color:var(--fg-2);font-size:12px;box-shadow:none;border:0;overflow-wrap:anywhere}
/* ---- 工单历程：系统事件气泡（TG 服务消息口径） ---- */
.msg.event{align-self:center;max-width:78%}
.msg.event .sys-body{display:block;width:fit-content;max-width:100%;background:rgba(127,127,127,.16);border:0;border-radius:10px;padding:6px 12px;font-size:12px;color:var(--fg-2);line-height:1.6;box-shadow:none;overflow-wrap:anywhere}
.msg.event .ev-line{display:block}
.msg.event .sys-body.clamp{cursor:pointer}
.msg.event .sys-body.clamp:hover{background:rgba(127,127,127,.26)}
.msg.event .ev-label{font-weight:600;color:var(--fg-2);margin-right:6px}
.msg.event .ev-text{min-width:0;word-break:break-word}
.msg.event .ev-ts{display:block;color:var(--muted);font-size:11px;margin-top:2px}
/* ---- 工具过程消息 ---- */
.tool-msg .msg-name{color:var(--muted)}
.bubble-body.tool{background:var(--bg);border:1px solid var(--line);color:var(--fg-2);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.bubble-body.tool.md{white-space:normal;line-height:1.55}
.bubble-body.tool.error{background:rgba(245,63,63,.08);border-color:rgba(245,63,63,.3);color:var(--danger);white-space:pre-wrap}

/* 工具调用：调用名与结果同卡，结果不再单独成条消息 */
.tool-call{display:block;padding:7px 11px;border:1px dashed var(--line);border-radius:10px;font-size:12px;color:var(--fg-2);background:var(--card);max-width:100%}
/* 群聊里工具往返默认收成一行，点开才展开明细 */
.tool-group{border:1px dashed var(--line);border-radius:10px;background:var(--bg);padding:0 10px;max-width:100%}
.tool-group>summary{cursor:pointer;list-style:none;padding:6px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tool-group>summary::-webkit-details-marker{display:none}
.tool-group>summary::before{content:"▸";color:var(--muted)}
.tool-group[open]>summary::before{content:"▾"}
.tool-group-body{display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.tool-group .tool-call{border-color:var(--line)}
.tool-call-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tool-call>summary{cursor:pointer;list-style:none}
.tool-call>summary::-webkit-details-marker{display:none}
.tool-call>summary:before{content:"▸";color:var(--muted);margin-right:2px}
.tool-call[open]>summary:before{content:"▾"}
.tool-call-body{margin-top:6px}
.tool-line{margin-top:4px;line-height:1.5;word-break:break-word}
.tool-line.err{color:var(--danger)}
.tool-line.pending{color:var(--muted)}
.tool-call .tool-raw{margin-top:4px}
.tool-call-name{font-weight:600;color:var(--purple)}
.tool-call-args{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all}
.tool-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:6px}
.tool-meta-item{font-size:12px;color:var(--fg-2)}
.tool-meta-item b{color:var(--purple);font-weight:600;margin-right:3px}
.tool-text{margin:6px 0;padding:8px 10px;border-radius:8px;background:rgba(127,127,127,.08);font-size:12.5px}
.tool-empty{color:var(--muted);font-size:12px}
.tool-items{margin:4px 0;padding-left:18px;font-size:12.5px}
.tool-trace{margin-top:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);word-break:break-all}
.tool-raw{margin-top:6px}
.tool-raw summary{cursor:pointer;color:var(--muted);font-size:11.5px;list-style:none}
.tool-raw summary::before{content:"▸ ";color:var(--muted)}
.tool-raw[open] summary::before{content:"▾ "}
.tool-raw pre{margin:6px 0 0;padding:8px;border-radius:8px;background:rgba(127,127,127,.10);font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
/* ---- 输入区 TG 化：胶囊输入框 + 圆润按钮，贴在聊天底色上 ---- */
/* 会话输入卡：textarea 左侧，右侧竖排语音/发送；追加备注是卡内一行小按钮 */
.composer{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--card);align-items:stretch;border-radius:var(--radius)}
.composer textarea{min-height:56px;max-height:140px;flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;resize:none;line-height:1.5}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.composer-actions{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;flex:none}
.composer sl-button::part(base){flex:none;border-radius:999px;padding:8px 14px}
.composer sl-button.primary::part(base){background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.composer sl-button.primary:hover::part(base){filter:brightness(1.06)}
.composer sl-button.voice::part(base){color:var(--accent);border-color:rgba(36,87,224,.4);background:var(--accent-weak)}
.composer sl-button.voice.on::part(base){background:var(--danger);border-color:var(--danger);color:#fff}
.composer-wrap{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.composer-wrap .composer{flex:1}
.composer.off textarea,.composer.off sl-button{opacity:.55;cursor:not-allowed}
.composer-hint{width:100%;font-size:12px;color:var(--muted)}
.composer-hint.busy{color:#8a5a00}
.field-hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:-2px}
.side-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.side-card h3{font-size:13px;margin:0 0 10px;color:var(--fg);font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;line-height:1.5;padding:6px 0;border-bottom:1px solid var(--line-2)}
.kv span{color:var(--muted);flex:none}
.kv div{color:var(--fg-2);text-align:right}
.doc-body{font-size:12.5px;line-height:1.6;white-space:normal;overflow-wrap:break-word}
.doc-body p{margin:0}
.doc-body p+p{margin-top:6px}
.doc-body h5{margin:8px 0 4px;font-size:13px;line-height:1.4}
.doc-body ul,.doc-body ol{margin:4px 0;padding-left:18px}
.doc-body li{margin:2px 0}
.doc-body code{padding:1px 5px;border-radius:5px;background:rgba(127,127,127,.14);font-size:12px}
.doc-body a{color:inherit;text-decoration:underline}
#banner{display:none;margin:0 22px;padding:10px 14px;border-radius:10px;font-size:12.5px}
#banner.err{display:block;background:rgba(245,63,63,.1);color:var(--danger)}
#banner.ok{display:block;background:rgba(0,180,42,.1);color:var(--ok)}
#banner.info{display:block;background:var(--accent-weak);color:var(--accent)}
#status{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line-2)}

/* ---- 两级侧栏：一级分组、二级页面；移动底栏固定在安全区之上 ---- */
.nav{display:flex;flex-direction:column;gap:6px;min-height:0;flex:1 1 auto;overflow:hidden}
/* 一级分组做成顶栏页签，二级列表独占整宽：两列并排会让“资产”组按钮和“工作”的叶子错行，看着像串组 */
.nav-primary{display:flex;flex-direction:row;gap:2px;min-width:0;flex:none;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.nav-primary>sl-button{flex:1 1 0;min-width:0}
.nav-group-btn::part(base){width:100%;min-width:0;justify-content:center;gap:4px;min-height:36px;padding:5px 4px;border-radius:9px;color:var(--fg-2);font-size:12px}
.nav-group-btn.on::part(base){background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-group-label{white-space:nowrap}
.nav-group-ico{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:none;font-size:15px}
.nav-secondary{display:flex;flex-direction:column;gap:3px;min-height:0;overflow-y:auto;padding-top:2px}
.nav-back::part(base){justify-content:flex-start;padding:7px 10px;color:var(--muted);font-size:12px}
.nav-sec-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 2px}
.nav-sec-head span{font-size:12px;font-weight:600;color:var(--fg-2);letter-spacing:.04em}
.nav-sec-head em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-items{display:flex;flex-direction:column;gap:2px}
.nav-leaf::part(base){justify-content:flex-start;padding:7px 10px;border-radius:9px;color:var(--fg-2);font-size:12.5px}
.nav-leaf.on::part(base){background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-empty{font-size:11.5px;color:var(--muted);line-height:1.6;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
/* 覆盖通用 .nav sl-button 的宽松内边距：一级页签 36、二级叶子 34，紧凑但不挤 */
.nav .nav-group-btn{height:36px}
.nav .nav-group-btn::part(base){height:36px;min-height:36px;justify-content:center;padding:5px 4px;font-size:12px;border-radius:9px}
.nav .nav-leaf{height:34px}
.nav .nav-leaf::part(base){height:34px;min-height:34px;padding:7px 10px;font-size:12.5px;border-radius:9px}
/* 底栏配置：入口在侧栏底部，勾选即存本地，不复制一份菜单数据 */
.tab-config{flex:none;padding:10px 4px 2px;border-top:1px solid var(--line-2);margin-top:8px;background:var(--card)}
.tcfg-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 6px 8px}
.tcfg-head b{font-size:12.5px;color:var(--fg)}
.tcfg-head span{font-size:11px;color:var(--muted)}
.tcfg-list{display:flex;flex-direction:column;gap:2px;max-height:30vh;overflow-y:auto}
.tcfg-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;padding:2px 8px;border-radius:8px;cursor:pointer}
.tcfg-row:hover{background:var(--line-2)}
.tcfg-row sl-checkbox{font-size:12.5px;color:var(--fg-2)}
.tcfg-row>span{font-size:10.5px;color:var(--muted);flex:none}
#tab-config-btn.on::part(base){background:var(--accent-weak);color:var(--accent)}

/* ---- IM 风外壳：分组标题 + 圆角高亮行；移动底栏固定在安全区之上 ---- */
.nav{gap:2px}
.nav-group{gap:2px;padding:0 4px}
.nav-group + .nav-group{margin-top:10px;padding-top:10px}
.nav-group-title{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:2px 10px 6px}
.nav sl-button::part(base){justify-content:flex-start;gap:9px;min-height:40px;padding:9px 12px;border-radius:12px}
.nav sl-button::part(label){display:inline-flex;align-items:center;gap:9px;min-width:0}
.ico-ph{width:22px;height:22px;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* 卡片版式：grid 网格 / list 列表；deck 堆叠逻辑保持现状 */
.cards.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--pcard-gap);grid-auto-rows:1fr}
.cards.list{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pcard.grid,.pcard.list{height:auto}
.pcard.grid .phead{padding-left:48px;flex-wrap:wrap;row-gap:4px}
/* 网格卡标题独占一行：徽标与操作落到第二行，两列窄卡里标题才不会被挤成一个字 */
.pcard.grid .pname{flex:1 1 100%}
.pcard.list{min-height:64px;border:0;border-radius:0;box-shadow:none;background:transparent}
.pcard.list + .pcard.list{border-top:1px solid var(--line-2)}
.pcard.list .phead{padding-left:56px}
.pcard.list .stat,.pcard.list .meta,.pcard.list .csub{margin-left:56px}
.pcard.list .acts{display:none}
.pav{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent-weak);color:var(--accent);font-weight:600}
.pcard.grid .pav{position:absolute;left:14px;top:14px;width:36px;height:36px;font-size:15px}
.pcard.list .pav{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:40px;height:40px;font-size:15px}
.csub{font-size:12.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.list .ar{top:50%;bottom:auto;transform:translateY(-50%)}

/* 底栏：桌面隐藏；窄屏固定底部，高度 56px + 安全区留白 */
.tabbar{display:none}
@media (max-width:720px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;align-items:stretch;gap:2px;
    background:var(--card);border-top:1px solid var(--line);
    padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tab{flex:1 1 0;min-width:0;height:56px}
  .tab::part(base){flex-direction:column;justify-content:center;gap:3px;padding:4px 2px;border-radius:12px;color:var(--fg-2)}
  .tab::part(label){display:inline-flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .tab-ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
  .tab-ico sl-icon{font-size:19px}
  .tab .tab-label{font-size:10.5px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab:hover::part(base){background:var(--line-2)}
  .tab.on::part(base){background:var(--accent-weak);color:var(--accent)}
  .cards.list{display:flex}
}
@media (max-width:719px){
  /* 项目列表按 IM 会话列表排：单列通栏，标题与最近消息不再被两列窄卡挤断 */
  .cards.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  /* 卡内三枚操作会把标题区挤爆：操作收进项目详情，卡面只留入口 */
  .pcard.grid .acts{display:none}
  .pcard.grid .phead{padding-left:44px}
  .pcard.grid .stat{font-size:12px;gap:4px;flex-wrap:wrap;white-space:normal}
  /* 两列窄卡里计数说明会换行成悬空的中点：只留主数字，明细进项目详情看 */
  .pcard.grid .stat .muted{display:none}
}

/* ---- 桌面：侧栏常驻且可收起（rail） ---- */
.rail-open{display:none;position:fixed;left:14px;top:14px;z-index:45;width:38px;height:38px;background:var(--card);box-shadow:var(--shadow)}
@media (min-width: 900px) {
  .topbar{display:none}
  .scrim{display:none}
  .sidebar{position:sticky;top:0;height:100vh;transform:none;box-shadow:none;transition:width .18s ease,padding .18s ease;
    overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .sidebar::-webkit-scrollbar{width:0}
  .shell{align-items:stretch}
  .sidebar.collapsed{width:0;padding:0;border-right:0;overflow:hidden}
  .sidebar.collapsed+.scrim{display:none}
  .nav{flex-direction:column;gap:6px;align-items:stretch;overflow:hidden}
  .nav-primary{flex:none;width:auto;min-width:0}
  .nav-group-btn::part(base){flex-direction:row;justify-content:center;gap:4px;min-width:0;min-height:36px;padding:5px 4px;font-size:12px}
  .nav-secondary{display:flex;flex:1;min-width:0;max-height:100%;overflow-y:auto}
  .nav-back{display:none}
  body.rail .rail-open{display:flex}
  body.rail main{padding-top:62px}
}
@media (max-width: 899px) {
  .rail-btn{display:none}
  .nav-primary{flex-direction:column;gap:4px;padding-bottom:0;border-bottom:0}
  .nav-primary>sl-button{flex:0 0 auto}
  .sidebar.group-open .nav-primary{display:none}
  .sidebar.group-open .nav-secondary{display:flex}
}

/* ---- 窄屏响应式（手机 / 窄窗） ---- */
@media (max-width: 720px) {
  .sidebar{width:280px}
  html,body{height:100%;overflow:hidden}
  .shell{height:100dvh;min-height:0}
  .main-col{height:100dvh;max-height:100dvh;overflow:hidden}
  .sidebar{height:100dvh;overflow-y:auto;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  main{padding:8px 10px calc(56px + env(safe-area-inset-bottom));flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  /* 手机上一屏只有群聊：面包屑与页面大标题合并，去掉一层重复 */
  /* 面包屑保留：顶部要能看出现在在哪一级（项目 / 工单 / 会话） */
  .crumb{display:flex;font-size:12px;gap:0;padding:2px 2px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .crumb::-webkit-scrollbar{display:none}
  .crumb button{padding:0;flex:none}
  .crumb .now{max-width:46vw;flex:none}
  .crumb .sep{flex:none;padding:0 4px}
  main .crumb{margin-bottom:2px}
  .view-head{padding:0 2px 8px;gap:6px;margin-bottom:0;flex:none;flex-wrap:wrap;align-items:flex-start}
  /* 标题至少占六成宽：短标题与按钮同一行，长标题自然把按钮挤到下一行 */
  .view-head>div:first-child{flex:1 1 60%;min-width:0}
  .view-head .spacer{display:none}
  .view-head .actions{margin-left:auto}
  .view-head h2{font-size:17px;word-break:break-word}
  .view-head .desc{display:none}
  /* 一屏一页：内容区横向吸附，一块内容一张卡，卡内滚动，整页不纵向长滚 */
  #view-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  #view-body{position:relative}
  /* 一页一张卡，纵向堆叠：卡高少 44px，下一张的上沿露在底部 */
  /* 一页到底：所有区块按顺序自然铺开，内容超出就整块滚动，不做一屏一卡的吸附翻页 */
  /* 滚动位置由 scrollRestore 自己还原：关掉浏览器滚动锚定，免得它按自己的锚点再挪一次 */
  #view-body .view-scroll,#view-body .chat,#view-body .tbl-wrap,#view-body .deck-stage,#view-body .flow-map,#drawer .drawer-body{overflow-anchor:none}
  .view-scroll{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px;overscroll-behavior:contain}
  .view-scroll::-webkit-scrollbar{display:none}
  /* 桌面的双栏容器在手机上摊平，两栏的每一节都成为同一堆的卡片 */
  .view-scroll>.ticket-grid,.view-scroll>.ticket-grid>.lane{display:contents}
  /* 聊天是主角：手机端 chat 栏占满 composer 以上，别让卡片按内容缩成三分之一 */
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"]){display:flex;flex-direction:column;gap:0;height:calc(100dvh - 96px);min-height:0}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"])>.lane{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"]) .vsec[data-kind="chat"]{flex:1 1 auto;min-height:0;display:flex}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"]) .vsec[data-kind="chat"] .chat-card{flex:1 1 auto;min-height:0}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"]) .vsec[data-kind="composer"]{flex:0 0 auto}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"]) .role-board{display:none} /* 手机上成员头像已能点开状态，整条状态板让位给消息区 */
  .view-scroll>.vsec,.view-scroll .lane>.vsec{flex:0 0 auto;width:100%;height:auto;min-height:0;margin:0;
    overflow:visible;display:flex;flex-direction:column}
  /* 只有一页时不留堆叠的缺口，直接占满 */
  .view-scroll>.vsec:only-child,.view-scroll>.lane>.vsec:only-child{height:100%}
  /* 折叠区块展开后卡内已有标题，卡外那条 summary 会重复，手机上隐藏 */
  .view-scroll>.vsec>.orphans>details[open]>summary,
  .view-scroll .lane>.vsec>.orphans>details[open]>summary{display:none}
  .view-scroll .vsec>.tree,.view-scroll .vsec>.tbl-wrap,.view-scroll .vsec>.cards,
  .view-scroll .vsec>.flow-grid,.view-scroll .vsec>.side-card,
  .view-scroll .vsec>.empty,.view-scroll .vsec>.chat-card{flex:0 1 auto;min-height:0;overflow-y:auto}
  .view-scroll .vsec>.stat-strip{flex:0 0 auto}
  /* 手机上统计格压到三列，一行读完，不拉成竖条 */
  .view-scroll .vsec>.stat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}

  .view-scroll .vsec>.side-card{flex:0 0 auto}
  /* 树节点在手机上一页到底，行高收一点，长清单才不至于滚半天 */
  .view-scroll .vsec>.tree .tree-node>summary{padding:7px 10px}
  .view-scroll .vsec>.tree .tree-children .tree-node>summary{padding:6px 8px}
  .view-scroll .vsec .stat-cell{padding:10px 11px;border-left:0}
  .view-scroll .vsec .stat-cell b{font-size:20px}

  .chat-card{flex:1 1 auto;height:auto;max-height:none;min-height:200px;border-radius:14px}
  .chat{max-height:none}
  .chat-head{padding:6px 10px;flex-wrap:nowrap;gap:6px}
  .chat-head-title strong{font-size:13px}
  .chat-head-meta{flex-wrap:nowrap;gap:2px 6px;font-size:11px}
  .chat-head-actions sl-button::part(base){padding:4px 8px;font-size:11px}
  .role-board{padding:3px 8px;gap:5px}
  .role-board .board-lab{display:none}
  .role-mini::part(base){padding:3px 8px;font-size:11px}
  .av-chip::part(base){min-width:28px;height:28px;padding:0}
  .chat-head-meta>span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;max-width:150px}
  .chat-head-meta>span:nth-of-type(n+2){display:none} /* 项目名/更新时间在面包屑与会话里都有，手机上不重复占位 */
  .chat{padding:12px 12px}
  .row2{grid-template-columns:1fr}
  .cards{display:flex;flex-direction:column;gap:10px}
  .deck-stage{--ox:8px;--oy:17px}
  .deck[data-open="1"] .deck-stage{display:flex;flex-direction:column;gap:10px}
  /* 手机端不要阴影：层次用边框和底色区分，卡片堆叠也一样 */
  .pcard,.card,.tbl-wrap,.tree-node,.stat-strip,.side-card,.flow-card,.wf,
  .vsec-fold>details,.chat-card,.composer,.popover{box-shadow:none}
  /* 堆叠卡按层位写过更具体的阴影，得按同样的选择器压掉，否则叠起来仍是浮的 */
  .deck[data-open="0"] .deck-stage>.pcard[data-front="1"],
  .deck[data-open="0"] .deck-stage>.pcard:not([data-front="1"]),
  .deck[data-dragging="1"] .deck-stage>.pcard[data-front="1"]{box-shadow:none}
  /* 离屏区块交给浏览器跳过渲染；带卡片堆叠的区块要量高度，不能跳 */
  .view-scroll .vsec>.cards.deck{overflow:visible}
  /* 移动档沿用同一套 pcard token，只按比例略放大；不再单独把 pname 拉到 17.5px */
  :root{--pcard-name:16px;--pcard-meta:12.5px;--pcard-stat-size:12.5px;--pcard-stat-num:20px;--pcard-pad:16px 16px 14px;--pcard-h:160px}
  .cards>.pcard .chips{flex-wrap:nowrap;overflow:hidden}
  /* 表格折成「字段名 + 值」的行式卡片：不用横向拖表，列不会被裁掉 */
  .tbl-wrap{overflow-x:visible}
  .tbl-wrap table{min-width:0;width:100%}
  /* 表头：标题与说明各占一行，避免标题被挤成竖排 */
  .tbl-wrap .tbl-head{flex-wrap:wrap;align-items:flex-start;gap:4px 8px}
  .tbl-wrap .tbl-head strong{flex:none;white-space:nowrap}
  .tbl-wrap .tbl-head .muted{flex:1 1 100%;min-width:0}
  .tbl-wrap thead{display:none}
  .tbl-wrap tbody tr{display:block;padding:8px 12px;border-bottom:1px solid var(--line-2)}
  .tbl-wrap tbody tr:last-child{border-bottom:0}
  /* 单元格：字段名在上、值占满一行，长串（如工具清单）不再被窄列挤成碎片 */
  /* 字段名在左、值在右：一行一字段，长串自然折行，不再一人两行 */
  .tbl-wrap td{display:grid;grid-template-columns:minmax(56px,86px) minmax(0,1fr);gap:8px;
    align-items:baseline;padding:2px 0;border:0;text-align:left;word-break:break-word;
    font-size:12.5px;line-height:1.45}
  .tbl-wrap td::before{content:attr(data-th);color:var(--muted);font-size:11px;text-align:left}
  .tbl-wrap td:first-child{display:block;font-size:15px;font-weight:650;text-align:left;padding-top:8px}
  .tbl-wrap td:first-child::before{display:none}
  .tbl-wrap td.actions{display:flex;justify-content:flex-end}
  .tbl-wrap td>.badge,.tbl-wrap td>span.badge{justify-self:start}
  .msg{max-width:92%}
  /* 手机群聊：输入框一行、操作按钮一行，别让底部把聊天区挤成三分之一 */
  .composer{flex-wrap:wrap;padding:6px 8px;gap:4px;align-items:flex-end}
  .lane-left>.vsec[data-kind="composer"] .composer{padding:6px 8px}
  .composer textarea,.lane-left>.vsec[data-kind="composer"] .composer textarea{flex:1 1 100%;min-width:0;min-height:36px;max-height:76px;padding:7px 10px;line-height:1.3;border-radius:12px}
  .composer-actions{flex-direction:row;gap:5px;width:100%;justify-content:flex-end;align-items:center}
  .composer-actions sl-button::part(base){height:32px;min-height:32px;padding:4px 10px;font-size:12px}
  .composer button{flex:none}
  /* 原始报文贴在原消息右侧，窄屏也不折成下一行当新消息 */
  .wire-pair{grid-template-columns:minmax(0,1fr) 88px;gap:6px}
  .wire-side-raw .raw-box summary{font-size:10px;line-height:1.35}
  #banner{margin:0 14px}
}

/* 角色状态板：一行看全组谁在哪个阶段，破折号换成点互斥；点开复用成员卡 */
.role-board{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.role-board::-webkit-scrollbar{display:none}
.role-board .board-lab{flex:none;font-size:11.5px;color:var(--muted);letter-spacing:.02em;padding-right:2px}
sl-button.role-mini{flex:none;max-width:100%}
sl-button.role-mini::part(base){display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px 5px 9px;font-size:12px;color:var(--fg-2);max-width:100%}
sl-button.role-mini:hover::part(base){border-color:var(--accent);background:var(--accent-weak)}
sl-button.role-mini b{font-size:12.5px;color:var(--fg);font-weight:600}
.rm-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.role-mini.st-busy .rm-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.role-mini.st-err .rm-dot{background:#f53f3f}
.role-mini.st-done .rm-dot{background:#00b42a}
.rm-stage{color:var(--accent);font-weight:600}
.rm-active{color:var(--muted);border-left:1px solid var(--line);padding-left:6px;font-size:11.5px}
/* 原报文：结构化对象原样展开，谁都别猜字段 */
.raw-box{margin-top:4px;font-size:11.5px}
.raw-box summary{cursor:pointer;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:6px}
.raw-box summary:hover{color:var(--fg-2);background:var(--line-2)}
.raw-box summary::-webkit-details-marker{display:none}
.raw-box summary::before{content:"▸";font-size:10px}
.raw-box[open] summary::before{content:"▾"}
.raw-box pre{margin:4px 0 0;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:11px;line-height:1.55;color:var(--fg-2);white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto}
.inject{display:flex;flex-direction:column;gap:6px;padding:6px 4px 0}
.inject-note{font-size:11.5px;color:var(--muted);line-height:1.6}
.inject .raw-box{margin:0}
/* 成员卡里的流程链 */
.p-flow{font-size:12px;color:var(--muted);margin-bottom:5px}
.st-chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.st-pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--fg-2);border:1px solid transparent;white-space:nowrap}
.st-pill.cur{background:var(--accent-weak);color:var(--accent);border-color:rgba(47,107,255,.3);font-weight:600}
.st-pill.on{color:var(--fg);font-weight:600;border-color:var(--line)}
.st-pill.term{color:var(--muted)}
.st-arrow{color:var(--muted);font-size:11px}

/* 待办板：模型自排计划，和岗位流程状态机分开看 */
.todo-board{margin:8px 4px 0;font-size:12px}
.todo-board summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg-2)}
.todo-board summary::-webkit-details-marker{display:none}
.todo-board summary::before{content:"▸";font-size:10px;color:var(--muted)}
.todo-board[open] summary::before{content:"▾"}
.todo-board summary b{color:var(--fg)}
.td-list{margin-top:6px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.td-row{display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--fg-2)}
.td-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.td-dot.doing{background:var(--accent)}
.td-dot.done{background:#00b42a}
.td-id{font-size:11px;color:var(--muted);min-width:22px}
.td-text{flex:1;min-width:0;overflow-wrap:anywhere}
.td-text.off{text-decoration:line-through;color:var(--muted)}
.td-row em{font-size:11px;color:var(--muted);font-style:normal}


/* ---- 架构页：指标条 / 区块头 / 状态机 ---- */
.sec-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.sec-head strong{font-size:13.5px;font-weight:650}
.sec-head .muted{font-size:12px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 4px}
.stat-cell{padding:2px 16px;border-left:1px solid var(--line-2);min-width:0}
.stat-cell:first-child{border-left:0}
.stat-cell .stat-label{display:block;font-size:13px;color:var(--fg-2);font-weight:600;letter-spacing:0}
.stat-cell b{display:block;font-size:25px;line-height:1.16;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.stat-cell span{display:block;font-size:12.5px;color:var(--fg-2);margin-top:3px}
.stat-cell em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:1px}
.flow-col-t{font-size:11.5px;line-height:1.3;color:var(--muted);font-weight:600;margin-bottom:5px}
.map-num{display:block;font-style:normal;font-size:19px;line-height:1.15;font-weight:650;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 2px}
.flow-grid.map-grid{grid-template-columns:1fr}
.map-grid .flow-col{min-width:0;flex:1 1 0}
.map-grid .flow-node span{display:block;word-break:break-word}
.map-grid .flow-map{gap:8px}
.map-grid .flow-card{min-width:0}
.map-foot{display:flex;flex-direction:column;gap:6px;min-width:0;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.map-foot .chips{flex-wrap:wrap;min-width:0}
.map-foot .chip{white-space:nowrap}
.flow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:14px}
.flow-grid.single{grid-template-columns:1fr}
.flow-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.flow-card header{display:flex;align-items:baseline;gap:8px;margin-bottom:11px;min-width:0}
.flow-card h4{margin:0;font-size:14px;font-weight:650}
.flow-card header .muted{margin-left:auto;flex:none;font-size:11.5px}
.flow-chain{list-style:none;margin:0;padding:0}
.flow-state{display:flex;gap:10px;padding:0 0 14px;position:relative}
.flow-state:last-child{padding-bottom:0}
.flow-state:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:15px;bottom:0;width:1px;background:var(--line)}
.flow-dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px;background:var(--card);border:2px solid var(--accent);position:relative;z-index:1}
.flow-state.term .flow-dot{background:var(--ok);border-color:var(--ok)}
.flow-line{min-width:0;font-size:12.5px}
.flow-line strong{font-size:13px;font-weight:600;margin-right:6px}
.flow-line p{margin:2px 0 0;line-height:1.55}
.flow-next{margin-top:3px;font-size:11.5px;color:var(--muted)}
.flow-next .k{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--fg-2)}


/* 列表式树：整块一张卡，行与行只隔一条细线，适合装几十上百条 */
.vsec-list[data-kind="tree"] .tree{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px;gap:0}
.vsec-list .tree-node{border:0;border-radius:8px;box-shadow:none;background:transparent}
.vsec-list .tree-node>summary{padding:7px 12px}
.vsec-list .tree-node>summary:hover{background:var(--line-2)}
.vsec-list .tree-node>summary .badge{min-width:34px;justify-content:center}
.vsec-list .tree-children{gap:0;padding:2px 6px 6px 22px;border-top:1px solid var(--line-2)}
.vsec-list .tree-children .tree-node{border-radius:6px}
.vsec-list .tree-children .tree-doc{padding:4px 10px;border-radius:6px;line-height:1.5}
.vsec-list .tree-children .tree-node>summary{padding:8px 10px}

.vsec-fold>details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.vsec-fold>details>summary{display:flex;align-items:baseline;gap:10px;padding:13px 16px;cursor:pointer;list-style:none}
.vsec-fold>details>summary::-webkit-details-marker{display:none}
.vsec-fold>details>summary::before{content:"▸";color:var(--muted);font-size:11px}
.vsec-fold>details[open]>summary::before{content:"▾"}
.vsec-fold>details>summary strong{font-size:13.5px;font-weight:650}
.vsec-fold>details>summary .muted{font-size:12px}
.vsec-fold>details[open]>summary{border-bottom:1px solid var(--line-2)}
.vsec-fold>details>*:not(summary) .tbl-wrap,.vsec-fold>details>*:not(summary) .tree{box-shadow:none;border:0;border-radius:0}
.vsec-fold>details>*:not(summary){padding:0}
/* 嵌套折叠不叠边框：内层折叠去掉阴影与重边框，避免一圈套一圈 */
.vsec-fold>details .elem-page,.vsec-fold>details .tree-node{box-shadow:none}
.vsec-fold>details .elem-page{border-color:var(--line-2)}

/* ---- 链路瀑布：左侧层级标签 + 右侧时间轴 ---- */
.wf{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px 16px}
.wf-row{display:grid;grid-template-columns:minmax(180px,32%) 1fr;gap:12px;align-items:center;padding:2px 0}
.wf-head{padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line-2)}
.wf-head .wf-label{font-size:11.5px;color:var(--muted);font-weight:600}
.wf-label{min-width:0;display:flex;align-items:baseline;gap:6px;font-size:12.5px}
.wf-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-caller{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.wf-meta{margin-left:auto;flex:none;font-size:11px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.wf-track{position:relative;height:18px;background:var(--bg);border-radius:5px;overflow:hidden}
.wf-bar{position:absolute;top:4px;height:10px;border-radius:3px;background:var(--accent);min-width:2px}
.wf-bar.d1{background:var(--purple)}
.wf-bar.d2{background:var(--teal)}
.wf-bar.d3{background:#a9aeb8}
.wf-bar.bad{background:var(--danger)}
.wf-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:2px}
/* ---- 移动端第二套骨架：底部 tab 栏（≤720px 生效） ---- */

@media (max-width:720px){
  .stat-strip{grid-template-columns:1fr 1fr;padding:12px 2px}
  .stat-cell{padding:4px 12px;border-left:0}
  .stat-cell:nth-child(even){border-left:1px solid var(--line-2)}
  .stat-cell b{font-size:21px}
  .flow-grid{grid-template-columns:1fr}
  /* 状态机在窄卡里也压成一行，不靠横向拖 */
  .flow-card{padding:12px 12px}
  .flow-card header .muted{display:none}
  .flow-map{gap:2px}
  .flow-col{min-width:0;flex:1 1 0}
  .flow-node{padding:5px 7px}
  .flow-node b{font-size:12px}
  .flow-node span{font-size:10px;word-break:break-all}
.flow-arrow{font-size:11px;padding:11px 0 0}
  /* 全景图在手机上转成纵向分层：一行一个环节，箭头朝下，一屏读完不用横拖 */
  .map-grid .flow-map{flex-direction:column;gap:2px;overflow:visible}
  .map-grid .flow-col{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;width:100%;min-width:0;gap:6px;align-items:stretch}
  .map-grid .flow-col-t{width:100%;margin-bottom:1px}
.map-grid .flow-arrow{transform:rotate(90deg);align-self:center;padding:0;line-height:1;height:12px;display:flex;align-items:center}
  .map-grid .flow-card{min-width:0;overflow:hidden;padding:10px 12px}
  .map-grid .flow-node{padding:4px 8px}
  .map-grid .flow-node b{font-size:15px}
  .map-grid .flow-node span{font-size:11px}
  .map-foot .chips{flex-wrap:wrap;max-width:100%}
  .map-foot .chips::-webkit-scrollbar{display:none}
  .map-foot .chip{flex:none}
  .map-grid .sec-head{flex-wrap:wrap}
  .map-grid .flow-node{flex:1 1 42%;min-width:0;padding:5px 8px}
  .map-grid .map-num{font-size:16px;line-height:1.25}
  .map-grid .flow-node span{font-size:10.5px;line-height:1.35}
  .map-grid .flow-col-t{font-size:11px;margin:0 0 2px}
  .map-grid .map-foot{margin-top:8px;padding-top:8px}
  .map-grid .flow-card{box-shadow:none}
  .map-grid .flow-map{gap:0}
  /* 群聊页：聊天与输入框是同一张卡，不在两页之间来回滑 */
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"]){flex:0 0 100%;width:100%;height:100%;display:flex;flex-direction:column;
    gap:8px;max-height:100%;overflow:hidden}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"])>.lane{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;gap:8px}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"])>.lane>.vsec{flex:0 0 auto;width:auto;height:auto;max-height:none;overflow:visible}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"])>.lane>.vsec[data-kind="chat"]{flex:1 1 auto;min-height:0;overflow:hidden}
  .view-scroll>.ticket-grid:has(.vsec[data-kind="chat"])>.lane>.vsec[data-kind="chat"]>.chat-card{flex:1 1 auto;min-height:0}
  .view-scroll .vsec[data-kind="chat"] .chat{min-height:0}
  /* 露出的角要能读出这是哪一页：▸ 与标题同行，note 放不下才折行 */
  .vsec-fold>details>summary{flex-wrap:wrap;align-items:baseline;gap:4px 8px}
  .vsec-fold>details>summary .muted{flex:1 1 100%}
  .wf-row{grid-template-columns:minmax(140px,50%) 1fr;gap:8px}
  .wf-caller{display:none}
  .wf-label{font-size:12px}
  .wf-ticks{display:none}
  .wf-head .wf-label{font-size:11px}
  .wf-label{flex-wrap:wrap;row-gap:1px}
  .wf-meta{width:100%;margin-left:0;order:2;font-size:10.5px}
  .side-foot{padding-bottom:20px}
}
#ops-insight{display:grid;gap:10px;margin-top:16px}
#ops-insight .ops-fold{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
#ops-insight .ops-fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:13px}
#ops-insight .ops-fold>summary::-webkit-details-marker{display:none}
#ops-insight .ops-fold>summary::before{content:"▸";color:var(--muted);font-size:12px}
#ops-insight .ops-fold[open]>summary::before{content:"▾"}
#ops-insight .ops-fold>summary strong{font-size:14px}
#ops-insight .ops-fold>summary span{color:var(--muted);flex:1}
#ops-insight .ops-fold>summary em{font-style:normal;color:var(--primary);font-size:12px}
#ops-insight .ops-fold[open]>summary em{display:none}
#ops-insight .ops-fold-body{padding:0 14px 14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="drawer">
    <div class="brand">
      <span class="logo" data-brand="logo"></span>
      <div><h1 data-brand="name"></h1><div class="sub" data-brand="tagline"></div></div>
      <sl-icon-button class="rail-btn" id="side-collapse" name="chevron-left" data-clk="rail_close" data-ctl="ctl.shell.rail_close" data-ctl-state="idle" data-ui-aria="collapse" data-ui-title="collapse"></sl-icon-button>
    </div>
    <!-- 导航项由后端菜单渲染：视图规格里的 menu 决定顺序与名称，页面不存清单 -->
    <nav class="nav" id="side-nav"></nav>
    <div class="tab-config" id="tab-config" hidden></div>
    <div class="side-foot">
      <sl-button id="tab-config-btn" variant="text" data-ui="tab_config" data-clk="tab_config" data-ctl="ctl.shell.tab_config" data-ctl-state="idle">底栏配置</sl-button>
      <sl-button id="logout" variant="text" data-ui="logout" data-clk="logout" data-ctl="ctl.shell.logout" data-ctl-state="idle"></sl-button>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-clk="drawer_scrim" data-ctl="ctl.shell.scrim" data-ctl-state="idle"></div>
  <div class="main-col">
    <header class="topbar">
      <sl-icon-button class="icon-btn" id="menu-btn" name="menu-button" data-clk="drawer_open" data-ctl="ctl.shell.menu" data-ctl-state="idle" data-ui-aria="menu"></sl-icon-button>
      <div class="brand-mini"><span class="logo" data-brand="logo"></span><h1 data-brand="name"></h1></div>
    </header>
    <sl-icon-button class="icon-btn rail-open" id="rail-open" name="menu-button" data-clk="rail_open" data-ctl="ctl.shell.rail_open" data-ctl-state="idle" data-ui-aria="expand" data-ui-title="expand"></sl-icon-button>
    <div id="banner"></div>
    <main>
      <div class="crumb" id="crumb"></div>
      <div id="view-body"><div class="loading"><sl-spinner></sl-spinner><span data-ui="loading"></span></div></div>
      <!-- 运维页洞察挂点：内容由 ops-insight.js 填充，本页只留钩子 -->
      <section id="ops-insight" hidden></section>
    </main>
  </div>
</div>

<!-- 手机底栏同样由后端菜单渲染：取声明了 tab 序号的菜单，内容与顺序都来自后端 -->
<nav id="tabbar" class="tabbar" aria-label=""></nav>

<!-- 成员卡浮层 -->
<div class="popover" id="popover" hidden></div>

<!-- 通用弹窗：三个控件的状态机在 console.yaml 里有名有姓，静态就盖 data-ctl，
     不等运行时兜底——弹窗骨架不进任何 stampCtl 覆盖区，漏盖就是永远裸奔 -->
<sl-dialog id="modal" data-clk="modal_backdrop" data-ctl="ctl.modal_backdrop" data-ctl-state="idle" class="modal-dialog">
  <p class="hint" id="modal-hint"></p>
  <div class="modal-err" id="modal-err"></div>
  <form id="modal-form"></form>
  <div slot="footer" class="modal-foot">
    <sl-button type="button" id="modal-cancel" data-clk="modal_cancel" data-ctl="ctl.modal_cancel" data-ctl-state="idle" data-ui="cancel"></sl-button>
    <sl-button type="submit" variant="primary" id="modal-ok" data-clk="modal_ok" data-ctl="ctl.modal_ok" data-ctl-state="idle" data-ui="ok"></sl-button>
  </div>
</sl-dialog>

<!-- Shoelace 组件包（离线 vendored，见 assets/shoelace/SHOELACE-LICENSE.md） -->
<script type="module" src="assets/shoelace/shoelace.js"></script>
<!-- 六个脚本由服务端按 web.bundle 清单合成一个响应：首屏只剩一次脚本往返 -->
<script defer src="assets/dagre.min.js"></script>
<script defer src="assets/cytoscape.min.js"></script>
<script defer src="assets/cytoscape-dagre.js"></script>
<script defer src="graph.js"></script>
<script defer src="/console.js"></script>
<!-- 运维页洞察：内容实现由并行任务交付，这里只挂入口 -->
<script defer src="ops-insight.js"></script>
</body>
</html>
