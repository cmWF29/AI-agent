<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hive AI · 项目与工单</title>
<style>
:root{color-scheme:light dark;--fg:#1d2129;--bg:#f7f8fa;--card:#fff;--line:#e5e6eb;--accent:#1664ff}
@media (prefers-color-scheme:dark){:root{--fg:#e5e6eb;--bg:#17171a;--card:#1f1f24;--line:#2f2f36;--accent:#6aa1ff}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,Segoe UI,Roboto,"Microsoft YaHei",Arial,"PingFang SC",sans-serif;color:var(--fg);background:var(--bg)}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:16px;margin:0}
header nav{display:flex;gap:8px}
header nav a{color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
header nav a.active{border-color:var(--accent);color:var(--accent)}
header .spacer{margin-left:auto}
input,select,textarea{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:64px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:6px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#f53f3f;border-color:#f53f3f}
button:disabled{opacity:.4;cursor:not-allowed}
main{display:grid;grid-template-columns:380px 1fr;gap:16px;padding:16px 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
section h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin:0 0 10px}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
form .full{margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{opacity:.6;font-weight:500}
.muted{opacity:.6;font-size:12px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px}
.badge.closed,.badge.gone{color:#00b42a;border-color:#00b42a}
.badge.archived{color:#ff7d00;border-color:#ff7d00}
.badge.running{color:#1664ff;border-color:#1664ff}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{padding:3px 8px;font-size:12px}
#status{margin-top:8px;font-size:12px;opacity:.7}
#banner{margin:12px 20px 0;padding:10px 14px;border-radius:10px;font-size:13px;display:none}
#banner.err{display:block;background:#ffece8;color:#f53f3f;border:1px solid #f53f3f}
#banner.ok{display:block;background:#e8ffea;color:#00b42a;border:1px solid #00b42a}
/* 分级树 */
.tree{margin-top:10px}
.proj{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.proj-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.proj-head .caret{width:14px;display:inline-block;transition:transform:.15s}
.proj.open .caret{transform:rotate(90deg)}
.proj-head .pname{font-weight:600;flex:1}
.proj-head .cnt{font-size:12px;opacity:.6}
.proj-body{display:none;border-top:1px solid var(--line)}
.proj.open .proj-body{display:block}
.ticket-row{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 34px;cursor:pointer;border-top:1px solid var(--line)}
.ticket-row:hover{background:var(--bg)}
.ticket-row.active{background:rgba(22,100,255,.08)}
.ticket-row .t-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orphans{margin-top:10px}
/* 群聊气泡 */
.chat{display:flex;flex-direction:column;gap:12px;max-height:46vh;overflow-y:auto;padding:4px 2px}
.bubble{display:flex;flex-direction:column;max-width:72%;gap:3px}
.bubble .who{font-size:12px;opacity:.65}
.bubble .body{padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.bubble.user{align-self:flex-end;text-align:right}
.bubble.user .body{background:#1c2b4d;border-color:#2b4070;color:#eaf1ff}
.bubble.assistant,.bubble.role{align-self:flex-start}
.bubble.system{align-self:center;max-width:90%}
.bubble.system .body{background:transparent;border-color:transparent;color:var(--fg);opacity:.55;font-size:12px}
.bubble .ts{font-size:11px;opacity:.5}
.thread-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer textarea{flex:1;min-height:44px}
.full{grid-column:1/-1}
@media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>项目与工单</h1>
  <nav>
    <a href="/index.html">装配控制台</a>
    <a href="/panel.html">消息面板</a>
    <a href="/manage.html" class="active">项目与工单</a>
  </nav>
  <div class="spacer"></div>
  <button id="logout">登出</button>
</header>
<div id="banner"></div>
<main>
  <section>
    <h2>项目 / 工单（分级）</h2>
    <form id="proj-form">
      <div class="row">
        <div><label class="muted">项目名称</label><input id="p-name" placeholder="例如：官网重构" required></div>
        <div><label class="muted">默认后端（可选）</label><input id="p-backend" placeholder="如 deepseek-chat"></div>
      </div>
      <div class="actions"><button class="primary" type="submit">新建项目</button>
        <button type="button" id="p-refresh">刷新</button></div>
    </form>
    <form id="ticket-form" style="margin-top:12px">
      <div class="row">
        <div><label class="muted">标题</label><input id="t-title" placeholder="工单标题" required></div>
        <div><label class="muted">所属项目</label><select id="t-project" required></select></div>
      </div>
      <div class="full"><label class="muted">需求目标</label><textarea id="t-goal" placeholder="要做什么、验收标准是什么"></textarea></div>
      <div class="row">
        <div><label class="muted">类型</label><select id="t-kind">
          <option value="normal">普通</option>
          <option value="stall-audit">停滞审计</option>
        </select></div>
        <div><label class="muted">父工单（可选）</label><input id="t-parent" placeholder="父工单 ID"></div>
      </div>
      <div class="actions"><button class="primary" type="submit">建工单</button></div>
    </form>
    <div class="tree" id="tree"></div>
  </section>

  <section>
    <h2>工单会话</h2>
    <div class="thread-meta" id="thread-meta"><span class="muted">从左侧项目展开后选择一个工单</span></div>
    <div class="chips" id="thread-roles"></div>
    <div class="chat" id="chat"><div class="muted" style="margin:auto">还没有消息</div></div>
    <div class="composer">
      <textarea id="op-text" placeholder="发给 PM 的消息，Enter 发送"></textarea>
      <button class="primary" id="op-message">发送</button>
    </div>
    <div class="actions" style="margin-top:10px">
      <button id="op-detail">查看详情</button>
      <button id="op-note">追加备注</button>
      <button id="op-close" class="danger">结单</button>
    </div>
    <pre id="detail" style="margin-top:10px;max-height:180px;overflow:auto"></pre>
    <div id="status"></div>
  </section>

  <section class="full">
    <h2>岗位库（岗位 = 系统提示词 + 流程规范；角色是岗位的实例）</h2>
    <table>
      <thead><tr><th>ID</th><th>名称</th><th>提示词</th><th>产出约束</th><th>流程检查</th></tr></thead>
      <tbody id="position-rows"></tbody>
    </table>
  </section>

  <section class="full">
    <h2>会话调试（内部推理会话）</h2>
    <div class="row" style="margin-bottom:10px">
      <div><label class="muted">按状态筛选</label><select id="s-filter-status">
        <option value="">全部</option><option value="idle">idle</option>
        <option value="queued">queued</option><option value="running">running</option>
        <option value="gone">gone</option>
      </select></div>
      <div><label class="muted">刷新</label><button id="s-refresh">刷新会话</button></div>
    </div>
    <table>
      <thead><tr><th>ID</th><th>名称</th><th>角色</th><th>所属工单</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
      <tbody id="session-rows"></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
function readCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}
const token = () => localStorage.getItem("ai_new_token") || readCookie("hive_token") || "";
function clearToken() {
  localStorage.removeItem("ai_new_token");
  sessionStorage.removeItem("hive.token");
  document.cookie = "hive_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
}
function headers() {
  const h = { "Content-Type": "application/json" };
  if (token()) h["X-Auth-Token"] = token();
  return h;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

const ticketMap = {};
const sessionMap = {};
let selId = "";

async function run(demand, input) {
  let resp, body;
  try {
    resp = await fetch("/api/rpc/demand_engine/run", {
      method: "POST", headers: headers(),
      body: JSON.stringify({ id: demand, input: input || {} })
    });
    body = await resp.json().catch(() => ({ ok: false, error: "响应不是 JSON", code: "bad_json" }));
  } catch (e) {
    throw Object.assign(new Error("网络请求失败：" + e.message), { status: 0, code: "network" });
  }
  if (!body.ok) {
    if (resp.status === 401 || body.code === "unauthorized") { clearToken(); location.href = "/login.html"; return; }
    throw Object.assign(new Error(body.error || ("HTTP " + resp.status)),
      { status: resp.status, code: body.code });
  }
  const inner = (body.result && body.result.result) || {};
  if (inner && inner.ok === false) {
    if (resp.status === 401 || inner.code === "unauthorized") { clearToken(); location.href = "/login.html"; return; }
    throw Object.assign(new Error(inner.error || inner.code || "需求失败"),
      { status: resp.status, code: inner.code });
  }
  return inner;
}
function banner(msg, kind) {
  const el = $("banner");
  if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
  el.className = kind === "ok" ? "ok" : "err";
  el.textContent = msg;
}
function status(text) { $("status").textContent = text; }
function gateMessage(err) {
  if (err && (err.status === 401 || err.code === "unauthorized")) return "登录已失效（401），请重新登录。";
  return (err && err.message) || "操作失败";
}
async function withBusy(btn, fn) {
  if (btn) { btn.disabled = true; }
  try { return await fn(); }
  finally { if (btn) btn.disabled = false; }
}
function actBtn(act, id, label, disabled, cls, tip) {
  const attrs = disabled ? 'disabled title="' + esc(tip || "当前状态不可用") + '"' : "";
  const clsAttr = cls ? 'class="' + cls + '"' : "";
  return `<button ${clsAttr} data-act="${act}" data-id="${esc(id)}" ${attrs}>${label}</button>`;
}

const ROLE_CN = { pm: "PM", user: "用户", assistant: "助手", system: "系统" };
function speakerOf(msg, roles) {
  const role = msg.role || "assistant";
  if (role === "user") return "用户";
  if (role === "system") return "系统";
  if (role === "pm" || role === "assistant") return ROLE_CN[role] || role;
  const hit = (roles || []).find((r) => r.role === role || r.session === role);
  return (hit && (hit.display || hit.role)) || role;
}
function bubbleClass(msg) {
  const role = msg.role || "assistant";
  if (role === "user") return "user";
  if (role === "system") return "system";
  if (role === "assistant" || role === "pm") return "assistant";
  return "role";
}

// ---- 分级树：项目 → 工单 ----
async function loadTree() {
  const tree = await run("project-tree", {});
  const items = tree.items || [];
  const orphans = tree.orphans || [];
  Object.keys(ticketMap).forEach((k) => delete ticketMap[k]);
  items.forEach((n) => (n.tickets || []).forEach((t) => { ticketMap[t.id] = t; }));
  orphans.forEach((t) => { ticketMap[t.id] = t; });

  const projOpts = ['<option value="">（选择项目）</option>']
    .concat(items.map((n) => `<option value="${esc(n.project.id)}">${esc(n.project.name || n.project.id)}</option>`));
  $("t-project").innerHTML = projOpts.join("");

  const html = items.map((n) => {
    const p = n.project;
    const tickets = (n.tickets || []).map((t) => ticketRow(t)).join("")
      || '<div class="ticket-row muted" style="cursor:default">暂无工单</div>';
    return `
    <div class="proj" data-proj="${esc(p.id)}">
      <div class="proj-head" data-proj-head="${esc(p.id)}">
        <span class="caret">▶</span>
        <span class="pname">${esc(p.name || p.id)}</span>
        <span class="cnt">${(n.tickets || []).length} 工单</span>
        <span class="actions">
          ${actBtn("archive", p.id, "归档", !!p.archived, "", "项目已归档")}
          ${actBtn("del", p.id, "删除", false, "danger")}
        </span>
      </div>
      <div class="proj-body">${tickets}</div>
    </div>`;
  }).join("");
  const orphanHtml = orphans.length
    ? `<div class="orphans"><div class="muted">未归属工单</div>` +
      orphans.map((t) => ticketRow(t)).join("") + "</div>" : "";
  $("tree").innerHTML = html + orphanHtml || '<div class="muted">暂无项目</div>';
}

function ticketRow(t) {
  const closed = t.status === "closed";
  const badge = closed ? '<span class="badge closed">closed</span>'
    : `<span class="badge ${esc(t.status)}">${esc(t.status)}</span>`;
  const active = t.id === selId ? " active" : "";
  return `<div class="ticket-row${active}" data-ticket="${esc(t.id)}">
    <span class="t-title">${esc(t.title || t.id)}</span>${badge}</div>`;
}

$("proj-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const rec = await run("projects-create", {
      name: $("p-name").value.trim(), default_backend: $("p-backend").value.trim()
    });
    banner(""); status("已建项目：" + (rec.id || ""));
    $("p-name").value = ""; $("p-backend").value = "";
    await loadTree();
  } catch (err) { banner(gateMessage(err), "err"); status("项目创建失败：" + err.message); }
};
$("p-refresh").onclick = () => loadTree().catch((e) => banner(gateMessage(e), "err"));

$("tree").onclick = async (e) => {
  const head = e.target.closest("[data-proj-head]");
  if (head) { head.closest(".proj").classList.toggle("open"); return; }
  const btn = e.target.closest("button");
  if (btn && !btn.disabled) {
    const id = btn.dataset.id;
    try {
      if (btn.dataset.act === "archive") { await withBusy(btn, () => run("projects-archive", { id })); status("已归档：" + id); }
      else if (btn.dataset.act === "del") {
        if (!confirm("彻底删除项目 " + id + "？")) return;
        await withBusy(btn, () => run("projects-delete", { id, purge: true })); status("已删除：" + id);
      }
      await loadTree();
    } catch (err) { banner(gateMessage(err), "err"); status("操作失败：" + err.message); }
    return;
  }
  const row = e.target.closest("[data-ticket]");
  if (row) { await openTicket(row.dataset.ticket); }
};

$("ticket-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const rec = await run("ticket-create", {
      title: $("t-title").value.trim(), goal: $("t-goal").value.trim(),
      project: $("t-project").value, kind: $("t-kind").value, parent: $("t-parent").value.trim()
    });
    banner(""); status("已建工单：" + (rec.id || ""));
    $("t-title").value = ""; $("t-goal").value = ""; $("t-parent").value = "";
    await loadTree();
    if (rec.id) await openTicket(rec.id);
  } catch (err) { banner(gateMessage(err), "err"); status("工单创建失败：" + err.message); }
};

// ---- 工单主会话（1:1 业务会话）----
async function openTicket(id) {
  selId = id;
  let th;
  try { th = await run("ticket-thread", { id }); }
  catch (err) { banner(gateMessage(err), "err"); status("加载工单会话失败：" + err.message); return; }
  const t = th.ticket || {};
  $("thread-meta").innerHTML =
    `<strong>${esc(t.title || id)}</strong><span class="muted">${esc(t.id || "")}</span>` +
    `<span class="badge ${esc(t.status || "")}">${esc(t.status || "")}</span>`;
  const roles = th.roles || [];
  $("thread-roles").innerHTML = roles.map((r) =>
    `<span class="chip">${esc(r.display || r.role)} · ${esc(r.status || "")}</span>`).join("");
  renderChat(th.thread || {}, roles);
  showDetail(t);
  syncOps();
  loadTree().catch(() => {});
}

function renderChat(thread, roles) {
  const msgs = thread.messages || [];
  const list = $("chat");
  if (!msgs.length) { list.innerHTML = '<div class="muted" style="margin:auto">还没有消息</div>'; return; }
  list.innerHTML = msgs.map((m) => {
    const cls = bubbleClass(m);
    const who = cls === "system" ? "" : `<span class="who">${esc(speakerOf(m, roles))}</span>`;
    const ts = m.ts ? `<span class="ts">${new Date(m.ts).toLocaleTimeString()}</span>` : "";
    return `<div class="bubble ${cls}">${who}<div class="body">${esc(m.content == null ? "" : m.content)}</div>${ts}</div>`;
  }).join("");
  list.scrollTop = list.scrollHeight;
}

function showDetail(rec) { $("detail").textContent = JSON.stringify(rec, null, 2); }

function syncOps() {
  const t = ticketMap[selId];
  const closed = !!(t && t.status === "closed");
  $("op-note").disabled = closed;
  $("op-message").disabled = closed;
  $("op-close").disabled = closed;
}

$("op-detail").onclick = async () => {
  if (!selId) return;
  try { showDetail(await run("ticket-get", { id: selId })); }
  catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};
$("op-note").onclick = async () => {
  if (!selId) return;
  const text = $("op-text").value.trim();
  if (!text) return;
  try { await run("ticket-note", { id: selId, text }); status("备注已追加"); $("op-text").value = ""; await openTicket(selId); }
  catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};
$("op-message").onclick = async () => {
  if (!selId) return;
  const text = $("op-text").value.trim();
  if (!text) return;
  try { await run("ticket-message", { id: selId, text, target: "pm" }); status("已通知 PM"); $("op-text").value = ""; await openTicket(selId); }
  catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};
$("op-close").onclick = async () => {
  if (!selId) return;
  const summary = prompt("结单摘要：");
  if (summary == null) return;
  const verdict = prompt("验收结论（可选，通过/驳回）：") || "";
  try {
    const rec = await run("ticket-close", { id: selId, summary, verdict });
    showDetail(rec); status("已结单"); await openTicket(selId);
  } catch (e) { banner(gateMessage(e), "err"); status(e.message); }
};

// ---- 岗位库 ----
async function loadPositions() {
  const list = await run("position-list", {});
  const items = list.items || [];
  $("position-rows").innerHTML = items.map((p) => {
    const checks = (p.flow && p.flow.checks) || [];
    return `<tr>
      <td>${esc(p.id)}</td><td>${esc(p.cn || "")}</td>
      <td class="muted">${esc(p.prompt_file || "")}</td>
      <td class="muted">${esc((p.must_outputs || []).join(", "))}</td>
      <td>${checks.length} 项流程检查</td>
    </tr>`;
  }).join("") || '<tr><td colspan="5" class="muted">暂无岗位</td></tr>';
}

// ---- 会话调试 ----
async function loadSessions() {
  const list = await run("session-list", { status: $("s-filter-status").value });
  const items = list.items || [];
  Object.keys(sessionMap).forEach((k) => delete sessionMap[k]);
  items.forEach((s) => { sessionMap[s.id] = s; });
  $("session-rows").innerHTML = items.map((s) => {
    const st = s.status || "unknown";
    const gone = st === "gone", running = st === "running";
    return `<tr>
      <td>${esc(s.id)}</td><td>${esc(s.name || "")}</td>
      <td class="muted">${esc(s.role || "")}</td><td class="muted">${esc(s.ticket || "")}</td>
      <td class="muted">${esc(s.kind || "")}</td>
      <td><span class="badge ${esc(st)}">${esc(st)}</span></td>
      <td class="actions">
        ${actBtn("s-detail", s.id, "详情", false)}
        ${actBtn("s-send", s.id, "发消息", gone, "", "会话已销毁")}
        ${actBtn("s-run", s.id, "运行", gone || running, "", running ? "会话运行中" : "会话已销毁")}
        ${actBtn("s-wait", s.id, "取回复", gone, "", "会话已销毁")}
      </td></tr>`;
  }).join("") || '<tr><td colspan="7" class="muted">暂无可会话</td></tr>';
}
$("s-refresh").onclick = () => loadSessions().catch((e) => banner(gateMessage(e), "err"));
$("s-filter-status").onchange = () => loadSessions().catch((e) => banner(gateMessage(e), "err"));
$("session-rows").onclick = async (e) => {
  const btn = e.target.closest("button"); if (!btn || btn.disabled) return;
  const id = btn.dataset.id;
  try {
    if (btn.dataset.act === "s-detail") showDetail(await run("session-get", { id }));
    else if (btn.dataset.act === "s-send") {
      const text = prompt("发给会话 " + id + " 的消息：");
      if (text == null) return;
      await withBusy(btn, () => run("session-send", { id, text }));
      status("已发送：" + id); await loadSessions();
    } else if (btn.dataset.act === "s-run") {
      await withBusy(btn, () => run("session-run", { id }));
      status("本轮运行结束：" + id); await loadSessions();
    } else if (btn.dataset.act === "s-wait") {
      const reply = await withBusy(btn, () => run("session-wait", { id }));
      showDetail(reply); status("已取回复：" + id);
    }
  } catch (err) { banner(gateMessage(err), "err"); status("会话操作失败：" + err.message); }
};

$("logout").onclick = async () => {
  try { await run("auth-logout", { token: token() }); } catch (e) {}
  clearToken(); location.href = "/login.html";
};

async function boot() {
  let st = { enabled: false };
  try { const r = await fetch("/api/auth/status"); const _j = await r.json(); st = _j.result || _j || {}; } catch (e) {}
  if (st.enabled && !token()) { location.href = "/login.html"; return; }
  const errors = [];
  for (const step of [loadTree, loadPositions, loadSessions]) {
    try { await step(); } catch (e) { errors.push(gateMessage(e)); }
  }
  if (errors.length) banner(errors[0], "err"); else banner("");
}
boot();
</script>
</body>
