<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive AI · 消息面板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #0f1115; color: #e6e8ee; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 10px 14px; border-bottom: 1px solid #23262f; background: #14171d; }
  header input { background: #0f1115; border: 1px solid #2b3040; border-radius: 6px;
                 color: #e6e8ee; padding: 7px 9px; font-size: 13px; }
  header input#channel { width: 140px; }
  header button { background: #2f6fed; border: 0; border-radius: 6px; color: #fff;
                  padding: 7px 12px; font-size: 13px; cursor: pointer; }
  header button.ghost { background: #23262f; }
  header .state { margin-left: auto; font-size: 12px; color: #8b93a7; }
  main { display: flex; flex-direction: column; height: calc(100vh - 58px); }
  #list { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex;
          flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 9px 12px; border-radius: 10px; background: #1a1e26;
         border: 1px solid #23262f; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1c2b4d; border-color: #2b4070; }
  .msg.assistant { align-self: flex-start; }
  .msg.system { align-self: center; background: #2a2020; border-color: #4a2f2f;
                color: #ffb4b4; font-size: 12px; }
  .msg .meta { display: block; margin-top: 4px; font-size: 11px; color: #7d8599; }
  #composer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #23262f;
              background: #14171d; }
  #composer textarea { flex: 1; resize: none; height: 44px; background: #0f1115;
                       border: 1px solid #2b3040; border-radius: 8px; color: inherit;
                       padding: 10px; font: inherit; }
  #composer button { background: #2f6fed; border: 0; border-radius: 8px; color: #fff;
                     padding: 0 18px; cursor: pointer; }
  .empty { color: #5d6478; font-size: 12px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<header>
  <input id="channel" value="web" aria-label="频道">
  <button id="connect">连接</button>
  <button id="clear" class="ghost">清屏</button>
  <nav style="display:flex;gap:8px">
    <a href="/index.html" style="color:#e6e8ee;text-decoration:none;font-size:13px">装配</a>
    <a href="/manage.html" style="color:#e6e8ee;text-decoration:none;font-size:13px">项目与工单</a>
  </nav>
  <button id="logout" class="ghost">登出</button>
  <span class="state" id="state">未连接</span>
</header>
<main>
  <div id="list"><div class="empty">还没有消息</div></div>
  <div id="composer">
    <textarea id="text" placeholder="输入一条消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const stateEl = $("state"), list = $("list"), input = $("text");
let cursor = 0, abort = null, alive = false;

function readCookie(name) {
  const m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
  return m ? decodeURIComponent(m[1]) : "";
}
const token = () => localStorage.getItem("ai_new_token") || readCookie("hive_token") || "";
function clearToken() {
  localStorage.removeItem("ai_new_token");
  sessionStorage.removeItem("hive.token");
  document.cookie = "hive_token=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
}
function authHeaders() {
  const h = {};
  if (token()) h["X-Auth-Token"] = token();
  return h;
}
if (sessionStorage.getItem("hive.channel")) $("channel").value = sessionStorage.getItem("hive.channel");

function setState(text) { stateEl.textContent = text; }

function render(msg) {
  const empty = list.querySelector(".empty");
  if (empty) empty.remove();
  const box = document.createElement("div");
  box.className = "msg " + (msg.role || "assistant");
  box.textContent = msg.content == null ? "" : msg.content;
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = (msg.role || "") + (msg.ts ? " · " + new Date(msg.ts).toLocaleTimeString() : "");
  box.appendChild(meta);
  list.appendChild(box);
  list.scrollTop = list.scrollHeight;
}

async function connect() {
  const tk = token();
  const ch = $("channel").value.trim() || "web";
  sessionStorage.setItem("hive.channel", ch);
  if (abort) abort.abort();
  abort = new AbortController();
  alive = true;
  setState("连接中…");
  let backoff = 500;
  while (alive) {
    try {
      const url = "/api/sse/channel/watch?channel=" + encodeURIComponent(ch) +
                  "&cursor=" + cursor + "&timeout=20";
      const resp = await fetch(url, {headers: authHeaders(), signal: abort.signal});
      if (resp.status === 401) { clearToken(); location.href = "/login.html"; return; }
      if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
      setState("已连接");
      backoff = 500;
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (alive) {
        const {value, done} = await reader.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx).trim();
          buf = buf.slice(idx + 2);
          if (!frame || frame.startsWith(":")) continue;
          const line = frame.split("\n").find((x) => x.startsWith("data:"));
          if (!line) continue;
          try {
            const msg = JSON.parse(line.slice(5).trim());
            if (msg && msg.seq) cursor = Math.max(cursor, msg.seq);
            if (msg) render(msg);
          } catch (e) { /* 非 JSON 帧忽略 */ }
        }
      }
    } catch (e) {
      if (!alive) break;
      setState("断线，重连中…" + (e.message ? " (" + e.message + ")" : ""));
    }
    if (!alive) break;
    await new Promise((r) => setTimeout(r, backoff));
    backoff = Math.min(backoff * 1.6, 5000);
  }
  setState("未连接");
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  const ch = $("channel").value.trim() || "web";
  input.value = "";
  try {
    const resp = await fetch("/api/rpc/demand_engine/run", {
      method: "POST",
      headers: Object.assign({"Content-Type": "application/json"}, authHeaders()),
      body: JSON.stringify({ id: "channel-post",
                             input: { channel: ch, role: "user", content: text } })
    });
    if (resp.status === 401) { clearToken(); location.href = "/login.html"; return; }
    if (!resp.ok) setState("发送失败 HTTP " + resp.status);
  } catch (e) {
    setState("发送失败：" + e.message);
  }
}

$("connect").onclick = connect;
$("clear").onclick = () => { list.innerHTML = '<div class="empty">还没有消息</div>'; };
$("send").onclick = send;
$("logout").onclick = async () => {
  try { await fetch("/api/rpc/demand_engine/run", {
    method: "POST", headers: Object.assign({"Content-Type": "application/json"}, authHeaders()),
    body: JSON.stringify({ id: "auth-logout", input: { token: token() } }) }); } catch (e) {}
  clearToken(); location.href = "/login.html";
};
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

async function boot() {
  let st = { enabled: false };
  try { const r = await fetch("/api/auth/status"); const _j = await r.json(); st = _j.result || _j || {}; } catch (e) {}
  if (st.enabled && !token()) { location.href = "/login.html"; return; }
  connect();
}
boot();
</script>
</body>
</html>
