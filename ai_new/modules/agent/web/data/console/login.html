<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>控制台</title>
<style>
:root{
  color-scheme:light;--fg:#1f2329;--fg-2:#4e5969;--muted:#86909c;
  --card:#ffffff;--line:#e7e9ef;--accent:#2f6bff;--accent-weak:rgba(47,107,255,.10);
  --danger:#f53f3f;--shadow:0 8px 30px rgba(16,24,40,.12);
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--fg:#e5e6eb;--fg-2:#c9cdd4;--muted:#8b90a0;
    --card:#1d1e24;--line:#2e3038;--accent:#6aa1ff;--accent-weak:rgba(106,161,255,.16);
    --shadow:0 8px 30px rgba(0,0,0,.4);}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  color:var(--fg);
  background:linear-gradient(135deg,#eef2ff 0%,#f7f8fa 45%,#f3ecff 100%);}
@media (prefers-color-scheme:dark){body{background:linear-gradient(135deg,#16171d 0%,#141519 45%,#1a1722 100%)}}
.card{width:360px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 26px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2f6bff,#722ed1);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.brand h1{font-size:17px;margin:0;line-height:1.2}
.brand .sub{font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:12.5px;margin:4px 0 0}
label{display:block;font-size:12.5px;color:var(--fg-2);margin:16px 0 5px}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;width:100%;margin-top:20px;transition:background .15s,border-color .15s}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#2457e0}
#banner{margin-top:14px;font-size:13px;color:var(--danger);display:none}
#open{margin-top:14px;font-size:13px;display:none;color:var(--fg-2)}
#open button{margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo" data-chrome="logo"></span><div><h1 data-chrome="name"></h1><div class="sub" data-chrome="subtitle"></div></div></div>
  <p class="muted" data-chrome="note"></p>
  <form id="login-form">
    <label data-chrome="user_label"></label>
    <input id="username" autocomplete="username" required>
    <label data-chrome="pass_label"></label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" data-chrome="submit"></button>
  </form>
  <div id="banner"></div>
  <div id="open"></div>
</div>
<script src="/assets/js-yaml.min.js"></script>
<script>
async function readYaml(resp){return jsyaml.load(await resp.text())||{};}
function yamlBody(o){return jsyaml.dump(o,{flowLevel:Infinity,noRefs:true,sortKeys:false});}
const $ = (id) => document.getElementById(id);

function saveToken(t) {
  localStorage.setItem("ai_new_token", t);
  document.cookie = "hive_token=" + encodeURIComponent(t) + "; path=/; SameSite=Lax";
}

/* 外壳：登录页的字也来自后端（console-chrome 未登录可读），页面只留空壳 */
let CHROME = { brand: {}, login: {} };
function chrome(key) { return (CHROME.login || {})[key] == null ? "" : String(CHROME.login[key]); }
function fill(tpl, ...args) {
  let i = 0;
  return String(tpl == null ? "" : tpl).replace(/\{\}/g, () => (i < args.length ? String(args[i++]) : ""));
}
function applyChrome() {
  const b = CHROME.brand || {};
  const words = { logo: b.logo, name: b.name, ...(CHROME.login || {}) };
  document.querySelectorAll("[data-chrome]").forEach((el) => {
    const v = words[el.dataset.chrome];
    if (v != null) el.textContent = String(v);
  });
  document.title = chrome("title") || (b.name ? b.name + " · " + chrome("submit") : "");
}
async function loadChrome() {
  try {
    const resp = await fetch("/api/rpc/demand_engine/run", {
      method: "POST", headers: { "Content-Type": "application/yaml" },
      body: yamlBody({ id: "console-chrome", input: {} })
    });
    const body = await readYaml(resp);
    CHROME = ((body.result && body.result.result) || {});
  } catch (e) { /* 拿不到就留空壳，不挡登录 */ }
  applyChrome();
}

async function loadStatus() {
  const r = await fetch("/api/auth/status");
  const body = await readYaml(r).catch(() => ({ ok: false }));
  const st = body.result || body || {};
  if (!st.enabled && !st.legacy) {
    // 开放模式（本机开发）：无需登录，直接进控制台
    $("login-form").style.display = "none";
    const box = $("open");
    box.style.display = "block";
    box.textContent = chrome("open_mode");
    const go = document.createElement("button");
    go.className = "primary";
    go.textContent = chrome("open_enter");
    go.onclick = () => { location.href = "/manage.html"; };
    box.appendChild(go);
  }
}

$("login-form").onsubmit = async (e) => {
  e.preventDefault();
  const banner = $("banner");
  banner.style.display = "none";
  try {
    const resp = await fetch("/api/rpc/demand_engine/run", {
      method: "POST",
      headers: { "Content-Type": "application/yaml" },
      body: yamlBody({ id: "auth-login", input: {
        username: $("username").value.trim(),
        password: $("password").value
      } })
    });
    const body = await readYaml(resp).catch(() => ({ ok: false }));
    const inner = (body.result && body.result.result) || {};
    if (!body.ok || inner.ok === false) {
      banner.textContent = (inner.error || body.error || chrome("failed"))
        + fill(chrome("http_code"), resp.status);
      banner.style.display = "block";
      return;
    }
    if (!inner.token) {
      banner.textContent = chrome("no_token");
      banner.style.display = "block";
      return;
    }
    saveToken(inner.token);
    location.href = "/manage.html";
  } catch (err) {
    banner.textContent = fill(chrome("net_fail"), err.message);
    banner.style.display = "block";
  }
};

loadChrome().then(loadStatus);
</script>
</body>
</html>
