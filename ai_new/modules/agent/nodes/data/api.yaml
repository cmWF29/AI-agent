# 消息契约：nodes 模块每条协调路由收什么、回什么。
module: nodes
routes:
  nodes.register:
    in:
      id: {type: str, req: true}
      endpoint: {type: str, req: true}
      transport: {type: str, req: false}
      capacity: {type: dict, req: false}
      lease_ttl: {type: int, req: false}
      role: {type: str, req: false}        # entry=控制面入口；executor=内网执行节点，缺省 executor
      public_exposed: {type: bool, req: false}  # 是否对公网暴露；执行节点默认 false（仅内网）
    out:
      ok: {type: bool}
      node: {type: dict}
      effects: {type: list}
  nodes.heartbeat:
    in:
      node: {type: str, req: true}
      load: {type: dict, req: false}
    out:
      ok: {type: bool}
      node: {type: dict}
      effects: {type: list}
  nodes.acquire:
    in:
      project: {type: str, req: true}
      node: {type: str, req: true}
      ttl: {type: int, req: false}
      tier: {type: str, req: false}
      checkpoint: {type: dict, req: false}
    out:
      ok: {type: bool}
      lease: {type: dict}
      reused: {type: bool}
      effects: {type: list}
  nodes.renew:
    in:
      project: {type: str, req: true}
      token: {type: str, req: true}
      checkpoint: {type: dict, req: false}
    out:
      ok: {type: bool}
      lease: {type: dict}
      effects: {type: list}
  nodes.release:
    in:
      project: {type: str, req: true}
      token: {type: str, req: true}
    out:
      ok: {type: bool}
      lease: {type: dict}
      effects: {type: list}
  nodes.fence_check:
    in:
      project: {type: str, req: true}
      token: {type: str, req: true}
      epoch: {type: int, req: true}
    out:
      ok: {type: bool}
      code: {type: str}
      epoch: {type: int}
  nodes.nodes_view:
    in:
      ttl: {type: int, req: false}
    out:
      ok: {type: bool}
      nodes: {type: list}
  nodes.assignments:
    in: {}
    out:
      ok: {type: bool}
      assignments: {type: list}
  nodes.overview:
    in: {}
    out:
      ok: {type: bool}
      nodes: {type: list}
      assignments: {type: list}
  nodes.status:
    # 运维页只读组合视图。nodes 行字段：id, role(entry/executor),
    # public_exposed(bool，执行节点 false=仅内网), endpoint_masked(脱敏地址，
    # 不下发真实内网 IP/端口), transport, region, capacity, load,
    # registered_at, last_seen, lease_ttl, status,
    # health(alive/lost 假死), lease_count, lease_remaining(剩余秒数/None),
    # projects(持有项目列表)；assignments 行字段：project, node, epoch,
    # state(held/released), tier, expires_at, remaining(剩余秒数/None)；
    # backups 行字段：project, last_backup_at(最近备份时间/None),
    # backup_state(verified/planned/failed 等结果), snapshot_id, entries。
    in:
      ttl: {type: int, req: false}
    out:
      ok: {type: bool}
      nodes: {type: list}
      assignments: {type: list}
      backups: {type: list}
  nodes.project_node:
    in:
      project: {type: str, req: true}
    out:
      ok: {type: bool}
      assignment: {type: dict}
  nodes.backups:
    in: {}
    out:
      ok: {type: bool}
      backups: {type: list}
  nodes.backup_record:
    in:
      project: {type: str, req: true}
      snapshot: {type: dict, req: false}
    out:
      ok: {type: bool}
      backup: {type: dict}
      effects: {type: list}
  nodes.snapshot_plan:
    in:
      project: {type: str, req: true}
      entries: {type: list, req: false}
    out:
      ok: {type: bool}
      manifest: {type: dict}
      rejected: {type: list}
  nodes.verify_snapshot:
    in:
      manifest: {type: dict, req: true}
      digests: {type: dict, req: false}
    out:
      ok: {type: bool}
      missing: {type: list}
      mismatch: {type: list}
  nodes.pick_node:
    in:
      project: {type: str, req: true}
      policy: {type: dict, req: false}
    out:
      ok: {type: bool}
      node: {type: str}
      score: {type: float}
      reasons: {type: list}
  nodes.reassign:
    in:
      project: {type: str, req: true}
      policy: {type: dict, req: false}
      candidate: {type: str, req: false}
      reason: {type: str, req: false}
      checkpoint: {type: dict, req: false}
    out:
      ok: {type: bool}
      lease: {type: dict}
      migration: {type: dict}
      steps: {type: list}
      effects: {type: list}
  nodes.migrations:
    in: {}
    out:
      ok: {type: bool}
      migrations: {type: list}
