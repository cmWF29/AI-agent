    - name: action
      type: string
      required: true
      desc: 动作：list 查 / add 增 / update 改 / remove 删 / clear 清空 / replace 整表覆盖
    - name: id
      type: string
      required: false
      desc: 待办 id（update/remove 必填）
    - name: text
      type: string
      required: false
      desc: 待办正文（add 必填）
    - name: status
      type: string
      required: false
      desc: pending / doing / done
    - name: items
      type: list
      required: false
