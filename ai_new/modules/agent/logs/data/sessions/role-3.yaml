    - name: layer
      type: string
      desc: public/project/ticket
      required: false
    - name: name
      type: string
      desc: 文档名（不含 .md）
      required: false
    - name: project
      type: string
      desc: project 层必填
      required: false
    - name: ticket
      type: string
      desc: ticket 层必填
      required: false
    - name: content
      type: string
      desc: 写入内容
      required: false
    - name: query
      type: string
      desc: 检索词
      required: false
    module: knowledge
  - name: ticket_note
    desc: 给工单记一条备注（不改动交付件）
    params:
    - name: text
      type: string
      desc: 备注内容
      required: true
    module: tickets
  - name: ticket_read_doc
    desc: 读本工单交付件或交接文档（只读）
    params:
    - name: path
      type: string
      desc: 交付件相对路径
      required: true
    module: tickets
  - name: todo
