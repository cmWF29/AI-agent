      desc: 交付件相对路径
      required: true
    module: tickets
  - name: todo
    desc: 会话待办清单（你自己的分步计划）：增删查改都走这里，状态存会话快照、重启后仍在；随时可查当前进度。
    params:
    - name: action
      type: string
      required: true
      desc: 动作：list 查 / add 增 / update 改 / remove 删 / clear 清空 / replace 整表覆盖
    - name: id
      type: string
      required: false
      desc: 待办 id（update/remove 必填）
    - name: text
      type: string
      required: false
      desc: 待办正文（add 必填）
    - name: status
      type: string
      required: false
      desc: pending / doing / done
    - name: items
      type: list
      required: false
      desc: 整表覆盖时的条目数组：[{text, status}]，status 取 pending/doing/done
    module: todos
